[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = ["sh -c 'PYTHONPATH=src python scripts/apply_verigence_attendance_schema.py'"]
startCommand = "PYTHONPATH=src uvicorn audit_core.verigence_attendance.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
