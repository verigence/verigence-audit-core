    origin: SYSTEM
    source: RULE
    completion: MACHINE_VERIFIED
    actions:
    - UPLOAD_DOCUMENT
    - REUPLOAD_DOCUMENT
    - ADD_COMMENT
  RULE_DISCREPANCY_REVIEW:
    category: CROSS_DOCUMENT_REVIEW
    owner: PC
    origin: SYSTEM
    source: RULE
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - CORRECT_EXTRACTED_FIELD
    - ADD_EVIDENCE
    - PROVIDE_FEEDBACK
    - ACCEPT_EXCEPTION
    - ADD_COMMENT
  FIELD_CORRECTION_REVIEW_P2:
    category: CORRECTION_APPROVAL
    owner: TL
    origin: SYSTEM
    source: DOCUMENT_FIELD
    completion: MACHINE_VERIFIED
    actions:
    - APPROVE_CORRECTION
    - REJECT_CORRECTION
    - ADD_COMMENT
  REQUESTER_CONFIRMATION:
    category: TASK_CONFIRMATION
    owner: REQUESTER
    origin: SYSTEM
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - ACCEPT
