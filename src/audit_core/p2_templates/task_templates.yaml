    completion: MACHINE_VERIFIED
    actions:
    - ADD_EVIDENCE
    - CORRECT_EXTRACTED_FIELD
    - ADD_COMMENT
  TL_TAKE_ACTION:
    category: FINDING_REMEDIATION
    owner: PC
    origin: HUMAN
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - UPLOAD_DOCUMENT
    - REUPLOAD_DOCUMENT
    - CORRECT_EXTRACTED_FIELD
    - ADD_EVIDENCE
    - PROVIDE_FEEDBACK
    - ADD_COMMENT
  FINDING_REVIEW:
    category: FINDING_REMEDIATION
    owner: TL
    origin: SYSTEM
