# Phase 2 task catalog (blueprint v2.2 section 11). Every P2 task type, its owner,
# completion protocol and allowed actions.
version: 1
actions:
- UPLOAD_DOCUMENT
- REUPLOAD_DOCUMENT
- REVIEW_DOCUMENT
- CORRECT_EXTRACTED_FIELD
- ADD_EVIDENCE
- ADD_COMMENT
- PROVIDE_FEEDBACK
- REQUEST_CLARIFICATION
- COMPLETE_ACTION
- APPROVE_CORRECTION
- REJECT_CORRECTION
- ACCEPT
- REJECT
- ACCEPT_EXCEPTION
- PROVIDE_VEHICLE_ID
# A Team Lead's verdict on the finding behind a task (Phase 1 finding actions).
- CONFIRM_BREACH
- MARK_FALSE_POSITIVE
# The PC closes an image-quality task by hand, with a comment
# (PC_PAGE_QUALITY_REJECTED only).
- CLOSE_TASK
exception_roles:
- TL
- PM
task_types:
  PC_VERIFY_UNRECOGNIZED_DOCUMENT:
    category: DOCUMENT_VERIFICATION
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - COMPLETE_ACTION
    - ADD_COMMENT
  MANUAL_VERIFICATION_REVIEW:
    category: DOCUMENT_VERIFICATION
    owner: PC
    origin: SYSTEM
    source: DOCUMENT_FIELD
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - CORRECT_EXTRACTED_FIELD
    - ADD_COMMENT
  # The booking form on file carries no booking date; the deal is priced on
  # it, so the PC enters it on the form (Medium, closes itself).
  PC_BOOKING_DATE_MISSING:
    category: DOCUMENT_VERIFICATION
    owner: PC
    origin: SYSTEM
    source: DOCUMENT_FIELD
    completion: MACHINE_VERIFIED
    actions:
    - CORRECT_EXTRACTED_FIELD
    - ADD_COMMENT
  WRONG_DOCUMENT_REVIEW:
    category: DOCUMENT_VERIFICATION
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - UPLOAD_DOCUMENT
    - REUPLOAD_DOCUMENT
    - COMPLETE_ACTION
    - ADD_COMMENT
  WRONG_DOCUMENT_DEALER_NOTICE:
    category: DOCUMENT_VERIFICATION
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - PROVIDE_FEEDBACK
    - ADD_COMMENT
  PC_DOCUMENT_REUPLOAD:
    category: DOCUMENT_REUPLOAD
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - UPLOAD_DOCUMENT
    - REUPLOAD_DOCUMENT
    - ADD_COMMENT
  DUPLICATE_RECEIPT_NOTICE:
    category: DOCUMENT_EXCEPTION
    owner: PC
    origin: SYSTEM
    source: CONTROL
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - PROVIDE_FEEDBACK
    - ACCEPT_EXCEPTION
    - ADD_COMMENT
  # A page that could not be processed after the retries (or that the
  # document service refused outright): the PC retries it, replaces the
  # upload, or deletes the booking. Closes itself when the page is
  # processed or removed.
  PC_RESOLVE_DOCUMENT_PROCESSING_FAILURE:
    category: DOCUMENT_EXCEPTION
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - REUPLOAD_DOCUMENT
    - ADD_COMMENT
  # One task per uploaded file that is taking long or lost pages: Info while
  # the file is still being worked on an hour after upload ("check back after
  # 1 hour"), High naming the pages to upload on their own once the retries
  # are spent. It updates and closes itself.
  PC_UPLOAD_STATUS:
    category: DOCUMENT_EXCEPTION
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - REUPLOAD_DOCUMENT
    - ADD_COMMENT
  # "Document to resubmit" (product owner 2026-10-21): one task per uploaded
  # file with pages that failed (after T0, T0+10 and T0+20 minutes, at once
  # for a refusal, or when not read within 30 minutes), listing each failed
  # page, the reason in plain words and a link that opens the page. Category
  # key DOCUMENT_RESUBMIT. It updates and closes itself once the pages are
  # read again or uploaded again.
  DOCUMENT_RESUBMIT:
    category: DOCUMENT_RESUBMIT
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - REUPLOAD_DOCUMENT
    - ADD_COMMENT
  # One task per uploaded file with pages refused by the scan-quality check
  # (blurred, faded / low contrast, too small: any DI_QUALITY_* refusal),
  # naming the pages and why (product owner 2026-10-21: image quality is
  # its own group of document tasks). A retry cannot fix such a page, so
  # the PC re-scans it. The day-end clean-up takes the page off the journey
  # but never closes the task. The system cannot know which upload answers
  # it, so the PC closes it by hand every time (product owner 2026-10-22):
  # CLOSE_TASK with a mandatory comment ("Document Uploaded", "Document Not
  # required to be uploaded for Extraction" or his own words). It also still
  # closes by itself when the refused pages are replaced by the same scan,
  # read or removed, or the file is deleted; a file uploaded on the booking
  # never closes it.
  PC_PAGE_QUALITY_REJECTED:
    category: DOCUMENT_REUPLOAD
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - REUPLOAD_DOCUMENT
    - CLOSE_TASK
    - ADD_COMMENT
  # A file still not read a day after upload (decision 2026-10-01): the
  # Team Lead is told, with what the PC already has. Closes itself.
  TL_DOCUMENT_STUCK:
    category: SUPERVISORY_NOTICE
    owner: TL
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # A PC deleted a booking that a failed document upload left stuck: the
  # TL is told.
  JOURNEY_CANCELLED_NOTICE:
    category: SUPERVISORY_NOTICE
    owner: TL
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  FIELD_CORRECTION_REVIEW:
    category: CORRECTION_APPROVAL
    owner: TL
    origin: SYSTEM
    source: DOCUMENT_FIELD
    completion: MACHINE_VERIFIED
    actions:
    - APPROVE_CORRECTION
    - REJECT_CORRECTION
    - ADD_COMMENT
  # SKU resolution (decision 2026-10-20). The closest price-master SKU is
  # only suggested: the PC accepts it or rejects it and picks one by hand.
  SKU_CLOSEST_MATCH_CONFIRM:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - REJECT
    - ADD_COMMENT
  # The model is only in another month's price list: a Team Lead approves
  # pricing the Journey on it before any SKU is resolved.
  SKU_OTHER_MONTH_PRICE_LIST:
    category: CORRECTION_APPROVAL
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - REJECT
    - ADD_COMMENT
  # No price master version covers the deal's pricing date (2026-10-20
  # product owner rules: no silent fallback to another month). Closes itself
  # once a book for that date is loaded or the pricing date is corrected.
  PRICE_MASTER_NOT_IN_FORCE:
    category: OBSERVATION
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # The Journey's SKU is not in the price master in force on its pricing
  # date (a complete book withdrew it): the PC sets the SKU. Closes itself
  # once the SKU is in that book (2026-10-20 product owner rules).
  SKU_NOT_IN_PRICE_MASTER:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # A discount-scheme master row whose named variants the price list does
  # not carry (2026-10-20 product owner rules; review of PR 472, B1): the
  # deal's benefit has no standard until the wording is mapped, and is never
  # called an over-grant meanwhile. One task per master row, not per deal;
  # closes itself once a newer upload replaces the row.
  SCHEME_MASTER_UNMATCHED:
    category: OBSERVATION
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # A corporate privilege claimed where the corporate on file is not named
  # exactly on the OEM's list in force: the PC confirms the category from
  # the shortlist (only the PC decides). Closes itself once the corporate
  # code or exact name is on file, or the claim is gone.
  CORPORATE_CATEGORY_CONFIRM:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # A discount that depends on the old vehicle ("against old Maruti", "Tata
  # Ace Family") with no RC / valuation report read yet: the PC uploads or
  # confirms it. Closes itself once the document is read (review of PR 472).
  OLD_VEHICLE_EVIDENCE_CONFIRM:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # No discount scheme of the bulletins is in force on the deal's pricing
  # date (the month's bulletin is not loaded yet): the given discounts have
  # no standard, said so here rather than applying another month's scheme.
  # The Team Lead accepts it as an exception (comment required); the shared
  # ACCEPT_EXCEPTION path closes it and the resolver does not reopen it while
  # the condition is the same. COMPLETE_ACTION is not offered: a RESOLVER
  # task has no worker verification adapter, so it would stay VERIFYING.
  DISCOUNT_SCHEME_NOT_IN_FORCE:
    category: OBSERVATION
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT_EXCEPTION
    - ADD_COMMENT
  # Information: the invoice named a different vehicle and the Journey now
  # carries it (the invoice is the source of truth).
  MODEL_CHANGED_BY_INVOICE:
    category: OBSERVATION
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # SKU price check (2026-10-20 product owner rules R3): the documents'
  # words name one SKU but its master ex-showroom differs from the booking
  # form's (or a vehicle invoice's). The SKU stays on the Journey as an
  # automatic match; the PC keeps it (Accept) or picks the right one.
  SKU_PRICE_MISMATCH:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - ADD_COMMENT
  # Two vehicle invoices on one Journey name different vehicles: the PC
  # picks one of their SKUs (ACCEPT, details.skuId) or marks one invoice
  # cancelled (REJECT, details.documentId: it is voided). Nothing is set from
  # either on its own.
  SKU_INVOICES_DISAGREE:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - REJECT
    - ADD_COMMENT
  # Two booking forms name different vehicles (never "the newest wins"):
  # the same two actions as SKU_INVOICES_DISAGREE.
  SKU_BOOKING_FORMS_DISAGREE:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - REJECT
    - ADD_COMMENT
  # No SKU on the Journey and nothing to identify it from yet (2026-10-21:
  # every Journey without a clear SKU has a PC task). Closes itself.
  SKU_NOT_SET:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ADD_COMMENT
  # A booking form names a different SKU from a PC / TL decision: never
  # overwritten; the PC keeps it (ACCEPT) or proposes a correction.
  SKU_BOOKING_FORM_DIFFERS:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - ADD_COMMENT
  # An automatic SKU its documents no longer name (a re-check could not
  # confirm it): kept on the Journey, the PC confirms it (ACCEPT confirms the
  # SKU the task names) or sets another in the model picker.
  SKU_NOT_CONFIRMED:
    category: CORRECTION_APPROVAL
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - ADD_COMMENT
  # The vehicle invoice names a different SKU (at its master price) from
  # the one a PC or Team Lead set: never overwritten, the Team Lead decides.
  SKU_INVOICE_REVIEW:
    category: CORRECTION_APPROVAL
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - ACCEPT
    - REJECT
    - ADD_COMMENT
  MODEL_SELECTION_CORRECTION_REVIEW:
    category: CORRECTION_APPROVAL
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - APPROVE_CORRECTION
    - REJECT_CORRECTION
    - ADD_COMMENT
  INVOICE_DISCREPANCY_REVIEW:
    category: CROSS_DOCUMENT_REVIEW
    owner: TL
    origin: SYSTEM
    source: CONTROL
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - PROVIDE_FEEDBACK
    - COMPLETE_ACTION
    - ACCEPT_EXCEPTION
    - ADD_COMMENT
  FINANCE_DISBURSEMENT_REVIEW:
    category: BUSINESS_RESOLUTION
    owner: PC
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - PROVIDE_FEEDBACK
    - COMPLETE_ACTION
    - ADD_COMMENT
  FINANCE_DISBURSEMENT_CONFIRMED_NOTICE:
    category: SUPERVISORY_NOTICE
    owner: TL
    origin: SYSTEM
    source: RESOLVER
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - COMPLETE_ACTION
    - ADD_COMMENT
  DELIVERY_VEHICLE_PHOTOS_MISSING:
    category: EVIDENCE_GAP
    owner: PC
    origin: SYSTEM
    source: DOCUMENT/EVIDENCE
    completion: MACHINE_VERIFIED
    actions:
    - ADD_EVIDENCE
    - PROVIDE_VEHICLE_ID
    - ADD_COMMENT
  DELIVERY_VIN_MANUAL_ENTRY_REVIEW:
    category: CORRECTION_APPROVAL
    owner: TL
    origin: SYSTEM
    source: DOCUMENT_FIELD
    completion: MACHINE_VERIFIED
    actions:
    - APPROVE_CORRECTION
    - REJECT_CORRECTION
    - ADD_COMMENT
  AUTO_SELF_SERVE:
    category: FINDING_REMEDIATION
    owner: PC
    origin: SYSTEM
    source: FINDING
    completion: MACHINE_VERIFIED
    actions:
    - ADD_EVIDENCE
    - CORRECT_EXTRACTED_FIELD
    - ADD_COMMENT
  # A Team Lead raises it to enable the Management Referral (MR) discount
  # for one journey (decision 2026-09-30): completing it with the approved
  # amount and the reason switches MR on. The TL's own process follows.
  TL_MANAGEMENT_REFERRAL:
    category: PROCESS_CONFIRMATION
    owner: TL
    origin: HUMAN
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # Tasks a Team Lead or PMO raises by hand on a journey for its PC
  # (decision 2026-09-30): a document to upload, something to verify by
  # hand, or a data violation to correct. The PC marks it done and the
  # requester accepts or sends it back.
  TL_DOCUMENT_UPLOAD:
    category: DOCUMENT_REUPLOAD
    owner: PC
    origin: HUMAN
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - UPLOAD_DOCUMENT
    - COMPLETE_ACTION
    - ADD_COMMENT
  TL_MANUAL_VERIFICATION:
    category: DOCUMENT_VERIFICATION
    owner: PC
    origin: HUMAN
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - REVIEW_DOCUMENT
    - COMPLETE_ACTION
    - ADD_COMMENT
  TL_DATA_VIOLATION:
    category: FINDING_REMEDIATION
    owner: PC
    origin: HUMAN
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - CORRECT_EXTRACTED_FIELD
    - COMPLETE_ACTION
    - ADD_COMMENT
  TL_TAKE_ACTION:
    category: FINDING_REMEDIATION
    owner: PC
    origin: HUMAN
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - UPLOAD_DOCUMENT
    - REUPLOAD_DOCUMENT
    - CORRECT_EXTRACTED_FIELD
    - ADD_EVIDENCE
    - PROVIDE_FEEDBACK
    - ADD_COMMENT
  # A violation for the Team Lead: confirm the breach or reject it as a
  # false positive (the finding closes with the verdict), or fix the facts
  # and let the check pass.
  FINDING_REVIEW:
    category: FINDING_REMEDIATION
    owner: TL
    origin: SYSTEM
    source: RULE
    completion: MACHINE_VERIFIED
    actions:
    - CONFIRM_BREACH
    - MARK_FALSE_POSITIVE
    - REVIEW_DOCUMENT
    - CORRECT_EXTRACTED_FIELD
    - ADD_EVIDENCE
    - PROVIDE_FEEDBACK
    - ACCEPT_EXCEPTION
    - ADD_COMMENT
  FINDING_REMEDIATION:
    category: FINDING_REMEDIATION
    owner: PC
    origin: SYSTEM
    source: RULE
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - CORRECT_EXTRACTED_FIELD
    - UPLOAD_DOCUMENT
    - ADD_EVIDENCE
    - ACCEPT_EXCEPTION
    - ADD_COMMENT
  DOCUMENT_REMEDIATION:
    category: DOCUMENT_REUPLOAD
    owner: PC
    origin: SYSTEM
    source: RULE
    completion: MACHINE_VERIFIED
    actions:
    - UPLOAD_DOCUMENT
    - REUPLOAD_DOCUMENT
    - ADD_COMMENT
  RULE_DISCREPANCY_REVIEW:
    category: CROSS_DOCUMENT_REVIEW
    owner: PC
    origin: SYSTEM
    source: RULE
    completion: MACHINE_VERIFIED
    actions:
    - REVIEW_DOCUMENT
    - CORRECT_EXTRACTED_FIELD
    - ADD_EVIDENCE
    - PROVIDE_FEEDBACK
    - ACCEPT_EXCEPTION
    - ADD_COMMENT
  FIELD_CORRECTION_REVIEW_P2:
    category: CORRECTION_APPROVAL
    owner: TL
    origin: SYSTEM
    source: DOCUMENT_FIELD
    completion: MACHINE_VERIFIED
    actions:
    - APPROVE_CORRECTION
    - REJECT_CORRECTION
    - ADD_COMMENT
  REQUESTER_CONFIRMATION:
    category: TASK_CONFIRMATION
    owner: REQUESTER
    origin: SYSTEM
    source: HUMAN_ACTION
    completion: REQUESTER_CONFIRMED
    actions:
    - ACCEPT
    - REJECT
    - ADD_COMMENT
  DOCUMENT_MISSING:
    category: DOCUMENT_REUPLOAD
    owner: PC
    origin: SYSTEM
    source: DOCUMENT
    completion: MACHINE_VERIFIED
    actions:
    - UPLOAD_DOCUMENT
    - ADD_COMMENT
  DELIVERY_REVIEW:
    category: TASK_CONFIRMATION
    owner: TL
    origin: SYSTEM
    source: REVIEW
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
  # A yes/no question a check needs the PC to answer (cash intimation,
  # third-party payer declaration, NDC signature). The answer is the task's
  # completion result; the check reads it and closes the task.
  PC_CONFIRMATION:
    category: PROCESS_CONFIRMATION
    owner: PC
    origin: SYSTEM
    source: CONTROL
    completion: MACHINE_VERIFIED
    actions:
    - COMPLETE_ACTION
    - ADD_COMMENT
