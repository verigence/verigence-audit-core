# Phase 2 control catalog: 25 active Audit Core controls, 21 deal-audit Audit Core
# checks (uc03_p2_audit_rules.py; the "Manual Observations" ones are answered by a
# PC, TL or PM rather than read from documents) and 47 enabled Rule Engine rules
# (blueprint v2.2 sections 9-10). Audit Core owns execution state for both.
# mode: RERUN (native runner) | EXTERNAL (Rule Engine) | GATE (P2 stage gates)
#       | PAGES (P2 page outcomes) | SYNC (existing document sync) | EVENT (process event)
version: 1
controls:
  WRONG_DOCUMENT:
    executor: NATIVE
    mode: RERUN
    phases:
    - BOOKING
    - DELIVERY
    category: Customer & Dealer Identity
    triggers:
    - DOCUMENT_SYNCED
    rerun: RERUNNABLE
    finding_class: VIOLATION
    severity: HIGH
    owner: TL
    resolution: ADJUDICATED
    task:
      type: FINDING_REVIEW
      owner: TL
  DUPLICATE_RECEIPT:
