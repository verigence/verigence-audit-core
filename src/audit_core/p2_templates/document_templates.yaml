# Phase 2 document templates -- the single executable description of every
# document the audit understands. Loaded and validated at startup by
# audit_core.uc03_p2_registry; CI fails on any drift (unknown DI type, unknown
# key field, unknown control, gate referencing an unknown template).
#
# requirement: REQUIRED | OPTIONAL | CONDITIONAL | SUPPORTING
# pages.shape: SINGLE | PARTS | MULTI_PAGE   pages.group: ADJACENT | BATCH
# extraction.review_threshold: fields below this confidence need PC review
# extraction.strict_fields: money/identity fields reviewed below strict_review_threshold
version: 1
source:
  blueprint: Verigence Phase 2 Design Blueprint v2.2 (27 Sep 2026)
  di_schema_snapshot: di_schema_snapshot.json
stages:
  BOOKING:
    order: 1
    states:
    - BOOKING_DOCUMENT_UPLOAD
    - BOOKING_VERIFY_DOCUMENTS
    - BOOKING_COMPLETE
    gates:
    - key: BOOKING_FORM_EXTRACTED
      kind: DOCUMENT_READY
      documents:
      - booking_docket
      label: Booking Docket ready
      missing: Upload the Booking Docket (commitment form and order taking form).
    - key: PAN_EXTRACTED
      kind: DOCUMENT_READY
      documents:
      - pan_card
      label: PAN ready
      missing: Upload the customer's PAN card.
    - key: AADHAAR_EXTRACTED
      kind: DOCUMENT_READY
      documents:
      - aadhaar
      label: Aadhaar ready
      missing: Upload the customer's Aadhaar (front and back).
    - key: MINIMUM_BOOKING_PAYMENT
      kind: PAYMENT_MINIMUM
      label: Minimum booking amount received
      missing: Upload dealer receipts totalling at least the minimum booking amount.
    - key: NO_MANUAL_VERIFICATION_PENDING
      kind: NO_OPEN_TASKS
      task_types:
      - MANUAL_VERIFICATION_REVIEW
      label: All low-confidence fields verified
      missing: Review and confirm the highlighted low-confidence fields.
  DELIVERY:
    order: 2
    states:
    - DELIVERY_DOCUMENT_UPLOAD
    - DELIVERY_VERIFY_DOCUMENTS
    - DELIVERY_COMPLETE
    completion_approved: false
    gates: []
document_types:
  booking_docket:
    display_name: Booking Docket
    di_types:
    - booking_form
    stage: BOOKING
    requirement: REQUIRED
    condition: null
    accepted_early: true
    pages:
      shape: PARTS
      max_pages: 2
      group: BATCH
    extraction:
      di_schema: DEDICATED
      di_schema_version: '1.6'
      key_fields:
      - customer_name
      - booking_date
      - vehicle_model
      - vehicle_variant
      - total_price
      - booking_amount_paid
      review_threshold: 90
      strict_fields:
      - total_price
      - booking_amount_paid
      - discount_amount
      strict_review_threshold: 97
    persistence:
      typed: booking_form_review_values
      canonical:
      - bookings
      - customers
      - journey_products
      - commercial_lines
      - discount_applications
      - journey_addons
      - registration_records
      - insurance_records
      - trade_in_cases
    processors:
    - Booking materialization
    - SKU resolution
    - booking intimation
    - deal reconciliation
    controls:
    - MODEL_NOT_IDENTIFIED
    - BK_DOCKET_PRESENT
    - BK_DISCOUNT_EVIDENCE_MISSING
    - WRONG_DOCUMENT
    - DUPLICATE_BOOKING
    control_notes: MODEL_NOT_IDENTIFIED; BK_DOCKET_PRESENT; BK_DISCOUNT_EVIDENCE_MISSING; WRONG_DOCUMENT;
      DUPLICATE_BOOKING
    task_effects:
    - Low-confidence review
    - wrong-document review
    - correction review
    - re-upload when rejected
    journey_360:
    - CUSTOMER
    - BOOKING
    - VEHICLE
    - DEAL
