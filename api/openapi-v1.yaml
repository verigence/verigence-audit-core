openapi: 3.1.0
info:
  title: Verigence Audit Core API
  version: 1.0.0-draft
  description: >-
    User-facing Audit Core contract. Audit Core audits/observes dealer business operations and
    does not control or stop them. DI is internal-only and is never called directly by Web/Mobile
    clients through this contract.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /me/projects:
    get:
      operationId: listMyOperationalProjects
      description: >-
        Returns active operational Projects for the authenticated global human USER. This endpoint
        is distinct from the SuperAdmin /projects control-plane list. Project role and business
        scope are resolved from active Audit Core business assignments synchronized by UC02 Role
        Mapping. Zero Projects returns an empty projects array; one or many Projects use the same
        response shape.
      responses:
        '200':
          description: Active Projects available to the current USER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyProjects'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /projects:
    get:
      operationId: listProjects
      description: >-
        Returns persisted Projects available to the authenticated human SuperAdmin for Project
        Administration selection/resume. Audit Core remains the browser boundary and resolves
        Security Tenant metadata with the same human identity.
      responses:
        '200':
          description: Existing Projects
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProjectSelection'}
        default: {$ref: '#/components/responses/ProblemResponse'}
    post:
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201':
          description: Project provisioning completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectProvisioning'}
        '202':
          description: Project provisioning is in progress or requires recovery
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectProvisioning'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /project-provisioning-operations/{operationId}:
    get:
      operationId: getProjectProvisioningOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Project provisioning operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectProvisioning'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /project-provisioning-operations/{operationId}/retry:
    post:
      operationId: retryProjectProvisioningOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Project provisioning recovered and completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectProvisioning'}
        '202':
          description: Project provisioning still requires recovery
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectProvisioning'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /project-reference-data:
    get:
      operationId: getProjectReferenceData
      description: >-
        Returns active platform reference masters required before the first Project exists.
        Human SuperAdmin authorization is required. Web displays business names and submits the
        returned UUID identifiers when creating a Project.
      responses:
        '200':
          description: Active OEM and Product Category reference masters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectReferenceData'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/project:
    get:
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/uc03/landing-metrics:
    get:
      operationId: getUc03LandingMetrics
      description: >-
        Returns the four C0 landing counters for the authenticated USER within the selected
        Project and current Audit Core business-assignment scope. The Security human JWT is
        identity-only; Audit Core obtains a synchronous Security authorization decision for
        audit.journey.read before applying Dealer/Outlet business scope. Bookings In Progress
        counts BOOKING_STARTED and BOOKING_IN_PROGRESS. Delivery In Progress counts
        DELIVERY_STARTED and DELIVERY_IN_PROGRESS. Needs Attention is the distinct case count
        with at least one OPEN or ACKNOWLEDGED finding. Audit Flags is the OPEN/ACKNOWLEDGED
        finding count. Later UC03 checkpoints may broaden Needs Attention only through an
        explicit contract change.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: UC03 Project landing counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Uc03LandingMetrics'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/uc03/work-items:
    get:
      operationId: listUc03WorkItems
      description: >-
        Returns the latest authorized UC03 Booking/Delivery work items for the selected Project.
        The Security human JWT proves global USER identity only; Audit Core obtains a synchronous
        Security authorization decision for audit.journey.read and then enforces current
        business_assignments Dealer/Outlet scope. Results are ordered by latestActivityAtUtc then
        journeyId and limited to at most 10 rows per page. Date filters use the Project timezone.
        Booking date precedence is source Booking date, then Booking first-start event date, then
        Booking record date. Delivery date precedence is actual-delivered date, then Delivery
        first-start event date, then Delivery record date. For workType=ALL a case is returned once
        when either applicable stage falls in the requested range.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: workType
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, BOOKING, DELIVERY]
            default: ALL
        - name: fromDate
          in: query
          required: false
          schema: {type: string, format: date}
        - name: toDate
          in: query
          required: false
          schema: {type: string, format: date}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 10, default: 10}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 1024}
      responses:
        '200':
          description: UC03 Project work-item page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Uc03WorkItemPage'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  # UC03_C1_BOOKING_CONTRACT
  /tenants/{tenantId}/journeys/{journeyId}/booking/start:
    post:
      operationId: startUc03Booking
      description: Starts the Booking audit stage using idempotent optimistic concurrency.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Booking started or idempotently replayed, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/booking/close-ready:
    post:
      operationId: closeUc03BookingReady
      description: Completes Booking normally only when the versioned Booking completion gate has no blockers. Open non-blocking audit flags do not stop dealer business operations.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Booking checkpoint completed, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/booking/close-no-delivery:
    post:
      operationId: closeUc03BookingNoDelivery
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closeReasonCode]
              properties:
                closeReasonCode: {type: string, minLength: 1, maxLength: 100}
                remarks: {type: string, maxLength: 4000}
      responses:
        '200': {description: Booking closed with no-delivery disposition, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/booking/cancel:
    post:
      operationId: cancelUc03Booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closeReasonCode]
              properties:
                closeReasonCode: {type: string, minLength: 1, maxLength: 100}
                remarks: {type: string, maxLength: 4000}
      responses:
        '200': {description: Booking cancelled with configured reason, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/booking/mark-duplicate:
    post:
      operationId: markUc03BookingDuplicate
      description: Closes the Booking as duplicate and creates the mandatory HIGH duplicate finding with append-only history.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {remarks: {type: string, maxLength: 4000}}}
      responses:
        '200': {description: Duplicate Booking conclusion recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/capture/{fieldKey}:
    put:
      operationId: recordUc03BookingCapture
      description: Records approved typed-domain Booking capture; UC03 does not create a generic 123-field business-data store.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: fieldKey, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {}
                sourceEvidenceId: {type: string, format: uuid}
      responses:
        '200': {description: Typed Booking capture recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/extraction-proposals/{proposalId}/accept:
    post:
      operationId: acceptUc03BookingExtractionProposal
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {acceptedValue: {}}}
      responses:
        '200': {description: Proposal accepted into its approved typed domain with provenance retained, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/extraction-proposals/{proposalId}/correct:
    post:
      operationId: correctUc03BookingExtractionProposal
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [acceptedValue], properties: {acceptedValue: {}}}
      responses:
        '200': {description: Human correction recorded while immutable machine original/source version remain provenance, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/booking/extraction/refresh:
    post:
      operationId: refreshUc03BookingExtraction
      description: Refreshes processing and publishes proposals only for DI mappings reconciled as SUPPORTED for C1; PROVISIONAL/TBD mappings remain excluded.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': {description: Processing and proposal refresh result, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/processing-status:
    get:
      operationId: getUc03BookingProcessingStatus
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': {description: Progressive Booking document processing state, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/flags:
    get:
      operationId: listUc03BookingFlags
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': {description: Booking audit flags, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
    post:
      operationId: createUc03BookingHumanFlag
      description: Creates a PC-observed audit flag. Completion blocking is explicit and is not implied merely by an open finding.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, severity, summary]
              properties:
                category: {type: string, maxLength: 100}
                severity: {type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]}
                summary: {type: string, maxLength: 500}
                remarks: {type: string, maxLength: 4000}
                evidenceIds: {type: array, maxItems: 20, items: {type: string, format: uuid}}
      responses:
        '200': {description: Human audit flag recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/uc03-workspace:
    get:
      operationId: getUc03BookingWorkspace
      description: Returns the Web/Android Booking workspace including typed capture, document checklist/processing, proposals, flags and completion blockers.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': {description: Booking workspace, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/stages/BOOKING/documents/{requirementKey}/evidence:
    post:
      operationId: uploadUc03BookingDocument
      description: Human-token Audit Core facade for Booking evidence. Audit Core manages DI subject/context linkage and idempotent processing; Web/Android never calls DI directly.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: requirementKey, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        '201': {description: Booking evidence accepted and linked, content: {application/json: {schema: {$ref: '#/components/schemas/Evidence'}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/stages/{stageCode}/documents:
    get:
      operationId: listUc03BookingDocumentAssessments
      description: Lists versioned Booking requirements and effective applicability/assessment state. C1 accepts only BOOKING.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - {name: stageCode, in: path, required: true, schema: {type: string, enum: [BOOKING]}}
      responses:
        '200': {description: Booking document assessments, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/stages/{stageCode}/documents/{requirementKey}:
    put:
      operationId: recordUc03BookingDocumentAssessment
      description: Records YES, NO, NA or UNANSWERED after dynamic applicability is resolved.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: stageCode, in: path, required: true, schema: {type: string, enum: [BOOKING]}}
        - {name: requirementKey, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {type: string, enum: [YES, NO, NA, UNANSWERED]}
                evidenceId: {type: string, format: uuid}
                remarks: {type: string, maxLength: 4000}
      responses:
        '200': {description: Booking document assessment recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/reference/product-skus:
    get:
      operationId: listProductSkus
      description: Returns active Product SKU references for the OEM configured on the requested Tenant/Project. Requires audit.master.read.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 120}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Project/OEM-scoped active Product SKU references
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProductSkuReference'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/customers/{customerId}/journeys:
    post:
      operationId: createJourney
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Journey created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}:
    get:
      operationId: getJourney
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200':
          description: Journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/delivery:
    put:
      operationId: upsertObservedDelivery
      description: Records observed/actual delivery facts. Does not approve, block, stop or cancel dealer delivery.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryObservation'}
      responses:
        '200':
          description: Delivery observation recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryObservation'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/evidence:
    post:
      operationId: uploadJourneyEvidence
      description: Audit Core façade over internal DI. Client never calls DI directly.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, evidencePurpose]
              properties:
                file: {type: string, format: binary}
                evidencePurpose: {type: string}
                requirementKey: {type: string}
                documentTypeKey: {type: string}
      responses:
        '201':
          description: Evidence accepted by Audit Core
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evidence'}
        default: {$ref: '#/components/responses/ProblemResponse'}
    get:
      operationId: listJourneyEvidence
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Evidence'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/audit/submit:
    post:
      operationId: submitAuditWork
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Audit work submitted; resulting review task is durable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditStatus'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/review-decisions:
    post:
      operationId: createReviewDecision
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '201':
          description: Review decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditStatus'}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/tasks/{taskId}/complete:
    post:
      operationId: completeAuditTask
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Durable audit task completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/ProblemResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    OperationId:
      name: operationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: {type: string, format: uuid}
    JourneyId:
      name: journeyId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 200}
  schemas:
    MyProjects:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: {$ref: '#/components/schemas/OperationalProject'}
    OperationalProject:
      type: object
      required:
        - tenantId
        - projectCode
        - projectName
        - projectStatus
        - timezoneName
        - operatingRole
        - scope
      properties:
        tenantId: {type: string, maxLength: 128}
        projectCode: {type: string}
        projectName: {type: string}
        projectStatus: {type: string, enum: [ACTIVE]}
        timezoneName: {type: string}
        operatingRole:
          type: string
          enum: [PC, TL, PM, CRM, Executive]
        scope: {$ref: '#/components/schemas/ProjectScopeSummary'}
    ProjectScopeSummary:
      type: object
      required: [allDealers, dealerCount, outletCount]
      properties:
        allDealers: {type: boolean}
        dealerCount: {type: integer, minimum: 0}
        outletCount: {type: integer, minimum: 0}
    Uc03LandingMetrics:
      type: object
      required: [bookingsInProgress, deliveryInProgress, needsAttention, auditFlags]
      properties:
        bookingsInProgress: {type: integer, minimum: 0}
        deliveryInProgress: {type: integer, minimum: 0}
        needsAttention:
          type: integer
          minimum: 0
          description: Distinct authorized cases with at least one OPEN or ACKNOWLEDGED finding in C0.
        auditFlags:
          type: integer
          minimum: 0
          description: OPEN and ACKNOWLEDGED finding count in the authorized Project scope.
    Uc03StageSummary:
      type: object
      required: [businessStatus, auditState, auditStatus, businessDate]
      properties:
        businessStatus: {type: [string, 'null']}
        auditState:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, COMPLETE]
        auditStatus:
          type: string
          enum: [NOT_EVALUATED, NO_FLAGS, FLAGS_RAISED]
        businessDate: {type: [string, 'null'], format: date}
    Uc03WorkItem:
      type: object
      required:
        - journeyId
        - bookingReference
        - customerDisplayName
        - customerMobileLast4
        - productLabel
        - projectName
        - dealerId
        - dealerName
        - outletId
        - outletName
        - booking
        - delivery
        - openFlagCount
        - totalFlagCount
        - highestOpenSeverity
        - processingDocumentCount
        - proposalReadyCount
        - latestActivityAtUtc
        - nextActionCode
      properties:
        journeyId: {type: string, format: uuid}
        bookingReference: {type: [string, 'null']}
        customerDisplayName: {type: string}
        customerMobileLast4: {type: [string, 'null']}
        productLabel: {type: [string, 'null']}
        projectName: {type: string}
        dealerId: {type: string, format: uuid}
        dealerName: {type: string}
        outletId: {type: string, format: uuid}
        outletName: {type: string}
        booking: {$ref: '#/components/schemas/Uc03StageSummary'}
        delivery: {$ref: '#/components/schemas/Uc03StageSummary'}
        openFlagCount: {type: integer, minimum: 0}
        totalFlagCount: {type: integer, minimum: 0}
        highestOpenSeverity:
          type: [string, 'null']
          description: Highest current open/acknowledged flag severity using the published severity vocabulary.
        processingDocumentCount: {type: integer, minimum: 0}
        proposalReadyCount:
          type: integer
          minimum: 0
          description: Reserved at zero in C0; populated when C1 extraction proposal acceptance is implemented.
        latestActivityAtUtc: {type: string, format: date-time}
        nextActionCode:
          type: [string, 'null']
          description: Reserved as null in C0 until concrete Booking/Delivery command policy is implemented.
    Uc03WorkItemFilters:
      type: object
      required: [workType, fromDate, toDate, timezoneName]
      properties:
        workType: {type: string, enum: [ALL, BOOKING, DELIVERY]}
        fromDate: {type: [string, 'null'], format: date}
        toDate: {type: [string, 'null'], format: date}
        timezoneName: {type: string}
    Uc03WorkItemPage:
      type: object
      required: [items, pageSize, nextCursor, previousCursor, filters]
      properties:
        items:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/Uc03WorkItem'}
        pageSize: {type: integer, minimum: 0, maximum: 10}
        nextCursor: {type: [string, 'null']}
        previousCursor:
          type: [string, 'null']
          description: C0 returns null; clients can retain prior cursor history for Previous navigation.
        filters: {$ref: '#/components/schemas/Uc03WorkItemFilters'}
    Project:
      type: object
      required: [tenantId, projectName]
      properties:
        tenantId: {type: string}
        projectCode: {type: string}
        projectName: {type: string}
    ProjectCreate:
      type: object
      required: [projectName, oemId, productCategoryId, effectiveStartDate]
      properties:
        projectName: {type: string, minLength: 1, maxLength: 240}
        oemId: {type: string, format: uuid}
        productCategoryId: {type: string, format: uuid}
        effectiveStartDate: {type: string, format: date}
        effectiveEndDate: {type: [string, 'null'], format: date}
        timezoneName: {type: string}
        regionCode: {type: [string, 'null']}
    ProjectSelection:
      type: object
      required: [tenantId, projectCode, projectName, projectStatus, securityTenantStatus]
      properties:
        tenantId: {type: string}
        projectCode: {type: string}
        projectName: {type: string}
        projectStatus: {type: string}
        securityTenantStatus: {type: string}
    ProjectProvisioning:
      type: object
      required:
        - operationId
        - projectName
        - projectStatus
        - provisioningStatus
        - currentStep
      properties:
        operationId: {type: string, format: uuid}
        tenantId: {type: [string, 'null']}
        projectName: {type: string}
        projectStatus: {type: string}
        provisioningStatus:
          type: string
          enum: [READY, IN_PROGRESS, RECOVERY_REQUIRED]
        currentStep:
          type: string
          enum: [SECURITY, AUDIT_CORE, DI, COMPLETE]
        errorCode: {type: [string, 'null']}
        errorMessage: {type: [string, 'null']}
    ProjectReferenceData:
      type: object
      required: [oems, productCategories]
      properties:
        oems:
          type: array
          items: {$ref: '#/components/schemas/OemReference'}
        productCategories:
          type: array
          items: {$ref: '#/components/schemas/ProductCategoryReference'}
    OemReference:
      type: object
      required: [oemId, oemCode, oemName]
      properties:
        oemId: {type: string, format: uuid}
        oemCode: {type: string}
        oemName: {type: string}
    ProductCategoryReference:
      type: object
      required: [productCategoryId, categoryCode, categoryName]
      properties:
        productCategoryId: {type: string, format: uuid}
        categoryCode: {type: string}
        categoryName: {type: string}
    ProductSkuReference:
      type: object
      required:
        - productSkuId
        - skuCode
        - oemCode
        - oemName
        - modelCode
        - modelName
        - variantCode
        - variantName
        - colourCode
        - colourName
      properties:
        productSkuId: {type: string, format: uuid}
        skuCode: {type: string}
        oemCode: {type: string}
        oemName: {type: string}
        modelCode: {type: string}
        modelName: {type: string}
        variantCode: {type: string}
        variantName: {type: string}
        colourCode: {type: [string, 'null']}
        colourName: {type: [string, 'null']}
    Journey:
      type: object
      required: [journeyId, tenantId, customerId, auditState, auditOutcome]
      properties:
        journeyId: {type: string, format: uuid}
        tenantId: {type: string}
        customerId: {type: string, format: uuid}
        outletId: {type: string, format: uuid}
        auditState:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, PC_SUBMITTED, TL_REVIEW, SENT_BACK, PM_REVIEW, REVIEW_COMPLETE]
        auditOutcome:
          type: string
          enum: [PENDING, NO_BREACH, BREACH]
        actualDeliveryStatusCode:
          type: [string, 'null']
          description: Configured observed delivery-status code. Canonical values remain business-configured.
        versionNo: {type: integer, minimum: 1}
    DeliveryObservation:
      type: object
      properties:
        plannedDeliveryAt: {type: [string, 'null'], format: date-time}
        deliveryIntimatedAt: {type: [string, 'null'], format: date-time}
        actualDeliveryStatusCode: {type: [string, 'null']}
        actualDeliveredAt: {type: [string, 'null'], format: date-time}
        statusSource:
          type: [string, 'null']
          enum: [EVIDENCE, OPERATIONAL_INPUT, SOURCE_SYSTEM, null]
        remarks: {type: [string, 'null'], maxLength: 4000}
    Evidence:
      type: object
      required: [evidenceId, journeyId, processingStatus]
      properties:
        evidenceId: {type: string, format: uuid}
        journeyId: {type: string, format: uuid}
        documentTypeKey: {type: [string, 'null']}
        evidencePurpose: {type: string}
        processingStatus: {type: string}
        verificationStatus: {type: [string, 'null']}
        createdAtUtc: {type: string, format: date-time}
    ReviewDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [BREACH, NO_BREACH, SEND_BACK]
        remarks: {type: [string, 'null'], maxLength: 4000}
    AuditStatus:
      type: object
      required: [auditState, auditOutcome]
      properties:
        auditState: {type: string}
        auditOutcome: {type: string}
    Task:
      type: object
      required: [taskId, status, taskType]
      properties:
        taskId: {type: string, format: uuid}
        taskType: {type: string}
        status: {type: string}
        dueAtUtc: {type: [string, 'null'], format: date-time}
        assignedActorId: {type: [string, 'null']}
        assignedRole: {type: [string, 'null']}
    Problem:
      type: object
      required: [type, title, status, errorCode, correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errorCode: {type: string}
        correlationId: {type: string}
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    ProblemResponse:
      description: Audit Core error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
