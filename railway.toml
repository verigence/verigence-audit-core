[build]
builder = "railpack"

[deploy]
preDeployCommand = ["sh -c 'set -eu; test -f migrations/versions/0015_uc02_universal_segments.py; alembic heads | grep -q 0015_uc02_global_segments; alembic upgrade head'"]
startCommand = "PYTHONPATH=src uvicorn audit_core.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
