[build]
builder = "railpack"

[deploy]
preDeployCommand = ["sh -c 'set -eu; test -f migrations/versions/0012_uc03_delivery_capture.py; alembic heads | grep -q 0012_uc03_delivery_capture; alembic upgrade head'"]
startCommand = "PYTHONPATH=src uvicorn audit_core.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
