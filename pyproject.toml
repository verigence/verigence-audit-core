[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "verigence-audit-core"
version = "0.1.0"
description = "Verigence Audit Core service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "PyJWT[crypto]==2.13.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "openpyxl>=3.1,<4",
    "structlog>=24.1.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
lint = [
    "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# This catch is a deliberate composite-operation recovery boundary: once a
# downstream Security write has occurred, any unexpected local failure must be
# converted into a durable RECOVERY_REQUIRED state rather than losing reconciliation.
"src/audit_core/role_mappings.py" = ["BLE001"]
# Telemetry initialization/export is a deliberate fail-open third-party boundary;
# no observability exception may prevent Audit Core business processing or startup.
"src/audit_core/otel.py" = ["BLE001"]
# The Project Master facade keeps imports grouped by owning master domain so the
# adapter boundary remains reviewable beside the corresponding confirm helpers.
"src/audit_core/project_master_imports.py" = ["I001"]
# UC02 readiness and Project-delete orchestration keep cross-module dependencies
# together as explicit review boundaries (Security / DI / Audit Core ownership).
"src/audit_core/readiness.py" = ["I001"]
"src/audit_core/uc02_project_admin_stabilization.py" = ["I001"]
