[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "channel-whatsapp"
version = "0.1.0"
description = "WhatsApp evidence channel for Verigence Audit Core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
redaction = ["pillow>=10.0", "pyzbar>=0.1"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["channel_whatsapp/tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["channel_whatsapp"]
