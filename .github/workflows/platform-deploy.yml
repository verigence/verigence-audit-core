name: "DEPRECATED — Unified Railway platform DEV (DO NOT USE)"

# DEPRECATED — DO NOT USE FOR NORMAL DEPLOYMENTS.
#
# This unified cross-module deployment workflow is obsolete and intentionally blocked.
# Verigence now uses three independent CI/CD pipelines from each module's `main` branch:
#
#   Audit Core: verigence-audit-core/.github/workflows/audit-core-dev-deploy.yml
#   Security:    verigence-security/.github/workflows/security-dev-deploy.yml
#   DI:          verigence-di/.github/workflows/deploy-dev.yml
#
# Each module must be built, tested and deployed independently. Do not use this workflow
# to redeploy unchanged modules together.
#
# The previous unified deployment implementation remains available in Git history if it
# is ever needed for forensic/reference purposes. Re-enabling it requires an explicit
# architecture/operations decision; do not remove this deprecation guard casually.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated:
    name: "BLOCKED — use module-specific deployment pipelines"
    runs-on: ubuntu-24.04
    steps:
      - name: Stop obsolete unified deployment
        shell: bash
        run: |
          echo "::error::DEPRECATED: platform-deploy.yml must not be used for normal deployments."
          echo "Audit Core deploy: .github/workflows/audit-core-dev-deploy.yml"
          echo "Security deploy: verigence-security/.github/workflows/security-dev-deploy.yml"
          echo "DI deploy: verigence-di/.github/workflows/deploy-dev.yml"
          echo "Each module now has an independent CI/CD pipeline from main."
          exit 1
