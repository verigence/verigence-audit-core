name: One-shot Schema V2 Audit Core sandbox 0035

on:
  push:
    branches: [feature/schema-v2-evidence-role-lineage]
    paths:
      - '.github/workflows/one-shot-schema-v2-sandbox-0035.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SERVICE: verigence-audit-core
      SANDBOX_HOST: ep-royal-pond-ayci3m0f-pooler.c-5.us-east-2.aws.neon.tech

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/schema-v2-evidence-role-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install application and clients
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          npm install --global @railway/cli >/dev/null

      - name: Resolve isolated Schema V2 sandbox connection
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$SERVICE" --json >/dev/null
          railway variable list --service "$SERVICE" --environment dev --json >/tmp/audit-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          values=json.loads(Path('/tmp/audit-vars.json').read_text())
          raw=str(values.get('DATABASE_URL') or '').strip()
          if not raw:
              raise SystemExit('Audit Core DATABASE_URL unavailable')
          raw=(raw.replace('postgresql+asyncpg://','postgresql://',1)
                  .replace('postgres+asyncpg://','postgresql://',1)
                  .replace('postgres://','postgresql://',1))
          parts=urlsplit(raw)
          if not parts.username:
              raise SystemExit('Audit Core DATABASE_URL has no database role')
          auth=parts.username
          if parts.password is not None:
              auth += ':' + parts.password
          query=dict(parse_qsl(parts.query, keep_blank_values=True))
          query.pop('ssl', None)
          query['sslmode']='require'
          netloc=auth+'@'+os.environ['SANDBOX_HOST']
          psql_url=urlunsplit(('postgresql', netloc, parts.path or '/neondb', urlencode(query), ''))
          alembic_url='postgresql+psycopg://'+psql_url[len('postgresql://'):]
          Path('/tmp/sandbox-psql-url').write_text(psql_url)
          Path('/tmp/sandbox-alembic-url').write_text(alembic_url)
          print('AUDIT_SCHEMA_V2_SANDBOX_CONNECTION=RESOLVED')
          PY
          echo "::add-mask::$(cat /tmp/sandbox-psql-url)"
          echo "::add-mask::$(cat /tmp/sandbox-alembic-url)"

      - name: Require exact pre-0035 baseline
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/sandbox-alembic-url)"
          alembic current | tee /tmp/audit-current.txt
          grep -q '0034_uc03_hot_indexes' /tmp/audit-current.txt
          if grep -q '0035_schema_v2_fact_lineage' /tmp/audit-current.txt; then
            echo 'AUDIT_0035_ALREADY_APPLIED=YES'
          else
            echo 'AUDIT_PRE_0035_BASELINE=0034_uc03_hot_indexes'
          fi

      - name: Snapshot evidence facts before Schema V2 migration
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/sandbox-psql-url)"
          psql "$url" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auditcore_v1_backup;
          DO $$
          BEGIN
            IF to_regclass('auditcore_v1_backup.evidence_facts_pre_0035') IS NULL THEN
              CREATE TABLE auditcore_v1_backup.evidence_facts_pre_0035
              AS TABLE auditcore.evidence_facts WITH DATA;
            END IF;
          END $$;
          SELECT
            (SELECT count(*) FROM auditcore.evidence_facts) AS live_rows,
            (SELECT count(*) FROM auditcore_v1_backup.evidence_facts_pre_0035) AS backup_rows;
          SQL

      - name: Apply Audit Core Schema V2 migration 0035
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/sandbox-alembic-url)"
          current="$(alembic current 2>/dev/null || true)"
          if echo "$current" | grep -q '0035_schema_v2_fact_lineage'; then
            echo 'AUDIT_SCHEMA_V2_0035_APPLY=SKIPPED_ALREADY_PRESENT'
          else
            echo "$current" | grep -q '0034_uc03_hot_indexes'
            alembic upgrade 0035_schema_v2_fact_lineage
            echo 'AUDIT_SCHEMA_V2_0035_APPLY=PASS'
          fi

      - name: Verify lineage schema and backup integrity
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/sandbox-alembic-url)"
          alembic current | tee /tmp/audit-current-after.txt
          grep -q '0035_schema_v2_fact_lineage' /tmp/audit-current-after.txt
          url="$(cat /tmp/sandbox-psql-url)"
          psql "$url" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_missing int;
            v_live bigint;
            v_backup bigint;
          BEGIN
            SELECT count(*) INTO v_missing
            FROM (VALUES
              ('fact_role'),('di_value_version_no'),('di_extracted_fact_id'),('di_processing_run_id'),
              ('di_extraction_profile_id'),('di_extraction_profile_version'),('di_invocation_id'),('di_pipeline_version')
            ) x(column_name)
            WHERE NOT EXISTS (
              SELECT 1 FROM information_schema.columns c
              WHERE c.table_schema='auditcore'
                AND c.table_name='evidence_facts'
                AND c.column_name=x.column_name
            );
            IF v_missing <> 0 THEN
              RAISE EXCEPTION 'Audit Core Schema V2 lineage columns missing: %', v_missing;
            END IF;

            SELECT count(*) INTO v_live FROM auditcore.evidence_facts;
            SELECT count(*) INTO v_backup FROM auditcore_v1_backup.evidence_facts_pre_0035;
            IF v_live <> v_backup THEN
              RAISE EXCEPTION 'Evidence row count changed during additive migration: live %, backup %', v_live, v_backup;
            END IF;
            RAISE NOTICE 'PASS: 8 lineage columns present and evidence row count preserved (%)', v_live;
          END $$;
          SELECT 'AUDIT_SCHEMA_V2_SANDBOX_0035=PASS' AS result;
          SQL
