name: One-shot JBR-01 masters (read-only)

# Runs when this branch is pushed. SELECT only (read-only session). Posts the result as an issue.
on:
  push:
    branches: [claude/jbr01-masters-readonly]

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q "psycopg[binary]"
      - run: python .github/one-shot/jbr01_masters_readonly.py
      - name: Post report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f /tmp/report.md || echo 'No report produced.' > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "JBR-01 masters read-only (run $GITHUB_RUN_ID)" --body-file /tmp/report.md
