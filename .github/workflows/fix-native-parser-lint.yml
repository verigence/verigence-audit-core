name: Fix native Mahindra parser lint

on:
  push:
    branches:
      - fix/uc02-mahindra-native-workbooks
    paths:
      - .github/workflows/fix-native-parser-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uc02-mahindra-native-workbooks
      - name: Apply lint corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/audit_core/mahindra_native_workbooks.py')
          text = path.read_text()
          text = text.replace('re.I)', 're.IGNORECASE)')
          text = text.replace('Decimal("0")', 'Decimal(0)')
          path.write_text(text)
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audit_core/mahindra_native_workbooks.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(uc02): satisfy native parser lint"
          git push origin HEAD:fix/uc02-mahindra-native-workbooks
