name: One-shot invoice date and deal amount diagnose (DEV, read-only)

# Read-only: one journey. Prints the invoice date field and any pending correction
# task, the invoice header amounts and the Deal source values. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-invoice-date-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-invoice-date-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Print the journey's date fields, correction tasks and deal amounts
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from datetime import datetime
          from sqlalchemy import create_engine, text
          from audit_core.uc03_p2_registry import get_registry

          J = "20f1de3c-46a7-4ac9-a7c1-dd9c39035255"

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False))

          print("date_floor:", get_registry().extraction_rules.date_floor)
          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              p = {"j": J}
              show("date fields", c.execute(text("""
                  SELECT di_document_id, source_document_type_key, field_key, extracted_value, modified_value,
                         effective_value, is_modified, confidence_score, reviewed_by_actor_id, reviewed_at_utc, updated_at_utc
                  FROM auditcore.journey_document_extracted_fields
                  WHERE journey_id = :j AND field_key LIKE '%date%'
                  ORDER BY source_document_type_key, field_key
              """), p).mappings().all())
              show("correction review tasks", c.execute(text("""
                  SELECT task_id, task_status, title, created_at_utc, updated_at_utc,
                         reference->>'fieldKey' AS field_key, reference->>'proposedValue' AS proposed,
                         reference->>'currentEffectiveValue' AS current_value, reference->>'proposalRemarks' AS remarks
                  FROM auditcore.p2_tasks
                  WHERE journey_id = :j AND task_type = 'FIELD_CORRECTION_REVIEW_P2'
                  ORDER BY created_at_utc
              """), p).mappings().all())
              show("invoice amount fields", c.execute(text("""
                  SELECT source_document_type_key, di_document_id, field_key, effective_value
                  FROM auditcore.journey_document_extracted_fields
                  WHERE journey_id = :j
                    AND field_key IN ('gross_amount_before_discount','invoice_discount_amount','taxable_amount','cgst_amount',
                                      'sgst_amount','igst_amount','cess_amount','tcs_amount','round_off_amount','grand_total_amount')
                  ORDER BY source_document_type_key, field_key
              """), p).mappings().all())
              show("deal source values", c.execute(text("""
                  SELECT line_kind, component_key, source_document_type, amount
                  FROM auditcore.commercial_line_source_values WHERE journey_id = :j
                  ORDER BY line_kind, component_key, source_document_type
              """), p).mappings().all())
          PY
