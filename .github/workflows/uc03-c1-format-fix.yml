name: UC03 C1 One-Time Format Fix

on:
  push:
    branches:
      - planning/uc-003-booking-delivery-audit
    paths:
      - .github/workflows/uc03-c1-format-fix.yml
      - src/audit_core/uc03_booking_commands.py

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UC03 branch
        uses: actions/checkout@v4
        with:
          ref: planning/uc-003-booking-delivery-audit
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff==0.16.0

      - name: Apply Ruff import formatting only
        run: ruff check --select I --fix src/audit_core/uc03_booking_commands.py

      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/audit_core/uc03_booking_commands.py; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audit_core/uc03_booking_commands.py
          git commit -m 'style(uc03-c1): apply Ruff import formatting'
          git push origin HEAD:planning/uc-003-booking-delivery-audit
