name: UC03 C1 formatter

on:
  push:
    branches:
      - planning/uc-003-booking-delivery-audit

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style(uc03-c1): apply formatter') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning/uc-003-booking-delivery-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.0
      - run: ruff check src/audit_core/uc03_booking_capture.py src/audit_core/uc03_booking_evidence.py src/audit_core/main.py --fix
      - name: Commit formatter changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audit_core/uc03_booking_capture.py src/audit_core/uc03_booking_evidence.py src/audit_core/main.py
          git commit -m "style(uc03-c1): apply formatter"
          git push origin HEAD:planning/uc-003-booking-delivery-audit
