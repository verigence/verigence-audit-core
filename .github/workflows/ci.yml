name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/auditcore_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'

      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Lint
        run: ruff check src tests migrations

      - name: Apply fresh database migration
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              assert connection.execute(text("select to_regclass('auditcore.projects')::text")).scalar_one() == "auditcore.projects"
              assert connection.execute(text("select version_num from alembic_version")).scalar_one() == "0004_uc02_outlet_google_place"
              assert connection.execute(text("""
                  select count(*) from information_schema.columns
                  where table_schema='auditcore'
                    and table_name='dealer_outlets'
                    and column_name='google_place_id'
              """)).scalar_one() == 1
          PY

      - name: Unit tests
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 100 pytest.log)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Pytest failure summary::$summary"
            exit "$status"
          fi
