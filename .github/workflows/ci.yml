name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/auditcore_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'

      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Lint
        run: ruff check src tests migrations

      - name: Apply fresh database migration
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              assert connection.execute(text("select to_regclass('auditcore.projects')::text")).scalar_one() == "auditcore.projects"
              assert connection.execute(text("select version_num from alembic_version")).scalar_one() == "0012_uc03_delivery_capture"
              assert connection.execute(text("select to_regclass('auditcore.administrative_operations')::text")).scalar_one() == "auditcore.administrative_operations"
              assert connection.execute(text("select to_regclass('auditcore.project_product_masters')::text")).scalar_one() == "auditcore.project_product_masters"
              assert connection.execute(text("select to_regclass('auditcore.project_product_master_versions')::text")).scalar_one() == "auditcore.project_product_master_versions"
              assert connection.execute(text("select to_regclass('auditcore.project_product_master_items')::text")).scalar_one() == "auditcore.project_product_master_items"
              assert connection.execute(text("select to_regclass('auditcore.project_master_imports')::text")).scalar_one() == "auditcore.project_master_imports"
              assert connection.execute(text("select to_regclass('auditcore.project_master_import_rows')::text")).scalar_one() == "auditcore.project_master_import_rows"
              assert connection.execute(text("select to_regclass('auditcore.journey_stage_states')::text")).scalar_one() == "auditcore.journey_stage_states"
              assert connection.execute(text("select to_regclass('auditcore.journey_workflow_events')::text")).scalar_one() == "auditcore.journey_workflow_events"
              assert connection.execute(text("select to_regclass('auditcore.audit_finding_events')::text")).scalar_one() == "auditcore.audit_finding_events"
              assert connection.execute(text("select to_regclass('auditcore.journey_delivery_audit_facts')::text")).scalar_one() == "auditcore.journey_delivery_audit_facts"
              assert connection.execute(text("select to_regprocedure('auditcore.current_security_actor_id()')::text")).scalar_one() == "auditcore.current_security_actor_id()"
              assert connection.execute(text("""
                  select count(*) from information_schema.columns
                  where table_schema='auditcore'
                    and table_name='dealer_outlets'
                    and column_name='google_place_id'
              """)).scalar_one() == 1
              assert connection.execute(text("""
                  select count(*) from information_schema.columns
                  where table_schema='auditcore'
                    and table_name='journey_stage_states'
                    and column_name in (
                        'close_reason_code', 'closure_remarks',
                        'closed_by_actor_id', 'closed_at_utc'
                    )
              """)).scalar_one() == 4
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.dealers', 'DELETE'
                  )
              """)).scalar_one() is True
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.dealer_outlets', 'DELETE'
                  )
              """)).scalar_one() is True
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.projects', 'DELETE'
                  )
              """)).scalar_one() is False
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.administrative_operations', 'DELETE'
                  )
              """)).scalar_one() is False
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.project_product_master_versions', 'DELETE'
                  )
              """)).scalar_one() is False
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.project_master_imports', 'DELETE'
                  )
              """)).scalar_one() is True
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.journey_stage_states', 'UPDATE'
                  )
              """)).scalar_one() is True
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.journey_workflow_events', 'UPDATE'
                  )
              """)).scalar_one() is False
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.journey_workflow_events', 'DELETE'
                  )
              """)).scalar_one() is False
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.audit_finding_events', 'UPDATE'
                  )
              """)).scalar_one() is False
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.audit_finding_events', 'DELETE'
                  )
              """)).scalar_one() is False
              assert connection.execute(text("""
                  select has_table_privilege(
                      'audit_core_runtime', 'auditcore.journey_delivery_audit_facts', 'DELETE'
                  )
              """)).scalar_one() is False
          PY

      - name: Unit tests
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 100 pytest.log)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Pytest failure summary::$summary"
            exit "$status"
          fi

  deploy-dev:
    name: Deploy tested Audit Core SHA to Railway DEV
    needs: quality
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.quality.result == 'success'
    uses: ./.github/workflows/audit-core-dev-deploy.yml
    secrets: inherit

  diagnose-security-create:
    name: Diagnose live Security tenant create
    needs: deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/one-shot-security-create-fast.yml
    secrets: inherit
