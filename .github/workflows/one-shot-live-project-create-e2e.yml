name: One-shot live Project Create E2E

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-live-project-create-e2e.yml'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'psycopg[binary]>=3.2,<4' 'PyJWT>=2.8,<3' 'cryptography>=42,<46' 'httpx>=0.27,<1'
          npm install --global @railway/cli
      - name: Verify live Security create latency
        shell: bash
        run: |
          set +e
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service security --json >/dev/null
          railway variable list --service security --environment dev --json >/tmp/security.json
          python - <<'PY'
          import json,time,uuid,traceback
          from datetime import UTC,datetime,timedelta
          from pathlib import Path
          import httpx,jwt,psycopg
          out=['LIVE_PROJECT_CREATE_E2E','MODE=SECURITY_CREATE_LATENCY_VERIFY']
          try:
              v=json.loads(Path('/tmp/security.json').read_text())
              db=str(v.get('DATABASE_URL') or '').replace('postgresql+psycopg://','postgresql://',1).replace('postgresql+asyncpg://','postgresql://',1)
              domain=str(v.get('RAILWAY_PUBLIC_DOMAIN') or v.get('RAILWAY_STATIC_URL') or '').strip()
              if not domain.startswith(('http://','https://')): domain='https://'+domain
              with psycopg.connect(db) as conn:
                  with conn.cursor() as cur:
                      cur.execute("SELECT a.user_id::text FROM security.user_admin_role_assignments a JOIN security.users u ON u.user_id=a.user_id WHERE a.role_key='SuperAdmin' AND a.scope_type='PLATFORM' AND a.scope_id IS NULL AND a.status='ACTIVE' AND u.status='ACTIVE' ORDER BY a.assigned_at_utc LIMIT 1")
                      uid=cur.fetchone()[0]
              now=datetime.now(UTC)
              token=jwt.encode({'iss':str(v.get('SECURITY_TOKEN_ISSUER') or 'verigence-security'),'sub':uid,'aud':str(v.get('SECURITY_TOKEN_AUDIENCE') or 'verigence-platform'),'iat':now,'exp':now+timedelta(minutes=5),'jti':str(uuid.uuid4()),'actor_type':'USER'},str(v.get('SECURITY_PRIVATE_KEY_PEM') or '').replace('\\n','\n'),algorithm='RS256',headers={'kid':str(v.get('SECURITY_KEY_ID') or '')})
              headers={'Authorization':'Bearer '+token,'Idempotency-Key':str(uuid.uuid4()),'Content-Type':'application/json'}
              name='SEC-LATENCY-'+now.strftime('%Y%m%d%H%M%S')
              started=time.monotonic()
              with httpx.Client(timeout=90,follow_redirects=True) as client:
                  r=client.post(domain.rstrip('/')+'/security/v1/platform/tenants',headers=headers,json={'tenantName':name})
                  elapsed=time.monotonic()-started
                  out.append('SECURITY_CREATE_HTTP='+str(r.status_code))
                  out.append('SECURITY_CREATE_SECONDS='+f'{elapsed:.3f}')
                  try: body=r.json()
                  except Exception: body={}
                  out.append('SECURITY_CREATE_BODY='+json.dumps(body,sort_keys=True)[:1000].replace('\n',' '))
                  tid=str(body.get('tenantId') or '') if isinstance(body,dict) else ''
                  if tid:
                      d=client.delete(domain.rstrip('/')+'/security/v1/platform/tenants/'+tid,headers={'Authorization':'Bearer '+token})
                      out.append('SECURITY_CLEANUP_HTTP='+str(d.status_code))
              out.append('RESULT='+('PASS' if r.status_code==201 and elapsed<20 else 'FAIL'))
          except Exception as exc:
              out.append('RESULT=FATAL')
              out.append('FATAL_TYPE='+type(exc).__name__)
              out.append('FATAL_MESSAGE='+str(exc)[:800].replace('\n',' '))
              out.append('TRACE_LAST='+traceback.format_exc().splitlines()[-1][:800])
          Path('docs/runtime/live-project-create-e2e.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/live-project-create-e2e.txt
          git commit -m 'docs(dev): record Security create latency verification [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
