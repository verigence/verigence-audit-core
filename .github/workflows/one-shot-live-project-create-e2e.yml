name: One-shot live Project Create E2E

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-live-project-create-e2e.yml'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SECURITY_SERVICE: security
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4' 'PyJWT>=2.8,<3' 'cryptography>=42,<46' 'httpx>=0.27,<1'
          npm install --global @railway/cli
      - name: Capture live Security tenant-create wait state
        shell: bash
        run: |
          set +e
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$SECURITY_SERVICE" --json >/dev/null
          railway variable list --service "$SECURITY_SERVICE" --environment dev --json >/tmp/security.json
          python - <<'PY'
          import json, uuid, traceback, threading, time
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          import httpx, jwt, psycopg

          out=['LIVE_PROJECT_CREATE_E2E','MODE=SECURITY_CREATE_WAIT_DIAG']
          try:
              v=json.loads(Path('/tmp/security.json').read_text())
              db=str(v.get('DATABASE_URL') or '').replace('postgresql+psycopg://','postgresql://',1).replace('postgresql+asyncpg://','postgresql://',1)
              domain=str(v.get('RAILWAY_PUBLIC_DOMAIN') or v.get('RAILWAY_STATIC_URL') or '').strip()
              if not domain.startswith(('http://','https://')): domain='https://'+domain
              base=domain.rstrip('/')
              with psycopg.connect(db) as conn:
                  with conn.cursor() as cur:
                      cur.execute("SELECT a.user_id::text FROM security.user_admin_role_assignments a JOIN security.users u ON u.user_id=a.user_id WHERE a.role_key='SuperAdmin' AND a.scope_type='PLATFORM' AND a.scope_id IS NULL AND a.status='ACTIVE' AND u.status='ACTIVE' ORDER BY a.assigned_at_utc LIMIT 1")
                      row=cur.fetchone(); uid=row[0] if row else ''
                      cur.execute("SELECT count(*) FROM security.platform_role_permission_defaults d JOIN security.permissions p ON p.permission_key=d.permission_key WHERE d.status='ACTIVE' AND p.status='ACTIVE' AND d.role_key IN ('PC','TL','PM','CRM','Executive')")
                      out.append('ROLE_DEFAULT_TOTAL='+str(cur.fetchone()[0]))
              private_key=str(v.get('SECURITY_PRIVATE_KEY_PEM') or '').replace('\\n','\n')
              kid=str(v.get('SECURITY_KEY_ID') or '')
              issuer=str(v.get('SECURITY_TOKEN_ISSUER') or 'verigence-security')
              audience=str(v.get('SECURITY_TOKEN_AUDIENCE') or 'verigence-platform')
              now=datetime.now(UTC)
              token=jwt.encode({'iss':issuer,'sub':uid,'aud':audience,'iat':now,'exp':now+timedelta(minutes=5),'jti':str(uuid.uuid4()),'actor_type':'USER'},private_key,algorithm='RS256',headers={'kid':kid})
              name='SEC-WAIT-'+now.strftime('%Y%m%d%H%M%S')
              headers={'Authorization':'Bearer '+token,'Idempotency-Key':str(uuid.uuid4()),'Content-Type':'application/json'}
              result={}
              def create():
                  started=time.monotonic()
                  try:
                      with httpx.Client(timeout=90,follow_redirects=True) as client:
                          r=client.post(base+'/security/v1/platform/tenants',headers=headers,json={'tenantName':name})
                      result['elapsed']=time.monotonic()-started
                      result['status']=r.status_code
                      try: result['body']=r.json()
                      except Exception: result['body']={}
                  except Exception as exc:
                      result['elapsed']=time.monotonic()-started
                      result['error']=f'{type(exc).__name__}:{exc}'
              t=threading.Thread(target=create,daemon=True); t.start()
              for delay in (2,5,10,20):
                  target=delay
                  while t.is_alive() and time.monotonic() < 10**20:
                      # relative sleeps are handled below; one sample per requested elapsed point
                      break
                  time.sleep(delay if delay==2 else delay-prev)
                  prev=delay
                  with psycopg.connect(db) as conn:
                      with conn.cursor() as cur:
                          cur.execute("""
                            SELECT pid,state,coalesce(wait_event_type,''),coalesce(wait_event,''),
                                   pg_blocking_pids(pid),left(regexp_replace(query,E'[\\n\\r]+',' ','g'),220)
                            FROM pg_stat_activity
                            WHERE datname=current_database()
                              AND pid<>pg_backend_pid()
                              AND state<>'idle'
                            ORDER BY query_start
                          """)
                          rows=cur.fetchall()
                  out.append(f'SAMPLE_{delay}S_ACTIVE={len(rows)}')
                  for i,row in enumerate(rows[:8]):
                      out.append(f'SAMPLE_{delay}S_{i}=pid:{row[0]}|state:{row[1]}|wait:{row[2]}/{row[3]}|blockers:{row[4]}|query:{row[5]}')
                  if not t.is_alive(): break
              t.join(timeout=75)
              out.append('CREATE_THREAD_ALIVE='+str(t.is_alive()).lower())
              out.append('CREATE_ELAPSED='+str(round(float(result.get('elapsed',90)),3)))
              out.append('SECURITY_CREATE_HTTP='+str(result.get('status','NONE')))
              if 'error' in result: out.append('SECURITY_CREATE_ERROR='+str(result['error'])[:800])
              body=result.get('body') if isinstance(result.get('body'),dict) else {}
              out.append('SECURITY_CREATE_BODY='+json.dumps(body,sort_keys=True)[:1200].replace('\n',' '))
              tid=str(body.get('tenantId') or '')
              if tid:
                  with httpx.Client(timeout=30,follow_redirects=True) as client:
                      d=client.delete(base+'/security/v1/platform/tenants/'+tid,headers={'Authorization':'Bearer '+token})
                  out.append('SECURITY_CLEANUP_HTTP='+str(d.status_code))
              out.append('RESULT='+('PASS' if result.get('status')==201 else 'FAIL'))
          except Exception as exc:
              out.append('RESULT=FATAL')
              out.append('FATAL_TYPE='+type(exc).__name__)
              out.append('FATAL_MESSAGE='+str(exc)[:800].replace('\n',' '))
              out.append('TRACE_LAST='+traceback.format_exc().splitlines()[-1][:800])
          Path('docs/runtime/live-project-create-e2e.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/live-project-create-e2e.txt
          git commit -m 'docs(dev): record Security create wait state [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
