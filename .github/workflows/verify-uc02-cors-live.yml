name: Verify UC02 live DEV CORS

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-cors-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      DEV_WEB_ORIGIN: https://verigence-web-dev.jbrconsulting-it.workers.dev
      EXPECTED_DEV_SHA: b67afa837b5d53ff09bf405b9325a24097a14e3c
      PREVIOUS_AUDIT_DEPLOYMENT_ID: 6cdbc186-3292-4620-9e92-5577790f8b3c
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Resolve live Audit Core DEV deployment
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo 'RAILWAY_API_TOKEN secret is not configured'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          echo 'RAILWAY_ENVIRONMENT=dev'

          for attempt in $(seq 1 18); do
            railway deployment list --service "$AUDIT_SERVICE" --limit 3 --json >/tmp/deployments.json
            read -r deployment_id status <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/deployments.json').read_text())
          if not rows:
              print(' ')
          else:
              row=rows[0]
              print(row.get('id',''), row.get('status',''))
          PY
          )"
            if [[ -n "$deployment_id" && "$deployment_id" != "$PREVIOUS_AUDIT_DEPLOYMENT_ID" && "$status" == "SUCCESS" ]]; then
              break
            fi
            echo "Waiting for fresh Audit Core DEV deployment: id=${deployment_id:-NONE} status=${status:-NONE} attempt=$attempt/18"
            if [[ "$attempt" == "18" ]]; then
              echo 'Fresh successful Audit Core DEV deployment not proven' >&2
              exit 1
            fi
            sleep 10
          done

          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/deployments.json').read_text())
          row=rows[0]
          print('AUDIT_CORE_RAILWAY_DEPLOYMENT=PASS')
          print('AUDIT_CORE_DEPLOYMENT_ID=' + str(row.get('id','')))
          print('AUDIT_CORE_DEPLOYMENT_STATUS=' + str(row.get('status','')))
          print('AUDIT_CORE_DEPLOYMENT_CREATED_AT=' + str(row.get('createdAt','')))
          meta=row.get('meta') or {}
          for key in sorted(meta):
              key_lower=str(key).lower()
              if any(token in key_lower for token in ('commit','branch','source','message')):
                  value=meta.get(key)
                  if isinstance(value, (str, int, float, bool)) or value is None:
                      print('AUDIT_CORE_DEPLOYMENT_META_' + str(key).upper() + '=' + str(value))
          PY

          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/audit-vars.json').read_text())
          app_env=str(data.get('APP_ENV','')).strip().lower()
          if app_env not in {'dev','development'}:
              raise SystemExit('Audit Core APP_ENV is not DEV: ' + app_env)
          domain=data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or ''
          if not domain:
              raise SystemExit('Audit Core DEV has no public domain')
          print('AUDIT_CORE_APP_ENV=' + app_env)
          print('AUDIT_CORE_PUBLIC_DOMAIN=' + str(domain))
          PY

      - name: Prove Web browser CORS boundary
        shell: bash
        run: |
          set -euo pipefail
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/audit-vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac

          curl --fail --silent --show-error "$base/health" >/tmp/health.json
          echo 'AUDIT_CORE_PUBLIC_HEALTH=PASS'

          cors_status="$(curl --silent --show-error \
            --dump-header /tmp/cors.headers \
            --output /tmp/cors.body \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: $DEV_WEB_ORIGIN" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type,idempotency-key,if-match,x-correlation-id,x-trace-id' \
            "$base/v1/projects" || true)"
          if [[ "$cors_status" != "200" ]]; then
            cat /tmp/cors.headers >&2 || true
            cat /tmp/cors.body >&2 || true
            echo "Browser preflight failed with HTTP $cors_status" >&2
            exit 1
          fi

          python - <<'PY'
          import os
          from pathlib import Path
          headers={}
          for raw in Path('/tmp/cors.headers').read_text().splitlines():
              if ':' in raw:
                  name,value=raw.split(':',1)
                  headers[name.strip().lower()]=value.strip()
          origin=os.environ['DEV_WEB_ORIGIN']
          if headers.get('access-control-allow-origin') != origin:
              raise SystemExit('Approved DEV Web origin was not allowed')
          if headers.get('access-control-allow-credentials','').lower() != 'true':
              raise SystemExit('CORS credentials are not allowed')
          methods={x.strip().upper() for x in headers.get('access-control-allow-methods','').split(',') if x.strip()}
          required_methods={'GET','POST','PUT','PATCH','DELETE','OPTIONS'}
          if not required_methods <= methods:
              raise SystemExit('Missing CORS methods: ' + ', '.join(sorted(required_methods-methods)))
          allowed={x.strip().lower() for x in headers.get('access-control-allow-headers','').split(',') if x.strip()}
          required={'authorization','content-type','idempotency-key','if-match','x-correlation-id','x-trace-id'}
          if not required <= allowed:
              raise SystemExit('Missing CORS headers: ' + ', '.join(sorted(required-allowed)))
          print('AUDIT_CORE_WEB_CORS_PREFLIGHT=PASS')
          PY

          correlation="uc02-cors-${GITHUB_RUN_ID}"
          actual_status="$(curl --silent --show-error \
            --dump-header /tmp/actual.headers \
            --output /tmp/actual.body \
            --write-out '%{http_code}' \
            --header "Origin: $DEV_WEB_ORIGIN" \
            --header "X-Correlation-ID: $correlation" \
            "$base/v1/tenants/uc02-cors-smoke/project/readiness" || true)"
          case "$actual_status" in
            401|403) ;;
            *)
              cat /tmp/actual.headers >&2 || true
              cat /tmp/actual.body >&2 || true
              echo "Expected fail-closed unauthenticated response; got HTTP $actual_status" >&2
              exit 1
              ;;
          esac
          python - <<'PY'
          import os
          from pathlib import Path
          headers={}
          for raw in Path('/tmp/actual.headers').read_text().splitlines():
              if ':' in raw:
                  name,value=raw.split(':',1)
                  headers[name.strip().lower()]=value.strip()
          origin=os.environ['DEV_WEB_ORIGIN']
          if headers.get('access-control-allow-origin') != origin:
              raise SystemExit('Actual response missing approved CORS origin')
          exposed={x.strip().lower() for x in headers.get('access-control-expose-headers','').split(',') if x.strip()}
          if 'x-correlation-id' not in exposed:
              raise SystemExit('X-Correlation-ID is not browser-exposed')
          expected='uc02-cors-' + os.environ['GITHUB_RUN_ID']
          actual=headers.get('x-correlation-id','')
          if actual != expected:
              raise SystemExit(f'Correlation ID mismatch: expected {expected}, got {actual}')
          print('AUDIT_CORE_WEB_CORS_ACTUAL_RESPONSE=PASS')
          print('AUDIT_CORE_CORS_CORRELATION_ID=' + actual)
          PY

          echo "AUDIT_CORE_EXPECTED_DEV_SHA=$EXPECTED_DEV_SHA"
          echo 'UC02_CORS_LIVE_VERIFICATION=PASS'
