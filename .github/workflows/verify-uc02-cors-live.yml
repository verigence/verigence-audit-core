name: Diagnose UC02 Security DEV deployment evidence

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'verify/uc02-cors-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SECURITY_SERVICE: security
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Inspect sanitized Security deployment records
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$SECURITY_SERVICE" --json >/tmp/link.json
          railway deployment list --service "$SECURITY_SERVICE" --limit 5 --json >/tmp/security-deployments.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/security-deployments.json').read_text())
          if not rows:
              raise SystemExit('No Security deployments found')
          for i,row in enumerate(rows):
              print(f'SECURITY_DEPLOYMENT[{i}]_ID={row.get("id","")}')
              print(f'SECURITY_DEPLOYMENT[{i}]_STATUS={row.get("status","")}')
              print(f'SECURITY_DEPLOYMENT[{i}]_CREATED_AT={row.get("createdAt","")}')
              meta=row.get('meta') or {}
              print(f'SECURITY_DEPLOYMENT[{i}]_META=' + json.dumps(meta, sort_keys=True, default=str))
          PY
