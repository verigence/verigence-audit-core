name: Diagnose DI worker live runtime evidence

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'verify/uc02-cors-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      DI_WORKER_SERVICE: di-worker
      EXPECTED_DEPLOYMENT_ID: 8c950929-93b5-4a5a-b005-f4061519b517
      DI_SHA: c97b3f3e5f8577160c88af1080496808189206fb
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Inspect only worker lifecycle evidence
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$DI_WORKER_SERVICE" --json >/tmp/link.json
          railway deployment list --service "$DI_WORKER_SERVICE" --limit 1 --json >/tmp/deployment.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path('/tmp/deployment.json').read_text())
          if not rows:
              raise SystemExit('No DI worker deployment')
          row=rows[0]
          if row.get('id') != os.environ['EXPECTED_DEPLOYMENT_ID']:
              raise SystemExit('DI worker deployment changed during acceptance')
          if row.get('status') != 'SUCCESS':
              raise SystemExit('DI worker deployment is not SUCCESS')
          if os.environ['DI_SHA'] not in json.dumps(row, sort_keys=True, default=str):
              raise SystemExit('DI worker deployment no longer proves expected SHA')
          print('DI_WORKER_DEPLOYMENT=PASS|' + row.get('id','') + '|' + os.environ['DI_SHA'])
          PY

          railway logs --service "$DI_WORKER_SERVICE" --latest --deployment --lines 5000 >/tmp/worker.log
          python - <<'PY'
          from pathlib import Path

          lines=Path('/tmp/worker.log').read_text(errors='replace').splitlines()
          patterns=(
              'DI_WORKER_STARTED=PASS',
              'DI_EOD_SCHEDULER_STARTED=PASS',
              'di_worker_starting',
              'processing_worker_started',
              'processing_worker_loop_started',
              'eod_retry_scheduler_started',
              'eod_tick',
              'di_worker_stopping',
              'di_worker_stopped',
              'processing_worker_loop_error',
              'eod_retry_scheduler_stopped',
          )
          matches=[]
          counts={p:0 for p in patterns}
          for line in lines:
              for p in patterns:
                  if p in line:
                      counts[p]+=1
                      if len(matches) < 40:
                          matches.append(line)
                      break
          print('DI_WORKER_LOG_LINES_SCANNED=' + str(len(lines)))
          for p in patterns:
              print('DI_WORKER_EVENT_COUNT|' + p + '|' + str(counts[p]))
          print('DI_WORKER_SANITIZED_MATCHES_BEGIN')
          for line in matches:
              print(line[:1000])
          print('DI_WORKER_SANITIZED_MATCHES_END')

          startup_required=(
              'di_worker_starting',
              'processing_worker_started',
              'processing_worker_loop_started',
              'eod_retry_scheduler_started',
          )
          missing=[p for p in startup_required if counts[p] < 1]
          if missing:
              raise SystemExit('Missing DI worker lifecycle evidence: ' + ','.join(missing))
          if counts['di_worker_stopped'] or counts['eod_retry_scheduler_stopped']:
              raise SystemExit('DI worker/scheduler shutdown evidence exists in current deployment logs')
          if counts['processing_worker_loop_error']:
              raise SystemExit('DI worker loop error exists in current deployment logs')
          if counts['eod_tick'] < 1:
              raise SystemExit('No recent EOD scheduler tick evidence found')
          print('DI_WORKER_CURRENT_RUNTIME=PASS')
          print('DI_EOD_SCHEDULER_CURRENT_RUNTIME=PASS')
          if counts['DI_WORKER_STARTED=PASS'] and counts['DI_EOD_SCHEDULER_STARTED=PASS']:
              print('DI_DEPLOYMENT_STARTUP_MARKERS=PASS')
          else:
              print('DI_DEPLOYMENT_STARTUP_MARKERS=AGED_OUT_OF_LOG_WINDOW')
          PY
