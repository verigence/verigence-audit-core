name: UC03 C2 Ruff Fix

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'planning/uc-003-booking-delivery-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.0
      - name: Apply only Ruff-supported mechanical fixes
        run: ruff check --fix --unsafe-fixes src/audit_core/uc03_delivery_commands.py src/audit_core/uc03_delivery_documents.py tests/test_uc03_delivery_commands.py migrations/versions/0012_uc03_delivery_capture.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/uc03-c2-ruff-fix.yml
      - name: Commit fixes and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(uc03-c2): apply Ruff mechanical fixes'
          git push origin HEAD:${{ github.head_ref }}
