name: Apply UC02 timeout fix

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/uc02-security-timeout-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply narrow timeout and regression changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/audit_core/project_provisioning.py')
          text = source_path.read_text()
          marker = '_OPERATION_TYPE = "PROJECT_PROVISION"\n'
          addition = marker + '_SECURITY_ADMIN_PROVISIONING_TIMEOUT_SECONDS = 20.0\n'
          if '_SECURITY_ADMIN_PROVISIONING_TIMEOUT_SECONDS' not in text:
              if marker not in text:
                  raise SystemExit('operation type marker missing')
              text = text.replace(marker, addition, 1)
          old = '            with SecurityAdminClient(base_url=_security_base_url()) as client:\n                tenant = client.create_tenant('
          new = '            with SecurityAdminClient(\n                base_url=_security_base_url(),\n                timeout_seconds=_SECURITY_ADMIN_PROVISIONING_TIMEOUT_SECONDS,\n            ) as client:\n                tenant = client.create_tenant('
          if old not in text:
              raise SystemExit('Security create client call marker missing')
          text = text.replace(old, new, 1)
          source_path.write_text(text)

          test_path = Path('tests/test_uc02_project_provisioning.py')
          tests = test_path.read_text()
          field_marker = '    list_calls: list[str] = field(default_factory=list)\n'
          if '    timeout_seconds: list[float] = field(default_factory=list)\n' not in tests:
              if field_marker not in tests:
                  raise SystemExit('security test controller marker missing')
              tests = tests.replace(
                  field_marker,
                  field_marker + '    timeout_seconds: list[float] = field(default_factory=list)\n',
                  1,
              )
          ctor = '            def __init__(self, *, base_url: str) -> None:\n                assert base_url == "https://security.test"\n'
          ctor_new = '            def __init__(self, *, base_url: str, timeout_seconds: float = 5.0) -> None:\n                assert base_url == "https://security.test"\n                controller.timeout_seconds.append(timeout_seconds)\n'
          if ctor not in tests:
              raise SystemExit('security fake constructor marker missing')
          tests = tests.replace(ctor, ctor_new, 1)
          assert_marker = '    operation_id = body["operationId"]\n'
          assert_new = assert_marker + '    assert setup["security"].timeout_seconds == [20.0]\n'
          if 'assert setup["security"].timeout_seconds == [20.0]' not in tests:
              if assert_marker not in tests:
                  raise SystemExit('provisioning operation assertion marker missing')
              tests = tests.replace(assert_marker, assert_new, 1)
          test_path.write_text(tests)
          PY
          git rm .github/workflows/apply-uc02-timeout-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audit_core/project_provisioning.py tests/test_uc02_project_provisioning.py
          git commit -m 'fix(uc02): allow Security tenant provisioning to complete'
          git push origin HEAD:${{ github.head_ref }}
