name: Deploy Audit Core DEV

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-core-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      DEPLOY_SHA: ${{ github.sha }}
      APP_ENV: ci
      DEV_WEB_ORIGIN: https://verigence-web-dev.jbrconsulting-it.workers.dev

    steps:
      - name: Check out exact tested Audit Core revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Audit Core
        run: python -m pip install -e .

      - name: Verify Alembic and route contracts before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/versions/0015_uc02_universal_segments.py
          test -f migrations/versions/0016_uc02_project_hard_delete.py
          test -f migrations/versions/0017_uc03_default_document_requirements.py
          test -f migrations/versions/0018_uc03_identity_business_date.py
          alembic heads | tee /tmp/alembic-heads.txt
          head_count="$(grep -c '(head)' /tmp/alembic-heads.txt || true)"
          if [[ "$head_count" != "1" ]]; then
            echo "::error::Audit Core must have exactly one Alembic head; found $head_count"
            cat /tmp/alembic-heads.txt >&2
            exit 1
          fi
          echo "AUDIT_CORE_ALEMBIC_SOURCE_HEAD=$(sed -n '1s/ (head)$//p' /tmp/alembic-heads.txt)"

          PYTHONPATH=src python - <<'PY'
          from audit_core.main import app

          paths = app.openapi().get("paths", {})
          required = [
              "/v1/projects",
              "/v1/tenants/{tenant_id}/project/readiness",
              "/v1/tenants/{tenant_id}/project/activate",
              "/v1/tenants/{tenant_id}/project/deletion-impact",
              "/v1/tenants/{tenant_id}/project",
              "/v1/tenants/{tenant_id}/project-masters",
              "/v1/tenants/{tenant_id}/role-mapping-candidates",
              "/v1/tenants/{tenant_id}/role-mappings",
              "/v1/tenants/{tenant_id}/mahindra-masters/segments/{segment_id}/imports",
              "/v1/tenants/{tenant_id}/mahindra-masters/discount-policy/imports",
              "/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/identity-context",
          ]
          missing = [path for path in required if path not in paths]
          if missing:
              raise SystemExit("Missing Audit Core API path(s) before deploy: " + ", ".join(missing))
          project_methods = paths["/v1/tenants/{tenant_id}/project"]
          if "delete" not in project_methods:
              raise SystemExit("Missing UC02 Project hard-delete method before deploy")
          print("AUDIT_CORE_ROUTE_CONTRACT=PASS")
          PY

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link and verify Audit Core Railway DEV target
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN secret is not configured.'; exit 1; }
          if ! railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json 2>/tmp/link.err; then
            cat /tmp/link.err >&2 || true
            echo '::error::Could not link the approved Railway project/service to environment dev.'
            exit 1
          fi
          echo 'RAILWAY_ENVIRONMENT=dev'
          railway status --json >/tmp/status.json
          railway service list --json >/tmp/services.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          project = json.loads(Path('/tmp/status.json').read_text())
          services = json.loads(Path('/tmp/services.json').read_text())
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          if project.get('id') != os.environ['PLATFORM_PROJECT_ID']:
              raise SystemExit('Railway API token does not target the approved shared DEV project')
          if not any(row.get('name') == os.environ['AUDIT_SERVICE'] for row in services):
              raise SystemExit('Audit Core Railway service is missing from the approved shared DEV project')
          required = ['DATABASE_URL', 'APP_ENV']
          missing = [name for name in required if not str(variables.get(name, '')).strip()]
          if missing:
              raise SystemExit('Audit Core Railway DEV is missing required service variable(s): ' + ', '.join(missing))
          app_env = str(variables.get('APP_ENV', '')).strip().lower()
          if app_env not in {'dev', 'development'}:
              raise SystemExit('Audit Core Railway DEV APP_ENV must be dev or development for the DEV CORS allowlist')
          print('AUDIT_CORE_RAILWAY_TARGET=PASS')
          print('AUDIT_CORE_RAILWAY_RUNTIME_CONFIG=PASS')
          print('AUDIT_CORE_APP_ENV=' + app_env)
          PY

      - name: Deploy Audit Core
        shell: bash
        run: |
          set -euo pipefail
          railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-before.json
          previous_id="$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/audit-before.json').read_text())
          print(rows[0].get('id', '') if rows else '')
          PY
          )"
          echo "AUDIT_PREVIOUS_DEPLOYMENT_ID=$previous_id" >> "$GITHUB_ENV"
          echo "AUDIT_CORE_PREVIOUS_DEPLOYMENT_ID=${previous_id:-NONE}"
          railway up . --path-as-root --service "$AUDIT_SERVICE" --detach --yes \
            --message "Audit Core DEV ${DEPLOY_SHA}" >/dev/null

      - name: Verify fresh Audit Core deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-deployment.json
            read -r deployment_id status <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/audit-deployment.json').read_text())
          if not rows:
              print(' ')
          else:
              print(rows[0].get('id', ''), rows[0].get('status', ''))
          PY
          )"

            if [[ -z "$deployment_id" || "$deployment_id" == "${AUDIT_PREVIOUS_DEPLOYMENT_ID:-}" ]]; then
              echo "Waiting for a new Audit Core deployment to appear (attempt $attempt/30)"
              sleep 10
              continue
            fi

            case "$status" in
              SUCCESS)
                echo "AUDIT_CORE_DEPLOYMENT=PASS"
                echo "AUDIT_CORE_DEPLOYMENT_ID=$deployment_id"
                break
                ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 220 || true
                echo "Audit Core deployment $deployment_id failed: $status" >&2
                exit 1
                ;;
              *)
                echo "New deployment $deployment_id is $status (attempt $attempt/30)"
                ;;
            esac

            if [[ "$attempt" == "30" ]]; then
              railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 220 || true
              echo "Audit Core deployment did not reach SUCCESS for a new deployment ID." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Smoke test deployed Audit Core service
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/audit-vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          if [[ -z "$domain" ]]; then
            echo '::error::Audit Core Railway DEV service has no public domain configured.'
            exit 1
          fi
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac

          curl --fail --silent --show-error "$base/health" >/tmp/audit-health.json
          echo "AUDIT_CORE_PUBLIC_BASE=$base"
          echo 'AUDIT_CORE_PUBLIC_HEALTH=PASS'

          cors_status="$(curl --silent --show-error \
            --dump-header /tmp/audit-cors.headers \
            --output /tmp/audit-cors.body \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: $DEV_WEB_ORIGIN" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type,idempotency-key,if-match,x-correlation-id,x-trace-id' \
            "$base/v1/projects" || true)"
          if [[ "$cors_status" != "200" ]]; then
            cat /tmp/audit-cors.headers >&2 || true
            cat /tmp/audit-cors.body >&2 || true
            echo "::error::Audit Core browser CORS preflight returned HTTP $cors_status"
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          headers = {}
          for raw in Path('/tmp/audit-cors.headers').read_text().splitlines():
              if ':' not in raw:
                  continue
              name, value = raw.split(':', 1)
              headers[name.strip().lower()] = value.strip()

          origin = os.environ['DEV_WEB_ORIGIN']
          if headers.get('access-control-allow-origin') != origin:
              raise SystemExit('Audit Core CORS did not allow the approved DEV Web origin')
          if headers.get('access-control-allow-credentials', '').lower() != 'true':
              raise SystemExit('Audit Core CORS did not allow browser credentials')

          methods = {
              value.strip().upper()
              for value in headers.get('access-control-allow-methods', '').split(',')
              if value.strip()
          }
          if 'POST' not in methods:
              raise SystemExit('Audit Core CORS did not allow POST')

          allowed_headers = {
              value.strip().lower()
              for value in headers.get('access-control-allow-headers', '').split(',')
              if value.strip()
          }
          required_headers = {
              'authorization',
              'content-type',
              'idempotency-key',
              'if-match',
              'x-correlation-id',
              'x-trace-id',
          }
          missing = sorted(required_headers - allowed_headers)
          if missing:
              raise SystemExit('Audit Core CORS missing allowed header(s): ' + ', '.join(missing))
          print('AUDIT_CORE_WEB_CORS_PREFLIGHT=PASS')
          PY

          echo 'AUDIT_CORE_UC02_DEV=PASS'
          echo "AUDIT_CORE_DEPLOYED_SHA=${DEPLOY_SHA}"
