name: One-shot UC02 Step 6 fix formatting

on:
  push:
    branches: [fix/uc02-step6-actions]
    paths:
      - '.github/workflows/one-shot-uc02-step6-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uc02-step6-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.0
      - name: Fix validation call and format imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/audit_core/project_master_forms.py')
          source = path.read_text()
          source = source.replace(
              'raise ValidationError("Effective To must be on or after Effective From.")',
              'raise ValidationError(detail="Effective To must be on or after Effective From.")',
          )
          path.write_text(source)
          PY
          ruff check --fix src/audit_core/project_master_forms.py
          ruff check src/audit_core/project_master_forms.py
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audit_core/project_master_forms.py
          git commit -m 'fix(uc02): satisfy Step 6 backend quality gate' || exit 0
          git push origin HEAD:fix/uc02-step6-actions
