name: Audit Core live DEV baseline

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/audit-core-live-baseline.yml'
      - 'src/**'
      - 'migrations/**'
      - 'railway.toml'

permissions:
  contents: write

jobs:
  baseline:
    if: ${{ !contains(github.event.head_commit.message, '[skip live-baseline]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime tooling
        run: |
          python -m pip install -e .
          npm install --global @railway/cli
      - name: Capture live baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN:-}"
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway deployment list --service "$AUDIT_SERVICE" --limit 3 --json >/tmp/deployments.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/vars.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from sqlalchemy import create_engine, text

          vars_ = json.loads(Path('/tmp/vars.json').read_text())
          deployments = json.loads(Path('/tmp/deployments.json').read_text())
          db = str(vars_.get('DATABASE_URL','')).strip()
          if not db:
              raise SystemExit('DATABASE_URL missing')
          if db.startswith('postgres://'):
              db='postgresql+psycopg://'+db[len('postgres://'):]
          elif db.startswith('postgresql://'):
              db='postgresql+psycopg://'+db[len('postgresql://'):]

          source_head = subprocess.check_output(['alembic','heads'], text=True).strip()
          source_current_file = Path('migrations/versions/0012_uc03_delivery_capture.py').exists()
          engine=create_engine(db, pool_pre_ping=True)
          with engine.connect() as c:
              db_rev=c.execute(text('select version_num from alembic_version')).scalar_one_or_none()
              projects=c.execute(text("select count(*) from auditcore.projects")).scalar_one()
          latest=deployments[0] if deployments else {}
          meta=latest.get('meta') if isinstance(latest.get('meta'),dict) else {}
          out=[
              'AUDIT_CORE_LIVE_BASELINE',
              f'CHECKED_GITHUB_SHA={os.environ.get("GITHUB_SHA","")}',
              f'SOURCE_ALEMBIC_HEAD={source_head}',
              f'SOURCE_0012_FILE_PRESENT={str(source_current_file).lower()}',
              f'DB_ALEMBIC_VERSION={db_rev}',
              f'DB_PROJECT_COUNT={projects}',
              f'LATEST_DEPLOYMENT_ID={latest.get("id","")}',
              f'LATEST_DEPLOYMENT_STATUS={latest.get("status","")}',
              f'LATEST_DEPLOYMENT_CREATED_AT={latest.get("createdAt","")}',
              f'LATEST_DEPLOYMENT_COMMIT={meta.get("commitHash", meta.get("commit", ""))}',
              f'LATEST_DEPLOYMENT_BRANCH={meta.get("branch","")}',
          ]
          Path('docs/runtime').mkdir(parents=True, exist_ok=True)
          Path('docs/runtime/audit-core-live-baseline.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY

          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/vars.json').read_text())
          print(v.get('RAILWAY_PUBLIC_DOMAIN') or v.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          if [[ -n "$domain" ]]; then
            case "$domain" in http://*|https://*) base="${domain%/}" ;; *) base="https://${domain%/}" ;; esac
            code="$(curl -sS -o /tmp/health -w '%{http_code}' "$base/health" || true)"
            echo "LIVE_HEALTH_HTTP=$code" >> docs/runtime/audit-core-live-baseline.txt
          else
            echo 'LIVE_HEALTH_HTTP=NO_PUBLIC_DOMAIN' >> docs/runtime/audit-core-live-baseline.txt
          fi
      - name: Commit sanitized baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/audit-core-live-baseline.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(dev): record Audit Core live baseline [skip live-baseline]'
          git push origin HEAD:dev
