name: One-shot GST name rule diagnose (read-only)

# Read-only: why one journey's customer name came from where it did. Prints document types, field keys and
# yes/no comparisons only -- no names, numbers or references (public repository). Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/gst-name-diagnose]
    paths:
      - '.github/workflows/one-shot-gst-name-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e . 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: GST certificates on file, by kind of business, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from collections import Counter
          from sqlalchemy import create_engine
          from audit_core.db import set_tenant_context
          from audit_core.uc03_p2_customer import is_gstin
          from audit_core.uc03_p2_names import same_person
          T = "afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572"
          REF_SHA = "402f2c9ddb3253cda2067b7539ca77084145131bfc83fd2bb784e9b50fe4d14b"
          KIND = {"P": "individual (proprietor)", "C": "company", "F": "firm/LLP", "H": "HUF", "A": "AOP", "T": "trust",
                  "B": "BOI", "L": "local authority", "J": "artificial person", "G": "government"}
          norm = lambda s: re.sub(r"[^A-Z0-9]", "", str(s or "").upper())
          e = create_engine(os.environ["DB"].replace("postgresql://", "postgresql+psycopg://", 1))
          with e.connect() as c:
              c.exec_driver_sql("SET TRANSACTION READ ONLY")
              set_tenant_context(c, T)
              rows = c.exec_driver_sql("""
                  SELECT e.evidence_id, j.journey_id,
                         encode(sha256(convert_to(j.journey_reference,'UTF8')),'hex') = %(h)s AS target,
                         c.legal_name AS customer,
                         max(f.effective_value #>> '{}') FILTER (WHERE f.field_key='gstin') AS gstin,
                         max(f.effective_value #>> '{}') FILTER (WHERE f.field_key='organisation_legal_name') AS legal,
                         max(f.effective_value #>> '{}') FILTER (WHERE f.field_key='organisation_trade_name') AS trade
                  FROM auditcore.evidence e
                  JOIN auditcore.journeys j ON j.tenant_id=e.tenant_id AND j.journey_id=e.journey_id
                  JOIN auditcore.customers c ON c.tenant_id=j.tenant_id AND c.customer_id=j.customer_id
                  JOIN auditcore.journey_document_extracted_fields f
                    ON f.tenant_id=e.tenant_id AND f.journey_id=e.journey_id AND f.di_document_id=e.di_document_id
                  WHERE e.tenant_id=%(t)s AND e.document_type_key='gst_certificate' AND e.association_status='ACTIVE'
                  GROUP BY e.evidence_id, j.journey_id, j.journey_reference, c.legal_name""", {"t": T, "h": REF_SHA}).mappings().all()
              c.rollback()
          stats = Counter()
          for r in rows:
              g = re.sub(r"\s", "", str(r["gstin"] or "")).upper()
              kind = KIND.get(g[5], "other") if is_gstin(g) else "no valid GSTIN"
              has_trade = bool(r["trade"]) and norm(r["trade"]) != norm(r["legal"])
              cust = "customer = legal name" if r["customer"] and r["legal"] and (norm(r["customer"]) == norm(r["legal"]) or same_person(r["customer"], r["legal"])) else (
                     "customer = trade name" if r["customer"] and r["trade"] and norm(r["customer"]) == norm(r["trade"]) else "customer = other")
              stats[(kind, "separate trade name" if has_trade else "no separate trade name", cust)] += 1
              if r["target"]:
                  print("THIS JOURNEY:", kind, "|", "separate trade name" if has_trade else "no separate trade name", "|", cust)
          print("GST CERTIFICATES", len(rows))
          for k, n in sorted(stats.items(), key=lambda x: -x[1]):
              print("  ", n, "|", " | ".join(k))
          PY
