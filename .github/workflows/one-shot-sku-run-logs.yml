name: One-shot Audit Core error log summary (read-only)

# Runs when this branch is pushed. Reads the last 6 hours (SKU run) of the Railway DEV Audit Core log,
# summarises the errors (secrets and emails redacted) and posts the summary as an issue.
on:
  push:
    branches: [claude/sku-run-logs]

permissions:
  contents: read
  issues: write

jobs:
  logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global @railway/cli
      - name: Read logs
        shell: bash
        run: |
          set -uo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway logs --service "$AUDIT_SERVICE" --lines 4000 >/tmp/audit.log 2>/tmp/audit.err || true
          railway deployment list --service "$AUDIT_SERVICE" --limit 3 --json >/tmp/dep.json 2>>/tmp/audit.err || true
          for dep in $(python -c "import json;print(' '.join(str(r.get('id')) for r in json.load(open('/tmp/dep.json'))[1:3]))" 2>/dev/null); do railway logs --service "$AUDIT_SERVICE" "$dep" --lines 4000 >>/tmp/audit.log 2>>/tmp/audit.err || true; done
          railway logs --service "$AUDIT_SERVICE" --http --since 6h --lines 3000 --json >/tmp/audit-http.json 2>>/tmp/audit.err || true
          python .github/one-shot/sku_run_log_summary.py
      - name: Post report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f /tmp/report.md || echo 'No report produced.' > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "SKU run log summary (run $GITHUB_RUN_ID)" --body-file /tmp/report.md
