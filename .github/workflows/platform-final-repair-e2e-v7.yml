name: Repair DI API and complete private E2E v7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/unified-railway-platform
    paths:
      - .github/workflows/platform-final-repair-e2e-v7.yml

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      SECURITY_SERVICE: security
      DI_API_SERVICE: di-api
      DI_WORKER_SERVICE: di-worker
      SMOKE_SERVICE: platform-smoke
      SECURITY_PORT: "8001"
      DI_PORT: "8000"
      DEV_TENANT_ID: dev-auth-test

    steps:
      - name: Checkout corrected DI runtime
        uses: actions/checkout@v6
        with:
          repository: verigence/verigence-di
          ref: agent/railway-two-service-runtime
          path: di

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify scoped Railway project
        shell: bash
        run: |
          set -euo pipefail
          railway status --json >/tmp/status.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/status.json').read_text())
          if data.get('id') != os.environ['TARGET_PROJECT_ID']:
              raise SystemExit('RAILWAY_TOKEN points to wrong project')
          print('PLATFORM_PROJECT_VERIFIED=PASS')
          PY

      - name: Deploy corrected DI API
        shell: bash
        run: |
          set -euo pipefail
          cat > di/backend/railway.toml <<'TOML'
          [build]
          builder = "DOCKERFILE"
          dockerfilePath = "Dockerfile"

          [deploy]
          preDeployCommand = ["alembic upgrade head"]
          startCommand = "sh -c 'uvicorn verigence.di.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000}'"
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 3
          TOML

          railway up di/backend --path-as-root --service "$DI_API_SERVICE" --detach --yes --message "Repair DI API v7 ${GITHUB_SHA}" >/dev/null
          sleep 40

      - name: Verify DI API runtime
        shell: bash
        run: |
          set -euo pipefail
          get_status() {
            railway deployment list --service "$DI_API_SERVICE" --limit 1 --json >/tmp/di-api-deploy.json
            python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/di-api-deploy.json').read_text())
          print(rows[0].get('status','') if rows else '')
          PY
          }

          status="$(get_status)"
          for wait_seconds in 30 30; do
            case "$status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$DI_API_SERVICE" --latest --deployment --lines 300 || true
                echo "DI API deployment failed: $status" >&2
                exit 1
                ;;
              *)
                sleep "$wait_seconds"
                status="$(get_status)"
                ;;
            esac
          done

          if [[ "$status" != "SUCCESS" ]]; then
            railway logs --service "$DI_API_SERVICE" --latest --deployment --lines 300 || true
            echo "DI API did not become healthy: $status" >&2
            exit 1
          fi

          railway logs --service "$DI_API_SERVICE" --latest --deployment --lines 250 >/tmp/di-api.log || true
          if grep -q 'ModuleNotFoundError: No module named' /tmp/di-api.log; then
            tail -n 180 /tmp/di-api.log >&2
            exit 1
          fi
          echo 'PLATFORM_DI_API_DEPLOYMENT=PASS'

      - name: Verify all persistent service deployments
        shell: bash
        run: |
          set -euo pipefail
          for service in "$AUDIT_SERVICE" "$SECURITY_SERVICE" "$DI_API_SERVICE" "$DI_WORKER_SERVICE"; do
            railway deployment list --service "$service" --limit 1 --json > "/tmp/${service}-deploy.json"
            SERVICE="$service" FILE="/tmp/${service}-deploy.json" python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path(os.environ['FILE']).read_text())
          status=rows[0].get('status','') if rows else ''
          if status != 'SUCCESS':
              raise SystemExit(f"{os.environ['SERVICE']} latest deployment is {status}")
          print(f"PLATFORM_SERVICE_DEPLOYMENT=PASS|{os.environ['SERVICE']}")
          PY
          done

          railway logs --service "$DI_WORKER_SERVICE" --latest --deployment --lines 250 >/tmp/worker.log
          grep -q 'DI_WORKER_STARTED=PASS' /tmp/worker.log
          grep -q 'DI_EOD_SCHEDULER_STARTED=PASS' /tmp/worker.log
          echo 'PLATFORM_DI_WORKER=PASS'
          echo 'PLATFORM_DI_EOD_SCHEDULER=PASS'

      - name: Capture Audit Core OAuth client secret safely
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          client_secret="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/audit-vars.json').read_text())
          print(data.get('SECURITY_CLIENT_SECRET',''))
          PY
          )"
          test -n "$client_secret" || { echo 'Audit Core SECURITY_CLIENT_SECRET missing' >&2; exit 1; }
          echo "::add-mask::$client_secret"
          echo "AUDIT_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"

      - name: Build private-network E2E probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke
          mkdir -p smoke
          cat > smoke/Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          WORKDIR /app
          RUN pip install --no-cache-dir httpx==0.28.1
          COPY smoke.py .
          CMD ["python", "smoke.py"]
          DOCKER

          cat > smoke/smoke.py <<'PY'
          import os
          import time
          from http.server import BaseHTTPRequestHandler, HTTPServer

          import httpx

          security=os.environ['SECURITY_BASE_URL'].rstrip('/')
          di=os.environ['DI_BASE_URL'].rstrip('/')
          client_id=os.environ['SECURITY_CLIENT_ID']
          client_secret=os.environ['SECURITY_CLIENT_SECRET']
          tenant_id=os.environ['DEV_TENANT_ID']

          def wait_json(url, expected):
              last=''
              with httpx.Client(timeout=5.0) as client:
                  for _ in range(100):
                      try:
                          response=client.get(url)
                          last=f'{response.status_code} {response.text[:180]}'
                          if response.status_code == 200 and response.json().get('status') == expected:
                              return
                      except Exception as exc:
                          last=str(exc)
                      time.sleep(2)
              raise RuntimeError(f'{url} unavailable: {last}')

          wait_json(security + '/health', 'ok')
          print('PLATFORM_SECURITY_HEALTH=PASS', flush=True)
          wait_json(di + '/health', 'ok')
          print('PLATFORM_DI_HEALTH=PASS', flush=True)
          wait_json(di + '/ready', 'ready')
          print('PLATFORM_DI_READY=PASS', flush=True)

          with httpx.Client(timeout=10.0) as client:
              token_response=client.post(
                  security + '/oauth/token',
                  auth=(client_id, client_secret),
                  data={
                      'grant_type':'client_credentials',
                      'tenant_id':tenant_id,
                      'scope':'di.document.read',
                  },
              )
              token_response.raise_for_status()
              token=token_response.json()['access_token']
              print('PLATFORM_SECURITY_SERVICE_TOKEN=PASS', flush=True)

              di_response=client.get(
                  f'{di}/v1/tenants/{tenant_id}/subjects',
                  params={'limit':1},
                  headers={
                      'Authorization':f'Bearer {token}',
                      'X-Correlation-ID':'platform-final-repair-e2e-v7',
                  },
              )
              if di_response.status_code != 200:
                  raise RuntimeError(
                      f'DI authenticated request failed: '
                      f'{di_response.status_code} {di_response.text[:300]}'
                  )
              print('PLATFORM_SECURITY_TO_DI_JWKS_AUTH=PASS', flush=True)
              print('PLATFORM_PRIVATE_E2E=PASS', flush=True)

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, format, *args):
                  return

          HTTPServer(('0.0.0.0', int(os.environ.get('PORT','8080'))), Handler).serve_forever()
          PY

      - name: Deploy private probe and verify E2E
        shell: bash
        run: |
          set -euo pipefail
          set_var() {
            local name="$1" value="$2"
            printf '%s' "$value" | railway variable set "$name" --service "$SMOKE_SERVICE" --stdin --skip-deploys >/dev/null
          }

          set_var SECURITY_BASE_URL "http://security.railway.internal:${SECURITY_PORT}"
          set_var DI_BASE_URL "http://di-api.railway.internal:${DI_PORT}"
          set_var SECURITY_CLIENT_ID audit-core
          set_var SECURITY_CLIENT_SECRET "$AUDIT_CLIENT_SECRET"
          set_var DEV_TENANT_ID "$DEV_TENANT_ID"

          railway up smoke --path-as-root --service "$SMOKE_SERVICE" --detach --yes --message "Unified DEV final E2E v7 ${GITHUB_SHA}" >/dev/null
          sleep 40
          railway logs --service "$SMOKE_SERVICE" --latest --deployment --lines 400 >/tmp/smoke.log || true
          if ! grep -q 'PLATFORM_PRIVATE_E2E=PASS' /tmp/smoke.log; then
            sleep 25
            railway logs --service "$SMOKE_SERVICE" --latest --deployment --lines 400 >/tmp/smoke.log || true
          fi

          for marker in \
            PLATFORM_SECURITY_HEALTH=PASS \
            PLATFORM_DI_HEALTH=PASS \
            PLATFORM_DI_READY=PASS \
            PLATFORM_SECURITY_SERVICE_TOKEN=PASS \
            PLATFORM_SECURITY_TO_DI_JWKS_AUTH=PASS \
            PLATFORM_PRIVATE_E2E=PASS; do
            grep -q "$marker" /tmp/smoke.log || {
              echo "Missing E2E marker: $marker" >&2
              tail -n 250 /tmp/smoke.log >&2
              exit 1
            }
            echo "$marker"
          done

      - name: Verify final unified topology
        shell: bash
        run: |
          set -euo pipefail
          railway service list --json >/tmp/services.json
          python - <<'PY'
          import json
          from pathlib import Path
          names={row.get('name') for row in json.loads(Path('/tmp/services.json').read_text())}
          required={'verigence-audit-core','security','di-api','di-worker','Postgres','platform-smoke'}
          missing=required-names
          if missing:
              raise SystemExit('missing services: '+','.join(sorted(missing)))
          if 'di-scheduler' in names:
              raise SystemExit('unexpected di-scheduler service')
          print('FINAL_TOPOLOGY=PASS')
          print('DI_PROCESS_TOPOLOGY=API_PLUS_WORKER')
          print('DI_SCHEDULER_SERVICE=NONE')
          PY

      - name: Stop smoke compute after verification
        if: always()
        shell: bash
        run: |
          set +e
          railway down --service "$SMOKE_SERVICE" --yes >/dev/null 2>&1
          exit 0
