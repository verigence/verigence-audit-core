name: One-shot V2 Booking completion

on:
  push:
    branches:
      - fix/v2-booking-completion
    paths:
      - .github/workflows/one-shot-v2-booking-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v2-booking-completion
          fetch-depth: 0
      - name: Apply focused V2 completion changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/audit_core/uc03_document_capture_v2.py')
          text = path.read_text()

          old = 'from fastapi import APIRouter, Depends\n'
          new = 'from fastapi import APIRouter, Depends, Header, Request, Response\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = 'from audit_core.errors import ConflictError, DependencyUnavailableError, NotFoundError\n'
          new = ('from audit_core.errors import ConflictError, DependencyUnavailableError, NotFoundError\n'
                 'from audit_core.idempotency import execute_idempotent_json_command\n'
                 'from audit_core.observability import get_correlation_id\n')
          assert old in text
          text = text.replace(old, new, 1)

          old = 'from audit_core.uc03_booking_commands import _stage_state\n'
          new = ('from audit_core.uc03_booking_commands import (\n'
                 '    _aggregate_lock,\n'
                 '    _append_workflow_event,\n'
                 '    _parse_if_match,\n'
                 '    _stage_state,\n'
                 ')\n')
          assert old in text
          text = text.replace(old, new, 1)

          old = '''class FinalizeResponse(BaseModel):\n    documentId: UUID\n    state: str\n\n\n'''
          new = '''class FinalizeResponse(BaseModel):\n    documentId: UUID\n    state: str\n\n\nclass BookingCaptureV2CompletionResponse(BaseModel):\n    journeyId: UUID\n    phase: Literal["BOOKING"] = "BOOKING"\n    status: Literal["COMPLETED"] = "COMPLETED"\n    aggregateVersion: int\n\n\n'''
          assert old in text
          text = text.replace(old, new, 1)

          anchor = '''def _human_actor_id(human_principal: HumanPrincipal) -> str:\n    return human_principal.subject\n\n\n'''
          assert anchor in text
          addition = anchor + '''def _capture_phase_state(\n    connection: Connection,\n    *,\n    tenant_id: str,\n    journey_id: UUID,\n    for_update: bool = False,\n):\n    suffix = " FOR UPDATE" if for_update else ""\n    row = connection.execute(\n        text(\n            """\n            SELECT business_status, capture_completed_at_utc, version_no\n            FROM auditcore.journey_stage_states\n            WHERE tenant_id=:tenant_id AND journey_id=:journey_id\n              AND stage_code='BOOKING'\n            """ + suffix\n        ),\n        {"tenant_id": tenant_id, "journey_id": journey_id},\n    ).mappings().one_or_none()\n    if row is None:\n        raise NotFoundError(\n            error_code="VAC-NF-005",\n            title="Booking not found",\n            detail="Booking stage not found for the requested Project.",\n        )\n    return row\n\n\ndef _require_capture_phase_open(connection: Connection, *, tenant_id: str, journey_id: UUID) -> None:\n    state = _capture_phase_state(connection, tenant_id=tenant_id, journey_id=journey_id)\n    if state["capture_completed_at_utc"] is not None:\n        raise ConflictError(\n            error_code="VAC-CONFLICT-004",\n            title="Booking document capture is complete",\n            detail="Booking V2 document capture is locked after Booking submission.",\n        )\n\n\n'''
          text = text.replace(anchor, addition, 1)

          marker = '''    return BookingCaptureV2Response(\n        journeyId=journey_id,\n        externalContextRef=context_ref,\n        requirements=requirement_results,\n        uploads=uploads,\n        declarations=response_declarations,\n        canContinue=can_continue,\n    )\n\n\n'''
          assert marker in text
          helper = marker + '''def _build_local_capture_response(\n    *,\n    journey_id: UUID,\n    requirements: list[dict[str, Any]],\n    declaration_rows: dict[str, dict[str, Any]],\n    audit_documents: list[dict[str, Any]],\n) -> BookingCaptureV2Response:\n    di_documents = [\n        {\n            "documentId": str(row["di_document_id"]),\n            "clientUploadId": str(row["client_upload_id"]),\n            "state": str(row["capture_status"]),\n            "classifiedDocumentTypeKey": row.get("classified_document_type_key"),\n            "originalFilename": str(row["original_filename"]),\n            "contentUrl": None,\n            "processingStatus": None,\n        }\n        for row in audit_documents\n    ]\n    return _build_capture_response(\n        journey_id=journey_id,\n        context_ref="local-v2-completion-check",\n        requirements=requirements,\n        declaration_rows=declaration_rows,\n        audit_documents=audit_documents,\n        di_documents=di_documents,\n    )\n\n\n'''
          text = text.replace(marker, helper, 1)

          get_end = '''    return _read_capture(\n        connection=connection,\n        engine=engine,\n        tenant_id=tenant_id,\n        journey_id=journey_id,\n        security_client=security_client,\n        di_client=di_client,\n        v2_client=v2_client,\n    )\n\n\n@router.post("/booking/upload-intents", response_model=UploadIntentResponse)\n'''
          assert get_end in text
          endpoint = '''    return _read_capture(\n        connection=connection,\n        engine=engine,\n        tenant_id=tenant_id,\n        journey_id=journey_id,\n        security_client=security_client,\n        di_client=di_client,\n        v2_client=v2_client,\n    )\n\n\n@router.post("/booking/complete", response_model=BookingCaptureV2CompletionResponse)\ndef complete_booking_capture_v2(\n    tenant_id: str,\n    journey_id: UUID,\n    request: Request,\n    response: Response,\n    idempotency_key: Annotated[str, Header(alias="Idempotency-Key", min_length=8, max_length=200)],\n    if_match: Annotated[str, Header(alias="If-Match", min_length=1, max_length=64)],\n    human_principal: Annotated[HumanPrincipal, Depends(get_human_principal)],\n    authorization_client: Annotated[SecurityAuthorizationClient, Depends(get_security_authorization_client)],\n    connection: Annotated[Connection, Depends(get_connection)],\n) -> BookingCaptureV2CompletionResponse:\n    context = _scope(\n        connection,\n        tenant_id=tenant_id,\n        journey_id=journey_id,\n        human_principal=human_principal,\n        authorization_client=authorization_client,\n    )\n    expected_version = _parse_if_match(if_match)\n    correlation_id = get_correlation_id(request)\n\n    def execute() -> dict[str, Any]:\n        _aggregate_lock(connection, tenant_id=tenant_id, journey_id=journey_id)\n        state = _capture_phase_state(\n            connection, tenant_id=tenant_id, journey_id=journey_id, for_update=True\n        )\n        _require_active_booking(state)\n        if int(state["version_no"]) != expected_version:\n            raise ConflictError(\n                error_code="VAC-CONFLICT-005",\n                title="Booking version conflict",\n                detail="Booking changed since it was loaded. Refresh the Booking and retry.",\n            )\n        if state["capture_completed_at_utc"] is not None:\n            raise ConflictError(\n                error_code="VAC-CONFLICT-004",\n                title="Booking document capture is complete",\n                detail="Booking V2 document capture has already been submitted.",\n            )\n\n        local_capture = _build_local_capture_response(\n            journey_id=journey_id,\n            requirements=_base_requirements(connection, tenant_id, journey_id),\n            declaration_rows=_declarations(connection, tenant_id, journey_id),\n            audit_documents=_linked_documents(connection, tenant_id, journey_id),\n        )\n        if not local_capture.canContinue:\n            raise ConflictError(\n                error_code="VAC-CONFLICT-004",\n                title="Booking document capture is incomplete",\n                detail="Required classifications or applicability decisions are still pending.",\n            )\n\n        next_version = expected_version + 1\n        connection.execute(\n            text(\n                """\n                UPDATE auditcore.journey_stage_states\n                SET capture_completed_at_utc=now(),\n                    pc_verification_status='PENDING',\n                    latest_activity_at_utc=now(),\n                    updated_at_utc=now(),\n                    version_no=:version\n                WHERE tenant_id=:tenant_id AND journey_id=:journey_id\n                  AND stage_code='BOOKING'\n                """\n            ),\n            {"tenant_id": tenant_id, "journey_id": journey_id, "version": next_version},\n        )\n        _append_workflow_event(\n            connection,\n            tenant_id=tenant_id,\n            journey_id=journey_id,\n            event_type="PC_BOOKING_CAPTURE_SUBMITTED",\n            source_kind="HUMAN",\n            actor_id=human_principal.subject,\n            actor_role_snapshot=context["operating_role"],\n            idempotency_key=idempotency_key,\n            correlation_id=correlation_id,\n            safe_payload={\n                "capturePath": "V2",\n                "pcVerificationStatus": "PENDING",\n                "bookingBusinessStatusChanged": False,\n            },\n            aggregate_version=next_version,\n        )\n        return BookingCaptureV2CompletionResponse(\n            journeyId=journey_id, aggregateVersion=next_version\n        ).model_dump(mode="json")\n\n    body, _ = execute_idempotent_json_command(\n        connection,\n        tenant_id=tenant_id,\n        operation_key=f"uc03.document-capture-v2.complete:{journey_id}",\n        idempotency_key=idempotency_key,\n        request_payload={"expectedVersion": expected_version},\n        execute=execute,\n    )\n    response.headers["ETag"] = f'"{body["aggregateVersion"]}"'\n    return BookingCaptureV2CompletionResponse.model_validate(body)\n\n\n@router.post("/booking/upload-intents", response_model=UploadIntentResponse)\n'''
          text = text.replace(get_end, endpoint, 1)

          auth_snippet = '''    _authorize_booking(\n        connection,\n        tenant_id=tenant_id,\n        journey_id=journey_id,\n        human_principal=human_principal,\n        authorization_client=authorization_client,\n    )\n'''
          # Keep the first occurrence (GET capture) readable; lock all four mutation paths after it.
          first = text.index(auth_snippet)
          cursor = first + len(auth_snippet)
          for _ in range(4):
              idx = text.index(auth_snippet, cursor)
              insert_at = idx + len(auth_snippet)
              text = text[:insert_at] + '''    _require_capture_phase_open(\n        connection, tenant_id=tenant_id, journey_id=journey_id\n    )\n''' + text[insert_at:]
              cursor = insert_at + len('''    _require_capture_phase_open(\n        connection, tenant_id=tenant_id, journey_id=journey_id\n    )\n''')

          path.write_text(text)

          test_path = Path('tests/test_uc03_document_capture_v2.py')
          tests = test_path.read_text()
          old = 'from audit_core.uc03_document_capture_v2 import _build_capture_response, _human_actor_id\n'
          new = ('from audit_core.main import app\n'
                 'from audit_core.uc03_document_capture_v2 import (\n'
                 '    _build_capture_response,\n'
                 '    _build_local_capture_response,\n'
                 '    _human_actor_id,\n'
                 ')\n')
          assert old in tests
          tests = tests.replace(old, new, 1)
          tests += '''\n\ndef test_v2_completion_route_is_additive() -> None:\n    assert "/v2/tenants/{tenant_id}/journeys/{journey_id}/booking/complete" in app.openapi()["paths"]\n\n\ndef test_local_completion_check_uses_reconciled_classified_links() -> None:\n    requirements = [_requirement()]\n    audit_documents = [{\n        "di_document_id": DOCUMENT_ID,\n        "client_upload_id": "client-upload-1",\n        "capture_status": "CLASSIFIED",\n        "classified_document_type_key": "booking_docket",\n        "requirement_key": "booking_docket",\n        "original_filename": "booking.pdf",\n    }]\n\n    result = _build_local_capture_response(\n        journey_id=JOURNEY_ID,\n        requirements=requirements,\n        declaration_rows={},\n        audit_documents=audit_documents,\n    )\n\n    assert result.canContinue is True\n    assert result.requirements[0].state == "UPLOADED"\n'''
          test_path.write_text(tests)
          PY

          python -m compileall -q src tests/test_uc03_document_capture_v2.py
          git diff --check
          git diff -- src/audit_core/uc03_document_capture_v2.py tests/test_uc03_document_capture_v2.py
          git config user.name "Verigence-admin"
          git config user.email "jbrconsulting.it@gmail.com"
          git add src/audit_core/uc03_document_capture_v2.py tests/test_uc03_document_capture_v2.py
          git commit -m "fix(v2): complete Booking without legacy capture submit"
          git push origin HEAD:fix/v2-booking-completion
