name: One-shot cleanup Project Admin diagnosis

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-project-admin-runtime-diagnose.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Restore planning Security contract and self-clean
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out planning branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore canonical admin-context files and remove diagnostics
        shell: bash
        env:
          C1_BASE_SHA: 647e7a95752bb65f90e9acbc9db4466dd05281b4
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git fetch --no-tags origin "$C1_BASE_SHA"
          git checkout "$C1_BASE_SHA" -- \
            src/audit_core/security_integration.py \
            tests/test_uc02_admin_security.py

          grep -Fq '/security/v1/platform/admin-context' src/audit_core/security_integration.py
          grep -Fq 'isSuperAdmin' src/audit_core/security_integration.py
          grep -Fq '/security/v1/platform/admin-context' tests/test_uc02_admin_security.py

          git rm -f .github/workflows/one-shot-project-admin-runtime-diagnose.yml
          git add src/audit_core/security_integration.py tests/test_uc02_admin_security.py

          git commit -m 'chore: restore Security admin-context contract and remove diagnostics [skip ci]'
          git push origin "HEAD:$HEAD_BRANCH"
