name: One-shot failed documents sent again after the 24 Nov AI outage (DEV, writes)

# The 24 Nov 19:30-20:30 IST AI outage left ~248 pages swept as DOCUMENT_AI_UNAVAILABLE; since
# PR #968 these are ours and the 8:15 job sends them again, 40 files / 60 documents a run. Product
# owner 25 Nov: "can you run it". A dry run, then committed runs one after another, each after the
# previous run's pages were read, until nothing is left (at most 8 runs).
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-failed-resend-now.yml'

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      TENANT: afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572
      LABEL: outage-2026-11-25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          rm -f /tmp/vars.json
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Dry run, then committed runs until nothing is left
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, psycopg
          from collections import Counter
          T = os.environ['TENANT']
          ACTIVE = ["QUEUED","PREPARING_PAGE","DI_UPLOAD_PREPARING","DI_UPLOADING","DI_FINALIZING","CLASSIFYING","EXTRACTING","SYNCING_TO_AUDIT_CORE","RETRY_WAIT"]
          def run(c, label):
              tag = f"{T}:{label}"
              row = c.execute("SELECT job_id FROM auditcore.p2_worker_jobs WHERE job_kind='FAILED_RESEND' AND tag=%s", (tag,)).fetchone()
              job_id = row[0] if row else c.execute("INSERT INTO auditcore.p2_worker_jobs (job_kind, tag, reports, requested_by) "
                  "VALUES ('FAILED_RESEND', %s, '{}', 'claude-github-actions') RETURNING job_id", (tag,)).fetchone()[0]
              for _ in range(180):
                  status, detail = c.execute("SELECT status, detail FROM auditcore.p2_worker_jobs WHERE job_id=%s", (job_id,)).fetchone()
                  if status in ("DONE", "FAILED"):
                      break
                  time.sleep(10)
              r = json.loads(detail or "{}") if status == "DONE" else {}
              d, f = r.get("documents") or {}, r.get("files") or {}
              print(label, status, "documents", {k: d.get(k) for k in ("documents","would_send","sent","skipped","left_for_next_run","failed")},
                    "files", {k: f.get(k) for k in ("would_send","sent","skipped","left_for_next_run","failed")}, flush=True)
              if status != "DONE":
                  print("DETAIL", (detail or "")[:2000])
              for kind, part in (("doc", d), ("file", f)):
                  tally = Counter((i.get("outcome"), str(i.get("failure") or i.get("reason") or i.get("code") or "")[:60]) for i in part.get("items") or [])
                  for k, n in tally.most_common():
                      print("  ", kind, n, k)
              return status, d, f
          def busy(c):
              return c.execute("SELECT count(*) FROM auditcore.p2_document_queue WHERE tenant_id=%s AND queue_status = ANY(%s)", (T, ACTIVE)).fetchone()[0]
          with psycopg.connect(os.environ["DB"], autocommit=True) as c:
              c.execute("SELECT set_config('app.tenant_id', %s, false)", (T,))
              status, d, f = run(c, os.environ['LABEL'] + "-dryrun")
              if status != "DONE":
                  raise SystemExit(1)
              if not (d.get("would_send") or f.get("would_send")):
                  print("NOTHING TO SEND"); raise SystemExit(0)
              for n in range(1, 9):
                  status, d, f = run(c, f"{os.environ['LABEL']}-r{n}-commit")
                  if status != "DONE":
                      raise SystemExit(1)
                  for _ in range(60):          # wait for the run's pages to be read (at most 20 minutes)
                      time.sleep(20)
                      if busy(c) <= 5:
                          break
                  print("  still reading after the wait:", busy(c), flush=True)
                  if not (d.get("left_for_next_run") or f.get("left_for_next_run")) or not (d.get("sent") or f.get("sent")):
                      break
              time.sleep(60)
              for r in c.execute("""SELECT q.queue_status, coalesce(q.last_error,'-'),
                    (SELECT n.queue_status FROM auditcore.p2_document_queue n WHERE n.tenant_id=q.tenant_id AND n.journey_id=q.journey_id
                       AND n.page_sha256=q.page_sha256 AND n.created_at_utc > q.created_at_utc ORDER BY n.created_at_utc DESC LIMIT 1) AS now_,
                    count(*)
                  FROM auditcore.p2_document_queue q WHERE q.tenant_id=%s AND q.last_error='DOCUMENT_AI_UNAVAILABLE'
                    AND q.updated_at_utc BETWEEN '2026-11-24 13:00+00' AND '2026-11-24 17:00+00' GROUP BY 1,2,3 ORDER BY 4 DESC""", (T,)):
                  print("OUTAGE_PAGES", r)
              for r in c.execute("""SELECT t.task_status, count(*) FROM auditcore.p2_tasks t WHERE t.tenant_id=%s AND t.task_type='DOCUMENT_RESUBMIT'
                  AND t.created_at_utc > now() - interval '2 days' GROUP BY 1""", (T,)):
                  print("RESUBMIT_TASKS", r)
          PY
