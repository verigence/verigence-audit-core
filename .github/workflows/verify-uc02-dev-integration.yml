name: Verify UC02 DEV integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-dev-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Audit Core downstream endpoint configuration
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          railway variable list --service security --json >/tmp/security-vars.json
          railway variable list --service di-api --json >/tmp/di-vars.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          audit = json.loads(Path('/tmp/audit-vars.json').read_text())
          security = json.loads(Path('/tmp/security-vars.json').read_text())
          di = json.loads(Path('/tmp/di-vars.json').read_text())

          checks = [
              ('SECURITY_BASE_URL', audit.get('SECURITY_BASE_URL'), security.get('PORT'), security.get('RAILWAY_PUBLIC_DOMAIN')),
              ('DI_BASE_URL', audit.get('DI_BASE_URL'), di.get('PORT'), di.get('RAILWAY_PUBLIC_DOMAIN')),
          ]
          failed = False
          for key, raw_url, service_port, public_domain in checks:
              value = str(raw_url or '').strip()
              if not value:
                  print(f'{key}=MISSING')
                  failed = True
                  continue
              parsed = urlparse(value)
              configured_port = parsed.port
              print(f'{key}=PRESENT')
              print(f'{key}_SCHEME={parsed.scheme}')
              print(f'{key}_HOST={parsed.hostname or "unknown"}')
              print(f'{key}_CONFIGURED_PORT={configured_port if configured_port is not None else "DEFAULT"}')
              print(f'{key}_SERVICE_PORT={service_port or "UNSET"}')
              print(f'{key}_PUBLIC_DOMAIN_PRESENT={"YES" if public_domain else "NO"}')
              if service_port and configured_port is not None and str(configured_port) != str(service_port):
                  print(f'{key}_PORT_MATCH=FAIL')
                  failed = True
              elif service_port and configured_port is not None:
                  print(f'{key}_PORT_MATCH=PASS')
              else:
                  print(f'{key}_PORT_MATCH=UNVERIFIED')
          if failed:
              raise SystemExit('Audit Core downstream endpoint configuration mismatch detected')
          PY

          railway logs --service "$AUDIT_SERVICE" --latest --lines 5000 >/tmp/audit.log 2>/dev/null || true
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/audit.log').read_text(errors='ignore') if Path('/tmp/audit.log').exists() else ''
          if 'SECURITY_BASE_URL is required for UC02 administration' in text:
              print('LATEST_SECURITY_FAILURE_CLASS=CONFIG_MISSING')
          elif 'Security administrative endpoint is unavailable' in text or 'endpoint_unavailable' in text:
              print('LATEST_SECURITY_FAILURE_CLASS=ENDPOINT_UNREACHABLE')
          else:
              matches = re.findall(r'Security administrative request failed with HTTP\s+(\d{3})', text)
              if matches:
                  print('LATEST_SECURITY_FAILURE_CLASS=DOWNSTREAM_HTTP_' + matches[-1])
              elif 'SECURITY_ADMIN_FAILED' in text:
                  print('LATEST_SECURITY_FAILURE_CLASS=SECURITY_ADMIN_FAILED_UNCLASSIFIED')
              else:
                  print('LATEST_SECURITY_FAILURE_CLASS=NO_RECENT_MATCH')
          PY
