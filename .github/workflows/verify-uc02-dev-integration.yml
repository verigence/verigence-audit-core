name: Verify UC02 DEV integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-dev-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Inspect Security and Audit request logs
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway logs --service security --lines 12000 >/tmp/security.log 2>/dev/null || true
          railway logs --service "$AUDIT_SERVICE" --lines 12000 >/tmp/audit.log 2>/dev/null || true
          python - <<'PY'
          import re
          from pathlib import Path

          uuid_re = re.compile(r'\b[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}\b')
          email_re = re.compile(r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b')
          token_re = re.compile(r'Bearer\s+\S+', re.I)
          def safe(line: str) -> str:
              line = token_re.sub('Bearer <redacted>', line)
              line = email_re.sub('<email>', line)
              line = uuid_re.sub('<uuid>', line)
              return line[:1600]

          sec = Path('/tmp/security.log').read_text(errors='ignore').splitlines()
          sec_keys = [
              '/security/v1/platform/tenants', '/security/v1/platform/admin-context',
              'platform.tenant.create', 'traceback', 'exception', 'error',
              'timeout', 'timed out', 'cancelled', 'client disconnected'
          ]
          sm = [l for l in sec if any(k in l.lower() for k in sec_keys)]
          print('SECURITY_TOTAL_LINES=' + str(len(sec)))
          print('SECURITY_MATCHED_LINES=' + str(len(sm)))
          for l in sm[-160:]:
              print('SECURITY_LOG|' + safe(l))

          aud = Path('/tmp/audit.log').read_text(errors='ignore').splitlines()
          aud_keys = [
              'security_admin_call_failed', 'project_provisioning_recovery_required',
              'endpoint_unavailable', 'security administrative endpoint is unavailable',
              'readtimeout', 'connecttimeout', 'timeout'
          ]
          am = [l for l in aud if any(k in l.lower() for k in aud_keys)]
          print('AUDIT_TOTAL_LINES=' + str(len(aud)))
          print('AUDIT_MATCHED_LINES=' + str(len(am)))
          for l in am[-120:]:
              print('AUDIT_LOG|' + safe(l))
          PY
