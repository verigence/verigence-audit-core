name: Verify UC02 DEV integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-dev-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Audit Core downstream endpoint configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo 'RAILWAY_API_TOKEN=UNAVAILABLE'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('/tmp/audit-vars.json').read_text())
          missing = []
          for key, path in [('SECURITY_BASE_URL', '/tmp/security-url'), ('DI_BASE_URL', '/tmp/di-url')]:
              value = str(data.get(key, '')).strip()
              if not value:
                  print(f'{key}=MISSING')
                  missing.append(key)
                  continue
              parsed = urlparse(value)
              if parsed.scheme not in {'http', 'https'} or not parsed.netloc:
                  print(f'{key}=INVALID')
                  missing.append(key)
                  continue
              print(f'{key}=PRESENT')
              print(f'{key}_HOST={parsed.hostname or "unknown"}')
              Path(path).write_text(value.rstrip('/'))
          if missing:
              raise SystemExit('Missing or invalid Audit Core downstream endpoint configuration: ' + ', '.join(missing))
          PY

          security="$(cat /tmp/security-url)"
          di="$(cat /tmp/di-url)"

          security_host="$(python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          print(urlparse(Path('/tmp/security-url').read_text()).hostname or '')
          PY
          )"
          di_host="$(python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          print(urlparse(Path('/tmp/di-url').read_text()).hostname or '')
          PY
          )"

          if [[ "$security_host" == *.railway.internal ]]; then
            echo 'SECURITY_CONNECTIVITY=PRIVATE_RAILWAY_HOST_CONFIGURED'
          else
            security_ready="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$security/health/ready" || true)"
            echo "SECURITY_READY_HTTP=$security_ready"
            [[ "$security_ready" == "200" ]] || { echo 'SECURITY_CONNECTIVITY=FAIL'; exit 1; }
            tenant_probe="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$security/security/v1/platform/tenants" || true)"
            echo "SECURITY_TENANT_ROUTE_HTTP=$tenant_probe"
            case "$tenant_probe" in
              401|403) echo 'SECURITY_ADMIN_ROUTE=REACHABLE_AUTH_REQUIRED' ;;
              2??) echo 'SECURITY_ADMIN_ROUTE=REACHABLE' ;;
              *) echo 'SECURITY_ADMIN_ROUTE=FAIL'; exit 1 ;;
            esac
          fi

          if [[ "$di_host" == *.railway.internal ]]; then
            echo 'DI_CONNECTIVITY=PRIVATE_RAILWAY_HOST_CONFIGURED'
          else
            di_health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$di/health" || true)"
            di_ready="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$di/ready" || true)"
            echo "DI_HEALTH_HTTP=$di_health"
            echo "DI_READY_HTTP=$di_ready"
            [[ "$di_health" == "200" && "$di_ready" == "200" ]] || { echo 'DI_CONNECTIVITY=FAIL'; exit 1; }
            echo 'DI_CONNECTIVITY=PASS'
          fi

          railway logs --service "$AUDIT_SERVICE" --latest --lines 800 >/tmp/audit.log 2>/dev/null || true
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/audit.log').read_text(errors='ignore') if Path('/tmp/audit.log').exists() else ''
          if 'SECURITY_BASE_URL is required for UC02 administration' in text:
              print('LATEST_SECURITY_FAILURE_CLASS=CONFIG_MISSING')
          elif 'Security administrative endpoint is unavailable' in text or 'endpoint_unavailable' in text:
              print('LATEST_SECURITY_FAILURE_CLASS=ENDPOINT_UNREACHABLE')
          else:
              matches = re.findall(r'Security administrative request failed with HTTP\s+(\d{3})', text)
              if matches:
                  print('LATEST_SECURITY_FAILURE_CLASS=DOWNSTREAM_HTTP_' + matches[-1])
              elif 'SECURITY_ADMIN_FAILED' in text:
                  print('LATEST_SECURITY_FAILURE_CLASS=SECURITY_ADMIN_FAILED_UNCLASSIFIED')
              else:
                  print('LATEST_SECURITY_FAILURE_CLASS=NO_RECENT_MATCH')
          PY
