name: UC02 working ruff autofix

on:
  push:
    branches:
      - fix/uc02-project-admin-stabilization-v2-working

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message != 'chore(uc02): ruff autofix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uc02-project-admin-stabilization-v2-working
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.0
      - run: ruff check --fix src/audit_core/readiness.py src/audit_core/uc02_project_admin_stabilization.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/audit_core/readiness.py src/audit_core/uc02_project_admin_stabilization.py
          git commit -m 'chore(uc02): ruff autofix'
          git push origin HEAD:fix/uc02-project-admin-stabilization-v2-working
