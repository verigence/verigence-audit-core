name: One-shot Sign-in failures diagnose (read-only)

# Read-only: failed sign-ins on 24 Nov 2026 IST, people as short hashes only (public repository). Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/login-diagnose]
    paths:
      - '.github/workflows/one-shot-login-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e . 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Why sign-ins were refused (422), from the sign-in service logs, read-only
        shell: bash
        run: |
          set -uo pipefail
          railway logs --service security --environment dev --since 2026-11-24T00:00:00Z --until 2026-11-25T00:00:00Z \
            --filter "@level:warn" --lines 500 --json > /tmp/v.jsonl 2>/tmp/v.err || cat /tmp/v.err
          python - <<'PY'
          import json
          from collections import Counter
          seen = Counter()
          for line in open('/tmp/v.jsonl'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              r = json.loads(line)
              flat = {**r, **(r.get('attributes') or {})}
              if 'validation' not in json.dumps(r):
                  continue
              print("KEYS", sorted(k for k in flat if k not in ('message',)))
              issues = r.get('validation_issues') or (r.get('attributes') or {}).get('validation_issues')
              route = r.get('http_route') or (r.get('attributes') or {}).get('http_route')
              print("V", r.get('timestamp'), route, issues)
              seen[(route, issues)] += 1
          print("SUMMARY", dict(seen))
          PY
