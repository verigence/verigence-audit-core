name: One-shot Sign-in failures diagnose (read-only)

# Read-only: failed sign-ins on 24 Nov 2026 IST, people as short hashes only (public repository). Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/login-diagnose]
    paths:
      - '.github/workflows/one-shot-login-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e . 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Failed sign-ins, read-only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os
          from collections import Counter
          from sqlalchemy import create_engine
          h = lambda s: hashlib.sha256(str(s).encode()).hexdigest()[:8] if s else "-"
          e = create_engine(os.environ["DB"].replace("postgresql://", "postgresql+psycopg://", 1))
          with e.connect() as c:
              c.exec_driver_sql("SET TRANSACTION READ ONLY")
              rows = c.exec_driver_sql("""
                  SELECT (attempted_at_utc AT TIME ZONE 'Asia/Kolkata') AS at_ist, identifier, user_id, outcome, reason,
                         device_type, platform, app_version
                  FROM security.login_attempts
                  WHERE attempted_at_utc >= TIMESTAMP '2026-11-23 18:30' AND attempted_at_utc < TIMESTAMP '2026-11-25 02:30'
                  ORDER BY attempted_at_utc""").mappings().all()
              print("ATTEMPTS", len(rows), Counter((r["outcome"], r["reason"]) for r in rows))
              for r in rows:
                  if r["outcome"] != "SUCCEEDED" and r["outcome"] != "SUCCESS":
                      print("FAIL", r["at_ist"].strftime("%d %H:%M:%S"), h(r["identifier"]), "user", h(r["user_id"]), r["outcome"], r["reason"], r["device_type"], r["platform"], r["app_version"])
              who = [r for r in rows if h(r["identifier"]) == "dd96cf54"]
              print("TARGET rows", len(who))
              for r in who:
                  print("TARGET", r["at_ist"].strftime("%d %H:%M:%S"), r["outcome"], r["reason"], r["device_type"], r["platform"], r["app_version"], "user", h(r["user_id"]))
              c.rollback()
          PY
