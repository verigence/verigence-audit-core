name: One-shot UC02 Ruff Fix

on:
  push:
    branches:
      - feature/uc02-mahindra-segment-masters
    paths:
      - .github/workflows/one-shot-uc02-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uc02-mahindra-segment-masters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.0
      - name: Apply lint fixes
        run: ruff check src/audit_core/mahindra_masters.py --fix
      - name: Commit fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-uc02-ruff-fix.yml
          git add src/audit_core/mahindra_masters.py
          git commit -m 'fix(uc02): satisfy Audit Core lint'
          git push origin HEAD:feature/uc02-mahindra-segment-masters
