name: Diagnose UC02 Postgres access

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'verify/uc02-dev-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      DB_SERVICE: Postgres
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Inspect only non-secret Postgres access metadata
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$DB_SERVICE" --json >/tmp/link.json
          railway variable list --service "$DB_SERVICE" --json >/tmp/postgres-vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          values=json.loads(Path('/tmp/postgres-vars.json').read_text())
          keys=sorted(values)
          print('POSTGRES_VARIABLE_KEYS=' + ','.join(keys))
          candidates=(
              'DATABASE_PUBLIC_URL','POSTGRES_PUBLIC_URL','RAILWAY_TCP_PROXY_DOMAIN',
              'RAILWAY_TCP_PROXY_PORT','PGHOST','PGPORT','PGUSER','PGPASSWORD','PGDATABASE',
              'POSTGRES_HOST','POSTGRES_PORT','POSTGRES_USER','POSTGRES_PASSWORD','POSTGRES_DB',
              'DATABASE_URL','DATABASE_PRIVATE_URL','RAILWAY_PRIVATE_DOMAIN',
          )
          for key in candidates:
              print(f'POSTGRES_KEY_PRESENT|{key}|{bool(values.get(key))}')
          PY
