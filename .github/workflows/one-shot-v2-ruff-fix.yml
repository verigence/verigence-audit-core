name: One-shot V2 Ruff Fix

on:
  push:
    branches: [feature/uc03-document-capture-v2]
    paths:
      - '.github/workflows/one-shot-v2-ruff-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uc03-document-capture-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact lint tool
        run: python -m pip install 'ruff==0.16.0'
      - name: Apply only proven V2 lint fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/audit_core/main.py src/audit_core/uc03_document_capture_v2.py --fix
          ruff check src/audit_core/main.py src/audit_core/uc03_document_capture_v2.py
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/audit_core/main.py\nsrc/audit_core/uc03_document_capture_v2.py' || {
            echo 'Unexpected files changed; refusing to commit.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audit_core/main.py src/audit_core/uc03_document_capture_v2.py
          git commit -m 'fix(v2): apply CI-reported Ruff fixes'
          git push origin HEAD:feature/uc03-document-capture-v2
