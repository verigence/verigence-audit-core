name: Inspect Railway workspace and deployed topology

on:
  push:
    branches:
      - agent/unified-railway-platform
    paths:
      - .github/workflows/platform-bootstrap-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DI_PROJECT_ID: 62c22163-78d0-4a86-a2f7-dbf39e64aa4d
    steps:
      - name: Require workspace/account Railway token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN:-}" || { echo 'RAILWAY_API_TOKEN missing' >&2; exit 1; }

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: List workspace projects
        shell: bash
        run: |
          set -euo pipefail
          railway list --json > /tmp/projects.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/projects.json').read_text())
          for row in rows:
              print(f"RAILWAY_PROJECT={row.get('name')}|{row.get('id')}")
          PY

      - name: Inspect production service topology for every project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/project-ids.txt
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/projects.json').read_text())
          for row in rows:
              if row.get('id'):
                  print(f"{row.get('id')}|{row.get('name','')}")
          PY

          while IFS='|' read -r project_id project_name; do
            rm -rf .railway
            echo "--- PROJECT ${project_name}|${project_id} ---"
            if railway link --project "$project_id" --environment production --json >/tmp/link.json 2>/tmp/link.err; then
              railway service list --json >/tmp/services.json
              PROJECT_NAME="$project_name" python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path('/tmp/services.json').read_text())
          if not rows:
              print(f"RAILWAY_TOPOLOGY={os.environ['PROJECT_NAME']}|NO_SERVICES")
          for row in rows:
              print(f"RAILWAY_SERVICE={os.environ['PROJECT_NAME']}|{row.get('name')}|{row.get('id')}")
          PY
            else
              echo "RAILWAY_PROJECT_INSPECT_SKIPPED=${project_name}|production-link-failed"
              cat /tmp/link.err || true
            fi
          done < /tmp/project-ids.txt

      - name: Identify DI worker and scheduler placement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .railway
          railway link --project "$DI_PROJECT_ID" --environment production --json >/tmp/di-link.json

          for service in di-api verigence-di; do
            railway variable list --service "$service" --json > "/tmp/${service}-vars.json"
            SERVICE_NAME="$service" VAR_FILE="/tmp/${service}-vars.json" python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ['VAR_FILE']).read_text())
          if not isinstance(data, dict):
              data={}
          print(f"DI_SERVICE_CONFIG={os.environ['SERVICE_NAME']}|DI_WORKER_ENABLED={data.get('DI_WORKER_ENABLED','<unset>')}")
          for key in ('RAILWAY_DOCKERFILE_PATH','PORT'):
              if key in data:
                  print(f"DI_SERVICE_CONFIG={os.environ['SERVICE_NAME']}|{key}={data[key]}")
          PY

            railway logs --service "$service" --latest --lines 500 > "/tmp/${service}.log" || true
            SERVICE_NAME="$service" LOG_FILE="/tmp/${service}.log" python - <<'PY'
          import os
          from pathlib import Path
          text=Path(os.environ['LOG_FILE']).read_text(errors='replace') if Path(os.environ['LOG_FILE']).exists() else ''
          markers={
              'WORKER_STARTED': ('processing_worker_started','processing_worker_loop_started','job_claimed'),
              'SCHEDULER_STARTED': ('eod_retry_scheduler_started','eod_window_matched','eod_retry_jobs_inserted'),
              'API_STARTED': ('Uvicorn running','Application startup complete','Started server process'),
          }
          for label, needles in markers.items():
              present=any(needle in text for needle in needles)
              print(f"DI_RUNTIME_MARKER={os.environ['SERVICE_NAME']}|{label}={'YES' if present else 'NO'}")
          PY

            railway deployment list --service "$service" --limit 3 --json > "/tmp/${service}-deployments.json" || true
            SERVICE_NAME="$service" DEPLOY_FILE="/tmp/${service}-deployments.json" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['DEPLOY_FILE'])
          if not p.exists() or not p.read_text().strip():
              print(f"DI_DEPLOYMENT_META={os.environ['SERVICE_NAME']}|NO_DEPLOYMENT_DATA")
              raise SystemExit(0)
          try:
              data=json.loads(p.read_text())
          except Exception:
              print(f"DI_DEPLOYMENT_META={os.environ['SERVICE_NAME']}|UNPARSEABLE")
              raise SystemExit(0)

          safe_keys={
              'startcommand','start_command','dockerfilepath','dockerfile_path',
              'rootdirectory','root_directory','repo','repository','branch',
              'status','builder','source','source_type','servicename','service_name'
          }
          rows=[]
          def walk(obj, path='root'):
              if isinstance(obj, dict):
                  for k,v in obj.items():
                      key=str(k).lower()
                      pth=f'{path}.{k}'
                      if key in safe_keys and isinstance(v,(str,int,float,bool)):
                          rows.append((pth,str(v)))
                      walk(v,pth)
              elif isinstance(obj, list):
                  for i,v in enumerate(obj[:3]):
                      walk(v,f'{path}[{i}]')
          walk(data)
          if not rows:
              print(f"DI_DEPLOYMENT_META={os.environ['SERVICE_NAME']}|NO_SAFE_FIELDS")
          for path,value in rows[:40]:
              print(f"DI_DEPLOYMENT_META={os.environ['SERVICE_NAME']}|{path}={value}")
          PY
          done

          echo 'DI_RUNTIME_PLACEMENT_INSPECTION=PASS'

      - name: State inspection result
        run: echo 'RAILWAY_WORKSPACE_TOPOLOGY_INSPECTION=PASS'
