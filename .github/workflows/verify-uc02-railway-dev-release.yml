name: Verify UC02 Railway DEV Release

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-railway-dev-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SERVICE: verigence-audit-core
      EXPECTED_DEV_SHA: e3a50a8da5040c9d223513f10a62332dbc9c9570
      NOT_BEFORE_UTC: '2026-08-22T03:45:00Z'

    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify latest Audit Core DEV deployment
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::Audit Core Railway token missing'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$SERVICE" --json >/tmp/link.json
          railway deployment list --service "$SERVICE" --limit 1 --json >/tmp/deploy.json
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          rows=json.loads(Path('/tmp/deploy.json').read_text())
          if not rows:
              raise SystemExit('No Audit Core Railway deployment found')
          row=rows[0]
          did=str(row.get('id',''))
          status=str(row.get('status',''))
          created=row.get('createdAt') or row.get('created_at') or ''
          print(f'AUDIT_CORE_DEPLOYMENT_ID={did}')
          print(f'AUDIT_CORE_DEPLOYMENT_STATUS={status}')
          print(f'AUDIT_CORE_DEPLOYMENT_CREATED_AT={created or "UNKNOWN"}')
          if status != 'SUCCESS':
              raise SystemExit(f'Latest Audit Core deployment is not SUCCESS: {status}')
          if created:
              when=datetime.fromisoformat(created.replace('Z','+00:00'))
              floor=datetime.fromisoformat(os.environ['NOT_BEFORE_UTC'].replace('Z','+00:00'))
              if when < floor:
                  raise SystemExit(f'Latest Audit Core deployment is stale: {created}')
          text=json.dumps(row, default=str)
          expected=os.environ['EXPECTED_DEV_SHA']
          if expected in text or expected[:12] in text:
              print('AUDIT_CORE_DEPLOYED_SHA_MATCH=PASS')
          else:
              print('AUDIT_CORE_DEPLOYED_SHA_MATCH=NOT_EXPOSED_BY_RAILWAY_LIST')
          PY

      - name: Smoke Audit Core DEV
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$SERVICE" --json >/tmp/vars.json
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          [ -n "$domain" ] || { echo '::error::Audit Core DEV public domain missing'; exit 1; }
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac
          curl --fail --silent --show-error "$base/health" >/tmp/health.json
          for path in \
            '/v1/projects' \
            '/v1/tenants/uc02-smoke/project/readiness' \
            '/v1/tenants/uc02-smoke/project/activate' \
            '/v1/tenants/uc02-smoke/project-masters' \
            '/v1/tenants/uc02-smoke/role-mapping-candidates' \
            '/v1/tenants/uc02-smoke/role-mappings'
          do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request OPTIONS "$base$path" || true)"
            case "$code" in 000|404|5??) echo "::error::$path returned HTTP $code"; exit 1;; esac
          done
          echo "AUDIT_CORE_PUBLIC_BASE=$base"
          echo 'AUDIT_CORE_RAILWAY_DEV_VERIFY=PASS'
