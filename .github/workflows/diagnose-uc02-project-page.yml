name: Diagnose UC02 Project page DEV

on:
  push:
    branches: [ops/diagnose-uc02-project-page]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Read exact recent Project page calls
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --json >/dev/null
          echo '--- AUDIT CORE PROJECT PAGE CALLS ---'
          railway logs --service verigence-audit-core --latest --deployment --lines 1500 2>/dev/null \
            | grep -E 'GET /v1/projects|GET /v1/project-reference-data|GET /v1/tenants/.*/project|api_error|system_error|project_directory_dependency_failed|security_admin_context_failed' \
            | tail -n 200 || true
          echo '--- SECURITY ADMIN CALLS ---'
          railway logs --service security --latest --deployment --lines 1000 2>/dev/null \
            | grep -E 'GET /security/v1/platform/admin-context|GET /security/v1/platform/tenants' \
            | tail -n 100 || true
