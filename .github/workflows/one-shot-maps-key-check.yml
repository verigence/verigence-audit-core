name: One-shot Maps key check (DEV, read-only)

# Reads GOOGLE_MAPS_API_KEY from the Audit Core DEV service and makes ONE Geocoding request.
# Prints only: whether the variable is set, its length, and Google's status. Never the key.
# (Re-run after the new key was applied on Railway.)
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-maps-key-check.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-maps-key-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Check the key with one Geocoding request
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/vars.json
          python3 - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          key = (json.load(open('/tmp/vars.json')).get('GOOGLE_MAPS_API_KEY') or '').strip()
          if not key:
              print('GOOGLE_MAPS_API_KEY: NOT SET on the Audit Core DEV service')
              all_vars = json.load(open('/tmp/vars.json'))
              near = sorted(n for n in all_vars if any(w in n.lower() for w in ('google', 'maps', 'geocod')))
              print('variable NAMES that look related (names only, no values):', near or 'none')
              print('total variables on the service:', len(all_vars))
              raise SystemExit(0)
          print('::add-mask::' + key)
          import hashlib
          print('GOOGLE_MAPS_API_KEY: set, length', len(key), ', starts with AIza:', key.startswith('AIza'))
          print('identical to the key pasted earlier in chat:', hashlib.sha256(key.encode()).hexdigest()[:12] == 'b71c824cbdff')
          url = 'https://maps.googleapis.com/maps/api/geocode/json?' + urllib.parse.urlencode(
              {'address': 'Cuttack Sadar, Odisha, India', 'components': 'country:IN', 'key': key})
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  body = json.load(r)
          except Exception as exc:
              print('request failed:', type(exc).__name__)
              raise SystemExit(0)
          # Second opinion from Google's newer Geocoding API: its errors say WHY a key is refused.
          try:
              req = urllib.request.Request(
                  'https://geocode.googleapis.com/v4beta/geocode/address/Cuttack%20Sadar%2C%20Odisha%2C%20India',
                  headers={'X-Goog-Api-Key': key})
              with urllib.request.urlopen(req, timeout=20) as r2:
                  print('new Geocoding API: HTTP', r2.status)
          except urllib.error.HTTPError as err:
              try:
                  detail = json.load(err).get('error', {})
              except Exception:
                  detail = {}
              print('new Geocoding API: HTTP', err.code, '| status:', detail.get('status'),
                    '| reason:', str(detail.get('message', '-')).replace(key, '***')[:220])
              for d in detail.get('details', []):
                  if isinstance(d, dict) and d.get('reason'):
                      print('  reason code:', d.get('reason'))
          except Exception as exc:
              print('new Geocoding API request failed:', type(exc).__name__)
          print('Google status:', body.get('status'))
          msg = str(body.get('error_message', ''))
          print('Google message:', msg.replace(key, '***')[:200] or '-')
          if body.get('status') == 'OK':
              loc = body['results'][0]['geometry']['location']
              print('sample result inside India:', 6 <= loc['lat'] <= 38 and 68 <= loc['lng'] <= 98)
          PY
