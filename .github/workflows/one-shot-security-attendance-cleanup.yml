name: One-shot Security attendance cleanup to the 2 Oct stage (DEV)

# WRITES to the DEV database, once. Runs only for a push whose commit message contains
# the token APPLY-CLEANUP-NOW; any other push skips the job.
# One transaction. Every expected row count is asserted; any difference rolls back.
# Every deleted row is printed so it can be restored. Prints no secrets.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-security-attendance-cleanup.yml'

permissions:
  contents: read

concurrency:
  group: security-attendance-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, 'APPLY-CLEANUP-NOW') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli

      - name: Cleanup (single transaction)
        shell: bash
        run: |
          set -uo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service security --json >/dev/null
          railway variable list --service security --json >/tmp/sec.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import psycopg

          v = json.loads(Path('/tmp/sec.json').read_text())
          url = v['DATABASE_URL']
          for pre in ('postgresql+psycopg://', 'postgresql+asyncpg://', 'postgres://'):
              if url.startswith(pre):
                  url = 'postgresql://' + url[len(pre):]

          NEW9 = ['attendance.employee.manage', 'attendance.attendance.admin', 'attendance.leave.hr.approve',
                  'attendance.reimbursement.read', 'attendance.reimbursement.hr.approve',
                  'attendance.reimbursement.finance.approve', 'attendance.payroll.manage',
                  'attendance.config.manage', 'attendance.reimbursement.payment.manage']
          SHARED2 = ['attendance.report.read', 'attendance.report.export']
          LEDGER_SEC = ['0033_attendance_financeadmin.sql', '0034_attendance_reimbursement_payment.sql']
          LEDGER_ATT_ALL = ['0001_attendance_phase1.sql', '0002_location_confirmation.sql',
                            '0003_employee_module.sql', '0004_reimbursement_payment_lifecycle.sql']
          LEDGER_ATT_DROP = ['0003_employee_module.sql', '0004_reimbursement_payment_lifecycle.sql']

          def fail(msg):
              print('ABORT:', msg)
              conn.rollback()
              sys.exit(1)

          conn = psycopg.connect(url, connect_timeout=20,
                                 options='-c statement_timeout=60000 -c lock_timeout=15000')
          cur = conn.cursor()

          def rows(sql, args=None):
              cur.execute(sql, args)
              cols = [d.name for d in cur.description]
              return [dict(zip(cols, r)) for r in cur.fetchall()]

          def expect(label, got, want):
              print(f'  {label}: {got} (expected {want})')
              if got != want:
                  fail(f'{label} is {got}, expected {want}')

          print('=== BEFORE: rows that will be removed or changed (kept here so they can be restored)')
          print('permissions (9 to delete):', json.dumps(rows('select * from security.permissions where permission_key = any(%s) order by 1', (NEW9,)), default=str))
          print('permissions (2 to restore):', json.dumps(rows('select * from security.permissions where permission_key = any(%s) order by 1', (SHARED2,)), default=str))
          print('module_role_permissions:', json.dumps(rows('select * from security.module_role_permissions where permission_key = any(%s) order by 2,3', (NEW9,)), default=str))
          print('platform_role_permissions:', json.dumps(rows('select * from security.platform_role_permissions where permission_key = any(%s) order by 1,2', (NEW9,)), default=str))
          print('ledger security:', json.dumps(rows('select * from security.schema_migrations where migration_name = any(%s) order by 1', (LEDGER_SEC,)), default=str))
          print('ledger attendance:', json.dumps(rows('select * from attendance.schema_migrations order by 1'), default=str))

          print('=== guards')
          for t in ('tenant_role_permissions', 'module_operating_role_permission_defaults', 'principal_permission_grants',
                    'role_permissions', 'platform_role_permission_defaults', 'module_role_template_permissions'):
              cur.execute(f'select count(*) from security."{t}" where permission_key = any(%s)', (NEW9,))
              expect(f'{t} rows on the 9 new permissions', cur.fetchone()[0], 0)
          cur.execute("select count(*) from security.module_roles where module_key='attendance' and role_key='FINANCEADMIN'")
          expect('FINANCEADMIN role definition present (it stays)', cur.fetchone()[0], 1)
          cur.execute('select count(*) from security.permissions where permission_key = any(%s)', (NEW9,))
          expect('new permissions present', cur.fetchone()[0], 9)

          print('=== security: delete data added by migrations 0033 and 0034')
          cur.execute('delete from security.module_role_permissions where permission_key = any(%s)', (NEW9,))
          expect('module_role_permissions deleted', cur.rowcount, 9)
          cur.execute('delete from security.platform_role_permissions where permission_key = any(%s)', (NEW9,))
          expect('platform_role_permissions deleted', cur.rowcount, 9)
          cur.execute('delete from security.permissions where permission_key = any(%s)', (NEW9,))
          expect('permissions deleted', cur.rowcount, 9)
          cur.execute("""update security.permissions
                         set resource_key = split_part(permission_key, '.', 2), description = NULL,
                             display_name = permission_key, catalog_version = 'attendance-phase1',
                             status = 'ACTIVE', updated_at_utc = CURRENT_TIMESTAMP
                         where permission_key = any(%s)""", (SHARED2,))
          expect('shared permissions restored to their migration 0027 values', cur.rowcount, 2)
          cur.execute('delete from security.schema_migrations where migration_name = any(%s)', (LEDGER_SEC,))
          expect('security ledger rows deleted (0033, 0034)', cur.rowcount, 2)

          print('=== attendance database: employee module schema and ledger rows')
          cur.execute('select migration_name from attendance.schema_migrations order by 1')
          names = [r[0] for r in cur.fetchall()]
          expect('attendance ledger rows', names, LEDGER_ATT_ALL)
          cur.execute("select table_name from information_schema.tables where table_schema='verigence_attendance' and table_type='BASE TABLE' order by 1")
          tables = [r[0] for r in cur.fetchall()]
          expect('verigence_attendance tables', len(tables), 20)
          for t in tables:
              cur.execute(f'select count(*) from verigence_attendance."{t}"')
              n = cur.fetchone()[0]
              allowed = 5 if t == 'module_configuration' else 0
              if n > allowed:
                  fail(f'verigence_attendance.{t} has {n} rows, more than the {allowed} expected; refusing to drop')
          print('  all verigence_attendance tables are empty apart from module_configuration (default config only)')
          # explicit drops without CASCADE: anything outside the schema that depends on these
          # objects makes the statement fail, which aborts and rolls back the transaction
          cur.execute('drop table ' + ', '.join(f'verigence_attendance."{t}"' for t in tables))
          cur.execute('drop schema verigence_attendance')
          cur.execute('delete from attendance.schema_migrations where migration_name = any(%s)', (LEDGER_ATT_DROP,))
          expect('attendance ledger rows deleted (0003, 0004)', cur.rowcount, 2)

          print('=== AFTER (inside the transaction, before commit)')
          cur.execute("select count(*) from security.permissions where permission_key like 'attendance.%'")
          expect('attendance.* permissions left (the 13 from August)', cur.fetchone()[0], 13)
          cur.execute("select role_key, count(*) from security.module_role_permissions where module_key='attendance' group by 1 order by 1")
          print('  module_role_permissions by role:', cur.fetchall())
          cur.execute("select module_key, role_key from security.module_roles order by 1,2")
          print('  module_roles:', cur.fetchall())
          cur.execute("select count(*) from security.tenant_role_permissions where permission_key like 'attendance.%'")
          expect('tenant_role_permissions on attendance.* (unchanged)', cur.fetchone()[0], 440)
          cur.execute("select count(*) from information_schema.schemata where schema_name='verigence_attendance'")
          expect('verigence_attendance schema exists', cur.fetchone()[0], 0)
          cur.execute("select count(*) from security.schema_migrations")
          expect('security ledger rows', cur.fetchone()[0], 32)
          conn.commit()
          print('COMMITTED')
          PY
