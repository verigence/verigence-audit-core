name: Validate live PC Booking direct DI review

on:
  push:
    branches:
      - validation/pc-booking-review-direct-di-live-20260827
    paths:
      - '.github/workflows/validate-pc-booking-review-direct-di-live.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      TENANT_ID: 5fbe26ab-6ed7-444a-8488-5bfb81208588
      JOURNEY_ID: 89cb1ca8-f9cf-488d-ad82-108a37fa4a43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4' 'PyJWT>=2.8,<3' 'cryptography>=42,<46' 'httpx>=0.27,<1'
          npm install --global @railway/cli
      - name: Collect DEV service variables
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service verigence-audit-core --json >/dev/null
          railway variable list --service security --environment dev --json > /tmp/security.json
          railway variable list --service verigence-audit-core --environment dev --json > /tmp/audit.json
          railway variable list --service di-api --environment dev --json > /tmp/di.json
      - name: Exercise exact PC Booking Review read path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, uuid
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          import httpx, jwt, psycopg

          tenant_id = os.environ['TENANT_ID']
          journey_id = os.environ['JOURNEY_ID']

          def load(path):
              return json.loads(Path(path).read_text())

          def pg(value):
              return str(value or '').replace('postgresql+psycopg://', 'postgresql://', 1).replace('postgresql+asyncpg://', 'postgresql://', 1)

          def base(values):
              domain = str(values.get('RAILWAY_PUBLIC_DOMAIN') or values.get('RAILWAY_STATIC_URL') or '').strip()
              if not domain.startswith(('http://', 'https://')):
                  domain = 'https://' + domain
              return domain.rstrip('/')

          security_vars = load('/tmp/security.json')
          audit_vars = load('/tmp/audit.json')
          di_vars = load('/tmp/di.json')

          actor_id = None
          roles = []
          with psycopg.connect(pg(audit_vars.get('DATABASE_URL'))) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      '''
                      SELECT ba.security_actor_id::text, ba.business_role_code
                      FROM auditcore.business_assignments ba
                      JOIN auditcore.journeys j
                        ON j.tenant_id=ba.tenant_id
                       AND j.journey_id=%s
                      WHERE ba.tenant_id=%s
                        AND ba.assignment_status='ACTIVE'
                        AND ba.effective_from <= now()
                        AND (ba.effective_to IS NULL OR ba.effective_to >= now())
                        AND (ba.dealer_id IS NULL OR ba.dealer_id=j.dealer_id)
                        AND (ba.outlet_id IS NULL OR ba.outlet_id=j.outlet_id)
                      ''',
                      (journey_id, tenant_id),
                  )
                  rows = cur.fetchall()
                  roles = sorted({str(row[1]) for row in rows})
                  for candidate, role in rows:
                      if str(role).upper() in {'PC', 'PROCESS_CONSULTANT', 'PROCESS CONSULTANT'}:
                          actor_id = str(candidate)
                          break

          print('ACTIVE_SCOPED_ROLES=' + ','.join(roles))
          if not actor_id:
              raise SystemExit('No active Process Consultant assignment resolved for the target Booking')

          with psycopg.connect(pg(security_vars.get('DATABASE_URL'))) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT status FROM security.users WHERE user_id=%s", (actor_id,))
                  row = cur.fetchone()
                  if not row or str(row[0]).upper() != 'ACTIVE':
                      raise SystemExit('Resolved Process Consultant is not an active Security user')

          now = datetime.now(UTC)
          token = jwt.encode(
              {
                  'iss': str(security_vars.get('SECURITY_TOKEN_ISSUER') or 'verigence-security'),
                  'sub': actor_id,
                  'aud': str(security_vars.get('SECURITY_TOKEN_AUDIENCE') or 'verigence-platform'),
                  'iat': now,
                  'exp': now + timedelta(minutes=8),
                  'jti': str(uuid.uuid4()),
                  'actor_type': 'USER',
              },
              str(security_vars.get('SECURITY_PRIVATE_KEY_PEM') or '').replace('\\n', '\n'),
              algorithm='RS256',
              headers={'kid': str(security_vars.get('SECURITY_KEY_ID') or '')},
          )

          headers = {'Authorization': 'Bearer ' + token}
          audit = base(audit_vars)
          di = base(di_vars)
          context_url = f'{audit}/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/document-upload-context'

          with httpx.Client(timeout=90, follow_redirects=True) as client:
              context_response = client.post(context_url, headers=headers)
              print('AUDIT_CONTEXT_HTTP=' + str(context_response.status_code))
              if context_response.status_code != 200:
                  print('AUDIT_CONTEXT_BODY=' + context_response.text[:1200].replace('\n', ' '))
                  raise SystemExit('Audit Core did not return the PC Booking document context')
              context = context_response.json()
              context_ref = str(context.get('externalContextRef') or '')
              requirements = context.get('requirements') or []
              print('AUDIT_REQUIREMENT_COUNT=' + str(len(requirements)))
              if not context_ref:
                  raise SystemExit('Audit Core returned no externalContextRef')

              list_url = f'{di}/v1/tenants/{tenant_id}/audit-storage-contexts/{context_ref}/pc-booking-documents'
              list_response = client.get(list_url, headers=headers)
              print('DI_DOCUMENT_LIST_HTTP=' + str(list_response.status_code))
              if list_response.status_code != 200:
                  print('DI_DOCUMENT_LIST_BODY=' + list_response.text[:1200].replace('\n', ' '))
                  raise SystemExit('Direct DI Booking document list call failed')
              envelope = list_response.json()
              data = envelope.get('data') or {}
              documents = data.get('documents') or []
              statuses = sorted(str(item.get('processingStatus') or 'UNKNOWN') for item in documents)
              print('DI_DOCUMENT_COUNT=' + str(len(documents)))
              print('DI_PROCESSING_STATUSES=' + ','.join(statuses))
              if not documents:
                  raise SystemExit('Direct DI Booking document list returned no documents for the target Booking')

              processed = next((item for item in documents if str(item.get('processingStatus') or '').upper() == 'PROCESSED'), None)
              if processed:
                  document_id = str(processed.get('documentId') or '')
                  extraction_url = list_url + '/' + document_id + '/extraction-review'
                  extraction_response = client.get(extraction_url, headers=headers)
                  print('DI_EXTRACTION_REVIEW_HTTP=' + str(extraction_response.status_code))
                  if extraction_response.status_code != 200:
                      print('DI_EXTRACTION_REVIEW_BODY=' + extraction_response.text[:1200].replace('\n', ' '))
                      raise SystemExit('Direct DI extraction review call failed')
                  extraction = (extraction_response.json().get('data') or {})
                  print('DI_EXTRACTION_FACT_COUNT=' + str(len(extraction.get('facts') or [])))
              else:
                  print('DI_EXTRACTION_REVIEW_HTTP=SKIPPED_NO_PROCESSED_DOCUMENT')

              review_state_url = f'{audit}/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/direct-document-review'
              review_state_response = client.get(review_state_url, headers=headers)
              print('AUDIT_DIRECT_REVIEW_STATE_HTTP=' + str(review_state_response.status_code))
              if review_state_response.status_code != 200:
                  print('AUDIT_DIRECT_REVIEW_STATE_BODY=' + review_state_response.text[:1200].replace('\n', ' '))
                  raise SystemExit('Audit Core direct review state call failed')
              review_state = review_state_response.json()
              print('AUDIT_ACTIVE_DOCUMENT_COUNT=' + str(review_state.get('activeDocumentCount')))
              print('AUDIT_REVIEWED_DOCUMENT_COUNT=' + str(review_state.get('reviewedDocumentCount')))

          print('PC_BOOKING_DIRECT_DI_LIVE_VALIDATION=PASS')
          PY
