name: TEMP UC03 runtime diagnostic

# sixth push extracts only safe traceback/classification lines around the known failure
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/temp-uc03-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      TARGET_DEPLOYMENT_ID: 1baa3d5d-351e-4e32-bc9d-ea0fa296f1ec
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Extract safe traceback context
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway logs "$TARGET_DEPLOYMENT_ID" --service "$AUDIT_SERVICE" --lines 5000 > /tmp/all.log
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/all.log').read_text(errors='replace').splitlines()
          needles=('ProgrammingError','UndefinedColumn','UndefinedTable','InsufficientPrivilege','permission denied','does not exist','column ','relation ','trigger ','Traceback','File "/app','File "/opt','psycopg.errors','sqlalchemy.exc')
          out=[]
          for i,line in enumerate(lines):
              if '13:44:12' not in line and not any(n.lower() in line.lower() for n in needles):
                  continue
              # Never print parameter-value dumps, auth headers, or bearer material.
              low=line.lower()
              if 'parameters' in low or 'authorization' in low or 'bearer ' in low or 'token=' in low:
                  continue
              out.append(line)
          print('\n'.join(out[-160:]))
          if not any('ProgrammingError' in x for x in out):
              raise SystemExit(2)
          PY
