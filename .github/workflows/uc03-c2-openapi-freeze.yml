name: UC03 C2 OpenAPI Freeze

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/uc03-c2-openapi-freeze.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning/uc-003-booking-delivery-audit
          fetch-depth: 0

      - name: Freeze C2 Delivery contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('api/openapi-v1.yaml')
          text = path.read_text()
          marker = '  # UC03_C2_DELIVERY_CONTRACT\n'
          if marker not in text:
              anchor = '\ncomponents:\n'
              if anchor not in text:
                  raise SystemExit('OpenAPI components anchor not found')
              block = r'''
  # UC03_C2_DELIVERY_CONTRACT
  /tenants/{tenantId}/journeys/{journeyId}/delivery/start:
    post:
      operationId: startUc03Delivery
      description: >-
        Records real Delivery Start using idempotent optimistic concurrency. Booking audit/capture
        incompleteness raises an audit finding but never rejects or suppresses a valid Delivery Start.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Delivery started or idempotently replayed, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/delivery/intimation:
    put:
      operationId: recordUc03DeliveryIntimation
      description: Records whether Delivery was intimated. A No answer requires a reason and raises a non-blocking audit finding.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {type: string, enum: [YES, NO]}
                reason: {type: string, maxLength: 4000}
                intimatedAtUtc: {type: string, format: date-time}
      responses:
        '200': {description: Delivery intimation recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/delivery/vehicle-observation:
    put:
      operationId: recordUc03DeliveryVehicleObservation
      description: >-
        Records observed VIN/chassis evidence and Audit Core reconciliation. Only comparable full
        identifiers are auto-matched or mismatched; ambiguous representations require review.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vin: {type: string, maxLength: 120}
                chassisNumber: {type: string, maxLength: 120}
                sourceEvidenceId: {type: string, format: uuid}
      responses:
        '200': {description: Vehicle observation and reconciliation recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/delivery/complete:
    post:
      operationId: completeUc03Delivery
      description: >-
        Records physical DELIVERY_COMPLETED even when Delivery audit work remains outstanding.
        Audit State and Audit Status remain independent and findings capture unresolved audit gaps.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Physical Delivery completion recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/delivery/workspace:
    get:
      operationId: getUc03DeliveryWorkspace
      description: Returns Delivery business status, independent audit state/status, intimation, vehicle reconciliation, documents, payments and cross-stage flags.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': {description: Delivery workspace, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/stages/DELIVERY/documents:
    get:
      operationId: listUc03DeliveryDocuments
      description: Returns the versioned Delivery document requirement/assessment checklist.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': {description: Delivery document checklist, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
  /tenants/{tenantId}/journeys/{journeyId}/stages/DELIVERY/documents/{requirementKey}:
    put:
      operationId: assessUc03DeliveryDocument
      description: Records Yes, No or Not Applicable for a configured Delivery requirement; audit exceptions do not block dealer operations.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: requirementKey, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {type: string, enum: [YES, NO, NA]}
                evidenceId: {type: string, format: uuid}
                remarks: {type: string, maxLength: 4000}
      responses:
        '200': {description: Delivery document assessment recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/ProblemResponse'}
'''
              text = text.replace(anchor, '\n' + block + anchor, 1)
              path.write_text(text)

          doc = yaml.safe_load(path.read_text())
          required = [
              '/tenants/{tenantId}/journeys/{journeyId}/delivery/start',
              '/tenants/{tenantId}/journeys/{journeyId}/delivery/intimation',
              '/tenants/{tenantId}/journeys/{journeyId}/delivery/vehicle-observation',
              '/tenants/{tenantId}/journeys/{journeyId}/delivery/complete',
              '/tenants/{tenantId}/journeys/{journeyId}/delivery/workspace',
              '/tenants/{tenantId}/journeys/{journeyId}/stages/DELIVERY/documents',
              '/tenants/{tenantId}/journeys/{journeyId}/stages/DELIVERY/documents/{requirementKey}',
          ]
          missing = [p for p in required if p not in doc.get('paths', {})]
          if missing:
              raise SystemExit('Missing frozen C2 path(s): ' + ', '.join(missing))
          print('UC03_C2_OPENAPI_FREEZE=PASS')
          PY

      - name: Commit contract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/uc03-c2-openapi-freeze.yml
          git add api/openapi-v1.yaml
          git commit -m 'docs(uc03): freeze C2 Delivery OpenAPI contract'
          git push origin HEAD:planning/uc-003-booking-delivery-audit
