name: Bind and verify Audit Core Security client

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-client-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-core-security-client-bind
  cancel-in-progress: false

jobs:
  bind-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      AUDIT_CORE_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_CORE_SERVICE_ID: d8fb0a34-9097-40ba-b47c-ac3f82b7a3dd
      SECURITY_BIND_TENANT_ID: dev-auth-test
      SECURITY_BIND_CLIENT_ID: audit-core

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Audit Core runtime and Railway CLI
        run: |
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Verify project token context
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_API_TOKEN railway status --json > /tmp/status.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/status.json').read_text())
          if data.get('id') != os.environ['AUDIT_CORE_PROJECT_ID']:
              raise SystemExit(f"Unexpected Railway project: {data.get('name')} | {data.get('id')}")
          print(f"Audit Core Railway project: {data.get('name')} | {data.get('id')}")
          PY

      - name: Bootstrap managed Audit Core OAuth client material
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          service="$AUDIT_CORE_SERVICE_ID"

          security_base="$(env -u RAILWAY_API_TOKEN railway run --service "$service" --no-local \
            python -c 'import os; print(os.environ.get("SECURITY_BASE_URL", "").strip())')"
          if [[ -z "$security_base" ]]; then
            echo "SECURITY_BASE_URL is not configured in Audit Core Railway" >&2
            exit 1
          fi
          token_url="${security_base%/}/oauth/token"

          set_variable() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | env -u RAILWAY_API_TOKEN railway variable set "$name" \
              --service "$service" --stdin --skip-deploys >/dev/null
          }

          set_variable SECURITY_CLIENT_ID "$SECURITY_BIND_CLIENT_ID"
          set_variable SECURITY_TOKEN_URL "$token_url"

          secret_present="$(env -u RAILWAY_API_TOKEN railway run --service "$service" --no-local \
            python -c 'import os; print("yes" if os.environ.get("SECURITY_CLIENT_SECRET") else "no")')"
          if [[ "$secret_present" != "yes" ]]; then
            client_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "::add-mask::$client_secret"
            set_variable SECURITY_CLIENT_SECRET "$client_secret"
            secret_hash="$(CLIENT_SECRET="$client_secret" python -c 'import hashlib,os; print(hashlib.sha256(os.environ["CLIENT_SECRET"].encode()).hexdigest())')"
            unset client_secret
            echo "Generated a new managed Audit Core OAuth client secret in Railway"
          else
            secret_hash="$(env -u RAILWAY_API_TOKEN railway run --service "$service" --no-local python - <<'PY'
          import hashlib
          import os
          secret = os.environ['SECURITY_CLIENT_SECRET']
          print(hashlib.sha256(secret.encode()).hexdigest())
          PY
          )"
            echo "Reused the existing managed Audit Core OAuth client secret in Railway"
          fi

          echo "AUDIT_CORE_CLIENT_ID=$SECURITY_BIND_CLIENT_ID"
          echo "AUDIT_CORE_CLIENT_SECRET_SHA256=$secret_hash"
          echo "secret_sha256=$secret_hash" >> "$GITHUB_OUTPUT"

      - name: Verify real SERVICE issuance and delegated path with Audit Core identity
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_API_TOKEN railway run --service "$AUDIT_CORE_SERVICE_ID" --no-local python - <<'PY'
          import os

          import httpx
          import jwt

          from audit_core.security_integration import SecurityOAuthClient, SecurityTokenError

          base_url = os.environ['SECURITY_BASE_URL'].rstrip('/')
          client_id = os.environ['SECURITY_CLIENT_ID']
          client_secret = os.environ['SECURITY_CLIENT_SECRET']
          tenant_id = os.environ['SECURITY_BIND_TENANT_ID']

          with SecurityOAuthClient(
              base_url=base_url,
              client_id=client_id,
              client_secret=client_secret,
              timeout_seconds=15.0,
          ) as security:
              service_token = security.get_service_token(
                  tenant_id=tenant_id,
                  permissions=['di.document.read'],
              )

              try:
                  security.exchange_user_token(
                      subject_token=service_token,
                      permissions=['di.document.upload'],
                  )
              except SecurityTokenError as exc:
                  if 'invalid_grant' not in str(exc):
                      raise
                  print('AUDIT_CORE_REAL_DELEGATED_PATH_FAIL_CLOSED=PASS')
              else:
                  raise SystemExit('Security incorrectly accepted a SERVICE token as delegated USER input')

          with httpx.Client(timeout=15.0) as client:
              jwks_response = client.get(base_url + '/.well-known/jwks.json')
              jwks_response.raise_for_status()
              jwks = jwks_response.json()

          header = jwt.get_unverified_header(service_token)
          jwk = next(item for item in jwks['keys'] if item['kid'] == header['kid'])
          key = jwt.PyJWK.from_dict(jwk).key
          claims = jwt.decode(
              service_token,
              key,
              algorithms=['RS256'],
              audience='verigence-platform',
              issuer='verigence-security',
          )
          assert claims['sub'] == client_id == 'audit-core'
          assert claims['tenant_id'] == tenant_id
          assert claims['actor_type'] == 'SERVICE'
          assert claims['permissions'] == ['di.document.read']
          print('AUDIT_CORE_REAL_SERVICE_TOKEN=PASS')
          print('AUDIT_CORE_SECURITY_CLIENT_BINDING=PASS')
          PY
