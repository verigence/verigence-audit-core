name: Guarded UC02 MahindraWest Audit Core cleanup

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  cleanup-six-mahindrawest-operations:
    if: github.event.pull_request.head.ref == 'cleanup/uc02-mahindrawest-duplicates'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e .
          npm install --global @railway/cli
      - name: Resolve DEV database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/vars.json').read_text())
          url=str(data.get('DATABASE_URL') or '').strip()
          if not url:
              raise SystemExit('Audit Core DEV DATABASE_URL missing')
          Path('/tmp/db').write_text(url)
          PY
      - name: Delete and verify exactly six failed duplicate operations
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$(cat /tmp/db)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine=create_engine(os.environ['DATABASE_URL'])
          with engine.begin() as connection:
              rows=connection.execute(text("""
                  SELECT operation_id,status,current_step,audit_core_receipt,di_receipt
                  FROM auditcore.administrative_operations
                  WHERE operation_type='PROJECT_PROVISION'
                    AND safe_request_summary->>'projectName'=:n
                  ORDER BY created_at_utc,operation_id
              """), {'n':'MahindraWest'}).mappings().all()
              if len(rows)!=6:
                  raise SystemExit(f'guard expected 6 operations, found {len(rows)}')
              for row in rows:
                  if str(row['status'])!='RECOVERY_REQUIRED' or str(row['current_step'])!='SECURITY':
                      raise SystemExit('guard requires all six operations to be Security-step RECOVERY_REQUIRED')
                  if row['audit_core_receipt'] is not None or row['di_receipt'] is not None:
                      raise SystemExit('guard found downstream durable state')
              project_count=int(connection.execute(text("SELECT count(*) FROM auditcore.projects WHERE project_name=:n"), {'n':'MahindraWest'}).scalar_one())
              if project_count!=0:
                  raise SystemExit(f'guard found {project_count} MahindraWest Project rows')
              ids=[str(r['operation_id']) for r in rows]
              deleted=connection.execute(text("DELETE FROM auditcore.administrative_operations WHERE operation_id = ANY(CAST(:ids AS uuid[]))"), {'ids':ids}).rowcount
              if int(deleted)!=6:
                  raise SystemExit(f'verification expected 6 deletes, got {deleted}')
          with engine.connect() as connection:
              remaining=int(connection.execute(text("SELECT count(*) FROM auditcore.administrative_operations WHERE operation_type='PROJECT_PROVISION' AND safe_request_summary->>'projectName'=:n"), {'n':'MahindraWest'}).scalar_one())
              if remaining!=0:
                  raise SystemExit(f'verification failed: {remaining} operations remain')
          engine.dispose()
          print('CLEANUP_RESULT=6_DELETED_0_REMAINING')
          PY
