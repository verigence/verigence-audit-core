name: Figures check (live bookings, read only)

# What a change moves on real bookings before it is merged (product owner
# 2026-11-17): the base branch's code and this pull request's code each build the
# Deal, Payments and Audit Summary and run every audit check, read only, on the
# verified bookings and a fixed sample of delivered bookings of the live Project.
# The difference is posted on the pull request. It reports; it does not block
# (product owner: "go live and report").

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Code to compare against
        default: dev
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: figures-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      # The live Project (Mahindra Orissa).
      FIGURES_TENANT: afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572
      APP_ENV: ci
    steps:
      - name: Check out this change
        uses: actions/checkout@v4
        with:
          path: head
      - name: Check out the base
        if: ${{ matrix.side == 'base' }}
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'dev' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the code to compare
        run: |
          python -m pip install "./${{ matrix.side }}" 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database (read only from here on)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN:-}"
          cd head
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "FIGURES_DATABASE_URL=$url" >> "$GITHUB_ENV"
      # The same bookings on both sides: the pick is made from the database, the same at both moments
      # (a booking verified in between is compared on the side that saw it only and left out).
      - name: Pick the bookings
        run: python head/tools/figures_check.py pick --tenant "$FIGURES_TENANT" --out /tmp/bookings.json --sample 40
      - name: Capture
        run: python head/tools/figures_check.py capture --tenant "$FIGURES_TENANT" --bookings /tmp/bookings.json --out "/tmp/${{ matrix.side }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: figures-${{ matrix.side }}
          path: |
            /tmp/${{ matrix.side }}.json
            /tmp/bookings.json
          retention-days: 7

  compare:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this change
        uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install ./head
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/figures
      - name: Compare
        run: |
          python head/tools/figures_check.py diff /tmp/figures/figures-base/base.json /tmp/figures/figures-head/head.json \
            --bookings /tmp/figures/figures-head/bookings.json --out /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post on the pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@/tmp/report.md >/dev/null
