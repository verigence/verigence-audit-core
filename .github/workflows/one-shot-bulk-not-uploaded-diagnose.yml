name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Utkal delivery dumps compared, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg, json, collections
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=60000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              dumps = c.execute("""SELECT u.dump_id, u.file_name, u.file_format, u.sheet_name, u.status, u.business_date,
                    u.period_month, u.row_count, to_char(u.uploaded_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI'),
                    (SELECT count(*) FROM auditcore.p2_dms_dump_rows r WHERE r.tenant_id=u.tenant_id AND r.dump_id=u.dump_id AND r.event_date IS NULL)
                  FROM auditcore.p2_dms_dumps u JOIN auditcore.dealers d ON d.tenant_id=u.tenant_id AND d.dealer_id=u.dealer_id
                  WHERE u.tenant_id=%s AND d.dealer_name='Utkal Mahindra' AND u.dump_kind='DELIVERY'
                  ORDER BY u.uploaded_at_utc DESC LIMIT 6""", (t,)).fetchall()
              for d in dumps:
                  print("DUMP", d[1:])
                  keys = collections.Counter()
                  for (raw,) in c.execute("SELECT raw FROM auditcore.p2_dms_dump_rows WHERE tenant_id=%s AND dump_id=%s", (t, d[0])):
                      keys.update((raw or {}).keys())
                  print("   KEYS", dict(keys))
                  for col in ("DELIVERY DATE", "DATE OF DELIVERY", "DATE", "TIMESTAMP", "BOOKING DATE"):
                      vals = collections.Counter()
                      for (v,) in c.execute("SELECT raw->>%s FROM auditcore.p2_dms_dump_rows WHERE tenant_id=%s AND dump_id=%s", (col, t, d[0])):
                          vals[(v or "<none>")[:19]] += 1
                      if set(vals) != {"<none>"}:
                          print("   VALUES", col, vals.most_common(8), "distinct", len(vals))
                  ev = c.execute("SELECT min(event_date), max(event_date), count(event_date) FROM auditcore.p2_dms_dump_rows WHERE tenant_id=%s AND dump_id=%s", (t, d[0])).fetchone()
                  print("   EVENT_DATE", ev)
          PY
