name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Banita Sasmal — insurance type, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, json, psycopg
          class Safe:
              def __init__(self, conn): self.conn = conn
              def execute(self, sql, params=None):
                  try:
                      return list(self.conn.execute(sql, params))
                  except Exception as exc:
                      print("QUERYERR", type(exc).__name__, str(exc).splitlines()[0][:200])
                      return []
          with psycopg.connect(os.environ["DB"], autocommit=True, options="-c statement_timeout=120000 -c default_transaction_read_only=on") as raw:
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              raw.execute("SELECT set_config('app.tenant_id', %s, false)", (t,))
              c = Safe(raw)
              jcols = [r[0] for r in c.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='auditcore' AND table_name='journeys'")]
              namecol = next((x for x in ("customer_name", "customer_display_name") if x in jcols), None)
              ids = set()
              if namecol:
                  ids |= {r[0] for r in c.execute(f"SELECT journey_id FROM auditcore.journeys WHERE tenant_id=%s AND {namecol} ILIKE '%%BANITA%%' AND {namecol} ILIKE '%%SASMAL%%'", (t,))}
              ids |= {r[0] for r in c.execute("""SELECT DISTINCT journey_id FROM auditcore.journey_document_extracted_fields WHERE tenant_id=%s
                   AND field_key IN ('customer_name','insured_name','buyer_name') AND effective_value #>> '{}' ILIKE '%%BANITA%%' AND effective_value #>> '{}' ILIKE '%%SASMAL%%'""", (t,))}
              print("JOURNEYS", len(ids))
              for j in ids:
                  r = (c.execute(f"SELECT journey_reference, {namecol or 'NULL'}, dealer_id FROM auditcore.journeys WHERE tenant_id=%s AND journey_id=%s", (t, j)) or [(None, None, None)])[0]
                  print("\n==== JOURNEY", j, r)
                  ccols = [x[0] for x in c.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='auditcore' AND table_name='journey_classifications' AND column_name LIKE 'insurance%%'")]
                  rows = c.execute(f"SELECT {', '.join(ccols)} FROM auditcore.journey_classifications WHERE tenant_id=%s AND journey_id=%s", (t, j))
                  print("CLASS", dict(zip(ccols, rows[0])) if rows else None)
                  icols = [x[0] for x in c.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='auditcore' AND table_name='insurance_records' ORDER BY ordinal_position")]
                  for row in c.execute("SELECT * FROM auditcore.insurance_records WHERE tenant_id=%s AND journey_id=%s", (t, j)):
                      print("INSREC", {k: str(v)[:120] for k, v in zip(icols, row) if v is not None and k not in ('tenant_id',)})
                  for row in c.execute("""SELECT document_type_key, association_status, di_document_id FROM auditcore.evidence WHERE tenant_id=%s AND journey_id=%s
                       ORDER BY document_type_key""", (t, j)):
                      print("EVID", row)
                  for row in c.execute("""SELECT e.document_type_key, f.field_key, left(f.effective_value #>> '{}', 160), f.confidence
                       FROM auditcore.journey_document_extracted_fields f JOIN auditcore.evidence e ON e.tenant_id=f.tenant_id AND e.journey_id=f.journey_id
                         AND e.di_document_id=f.di_document_id AND e.association_status='ACTIVE'
                       WHERE f.tenant_id=%s AND f.journey_id=%s AND (e.document_type_key ILIKE '%%insur%%' OR e.document_type_key ILIKE '%%policy%%'
                         OR f.field_key ~* 'insur|policy|misp|agent|premium|cover|idv|add_on|addon|zero|nil_dep|od_|tp_')
                       ORDER BY 1,2""", (t, j)):
                      print("FIELD", row)
                  for row in c.execute("""SELECT e.document_type_key, f.effective_value FROM auditcore.journey_document_extracted_fields f
                       JOIN auditcore.evidence e ON e.tenant_id=f.tenant_id AND e.journey_id=f.journey_id AND e.di_document_id=f.di_document_id AND e.association_status='ACTIVE'
                       WHERE f.tenant_id=%s AND f.journey_id=%s AND f.field_key='line_items'""", (t, j)):
                      items = row[1] if isinstance(row[1], list) else []
                      for it in items:
                          if isinstance(it, dict) and 'INSUR' in json.dumps(it).upper():
                              print("LINE", row[0], json.dumps(it)[:300])
                  for row in c.execute("""SELECT task_type, task_status, left(coalesce(title,''),120) FROM auditcore.p2_tasks WHERE tenant_id=%s AND journey_id=%s
                       AND (task_type ILIKE '%%INSUR%%' OR title ILIKE '%%insur%%')""", (t, j)):
                      print("TASK", row)
                  for row in c.execute("""SELECT d.policy_number, d.insurer, d.misp_code, d.dealer_id, u.status FROM auditcore.p2_insurance_dump_rows d
                       JOIN auditcore.p2_insurance_dumps u ON u.tenant_id=d.tenant_id AND u.dump_id=d.dump_id WHERE d.tenant_id=%s AND d.journey_id=%s""", (t, j)):
                      print("DUMP", row)
                  for row in c.execute("""SELECT field_key, left(coalesce(old_value::text,''),80), left(coalesce(new_value::text,''),80), change_reason, changed_at_utc
                       FROM auditcore.journey_field_change_log WHERE tenant_id=%s AND journey_id=%s AND field_key ~* 'insur|policy|misp|agent'
                       ORDER BY changed_at_utc""", (t, j)):
                      print("CHANGE", row)
                  print("DEALERCODES", c.execute("SELECT normalized_code FROM auditcore.dealer_insurance_codes WHERE tenant_id=%s AND dealer_id=%s", (t, r[2])))
          PY
