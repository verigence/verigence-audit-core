name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: All dealers' dumps profile, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=120000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              tenants = [r[0] for r in c.execute("SELECT DISTINCT tenant_id FROM auditcore.tenant_rule_config")]
              for t in tenants:
                  c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
                  for r in c.execute("""SELECT d.dealer_name, u.dump_kind, u.file_format, count(DISTINCT u.dump_id) dumps,
                        count(*) rows_, round(100.0*count(*) FILTER (WHERE r.event_date IS NULL)/count(*),1) pct_no_date,
                        round(100.0*count(*) FILTER (WHERE r.outlet_label IS NULL)/count(*),1) pct_no_label,
                        count(*) FILTER (WHERE r.event_date < DATE '2000-01-01') bad_year,
                        count(*) FILTER (WHERE r.booking_date > r.event_date) booked_after,
                        count(*) FILTER (WHERE r.dump_kind='DELIVERY' AND r.booking_date IS NULL) no_bdate,
                        min(u.business_date), max(u.business_date)
                      FROM auditcore.p2_dms_dumps u JOIN auditcore.p2_dms_dump_rows r ON r.tenant_id=u.tenant_id AND r.dump_id=u.dump_id
                      JOIN auditcore.dealers d ON d.tenant_id=u.tenant_id AND d.dealer_id=u.dealer_id
                      WHERE u.tenant_id=%s GROUP BY 1,2,3 ORDER BY 1,2,3""", (t,)):
                      print("PROFILE", t[:8], r)
                  for r in c.execute("""SELECT d.dealer_name, u.file_name, u.status, u.business_date, u.row_count,
                        count(*) FILTER (WHERE r.event_date IS NULL) no_date, count(*) FILTER (WHERE r.outlet_label IS NULL) no_label
                      FROM auditcore.p2_dms_dumps u JOIN auditcore.p2_dms_dump_rows r ON r.tenant_id=u.tenant_id AND r.dump_id=u.dump_id
                      JOIN auditcore.dealers d ON d.tenant_id=u.tenant_id AND d.dealer_id=u.dealer_id
                      WHERE u.tenant_id=%s GROUP BY 1,2,3,4,5
                      HAVING count(*) FILTER (WHERE r.event_date IS NULL) > 0 OR count(*) FILTER (WHERE r.outlet_label IS NULL) > 0
                      ORDER BY 4""", (t,)):
                      print("GAPS", t[:8], r)
                  for r in c.execute("""SELECT d.dealer_name, count(*) FROM auditcore.dealer_outlets o JOIN auditcore.dealers d
                      ON d.tenant_id=o.tenant_id AND d.dealer_id=o.dealer_id WHERE o.tenant_id=%s GROUP BY 1""", (t,)):
                      print("OUTLETS", t[:8], r)
          PY
