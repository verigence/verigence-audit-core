name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: After the Drive storage change (PR 971), read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], autocommit=True, options="-c statement_timeout=120000 -c default_transaction_read_only=on") as c:
              print("ALEMBIC", list(c.execute("SELECT version_num FROM public.alembic_version")))
              print("FILECOLS", [r[0] for r in c.execute("""SELECT column_name FROM information_schema.columns WHERE table_schema='auditcore'
                  AND table_name='p2_drive_files' AND column_name IN ('owner_email','gone_from_drive_at_utc','drive_checked_at_utc','handed_over_at_utc','handover_error')""")])
              print("PEOPLECOLS", [r[0] for r in c.execute("""SELECT column_name FROM information_schema.columns WHERE table_schema='auditcore'
                  AND table_name='p2_drive_people' AND column_name IN ('refresh_token_sealed','linked_google_email','link_status')""")])
              for t, in list(c.execute("SELECT tenant_id FROM auditcore.p2_drive_connections")):
                  c.execute("SELECT set_config('app.tenant_id', %s, false)", (t,))
                  print("STATE", t, list(c.execute("""SELECT count(*) FILTER (WHERE owner_email IS NOT NULL), count(*) FILTER (WHERE handed_over_at_utc IS NOT NULL),
                      count(*) FROM auditcore.p2_drive_files WHERE tenant_id=%s""", (t,))),
                      list(c.execute("SELECT count(*) FILTER (WHERE link_status='LINKED') FROM auditcore.p2_drive_people WHERE tenant_id=%s", (t,))))
          PY
