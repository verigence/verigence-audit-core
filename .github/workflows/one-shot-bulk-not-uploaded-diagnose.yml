name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Mancheswar not-received bookings, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          mobiles = ['9437100895', '9861085546', '7988166504', '6371500265', '8847871001']
          names = ['MAHESWAR ROUT', 'BABUL RAY', 'Sambit Swarup Sahani', 'Santosh Kumar Choudhury', 'Chitta Ranjan Patra']
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=120000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              for r in c.execute("""SELECT d.dealer_name, u.file_name, u.status, u.business_date, to_char(u.uploaded_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI'),
                    r.row_no, r.customer_name, r.mobile, r.event_date, r.outlet_label, r.booking_number, r.dms_booking_number, r.model,
                    r.outcome, r.match_basis, r.journey_id
                  FROM auditcore.p2_dms_dump_rows r JOIN auditcore.p2_dms_dumps u ON u.tenant_id=r.tenant_id AND u.dump_id=r.dump_id
                  JOIN auditcore.dealers d ON d.tenant_id=u.tenant_id AND d.dealer_id=u.dealer_id
                  WHERE r.tenant_id=%s AND r.dump_kind='BOOKING'
                    AND (regexp_replace(coalesce(r.mobile,''),'\D','','g') = ANY(%s) OR r.customer_name ILIKE ANY(%s))
                  ORDER BY r.customer_name, u.business_date""", (t, mobiles, ['%' + n.split()[-1] + '%' + '' for n in names][:0] + ['%MAHESWAR ROUT%', '%BABUL RAY%', '%Sambit Swarup%', '%Santosh Kumar Choudhury%', '%Chitta Ranjan Patra%'])):
                  print("ROW", r)
              for r in c.execute("""SELECT customer_name, dump_kind, outlet_label, event_date, claimed_by_name,
                    to_char(claimed_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI'), withdrawn_at_utc, row_key
                  FROM auditcore.p2_dms_intimations WHERE tenant_id=%s AND customer_name ILIKE ANY(%s)""",
                  (t, ['%MAHESWAR ROUT%', '%BABUL RAY%', '%Sambit Swarup%', '%Santosh Kumar Choudhury%', '%Chitta Ranjan Patra%'])):
                  print("INTIMATION", r)
              jids = [r[0] for r in c.execute("""SELECT DISTINCT r.journey_id FROM auditcore.p2_dms_dump_rows r
                  WHERE r.tenant_id=%s AND r.journey_id IS NOT NULL AND r.dump_kind='BOOKING'
                    AND regexp_replace(coalesce(r.mobile,''),'\D','','g') = ANY(%s)""", (t, mobiles))]
              cols = [x[0] for x in c.execute("""SELECT column_name FROM information_schema.columns WHERE table_schema='auditcore' AND table_name='journeys'""")]
              want = [x for x in ("journey_id","customer_name","display_name","otf_number","booking_number","outlet_id","stage","status","created_at_utc","created_by_name","deleted_at_utc") if x in cols]
              for j in jids:
                  row = c.execute(f"SELECT {', '.join(want)} FROM auditcore.journeys WHERE tenant_id=%s AND journey_id=%s", (t, j)).fetchone()
                  print("JOURNEY", dict(zip(want, row)) if row else (j, "not found"))
                  print("   DOCS", c.execute("SELECT count(*) FROM auditcore.p2_upload_batches WHERE tenant_id=%s AND journey_id=%s", (t, j)).fetchone())
              for r in c.execute("""SELECT report_date, to_char(generated_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI'), generated_by_name,
                    position('MAHESWAR' in upper(report::text))>0, position('CHITTA RANJAN' in upper(report::text))>0
                  FROM auditcore.p2_dms_reports WHERE tenant_id=%s ORDER BY generated_at_utc DESC LIMIT 6""", (t,)):
                  print("REPORT", r)
          PY
