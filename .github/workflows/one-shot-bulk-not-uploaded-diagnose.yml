name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Drive files per PC, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], autocommit=True, options="-c statement_timeout=180000 -c default_transaction_read_only=on") as c:
              for t, in list(c.execute("SELECT tenant_id FROM auditcore.p2_drive_connections")):
                  c.execute("SELECT set_config('app.tenant_id', %s, false)", (t,))
                  print("TENANT", t, list(c.execute("SELECT google_email, created_at_utc FROM auditcore.p2_drive_connections WHERE tenant_id=%s", (t,))))
                  print("PEOPLE", list(c.execute("SELECT count(*), min(asked_at_utc) FROM auditcore.p2_drive_people WHERE tenant_id=%s", (t,))))
                  for r in c.execute("""SELECT coalesce(p.google_email, f.pc_actor_id, '-') who, f.file_status, f.lane, count(*), round(sum(f.size_bytes)/1048576.0) mb,
                        min(f.upload_date), max(f.upload_date)
                      FROM auditcore.p2_drive_files f LEFT JOIN auditcore.p2_drive_people p ON p.tenant_id=f.tenant_id AND p.actor_id=f.pc_actor_id
                      WHERE f.tenant_id=%s GROUP BY 1,2,3 ORDER BY 1,2,3""", (t,)):
                      print("PC", r)
                  print("TOTAL", list(c.execute("SELECT count(*), round(sum(size_bytes)/1048576.0) FROM auditcore.p2_drive_files WHERE tenant_id=%s", (t,))))
          PY
