name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Weak booking matches sized, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg, collections
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=180000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              for (t,) in c.execute("SELECT DISTINCT tenant_id FROM auditcore.tenant_rule_config").fetchall():
                  c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
                  # The newest active booking dump per dealer: its matched rows by basis, with the gap
                  # between the DMS booking date and the journey's own booking date, and whether the
                  # journey's own OTF is another row (cancelled or not) of that dump.
                  rows = c.execute("""
                    WITH latest AS (
                      SELECT DISTINCT ON (dealer_id) dump_id, dealer_id FROM auditcore.p2_dms_dumps
                      WHERE tenant_id=%s AND status='ACTIVE' AND dump_kind='BOOKING' ORDER BY dealer_id, business_date DESC, uploaded_at_utc DESC)
                    SELECT d.dealer_name, r.match_basis, r.customer_name, r.event_date, r.booking_number, b.booking_date AS j_date,
                           b.booking_reference, COALESCE(NULLIF(cu.legal_name,''), cu.display_name) AS j_name,
                           EXISTS (SELECT 1 FROM auditcore.p2_dms_dump_rows o WHERE o.tenant_id=r.tenant_id AND o.dump_id=r.dump_id
                                   AND o.row_no<>r.row_no AND o.outcome='CANCELLED'
                                   AND regexp_replace(o.mobile,'\D','','g')=regexp_replace(r.mobile,'\D','','g')) AS cancelled_same_mobile
                    FROM latest l JOIN auditcore.p2_dms_dump_rows r ON r.tenant_id=%s AND r.dump_id=l.dump_id
                    JOIN auditcore.dealers d ON d.tenant_id=r.tenant_id AND d.dealer_id=l.dealer_id
                    LEFT JOIN auditcore.journeys j ON j.tenant_id=r.tenant_id AND j.journey_id=r.journey_id
                    LEFT JOIN auditcore.customers cu ON cu.tenant_id=j.tenant_id AND cu.customer_id=j.customer_id
                    LEFT JOIN auditcore.bookings b ON b.tenant_id=j.tenant_id AND b.journey_id=j.journey_id
                    WHERE r.outcome='MATCHED'""", (t, t)).fetchall()
                  if not rows: continue
                  print("TENANT", t[:8], "matched", len(rows), dict(collections.Counter(r[1] for r in rows)))
                  for basis in ("MOBILE", "NAME_MODEL", "NAME_NEAR_ID", "NAME_DATE"):
                      gaps = collections.Counter()
                      for r in rows:
                          if r[1] != basis: continue
                          g = "no j_date" if not (r[3] and r[5]) else abs((r[3]-r[5]).days)
                          gaps["none" if g == "no j_date" else "0-2" if g<=2 else "3-7" if g<=7 else "8-15" if g<=15 else "16-30" if g<=30 else ">30"] += 1
                      if gaps: print("  GAPS", basis, dict(gaps))
                  for r in rows:
                      if r[1] in ("MOBILE", "NAME_MODEL", "NAME_NEAR_ID") and ((r[3] and r[5] and abs((r[3]-r[5]).days) > 7) or r[8]):
                          print("  SUSPECT", r[0], r[1], "| DMS:", r[2], r[3], r[4], "| journey:", r[7], r[5], r[6], "| DMS cancelled same mobile:", r[8])
          PY
