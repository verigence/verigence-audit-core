name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Banita Sasmal — insurance sources, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, json, psycopg
          class Safe:
              def __init__(self, conn): self.conn = conn
              def execute(self, sql, params=None):
                  try:
                      return list(self.conn.execute(sql, params))
                  except Exception as exc:
                      print("QUERYERR", type(exc).__name__, str(exc).splitlines()[0][:200]); return []
          with psycopg.connect(os.environ["DB"], autocommit=True, options="-c statement_timeout=120000 -c default_transaction_read_only=on") as raw:
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'; j = '93b5ad09-3b2a-4dda-a313-9ede8ec61ced'
              raw.execute("SELECT set_config('app.tenant_id', %s, false)", (t,))
              c = Safe(raw)
              for k in ("misp_code", "agent_intermediary_code", "agent_intermediary_name", "insurance_source", "insurance_by",
                        "insurance_source_set_at_utc", "policy_type", "cover_type", "actual_premium_amount", "updated_at_utc"):
                  print("INSREC", k, c.execute(f"SELECT {k} FROM auditcore.insurance_records WHERE tenant_id=%s AND journey_id=%s", (t, j)))
              for r in c.execute("""SELECT s.line_kind, s.component_key, s.source_document_type, s.amount, s.source_document_id, s.updated_at_utc,
                       (SELECT e.association_status FROM auditcore.evidence e WHERE e.tenant_id=s.tenant_id AND e.evidence_id=s.source_evidence_id)
                  FROM auditcore.commercial_line_source_values s WHERE s.tenant_id=%s AND s.journey_id=%s AND s.component_key ILIKE '%%insur%%'
                  ORDER BY s.updated_at_utc""", (t, j)):
                  print("SRC", r)
              for r in c.execute("""SELECT e.document_type_key, e.di_document_id, f.field_key, left(f.effective_value #>> '{}', 200)
                  FROM auditcore.journey_document_extracted_fields f JOIN auditcore.evidence e ON e.tenant_id=f.tenant_id AND e.journey_id=f.journey_id
                    AND e.di_document_id=f.di_document_id AND e.association_status='ACTIVE'
                  WHERE f.tenant_id=%s AND f.journey_id=%s AND (e.document_type_key='insurance_cover'
                    OR f.field_key ~* 'insur|misp|agent|premium|document_title|statement_date|ledger_date|quotation|valid')
                  ORDER BY 1,2,3""", (t, j)):
                  print("FIELD", r)
              for r in c.execute("""SELECT e.document_type_key, e.di_document_id, f.effective_value FROM auditcore.journey_document_extracted_fields f
                  JOIN auditcore.evidence e ON e.tenant_id=f.tenant_id AND e.journey_id=f.journey_id AND e.di_document_id=f.di_document_id AND e.association_status='ACTIVE'
                  WHERE f.tenant_id=%s AND f.journey_id=%s AND f.field_key='line_items' AND e.document_type_key IN ('cost_sheet','customer_ledger')""", (t, j)):
                  items = r[2] if isinstance(r[2], list) else []
                  print("ITEMS", r[0], r[1], len(items))
                  for it in items:
                      if isinstance(it, dict) and 'INSUR' in json.dumps(it).upper():
                          print("   LINE", json.dumps(it)[:300])
          PY
