name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Effects of the 24 Nov Utkal delivery dump, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=60000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              base = """FROM auditcore.p2_dms_dump_rows r JOIN auditcore.p2_dms_dumps u ON u.tenant_id=r.tenant_id AND u.dump_id=r.dump_id
                  JOIN auditcore.dealers d ON d.tenant_id=u.tenant_id AND d.dealer_id=u.dealer_id
                  WHERE r.tenant_id=%s AND d.dealer_name='Utkal Mahindra' AND u.dump_kind='DELIVERY'"""
              for r in c.execute(f"""SELECT u.file_name, count(*) FILTER (WHERE r.outlet_label IS NULL) no_label,
                    count(*) FILTER (WHERE r.outlet_id IS NULL) no_outlet, count(*) FILTER (WHERE r.journey_id IS NOT NULL) matched, count(*)
                  {base} AND u.status='ACTIVE' AND u.business_date >= DATE '2026-11-23' GROUP BY 1 ORDER BY 1""", (t,)):
                  print("EFFECT", r)
              for r in c.execute(f"""SELECT r.outcome, count(*) {base} AND u.file_name LIKE 'ALL BRANCH DELIVERY SHEET 24.11.26%%' GROUP BY 1""", (t,)):
                  print("OUTCOME", r)
              for r in c.execute(f"""SELECT u.file_name, r.row_no, r.event_date, r.raw->>'DELIVERY DATE', r.raw->>'TIMESTAMP', r.raw->>'BOOKING DATE'
                  {base} AND u.status='ACTIVE' AND r.event_date < DATE '2026-09-01' ORDER BY 1,2""", (t,)):
                  print("ODD", r)
              for r in c.execute(f"""SELECT u.file_name, count(*) {base} AND u.status='ACTIVE' AND r.booking_date > r.event_date GROUP BY 1""", (t,)):
                  print("BOOKED_AFTER_DELIVERY", r)
              for r in c.execute(f"""SELECT r.row_no, r.raw->>'CUSTOMER NAME', r.raw->>'BOOKING DATE', r.raw->>'DELIVERY DATE', r.raw->>'TIMESTAMP'
                  {base} AND u.file_name LIKE 'ALL BRANCH DELIVERY SHEET 24.11.26%%'
                  AND (r.raw->>'BOOKING DATE') > (r.raw->>'DELIVERY DATE') ORDER BY 1 LIMIT 5""", (t,)):
                  print("TODAY_BOOKED_AFTER", r)
          PY
