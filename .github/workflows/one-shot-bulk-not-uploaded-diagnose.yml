name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Booking day gaps on two-thing matches, read-only
        shell: bash
        run: |
          git fetch -q --depth=1 origin claude/dms-booking-match-ladder && git checkout -q FETCH_HEAD -- src pyproject.toml
          python -m pip install -q -e . 2>&1 | tail -1
          python - <<'PY'
          import os, json
          from sqlalchemy import create_engine, text
          from audit_core import uc03_p2_dms_dumps as m
          from audit_core.uc03_p2_dates import parse_extracted_date
          from audit_core.uc03_p2_dms_field_sync import _COPIES_SQL, BOOKING_DOCS
          engine = create_engine(os.environ["DB"].replace("postgresql://", "postgresql+psycopg://", 1))
          t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
          out = []
          with engine.connect() as c:
              tx = c.begin()
              c.execute(text("SET TRANSACTION READ ONLY"))
              c.execute(text("SELECT set_config('app.tenant_id', :t, true)"), {"t": t})
              dumps = c.execute(text("""SELECT DISTINCT ON (u.dealer_id) u.dump_id, d.dealer_name, u.business_date, u.file_name FROM auditcore.p2_dms_dumps u
                  JOIN auditcore.dealers d ON d.tenant_id=u.tenant_id AND d.dealer_id=u.dealer_id
                  WHERE u.tenant_id=:t AND u.status='ACTIVE' AND u.dump_kind='BOOKING' ORDER BY u.dealer_id, u.business_date DESC, u.uploaded_at_utc DESC"""), {"t": t}).all()
              journeys = {str(r[0]): (r[1], r[2]) for r in c.execute(text("""SELECT j.journey_id, j.journey_reference, o.outlet_name FROM auditcore.journeys j
                  LEFT JOIN auditcore.dealer_outlets o ON o.tenant_id=j.tenant_id AND o.outlet_id=j.outlet_id WHERE j.tenant_id=:t"""), {"t": t})}
              for dump_id, dealer, bdate, fname in dumps:
                  rows = {r.row_no: r for r in c.execute(text("SELECT * FROM auditcore.p2_dms_dump_rows WHERE tenant_id=:t AND dump_id=:d"), {"t": t, "d": dump_id})}
                  plan = m.plan_dump(c, tenant_id=t, dump_id=dump_id)
                  pairs = [(u, rows[u["n"]]) for u in plan.updates if u["j"] and u["o"] == "MATCHED" and u["b"] != "BOOKING_NUMBER"]
                  copies = {}
                  for r in c.execute(text(_COPIES_SQL), {"t": t, "js": sorted({u["j"] for u, _ in pairs}), "fks": ["booking_date"], "docs": list(BOOKING_DOCS)}).mappings():
                      copies.setdefault(r["journey_id"], []).append(dict(r))
                  for u, r in pairs:
                      day = r.event_date
                      for cp in copies.get(u["j"], []):
                          read = parse_extracted_date(cp["value"])
                          if read and day and read != day:
                              x, y = read.strftime("%d%m%Y"), day.strftime("%d%m%Y")
                              diff = [i for i in range(8) if x[i] != y[i]]
                              if len(diff) == 1 and diff[0] < 2:
                                  ref, outlet = journeys.get(u["j"], (None, None))
                                  out.append({"dealer": dealer, "dump": f"{fname} ({bdate:%d %b})", "row": u["n"], "customer": r.customer_name,
                                              "otf": r.dms_booking_number or r.booking_number, "mobile": r.mobile, "dmsOutlet": r.outlet_label,
                                              "journey": ref, "journeyOutlet": outlet, "matchedOn": u["b"], "document": cp["doc"],
                                              "formDate": read.isoformat(), "dmsDate": day.isoformat(), "days": (day - read).days})
              tx.rollback()
          print("GAPCOUNT", len(out))
          print("GAPJSON " + json.dumps(out))
          PY
