name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Cost sheet titles, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], autocommit=True, options="-c statement_timeout=180000 -c default_transaction_read_only=on") as c:
              for t, in list(c.execute("SELECT DISTINCT tenant_id FROM auditcore.journeys")):
                  c.execute("SELECT set_config('app.tenant_id', %s, false)", (str(t),))
                  for r in c.execute("""SELECT upper(regexp_replace(coalesce(f.effective_value #>> '{}','(no title)'),'\s+',' ','g')) title, count(*),
                        count(DISTINCT e.journey_id),
                        count(*) FILTER (WHERE EXISTS (SELECT 1 FROM auditcore.p2_document_queue q WHERE q.tenant_id=e.tenant_id AND q.di_document_id=e.di_document_id
                            AND q.type_overridden_by_actor_id IS NOT NULL AND q.type_overridden_by_actor_id NOT LIKE 'SYSTEM%%' AND q.queue_status NOT IN ('MERGED','CANCELLED'))) person_typed,
                        count(*) FILTER (WHERE EXISTS (SELECT 1 FROM auditcore.evidence n WHERE n.tenant_id=e.tenant_id AND n.journey_id=e.journey_id
                            AND n.association_status='ACTIVE' AND n.document_type_key IN ('customer_ledger','customer_ledger_tally','erp_settlement'))) with_ndc
                      FROM auditcore.evidence e LEFT JOIN auditcore.journey_document_extracted_fields f ON f.tenant_id=e.tenant_id AND f.journey_id=e.journey_id
                        AND f.di_document_id=e.di_document_id AND f.field_key='document_title'
                      WHERE e.tenant_id=%s AND e.association_status='ACTIVE' AND e.document_type_key='cost_sheet' GROUP BY 1 ORDER BY 2 DESC""", (t,)):
                      print("TITLE", str(t)[:8], r)
          PY
