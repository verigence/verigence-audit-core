name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: The four matched journeys, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          jids = ['586da94e-9afa-4fad-a8dd-3e5e9c2b76a1', '6dff58f6-ac73-477c-9a7b-d3b255a93c75',
                  'b46e15c0-c280-43cb-8255-6174a6284d71', 'c0ff0e18-e4c7-4056-8e91-c521a1415769']
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=120000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              for j in jids:
                  r = c.execute("""SELECT COALESCE(NULLIF(cu.legal_name,''), cu.display_name), cu.mobile_number, b.booking_reference, b.booking_date,
                        jp.model_name_snapshot, o.outlet_name, to_char(j.created_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI'),
                        (SELECT string_agg(cs.stage_code||':'||cs.business_status, ', ') FROM auditcore.journey_stage_states cs
                           WHERE cs.tenant_id=j.tenant_id AND cs.journey_id=j.journey_id)
                      FROM auditcore.journeys j
                      LEFT JOIN auditcore.customers cu ON cu.tenant_id=j.tenant_id AND cu.customer_id=j.customer_id
                      LEFT JOIN auditcore.bookings b ON b.tenant_id=j.tenant_id AND b.journey_id=j.journey_id
                      LEFT JOIN auditcore.journey_products jp ON jp.tenant_id=j.tenant_id AND jp.journey_id=j.journey_id
                      LEFT JOIN auditcore.dealer_outlets o ON o.tenant_id=j.tenant_id AND o.outlet_id=j.outlet_id
                      WHERE j.tenant_id=%s AND j.journey_id=%s""", (t, j)).fetchone()
                  print("JOURNEY", j[:8], r)
                  for f in c.execute("""SELECT f.source_document_type_key, f.field_key, f.effective_value #>> '{}'
                      FROM auditcore.journey_document_extracted_fields f WHERE f.tenant_id=%s AND f.journey_id=%s
                        AND f.field_key IN ('customer_name','booking_number','otf_number','booking_reference','mobile_number','mobile','booking_date','model','model_name')
                      ORDER BY 1,2""", (t, j)):
                      print("   FIELD", f)
                  for u in c.execute("""SELECT original_filename, batch_status, to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI')
                      FROM auditcore.p2_upload_batches WHERE tenant_id=%s AND journey_id=%s""", (t, j)):
                      print("   UPLOAD", u)
          PY
