name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Failed reads and upload errors, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=120000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              print("== the file")
              for r in c.execute("""SELECT b.original_filename, b.batch_status, to_char(b.created_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI'),
                    q.page_number, q.queue_status, q.di_state, q.di_processing_status, q.attempt_count, q.last_error, q.status_reason,
                    q.di_document_id, to_char(q.di_submitted_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI:SS'),
                    to_char(q.updated_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI:SS'), q.classified_document_type
                  FROM auditcore.p2_upload_batches b JOIN auditcore.p2_document_queue q ON q.tenant_id=b.tenant_id AND q.batch_id=b.batch_id
                  JOIN auditcore.journeys j ON j.tenant_id=b.tenant_id AND j.journey_id=b.journey_id
                  WHERE b.tenant_id=%s AND j.journey_reference='UTK-SR-261104-004' AND b.original_filename ILIKE 'C1R27F00000090%%'
                  ORDER BY b.created_at_utc, q.page_number""", (t,)):
                  print("FILE", r)
              print("== pages failed per day (IST) by code, last 10 days")
              for r in c.execute("""SELECT to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','MM-DD') d, coalesce(last_error,'-'), count(*)
                  FROM auditcore.p2_document_queue WHERE tenant_id=%s AND unit_kind='PAGE' AND queue_status IN ('FAILED','DEAD_LETTER')
                    AND created_at_utc > now() - interval '10 days' GROUP BY 1,2 ORDER BY 1,3 DESC""", (t,)):
                  print("FAILDAY", r)
              print("== all pages per day by status")
              for r in c.execute("""SELECT to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','MM-DD') d, queue_status, count(*)
                  FROM auditcore.p2_document_queue WHERE tenant_id=%s AND unit_kind='PAGE' AND created_at_utc > now() - interval '10 days'
                  GROUP BY 1,2 ORDER BY 1,2""", (t,)):
                  print("PAGEDAY", r)
              print("== today's AI failures by hour (IST)")
              for r in c.execute("""SELECT to_char(updated_at_utc AT TIME ZONE 'Asia/Kolkata','MM-DD HH24') h, last_error, count(*)
                  FROM auditcore.p2_document_queue WHERE tenant_id=%s AND unit_kind='PAGE' AND queue_status IN ('FAILED','DEAD_LETTER','RETRY_WAIT')
                    AND updated_at_utc > now() - interval '3 days' GROUP BY 1,2 ORDER BY 1""", (t,)):
                  print("FAILHOUR", r)
              print("== reasons today")
              for r in c.execute("""SELECT left(status_reason,140), count(*) FROM auditcore.p2_document_queue WHERE tenant_id=%s
                  AND queue_status IN ('FAILED','DEAD_LETTER') AND created_at_utc > now() - interval '2 days' GROUP BY 1 ORDER BY 2 DESC""", (t,)):
                  print("REASON", r)
              print("== batches per day by status (upload side)")
              for r in c.execute("""SELECT to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','MM-DD'), batch_status, count(*)
                  FROM auditcore.p2_upload_batches WHERE tenant_id=%s AND created_at_utc > now() - interval '10 days' GROUP BY 1,2 ORDER BY 1,2""", (t,)):
                  print("BATCHDAY", r)
              print("== bulk files per day by outcome")
              for r in c.execute("""SELECT to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','MM-DD'), outcome, left(coalesce(detail,''),80), count(*)
                  FROM auditcore.p2_bulk_files WHERE tenant_id=%s AND created_at_utc > now() - interval '5 days' GROUP BY 1,2,3 ORDER BY 1,2""", (t,)):
                  print("BULKDAY", r)
              print("== work queue failures per day")
              for r in c.execute("""SELECT to_char(updated_at_utc AT TIME ZONE 'Asia/Kolkata','MM-DD'), work_type, work_status, left(coalesce(last_error,''),160), count(*)
                  FROM auditcore.p2_work_queue WHERE tenant_id=%s AND work_status IN ('FAILED','DEAD_LETTER','RETRY_WAIT')
                    AND updated_at_utc > now() - interval '4 days' GROUP BY 1,2,3,4 ORDER BY 1, 5 DESC LIMIT 80""", (t,)):
                  print("WORK", r)
          PY
