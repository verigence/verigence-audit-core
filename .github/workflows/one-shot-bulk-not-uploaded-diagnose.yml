name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: New booking ladder on the newest dumps, read-only
        shell: bash
        run: |
          git fetch -q --depth=1 origin claude/dms-booking-match-ladder && git checkout -q FETCH_HEAD -- src pyproject.toml
          python -m pip install -q -e . 2>&1 | tail -1
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from audit_core import uc03_p2_dms_dumps as m
          url = os.environ["DB"].replace("postgresql://", "postgresql+psycopg://", 1)
          engine = create_engine(url)
          t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
          with engine.connect() as c:
              tx = c.begin()
              c.execute(text("SET TRANSACTION READ ONLY"))
              c.execute(text("SELECT set_config('app.tenant_id', :t, true)"), {"t": t})
              dumps = c.execute(text("""SELECT DISTINCT ON (u.dealer_id) u.dump_id, d.dealer_name FROM auditcore.p2_dms_dumps u
                  JOIN auditcore.dealers d ON d.tenant_id=u.tenant_id AND d.dealer_id=u.dealer_id
                  WHERE u.tenant_id=:t AND u.status='ACTIVE' AND u.dump_kind='BOOKING' ORDER BY u.dealer_id, u.business_date DESC, u.uploaded_at_utc DESC"""), {"t": t}).all()
              refs = dict(c.execute(text("SELECT CAST(journey_id AS text), journey_reference FROM auditcore.journeys WHERE tenant_id=:t"), {"t": t}).all())
              for dump_id, dealer in dumps:
                  stored = {r.row_no: r for r in c.execute(text("""SELECT row_no, outcome, match_basis, CAST(journey_id AS text) j, customer_name,
                      event_date, dms_booking_number, mobile FROM auditcore.p2_dms_dump_rows WHERE tenant_id=:t AND dump_id=:d"""), {"t": t, "d": dump_id})}
                  plan = m.plan_dump(c, tenant_id=t, dump_id=dump_id)
                  index = m.build_index(c, tenant_id=t, dealer_id=c.execute(text("SELECT dealer_id FROM auditcore.p2_dms_dumps WHERE tenant_id=:t AND dump_id=:d"), {"t": t, "d": dump_id}).scalar_one())
                  print("DUMP", dealer)
                  for u in plan.updates:
                      r = stored[u["n"]]
                      if (u["o"], u["j"]) != (r.outcome, r.j):
                          def j(jid):
                              if not jid: return "-"
                              jj = index.journeys.get(jid, {})
                              return f"{refs.get(jid)} {sorted(jj.get('names') or [])[:2]} days={sorted(str(x) for x in jj.get('bookingDays') or [])} refs={sorted(jj.get('refs') or [])[:2]}"
                          print(f"  CHANGE row {u['n']} {r.customer_name} | {r.event_date} {r.dms_booking_number} {r.mobile} | was {r.outcome}/{r.match_basis} {j(r.j)} | now {u['o']}/{u['b']} {j(u['j'])}")
                  for f in plan.date_fixes:
                      ds = next(x for x in plan.updates if x["n"] == f["rowNo"])["ds"] or {}
                      if ds.get("digitOff"):
                          print(f"  DATEFIX row {f['rowNo']} {stored[f['rowNo']].customer_name} {refs.get(f['journeyId'])} {f['documentType']} {f['was']} -> {f['dms']}")
                  for f in plan.field_fixes:
                      ds = next(x for x in plan.updates if x["n"] == f["rowNo"])["ds"] or {}
                      flds = [x for x in ds.get("fields") or [] if x.get("digitOff") and x["was"] == f["was"]]
                      if flds:
                          print(f"  OTFFIX row {f['rowNo']} {stored[f['rowNo']].customer_name} {refs.get(f['journeyId'])} {f['was']} -> {f['dms']}")
                  print("  COUNTS dates", len(plan.date_fixes), "fields", len(plan.field_fixes))
              tx.rollback()
          PY
