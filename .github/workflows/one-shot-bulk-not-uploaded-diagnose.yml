name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Deployed DMS checks against today's Utkal rows, read-only
        shell: bash
        run: |
          git fetch -q --depth=1 origin dev && git checkout -q FETCH_HEAD -- src pyproject.toml
          python -m pip install -q -e . 2>&1 | tail -1
          python - <<'PY'
          import io, os, psycopg
          from datetime import datetime
          from openpyxl import Workbook
          from fastapi import HTTPException
          from audit_core import uc03_p2_dms_dumps as m
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=60000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              print("ALEMBIC", c.execute("SELECT version_num FROM public.alembic_version").fetchall() if c.execute("SELECT to_regclass(%s)", ("public.alembic_version",)).fetchone()[0] else "n/a")
              print("COLUMN", c.execute("""SELECT data_type, column_default FROM information_schema.columns WHERE table_schema='auditcore'
                  AND table_name='p2_dms_dumps' AND column_name='row_issues'""").fetchall())
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              rows = c.execute("""SELECT r.raw, coalesce(o.outlet_name, 'Utkal Mahindra - CDA') FROM auditcore.p2_dms_dump_rows r
                  JOIN auditcore.p2_dms_dumps u ON u.tenant_id=r.tenant_id AND u.dump_id=r.dump_id
                  LEFT JOIN auditcore.dealer_outlets o ON o.tenant_id=r.tenant_id AND o.outlet_id=r.outlet_id
                  WHERE r.tenant_id=%s AND u.file_name='ALL BRANCH DELIVERY SHEET 24.11.26.xlsx' ORDER BY r.row_no""", (t,)).fetchall()
          def iso(v):
              try: return datetime.fromisoformat(v)
              except Exception: return v
          cols = ["TIMESTAMP", "SALES MANAGER", "FSC", "CUSTOMER NAME", "CONT NO", "MODEL", "CHASSIS NO", "BOOKING DATE", "DELIVERY DATE"]
          def book(location_heading):
              wb = Workbook(); ws = wb.active; ws.title = "Form Responses 1"
              ws.append(["Timestamp", location_heading, "Sales Manager", "FSC", "Customer Name", "Cont No", "Model", "Chassis No", "Booking Date", "Delivery Date"])
              for raw, outlet in rows:
                  v = [iso(raw.get(k)) for k in cols]
                  ws.append([v[0], outlet.replace("Utkal Mahindra - ", "")] + v[1:])
              b = io.BytesIO(); wb.save(b); return b.getvalue()
          print("ROWS", len(rows))
          try:
              m.parse_workbook(book("Delivery Date")); print("TODAY_LAYOUT taken (unexpected)")
          except HTTPException as e:
              print("TODAY_LAYOUT refused", e.status_code, e.detail)
          p = m.parse_workbook(book("Location"))
          print("CORRECTED_LAYOUT taken", len(p.rows), "dated", sum(1 for r in p.rows if r["event_date"]),
                "with outlet", sum(1 for r in p.rows if r["outlet_label"]), "to correct", len(p.row_issues))
          for i in p.row_issues[:10]:
              print("   ISSUE", i)
          PY
