name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: Journey uploads today, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=60000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              cols = [r[0] for r in c.execute("""SELECT column_name FROM information_schema.columns
                  WHERE table_schema='auditcore' AND table_name='p2_upload_batches' ORDER BY ordinal_position""")]
              print("COLS", cols)
              for r in c.execute("""SELECT original_filename, batch_status, size_bytes, uploaded_by_actor_id,
                    to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI:SS'),
                    to_char(updated_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI:SS'), journey_id
                  FROM auditcore.p2_upload_batches WHERE tenant_id=%s AND original_filename ILIKE %s
                  ORDER BY created_at_utc""", (t, '%suvendu%')):
                  print("SUVENDU", r)
              for r in c.execute("""SELECT to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24') h,
                    count(*) total, count(*) FILTER (WHERE batch_status='AWAITING_UPLOAD') awaiting
                  FROM auditcore.p2_upload_batches WHERE tenant_id=%s AND created_at_utc > now() - interval '3 days'
                  GROUP BY 1 ORDER BY 1""", (t,)):
                  print("HOURLY", r)
              for r in c.execute("""SELECT to_char(created_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon'),
                    count(*), count(*) FILTER (WHERE batch_status='AWAITING_UPLOAD')
                  FROM auditcore.p2_upload_batches WHERE tenant_id=%s AND created_at_utc > now() - interval '30 days'
                  GROUP BY 1 ORDER BY min(created_at_utc)""", (t,)):
                  print("DAILY", r)
          PY
