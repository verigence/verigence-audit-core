name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: DMS rows without a date, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=60000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              base = """FROM auditcore.p2_dms_dump_rows r
                  JOIN auditcore.p2_dms_dumps u ON u.tenant_id=r.tenant_id AND u.dump_id=r.dump_id
                  LEFT JOIN auditcore.dealers d ON d.tenant_id=r.tenant_id AND d.dealer_id=r.dealer_id
                  LEFT JOIN auditcore.dealer_outlets o ON o.tenant_id=r.tenant_id AND o.outlet_id=r.outlet_id
                  WHERE r.tenant_id=%s AND u.status='ACTIVE'"""
              for r in c.execute(f"""SELECT d.dealer_name, u.file_name, r.dump_kind, u.uploaded_by_name,
                    to_char(u.uploaded_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI'),
                    count(*) FILTER (WHERE r.event_date IS NULL) no_date, count(*) total
                  {base} GROUP BY 1,2,3,4,5 HAVING count(*) FILTER (WHERE r.event_date IS NULL) > 0 ORDER BY 1""", (t,)):
                  print("FILE", r)
              for r in c.execute(f"""SELECT d.dealer_name, coalesce(o.outlet_name, r.outlet_label), count(*)
                  {base} AND r.event_date IS NULL GROUP BY 1,2 ORDER BY 1,3 DESC""", (t,)):
                  print("OUTLET", r)
              for r in c.execute(f"""SELECT r.row_no, r.raw {base} AND r.event_date IS NULL ORDER BY r.row_no LIMIT 3""", (t,)):
                  print("SAMPLE", r[0], {k: v for k, v in (r[1] or {}).items() if 'DATE' in k.upper() or 'DT' in k.upper()})
              for r in c.execute(f"""SELECT r.row_no, r.raw {base} AND r.event_date IS NOT NULL AND u.file_name LIKE 'ALL BRANCH DELIVERY SHEET 24.11.26%%' ORDER BY r.row_no LIMIT 2""", (t,)):
                  print("GOOD", r[0], {k: v for k, v in (r[1] or {}).items() if 'DATE' in k.upper() or 'DT' in k.upper()})
          PY
