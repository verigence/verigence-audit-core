name: One-shot bulk upload "Not uploaded before submit" diagnose (DEV, read-only)

# Read-only: the 24 Nov bulk drops and their file rows, to find why files were
# marked "Not uploaded before submit". Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/bulk-not-uploaded-diagnose]
    paths:
      - '.github/workflows/one-shot-bulk-not-uploaded-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"
      - name: After the re-match, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DB"], options="-c statement_timeout=120000") as c:
              c.execute("SET TRANSACTION READ ONLY")
              t = 'afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572'
              c.execute("SELECT set_config('app.tenant_id', %s, true)", (t,))
              latest = """SELECT DISTINCT ON (dealer_id) dump_id FROM auditcore.p2_dms_dumps WHERE tenant_id=%s AND status='ACTIVE'
                          AND dump_kind='BOOKING' ORDER BY dealer_id, business_date DESC, uploaded_at_utc DESC"""
              for r in c.execute(f"""SELECT r.customer_name, r.dms_booking_number, r.outcome, r.match_basis,
                    (SELECT journey_reference FROM auditcore.journeys j WHERE j.tenant_id=r.tenant_id AND j.journey_id=r.journey_id),
                    EXISTS (SELECT 1 FROM auditcore.p2_dms_intimations i WHERE i.tenant_id=r.tenant_id AND i.withdrawn_at_utc IS NULL
                            AND i.row_key = 'OTF:' || r.dms_booking_number)
                  FROM auditcore.p2_dms_dump_rows r WHERE r.tenant_id=%s AND r.dump_id IN ({latest})
                    AND r.dms_booking_number IN ('OTF27C054617','OTF27C054649','OTF27C053725','OTF27C054286','OTF27C054352','OTF27C053164')
                  ORDER BY 1""", (t, t)):
                  print("ROW", r)
              for r in c.execute("""SELECT field_key, previous_value, new_value, to_char(changed_at_utc AT TIME ZONE 'Asia/Kolkata','DD Mon HH24:MI')
                  FROM auditcore.journey_field_change_log WHERE tenant_id=%s AND change_reason='DMS_SYNC'
                    AND changed_at_utc > now() - interval '3 hours' ORDER BY field_key, changed_at_utc""", (t,)):
                  print("LOG", r)
              print("LOGCOUNT", c.execute("""SELECT field_key, count(*) FROM auditcore.journey_field_change_log WHERE tenant_id=%s
                  AND change_reason='DMS_SYNC' AND changed_at_utc > now() - interval '3 hours' GROUP BY 1""", (t,)).fetchall())
              jids = [r[0] for r in c.execute("""SELECT DISTINCT journey_id FROM auditcore.journey_field_change_log WHERE tenant_id=%s
                  AND change_reason='DMS_SYNC' AND changed_at_utc > now() - interval '3 hours'""", (t,))]
              print("TASKS", c.execute("""SELECT task_status, count(*) FROM auditcore.p2_tasks WHERE tenant_id=%s AND journey_id = ANY(%s)
                  AND task_type='MANUAL_VERIFICATION_REVIEW' AND updated_at_utc > now() - interval '3 hours' GROUP BY 1""", (t, jids)).fetchall())
              print("RECOMPUTE_PENDING", c.execute("""SELECT count(*) FROM auditcore.p2_journey_runtime WHERE tenant_id=%s AND journey_id = ANY(%s)
                  AND recompute_requested_version > COALESCE(recompute_completed_version, 0)""", (t, jids)).fetchone() if False else "n/a")
          PY
