name: One-shot Project provisioning runtime diagnose

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-project-provisioning-runtime-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose live Project provisioning failure
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      SECURITY_SERVICE: security

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Railway CLI and link DEV
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway status --json >/tmp/status.json
          railway deployment list --service "$AUDIT_SERVICE" --limit 6 --json >/tmp/audit-deployments.json
          railway deployment list --service "$SECURITY_SERVICE" --limit 6 --json >/tmp/security-deployments.json
          python - <<'PY'
          import json
          from pathlib import Path
          for label, path in [('AUDIT', '/tmp/audit-deployments.json'), ('SECURITY', '/tmp/security-deployments.json')]:
              rows=json.loads(Path(path).read_text())
              for row in rows:
                  meta=row.get('meta') if isinstance(row.get('meta'), dict) else {}
                  print(label + '_DEPLOYMENT|' + '|'.join([
                      str(row.get('id','')),
                      str(row.get('status','')),
                      str(row.get('createdAt') or row.get('created_at') or ''),
                      str(meta.get('commitHash') or meta.get('commit_hash') or ''),
                      str(meta.get('commitMessage') or meta.get('commit_message') or ''),
                  ]))
          PY

      - name: Read Audit Core provisioning logs
        shell: bash
        run: |
          set -euo pipefail
          railway logs --service "$AUDIT_SERVICE" --since 3h --lines 2500 >/tmp/audit.log 2>&1 || true
          echo '--- AUDIT CORE PROJECT PROVISIONING EVENTS ---'
          grep -Ei 'MahindraWest|project_provision|project_create|security_admin|administrative_operation|SECURITY_ADMIN_FAILED|RECOVERY_REQUIRED|VAC-SYS-002|/v1/projects' /tmp/audit.log | tail -n 500 || true
          echo '--- AUDIT CORE ERROR TAIL ---'
          grep -Ei 'error|warning|exception|traceback|failed|recovery' /tmp/audit.log | tail -n 500 || true

      - name: Read Audit Core projects HTTP logs
        shell: bash
        run: |
          set -euo pipefail
          echo '--- AUDIT CORE /v1/projects HTTP ---'
          railway logs --service "$AUDIT_SERVICE" --http --path /v1/projects --since 3h --json 2>/tmp/audit-http.err | tail -n 300 || true
          cat /tmp/audit-http.err >&2 || true

      - name: Read Security tenant creation HTTP logs
        shell: bash
        run: |
          set -euo pipefail
          echo '--- SECURITY TENANT CREATE HTTP ---'
          railway logs --service "$SECURITY_SERVICE" --http --path /security/v1/platform/tenants --since 3h --json 2>/tmp/security-http.err | tail -n 400 || true
          cat /tmp/security-http.err >&2 || true
          echo '--- SECURITY RELEVANT APP LOGS ---'
          railway logs --service "$SECURITY_SERVICE" --since 3h --lines 2500 >/tmp/security.log 2>&1 || true
          grep -Ei 'platform/tenants|tenant|admin-context|AUTH_TOKEN|PERMISSION|401|403|409|422|500|exception|error' /tmp/security.log | tail -n 600 || true
