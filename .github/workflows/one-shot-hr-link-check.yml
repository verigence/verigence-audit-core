name: One-shot HR employee login link check (DEV, read-only)

# Prints counts only (no names, emails or ids): how many employee records are linked to a Verigence
# login, by login status. Read-only transaction.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-link-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --global @railway/cli
          python -m pip install -q "psycopg[binary]"
      - name: Counts only
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service HRMgmt --json >/dev/null
          railway variable list --service HRMgmt --json > /tmp/v.json
          python3 - <<'PY'
          import json
          import psycopg
          v = json.load(open('/tmp/v.json'))
          db = v['DATABASE_URL'].strip()
          print('::add-mask::' + db)
          for p in ('postgresql+psycopg://', 'postgresql+asyncpg://', 'postgres://'):
              if db.startswith(p):
                  db = 'postgresql://' + db[len(p):]
          with psycopg.connect(db, options='-c default_transaction_read_only=on', connect_timeout=20) as c:
              cur = c.cursor()
              cur.execute("select employment_status, login_status, (security_user_id is not null) as linked, count(*) from hr.employee group by 1,2,3 order by 1,2,3")
              print('employment_status | login_status | linked | count')
              for r in cur.fetchall():
                  print(r)
              cur.execute("select to_regclass('security.users') is not null, to_regclass('security.human_identities') is not null")
              print('security tables visible from the HR database (users, human_identities):', cur.fetchall())
          PY
