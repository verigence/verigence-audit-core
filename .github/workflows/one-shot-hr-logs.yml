name: One-shot HRMgmt send failure check (read-only)

# Prints only short status lines from the Security log. No secret is printed (security 422 detail).
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Check
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service security --json >/dev/null
          timeout 90 railway logs --service security --lines 5000 > /tmp/sec.log 2>&1 || true
          echo "security log lines captured: $(wc -l < /tmp/sec.log)"
          echo "--- counts"
          for k in security_user_login_success login_attempt_not_recorded app_download_not_recorded Traceback "Human credential authentication denied" "Application startup complete" "ERROR"; do
            echo "$k: $(grep -c -- "$k" /tmp/sec.log)"
          done
          echo "--- the validation event in full (emails masked, no bodies are logged)"
          sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" /tmp/sec.log | grep "security_request_validation_failed" | cut -c1-1500 | tail -5
          echo "--- login requests by status"
          grep -E 'POST /security/v1/auth/login' /tmp/sec.log | sed -E 's/.*HTTP\/1.1" ([0-9]+).*/\1/' | sort | uniq -c
