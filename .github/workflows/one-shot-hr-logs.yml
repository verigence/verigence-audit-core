name: One-shot HRMgmt send failure check (read-only)

# Prints only counts and short status lines from the HR log. No secret is printed (face check live proof, evening).
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Check
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service HRMgmt --json >/dev/null
          timeout 90 railway logs --service HRMgmt --lines 5000 > /tmp/hr.log 2>&1 || true
          echo "HR log lines captured: $(wc -l < /tmp/hr.log)"
          echo "--- counts"
          for k in hr_attendance_timing hr_face_check_unavailable hr_face_check_failed hr_unhandled_error Traceback "Application startup complete" " 500 " " 503 "; do
            echo "$k: $(grep -c -- "$k" /tmp/hr.log)"
          done
          echo "--- last attendance timing lines (emails masked)"
          sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" /tmp/hr.log | cut -c1-300 | grep -E "hr_attendance_timing|face_check|unhandled|Traceback| 500 | 503 " | tail -12 || true
          echo "--- attendance requests by status"
          grep -E 'POST /hr/v1/attendance/(check-in|check-out)|GET /hr/v1/attendance/(daily|report)' /tmp/hr.log | sed -E 's/.*(GET|POST) ([^ ?]+).*HTTP\/1.1" ([0-9]+).*/\1 \2 \3/' | sort | uniq -c || true
