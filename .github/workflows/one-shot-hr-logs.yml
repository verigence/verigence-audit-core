name: One-shot Railway plan check (read-only)

# Prints only the plan name of the Railway workspace that holds the HRMgmt service. No secret is printed.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Plan
        shell: bash
        run: |
          set -uo pipefail
          q() { curl -s -m 30 https://backboard.railway.com/graphql/v2 -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H 'Content-Type: application/json' -d "$1"; }
          echo "--- Workspace fields about plan:"
          q '{"query":"{ __type(name: \"Workspace\") { fields { name } } }"}' | python3 -c "import sys,json; d=json.load(sys.stdin); print([f['name'] for f in (d.get('data') or {}).get('__type',{}).get('fields',[]) if any(k in f['name'].lower() for k in ('plan','subscription','tier','team','customer'))] or d)"
          echo "--- me / workspaces:"
          q '{"query":"{ me { workspaces { id name } } }"}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d)[:400])"
