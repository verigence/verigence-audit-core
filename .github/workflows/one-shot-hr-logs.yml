name: One-shot HRMgmt reachability check (DEV, read-only)

# Calls the public HRMgmt URL a few times and prints only status codes and timings.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            for path in /health /ready /hr/v1/attendance/team?month=2026-10 /hr/v1/me; do
              out="$(curl -s -m 20 -o /dev/null -w '%{http_code} %{time_total}s' "https://attendance-dev.up.railway.app$path")"
              echo "$i $path -> $out"
            done
            sleep 3
          done
