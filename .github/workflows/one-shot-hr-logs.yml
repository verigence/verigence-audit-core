name: One-shot HRMgmt send failure check (read-only)

# Prints only counts and short status lines from the HR log. No secret is printed (503 counts).
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Check
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service HRMgmt --json >/dev/null
          timeout 90 railway logs --service HRMgmt --lines 4000 > /tmp/hr.log 2>&1 || true
          echo "HR log lines: $(wc -l < /tmp/hr.log)"
          echo "--- HR requests by route and status (top 20)"
          grep -E 'INFO: +[0-9.]+:[0-9]+ - "' /tmp/hr.log | sed -E 's/.*"(GET|POST|PUT|DELETE) ([^ ?]+)[^"]*" ([0-9]+).*/\1 \2 \3/' | sed -E 's#/[0-9a-f]{8}-[0-9a-f-]{27,}#/<id>#g' | sort | uniq -c | sort -rn | head -20 || true
          echo "--- failed Security permission checks per minute (UTC)"
          grep 'hr_security_check_failed' /tmp/hr.log | sed -E 's/^20[0-9-]+ ([0-9]{2}:[0-9]{2}):[0-9]{2}.*/\1/' | sort | uniq -c || true
          echo "--- failed token / other Security failures"
          grep -c 'hr_security_token_failed' /tmp/hr.log || true
          echo "--- distinct permissions that failed (count)"
          grep 'hr_security_check_failed' /tmp/hr.log | sed -E 's/.*permission=([^ ]+).*/\1/' | sort | uniq -c | sort -rn | head -12 || true
          echo "--- check-in/out timing lines"
          grep 'hr_attendance_timing' /tmp/hr.log | cut -c1-230 | tail -8 || true
          echo "--- /hr/v1/me answers (status codes, count)"
          grep -E '"GET /hr/v1/me' /tmp/hr.log | sed -E 's/.*"GET \/hr\/v1\/me[^"]*" ([0-9]+).*/\1/' | sort | uniq -c || true
          echo "--- Security check failures by kind (batch and single), count"
          grep -E 'hr_security_check_failed|hr_security_token_failed' /tmp/hr.log | sed -E 's/.*(hr_security_[a-z_]+).*(http_status=[0-9]+)?.*/\1 \2/' | sort | uniq -c | head -12 || true
          echo "--- last 6 failure lines (no secrets in these lines)"
          grep -E 'hr_security_check_failed|hr_security_token_failed' /tmp/hr.log | tail -6 | cut -c1-230 || true
