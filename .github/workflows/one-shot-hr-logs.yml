name: One-shot HRMgmt send failure check (read-only)

# Prints only short status lines from the Security log. No secret is printed (security 422 check).
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Check
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service security --json >/dev/null
          timeout 90 railway logs --service security --lines 5000 > /tmp/sec.log 2>&1 || true
          echo "security log lines captured: $(wc -l < /tmp/sec.log)"
          echo "--- counts"
          for k in security_user_login_success login_attempt_not_recorded app_download_not_recorded Traceback "Human credential authentication denied" "Application startup complete" "ERROR"; do
            echo "$k: $(grep -c -- "$k" /tmp/sec.log)"
          done
          echo "--- context around every 422 (emails masked)"
          sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" /tmp/sec.log | cut -c1-400 | grep -n -B4 -A2 " 422 " | head -60
          echo "--- validation / warning lines"
          sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" /tmp/sec.log | cut -c1-400 | grep -i -E "validation|warning|WARN|not_recorded|unprocessable" | tail -20
