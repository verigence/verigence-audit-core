name: One-shot HRMgmt send failure check (read-only)

# Prints only counts and short status lines from the HR log. No secret is printed (security side of the 503s).
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Check
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service security --json >/dev/null
          timeout 120 railway logs --service security --lines 4000 > /tmp/sec.log 2>&1 || true
          echo "security log lines: $(wc -l < /tmp/sec.log)"
          [ "$(wc -l < /tmp/sec.log)" -lt 5 ] && head -c 400 /tmp/sec.log
          echo "--- first and last timestamped lines"
          grep -E '^20[0-9]{2}-' /tmp/sec.log | head -1 | cut -c1-60 || true
          grep -E '^20[0-9]{2}-' /tmp/sec.log | tail -1 | cut -c1-60 || true
          echo "--- requests by route and status"
          grep -E 'INFO: +[0-9.]+:[0-9]+ - "' /tmp/sec.log | sed -E 's/.*"(GET|POST|PUT|DELETE) ([^ ?]+)[^"]*" ([0-9]+).*/\1 \2 \3/' | sed -E 's#/[0-9a-f]{8}-[0-9a-f-]{27,}#/<id>#g' | sort | uniq -c | sort -rn | head -25 || true
          echo "--- warnings and errors (time, kind), emails masked"
          sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" /tmp/sec.log | grep -E '\[(WARN|ERROR|CRITICAL)' | cut -c1-260 | tail -25 || true
          echo "--- other keywords"
          for k in Traceback "timeout" "pool" "OperationalError" "database" "Connection" "SSL" "Killed" "OOM" "SIGTERM" "Starting Container" "Application startup complete"; do echo "$k: $(grep -c -i -- "$k" /tmp/sec.log)"; done
