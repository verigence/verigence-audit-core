name: One-shot Railway plan check (read-only)

# Prints only the plan name of the Railway workspace that holds the HRMgmt service. No secret is printed.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Plan
        shell: bash
        run: |
          set -uo pipefail
          q() { curl -s -m 30 https://backboard.railway.com/graphql/v2 -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H 'Content-Type: application/json' -d "$1"; }
          echo "--- plan:"
          q '{"query":"{ workspace(workspaceId: \"353d2d4d-32dc-4fb0-b448-5e4bde921332\") { name plan } }"}' | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin))[:300])"
