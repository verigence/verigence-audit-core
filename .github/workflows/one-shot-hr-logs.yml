name: One-shot HRMgmt send failure check (read-only)

# Prints only counts and short status lines from the HR log. No secret is printed (503 investigation).
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-logs.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-hr-logs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Check
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service HRMgmt --json >/dev/null
          timeout 90 railway logs --service HRMgmt --lines 5000 > /tmp/hr.log 2>&1 || true
          echo "HR log lines captured: $(wc -l < /tmp/hr.log)"
          echo "--- non-access lines (warnings, events) with their time, emails masked"
          sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" /tmp/hr.log | grep -v '^INFO: ' | cut -c1-330 | tail -40 || true
          echo "--- every 503 with its neighbours"
          sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" /tmp/hr.log | cut -c1-200 | grep -n -B2 -A1 ' 503 ' | head -60 || true
