name: One-shot HRMgmt variable check (DEV, read-only)

# Runs only for a push whose head commit message contains CHECK-HRMGMT-VARS.
# Prints, for a fixed list of HRMgmt variable names, only present / empty / unresolved and the
# length. Never prints a value.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-hr-vars.yml'

permissions:
  contents: read

jobs:
  check:
    if: contains(github.event.head_commit.message, 'CHECK-HRMGMT-VARS')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --global @railway/cli
      - name: Check names and lengths only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service HRMgmt --json >/dev/null
          railway variable list --service HRMgmt --json > /tmp/hr-vars.json
          python3 - <<'PY'
          import json
          v = json.load(open('/tmp/hr-vars.json'))
          for name in ['GOOGLE_MAPS_API_KEY', 'AUDIT_CORE_BASE_URL']:
              val = (v.get(name) or '').strip()
              if not val:
                  state = 'MISSING OR EMPTY'
              elif ('$' + '{{') in val:
                  state = 'UNRESOLVED REFERENCE'
              else:
                  state = 'present'
              print(f'{name}: {state} (length {len(val)})')
          print('AUDIT_CORE_BASE_URL is https:', (v.get('AUDIT_CORE_BASE_URL') or '').strip().startswith('https://'))
          print('GOOGLE_MAPS_API_KEY looks like a Google key (starts AIza):', (v.get('GOOGLE_MAPS_API_KEY') or '').strip().startswith('AIza'))
          print('other variable names present:', sorted(k for k in v if k.startswith(('HR_', 'SECURITY_', 'AUDIT_', 'GOOGLE_'))))
          PY
