name: UC03 C1 one-shot contract freeze

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/uc03-c1-contract-freeze.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning/uc-003-booking-delivery-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - name: Freeze and validate C1 OpenAPI
        run: python scripts/uc03_freeze_contract.py
      - name: Commit contract and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/uc03-c1-contract-freeze.yml scripts/uc03_freeze_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi-v1.yaml
          git commit -m "docs(uc03-c1): freeze Booking API contract"
          git push origin HEAD:planning/uc-003-booking-delivery-audit
