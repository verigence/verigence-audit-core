name: One-shot Railway inventory (read-only)

# Reads the Railway account and prints facts that decide which services cost money and which are
# not needed. It changes nothing. No variable value is printed: for database URLs only the KIND of
# host (Neon, Railway Postgres, other) is printed, never the host, user, password or database name.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-railway-inventory.yml'

permissions:
  contents: read

concurrency:
  group: railway-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - name: Inventory
        shell: bash
        run: |
          set -uo pipefail
          [[ -n "${RAILWAY_API_TOKEN:-}" ]] || { echo '::error::RAILWAY_API_TOKEN is not set'; exit 1; }
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlparse

          URL = 'https://backboard.railway.com/graphql/v2'
          TOKEN = os.environ['RAILWAY_API_TOKEN']
          PROJECT = os.environ['PLATFORM_PROJECT_ID']

          def gql(query, variables=None):
              body = json.dumps({'query': query, 'variables': variables or {}}).encode()
              req = urllib.request.Request(URL, data=body, headers={
                  'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json',
                  'User-Agent': 'verigence-inventory/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      out = json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return None, f'HTTP {e.code}'
              except Exception as e:
                  return None, type(e).__name__
              if out.get('errors'):
                  return out.get('data'), '; '.join(str(x.get('message'))[:160] for x in out['errors'])[:400]
              return out.get('data'), None

          def nodes(conn):
              return [e['node'] for e in ((conn or {}).get('edges') or [])]

          data, err = gql('query($id:String!){ project(id:$id){ environments{edges{node{ id name }}} services{edges{node{ id name }}} } }', {'id': PROJECT})
          if err: print('(project query:', err, ')')
          proj = (data or {}).get('project') or {}
          names = {s['id']: s['name'] for s in nodes(proj.get('services'))}
          envs = nodes(proj.get('environments'))
          env = next((e for e in envs if e['name'] == 'dev'), envs[0] if envs else None)
          print('environments:', [e['name'] for e in envs])

          print('\n=== A. Which database each service points at (kind of host only)')
          def kind(val):
              host = (urlparse(val.strip()).hostname or '').lower()
              if not host: return 'empty'
              if host.endswith('neon.tech'): return 'neon'
              if host.endswith('.railway.internal') or host.endswith('rlwy.net'): return 'railway-postgres'
              return 'other'
          DBVAR = re.compile(r'(DB_URL|DATABASE_URL|DATABASE_PUBLIC_URL|DSN)', re.I)
          for sid, n in sorted(names.items(), key=lambda x: x[1]):
              d, e = gql('query($p:String!,$e:String!,$s:String!){ variables(projectId:$p, environmentId:$e, serviceId:$s) }', {'p': PROJECT, 'e': env['id'], 's': sid})
              v = (d or {}).get('variables')
              if not isinstance(v, dict): continue
              found = [f"{k}={kind(str(v[k]))}" for k in sorted(v) if DBVAR.search(k) and not k.startswith('RAILWAY_')]
              if found: print(f'   {n:<24}', ' | '.join(found))

          print('\n=== B. Memory (GB) and CPU through the last 7 days, 6-hour averages, per service')
          sid_by_name = {n: s for s, n in names.items()}
          start = (datetime.now(timezone.utc) - timedelta(days=7)).strftime('%Y-%m-%dT%H:%M:%SZ')
          for n in ['di-worker-v2', 'di-api', 'Postgres', 'di-worker', 'verigence-audit-core', 'verigence-p2-worker', 'security', 'HRMgmt', 'audit-api', 'analytics']:
              sid = sid_by_name.get(n)
              if not sid: continue
              q = 'query($e:String!,$s:String!,$st:DateTime!){ metrics(environmentId:$e, serviceId:$s, startDate:$st, measurements:[MEMORY_USAGE_GB, CPU_USAGE], sampleRateSeconds:21600, averagingWindowSeconds:21600){ measurement values{ ts value } } }'
              d, e = gql(q, {'e': env['id'], 's': sid, 'st': start})
              if e and not d: print(f'   {n}: (metrics query: {e})'); continue
              for m in (d or {}).get('metrics') or []:
                  vals = ' '.join(f"{x['value']:.2f}" for x in m['values'])
                  print(f"   {n:<22} {m['measurement']:<16} {vals}")

          print('\n=== C. Recent deployments of the DI workers and API (restarts and redeploys)')
          for n in ['di-worker-v2', 'di-worker', 'di-api']:
              sid = sid_by_name.get(n)
              if not sid: continue
              q = 'query($p:String!,$e:String!,$s:String!){ deployments(first:25, input:{projectId:$p, environmentId:$e, serviceId:$s}){ edges{ node{ status createdAt } } } }'
              d, e = gql(q, {'p': PROJECT, 'e': env['id'], 's': sid})
              if e and not d: print(f'   {n}: (deployments query: {e})'); continue
              rows = [(x['createdAt'][:16], x['status']) for x in nodes((d or {}).get('deployments'))]
              print(f'   {n}: {len(rows)} most recent:', ', '.join(f'{c} {s}' for c, s in rows[:12]))
          PY
