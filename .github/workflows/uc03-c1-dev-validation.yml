name: UC03 C1 Audit Core DEV Validation

# Branch-safe C1 deployment evidence; this does not merge the planning branch into dev.
on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/uc03-c1-dev-validation.yml'

permissions:
  contents: read

concurrency:
  group: uc03-c1-audit-core-dev-validation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy C1 Audit Core branch to DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
      DEV_WEB_ORIGIN: https://verigence-web-dev.jbrconsulting-it.workers.dev

    steps:
      - name: Check out exact C1 revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and verify C1 runtime routes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          PYTHONPATH=src python - <<'PY'
          from audit_core.main import app
          paths = app.openapi().get('paths', {})
          required = [
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/start',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/close-ready',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/close-no-delivery',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/cancel',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/mark-duplicate',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/capture/{field_key}',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/booking/extraction/refresh',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/uc03-workspace',
              '/v1/tenants/{tenant_id}/journeys/{journey_id}/stages/BOOKING/documents/{requirement_key}/evidence',
          ]
          missing = [p for p in required if p not in paths]
          if missing:
              raise SystemExit('Missing C1 runtime route(s): ' + ', '.join(missing))
          print('AUDIT_CORE_C1_ROUTE_CONTRACT=PASS')
          PY

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link approved shared DEV target
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN secret is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway status --json >/tmp/status.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          project=json.loads(Path('/tmp/status.json').read_text())
          variables=json.loads(Path('/tmp/audit-vars.json').read_text())
          if project.get('id') != os.environ['PLATFORM_PROJECT_ID']:
              raise SystemExit('Wrong Railway project')
          if not variables.get('DATABASE_URL'):
              raise SystemExit('DATABASE_URL missing')
          if str(variables.get('APP_ENV','')).strip().lower() not in {'dev','development'}:
              raise SystemExit('APP_ENV is not DEV')
          print('AUDIT_CORE_RAILWAY_TARGET=PASS')
          PY

      - name: Record previous deployment
        shell: bash
        run: |
          railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-before.json
          previous="$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/audit-before.json').read_text())
          print(rows[0].get('id','') if rows else '')
          PY
          )"
          echo "AUDIT_PREVIOUS_DEPLOYMENT_ID=$previous" >> "$GITHUB_ENV"
          echo "AUDIT_PREVIOUS_DEPLOYMENT_ID=${previous:-NONE}"

      - name: Deploy exact C1 revision
        shell: bash
        run: |
          set -euo pipefail
          railway up . --path-as-root --service "$AUDIT_SERVICE" --detach --yes \
            --message "UC03 C1 Audit Core DEV ${DEPLOY_SHA}" >/dev/null

      - name: Verify fresh deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-deployment.json
            read -r deployment_id status <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/audit-deployment.json').read_text())
          print((rows[0].get('id','') + ' ' + rows[0].get('status','')) if rows else ' ')
          PY
          )"
            if [[ -z "$deployment_id" || "$deployment_id" == "${AUDIT_PREVIOUS_DEPLOYMENT_ID:-}" ]]; then
              echo "Waiting for fresh deployment ($attempt/30)"
              sleep 10
              continue
            fi
            case "$status" in
              SUCCESS)
                echo "AUDIT_CORE_C1_DEPLOYMENT=PASS"
                echo "AUDIT_CORE_C1_DEPLOYMENT_ID=$deployment_id"
                break ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 220 || true
                exit 1 ;;
            esac
            [[ "$attempt" != 30 ]] || { railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 220 || true; exit 1; }
            sleep 10
          done

      - name: Smoke deployed C1 routes and CORS
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/audit-vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          [ -n "$domain" ] || { echo '::error::No Audit Core public domain.'; exit 1; }
          case "$domain" in http://*|https://*) base="${domain%/}" ;; *) base="https://${domain%/}" ;; esac
          curl --fail --silent --show-error "$base/health" >/tmp/health.json
          echo "AUDIT_CORE_PUBLIC_BASE=$base"
          echo 'AUDIT_CORE_PUBLIC_HEALTH=PASS'

          probe() {
            local path="$1"
            local code
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request OPTIONS "$base$path" || true)"
            case "$code" in 000|404|5??) echo "::error::C1 route probe failed $path HTTP $code"; exit 1 ;; *) echo "C1_ROUTE_PRESENT|$path|HTTP_$code" ;; esac
          }
          probe '/v1/tenants/uc03-smoke/journeys/00000000-0000-0000-0000-000000000001/booking/start'
          probe '/v1/tenants/uc03-smoke/journeys/00000000-0000-0000-0000-000000000001/booking/close-ready'
          probe '/v1/tenants/uc03-smoke/journeys/00000000-0000-0000-0000-000000000001/booking/extraction/refresh'
          probe '/v1/tenants/uc03-smoke/journeys/00000000-0000-0000-0000-000000000001/uc03-workspace'

          cors_status="$(curl --silent --show-error --dump-header /tmp/cors.headers --output /tmp/cors.body --write-out '%{http_code}' \
            --request OPTIONS --header "Origin: $DEV_WEB_ORIGIN" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type,idempotency-key,if-match,x-correlation-id,x-trace-id' \
            "$base/v1/tenants/uc03-smoke/journeys/00000000-0000-0000-0000-000000000001/booking/start" || true)"
          [[ "$cors_status" == 200 ]] || { cat /tmp/cors.headers; cat /tmp/cors.body; exit 1; }
          grep -Fqi "access-control-allow-origin: $DEV_WEB_ORIGIN" /tmp/cors.headers || { cat /tmp/cors.headers; exit 1; }
          echo 'AUDIT_CORE_C1_CORS=PASS'
