name: Patch UC02 Project Admin Authority

on:
  push:
    branches:
      - refactor/uc02-project-admin-workspace
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'refactor/uc02-project-admin-workspace') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[uc02-admin-authority-applied]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/uc02-project-admin-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          dep = Path('src/audit_core/dependencies.py')
          text = dep.read_text()
          marker = 'def require_project_admin_request('
          if marker not in text:
              addition = '''\n\ndef _has_tenant_admin_scope(context: SecurityAdminContext, tenant_id: str) -> bool:\n    return any(\n        scope.role_key == "TenantAdmin"\n        and scope.scope_type == "TENANT"\n        and scope.scope_id == tenant_id\n        for scope in context.admin_scopes\n    )\n\n\ndef require_project_admin_request(\n    tenant_id: str,\n    http_request: Request,\n    bearer_token: Annotated[str, Depends(get_bearer_token)],\n    human_principal: Annotated[HumanPrincipal, Depends(get_human_principal)],\n) -> HumanAdminRequest:\n    """Authorize UC02 administration for SuperAdmin or matching TenantAdmin.\n\n    Lightweight authenticated GETs retain their existing fast path. Mutations and\n    non-lightweight reads use Security's live/cached admin-context; authority is\n    never taken from the human JWT itself.\n    """\n    if _is_lightweight_authenticated_read(http_request):\n        return HumanAdminRequest(\n            user_id=human_principal.subject,\n            bearer_token=bearer_token,\n            admin_context=SecurityAdminContext(\n                user_id=human_principal.subject,\n                is_super_admin=False,\n                admin_scopes=(),\n            ),\n        )\n\n    request = _security_admin_context(\n        bearer_token=bearer_token,\n        human_principal=human_principal,\n    )\n    if request.admin_context.is_super_admin or _has_tenant_admin_scope(\n        request.admin_context, tenant_id\n    ):\n        return request\n    raise AuthorizationError(\n        error_code="VAC-AUTH-002",\n        status_code=403,\n        title="Permission denied",\n    )\n'''
              text = text.rstrip() + addition + '\n'
              dep.write_text(text)

          tenant_modules = [
              'src/audit_core/projects.py',
              'src/audit_core/dealers.py',
              'src/audit_core/role_mappings.py',
              'src/audit_core/mahindra_masters.py',
              'src/audit_core/mahindra_upload_state.py',
              'src/audit_core/project_masters.py',
              'src/audit_core/project_master_imports.py',
              'src/audit_core/readiness.py',
          ]
          for name in tenant_modules:
              path = Path(name)
              source = path.read_text()
              if 'require_super_admin_request' in source:
                  source = source.replace('require_super_admin_request', 'require_project_admin_request')
                  path.write_text(source)

          main = Path('src/audit_core/main.py')
          source = main.read_text()
          import_line = 'from audit_core.project_master_admin import router as project_master_admin_router\n'
          anchor = 'from audit_core.project_master_imports import router as project_master_import_router\n'
          if import_line not in source:
              if anchor not in source:
                  raise SystemExit('main import anchor missing')
              source = source.replace(anchor, import_line + anchor)
          include = '    application.include_router(project_master_admin_router)\n'
          include_anchor = '    application.include_router(project_master_router)\n'
          if include not in source:
              if include_anchor not in source:
                  raise SystemExit('main router anchor missing')
              source = source.replace(include_anchor, include + include_anchor)
          main.write_text(source)
          PY
      - name: Validate backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[test,lint]' >/dev/null
          ruff check --fix src/audit_core/project_master_admin.py
          ruff check src tests migrations
          pytest -q
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Verigence-admin'
          git config user.email 'admin@verigence.local'
          git add src/audit_core/dependencies.py src/audit_core/projects.py src/audit_core/dealers.py src/audit_core/role_mappings.py src/audit_core/mahindra_masters.py src/audit_core/mahindra_upload_state.py src/audit_core/project_masters.py src/audit_core/project_master_imports.py src/audit_core/project_master_admin.py src/audit_core/readiness.py src/audit_core/main.py
          if git diff --cached --quiet; then
            echo 'No source changes required'
            exit 0
          fi
          git commit -m 'feat: allow tenant-scoped UC02 project administration [uc02-admin-authority-applied]'
          git push origin HEAD:refactor/uc02-project-admin-workspace
