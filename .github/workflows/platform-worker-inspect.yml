name: Inspect DI worker runtime

on:
  workflow_dispatch:
  push:
    branches:
      - agent/unified-railway-platform
    paths:
      - .github/workflows/platform-worker-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      TARGET_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      TARGET_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Inspect worker deployment and logs
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$TARGET_PROJECT_ID" --environment "$TARGET_ENVIRONMENT_ID" --json >/dev/null
          railway deployment list --service di-worker --limit 3 --json >/tmp/deployments.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/deployments.json').read_text())
          for i,row in enumerate(rows[:3]):
              print(f"WORKER_DEPLOYMENT_{i}={row.get('id','')}|{row.get('status','')}")
          PY
          echo '--- WORKER LOGS ---'
          railway logs --service di-worker --latest --deployment --lines 300 || true
          echo '--- DEFAULT WORKER LOGS ---'
          railway logs --service di-worker --latest --lines 300 || true
