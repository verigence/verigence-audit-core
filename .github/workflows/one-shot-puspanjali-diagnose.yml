name: One-shot Duplicate booking rule run diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Run the duplicate matcher read-only on the real pair and print the rule history
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from datetime import datetime, date
          from sqlalchemy import create_engine, text
          from audit_core.db import set_tenant_context
          from audit_core import uc03_duplicate_booking_detection as d

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime, date)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False)[:900])

          T = "5fbe26ab-6ed7-444a-8488-5bfb81208588"
          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              set_tenant_context(c, T)
              ids = {r[0]: r[1] for r in c.execute(text("SELECT journey_reference, journey_id FROM auditcore.journeys WHERE journey_reference IN ('VJ2609-000023','VJ2610-000026')")).all()}
              print("journeys", ids)
              j26, j23 = ids["VJ2610-000026"], ids["VJ2609-000023"]
              sig = d._identity_signals(c, tenant_id=T, journey_id=j26)
              print("\nsignals VJ26:", json.dumps(sig, default=str))
              cands = d._candidate_journeys(c, tenant_id=T, journey_id=j26)
              for cand in cands:
                  basis = d._match_basis(sig, cand)
                  if basis:
                      print("candidate", cand["journey_id"], "basis", basis, "conf", d._CONFIDENCE_PERCENT_BY_BASIS[basis],
                            "pan", cand.get("pan"), "aadhaar", cand.get("aadhaar"), "mobile", cand.get("mobile"), "name", cand.get("name"))
              show("finding rows for VJ26 (payload, events)", c.execute(text("""
                  SELECT to_jsonb(f) - 'description' AS finding FROM auditcore.audit_findings f
                  WHERE f.journey_id=:j AND f.rule_key LIKE 'DUPLICATE_BOOKING%'"""), {"j": j26}).mappings().all())
              show("rule executions for VJ26", c.execute(text("""
                  SELECT to_jsonb(r) AS execution FROM auditcore.rule_executions r
                  WHERE r.journey_id=:j AND to_jsonb(r)::text ILIKE '%DUPLICATE_BOOKING%'
                  ORDER BY r.evaluated_at_utc"""), {"j": j26}).mappings().all())
              show("control state for VJ26 duplicate", c.execute(text("""
                  SELECT to_jsonb(s) AS state FROM auditcore.p2_control_state s
                  WHERE s.journey_id=:j AND to_jsonb(s)::text ILIKE '%DUPLICATE_BOOKING%'"""), {"j": j26}).mappings().all())
          PY
