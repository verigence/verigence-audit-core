name: One-shot Puspanjali stage diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Print the journeys, stage records, uploads and delivery rows
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from datetime import datetime, date
          from sqlalchemy import create_engine, text

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime, date)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False))

          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              js = c.execute(text("""
                  SELECT j.journey_id, j.tenant_id, cu.display_name, j.journey_reference, j.audit_state,
                         j.created_at_utc, j.updated_at_utc, j.review_completed_at_utc
                  FROM auditcore.journeys j
                  JOIN auditcore.customers cu ON cu.tenant_id=j.tenant_id AND cu.customer_id=j.customer_id
                  WHERE cu.display_name ILIKE 'PUSPANJALI%'
                  ORDER BY j.created_at_utc
              """)).mappings().all()
              show("journeys", js)
              for j in js:
                  p = {"j": j["journey_id"]}
                  show("p2_journey_runtime", c.execute(text("SELECT * FROM auditcore.p2_journey_runtime WHERE journey_id=:j"), p).mappings().all())
                  show("journey_stage_states", c.execute(text("""
                      SELECT stage_code, business_status, business_completed_at_utc, capture_completed_at_utc,
                             booking_confirm_date, closure_disposition, created_at_utc, updated_at_utc
                      FROM auditcore.journey_stage_states WHERE journey_id=:j ORDER BY stage_code"""), p).mappings().all())
                  show("deliveries", c.execute(text("SELECT * FROM auditcore.deliveries WHERE journey_id=:j"), p).mappings().all())
                  show("upload batches", c.execute(text("""
                      SELECT batch_id, original_filename, page_count, batch_status, created_at_utc
                      FROM auditcore.p2_upload_batches WHERE journey_id=:j ORDER BY created_at_utc"""), p).mappings().all())
                  show("page queue by status", c.execute(text("""
                      SELECT queue_status, template_key, last_error, count(*) AS pages
                      FROM auditcore.p2_document_queue WHERE journey_id=:j GROUP BY 1,2,3 ORDER BY 1"""), p).mappings().all())
                  show("capture documents by status", c.execute(text("""
                      SELECT stage_code, capture_status, count(*) AS n
                      FROM auditcore.document_capture_v2_documents WHERE journey_id=:j GROUP BY 1,2"""), p).mappings().all())
                  show("evidence", c.execute(text("""
                      SELECT process_area, document_type_key, association_status, count(*) AS n
                      FROM auditcore.evidence WHERE journey_id=:j GROUP BY 1,2,3 ORDER BY 1,2"""), p).mappings().all())
                  show("stage gates", c.execute(text("""
                      SELECT * FROM auditcore.p2_stage_gate_state WHERE journey_id=:j"""), p).mappings().all())
                  show("activity (stage / upload events)", c.execute(text("""
                      SELECT event_type, details, occurred_at_utc FROM auditcore.p2_activity_events
                      WHERE journey_id=:j ORDER BY occurred_at_utc LIMIT 40"""), p).mappings().all())
          PY
