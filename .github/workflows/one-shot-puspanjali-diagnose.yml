name: One-shot Security attendance RBAC inventory (DEV, read-only)

# Read-only. Prints table names, row counts and permission keys only (no secrets,
# no user data). Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli

      - name: Inventory
        shell: bash
        run: |
          set -uo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service security --json >/dev/null
          railway variable list --service security --json >/tmp/sec.json
          python - <<'PY'
          import json
          from pathlib import Path
          import psycopg

          v = json.loads(Path('/tmp/sec.json').read_text())
          print('security service has variables:', sorted(k for k in v if 'DATABASE' in k))

          def norm(u):
              for pre in ('postgresql+psycopg://', 'postgresql+asyncpg://', 'postgres://'):
                  if u.startswith(pre):
                      return 'postgresql://' + u[len(pre):]
              return u

          NEW9 = ['attendance.employee.manage', 'attendance.attendance.admin', 'attendance.leave.hr.approve',
                  'attendance.reimbursement.read', 'attendance.reimbursement.hr.approve',
                  'attendance.reimbursement.finance.approve', 'attendance.payroll.manage',
                  'attendance.config.manage', 'attendance.reimbursement.payment.manage']
          OLD13 = ['attendance.self.read', 'attendance.self.checkin', 'attendance.self.checkout', 'attendance.team.read',
                   'attendance.all.read', 'attendance.location.read', 'attendance.exception.read',
                   'attendance.exception.resolve', 'attendance.correction.write', 'attendance.policy.read',
                   'attendance.policy.manage', 'attendance.report.read', 'attendance.report.export']

          for key in ('DATABASE_URL', 'SECURITY_ROLE_DATABASE_URL'):
              if not v.get(key):
                  print(key, ': not set'); continue
              print('=====', key)
              try:
                  with psycopg.connect(norm(v[key]), connect_timeout=15,
                                       options='-c statement_timeout=20000 -c default_transaction_read_only=on') as c:
                      cur = c.cursor()
                      cur.execute('select current_user')
                      print('connected as role:', cur.fetchone()[0])
                      for tbl in ('permissions', 'module_roles', 'module_role_permissions', 'schema_migrations',
                                  'tenant_role_permissions', 'module_operating_role_permission_defaults'):
                          cur.execute("select has_table_privilege(current_user, %s, 'DELETE'), has_table_privilege(current_user, %s, 'UPDATE')",
                                      (f'security.{tbl}', f'security.{tbl}'))
                          d, u = cur.fetchone()
                          print(f'  privilege on security.{tbl}: DELETE={d} UPDATE={u}')
                      # ledger
                      cur.execute("select column_name from information_schema.columns where table_schema='security' and table_name='schema_migrations' order by ordinal_position")
                      print('ledger columns:', [r[0] for r in cur.fetchall()])
                      cur.execute("select migration_name from security.schema_migrations where migration_name ~* 'attend' order by 1")
                      print('ledger rows matching attendance:', [r[0] for r in cur.fetchall()])
                      cur.execute("select migration_name from security.schema_migrations order by 1 desc limit 3")
                      print('latest ledger rows:', [r[0] for r in cur.fetchall()])
                      # every security table with a permission_key / module_key column
                      cur.execute("""select table_name, column_name from information_schema.columns
                                     where table_schema='security' and column_name in ('permission_key','module_key')
                                     order by 1,2""")
                      cols = cur.fetchall()
                      print('tables with permission_key/module_key:', sorted({t for t, _ in cols}))
                      for t, col in cols:
                          if col == 'permission_key':
                              cur.execute(f'select count(*) from security."{t}" where permission_key = any(%s)', (NEW9,))
                              n_new = cur.fetchone()[0]
                              cur.execute(f'select count(*) from security."{t}" where permission_key = any(%s)', (OLD13,))
                              n_old = cur.fetchone()[0]
                              cur.execute(f'select count(*) from security."{t}" where permission_key like %s', ('attendance.%',))
                              n_any = cur.fetchone()[0]
                              print(f'  {t}.permission_key: new9={n_new} old13={n_old} any attendance.*={n_any}')
                          else:
                              cur.execute(f"select count(*) from security.\"{t}\" where module_key = 'attendance'")
                              print(f'  {t}.module_key=attendance: {cur.fetchone()[0]}')
                      cur.execute("select module_key, role_key, status from security.module_roles order by 1,2")
                      print('module_roles:', cur.fetchall())
                      cur.execute("select role_key, count(*) from security.module_role_permissions where module_key='attendance' group by 1 order by 1")
                      print('module_role_permissions by role:', cur.fetchall())
                      cur.execute("select permission_key, resource_key, catalog_version, status from security.permissions where permission_key like 'attendance.%' order by 1")
                      for r in cur.fetchall():
                          print('   perm', r)
                      cur.execute("select count(*) from security.user_module_role_assignments"); print('user_module_role_assignments rows:', cur.fetchone()[0])
                      cur.execute("select count(*) from security.user_global_module_role_assignments"); print('user_global_module_role_assignments rows:', cur.fetchone()[0])
                      # foreign keys that point at permissions / module_roles
                      cur.execute("""select conrelid::regclass::text, conname, confrelid::regclass::text
                                     from pg_constraint where contype='f' and confrelid in ('security.permissions'::regclass,'security.module_roles'::regclass)
                                     order by 1""")
                      print('foreign keys into permissions/module_roles:'); [print('   ', r) for r in cur.fetchall()]
              except Exception as exc:
                  print('inspect failed:', type(exc).__name__, str(exc)[:160])
          PY
