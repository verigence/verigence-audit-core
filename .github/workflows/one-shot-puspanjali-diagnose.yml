name: One-shot Ramakanta page health diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Ramakanta Sahoo page health, read-only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, date
          from decimal import Decimal
          from sqlalchemy import create_engine, text
          from audit_core.db import set_tenant_context
          from audit_core.uc03_p2_document_health import journey_document_health

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime, date)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False)[:700])

          T = "5fbe26ab-6ed7-444a-8488-5bfb81208588"
          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              set_tenant_context(c, T)
              j = c.execute(text("""SELECT j.journey_id, j.journey_reference, cu.legal_name, cu.display_name
                  FROM auditcore.journeys j JOIN auditcore.customers cu ON cu.tenant_id=j.tenant_id AND cu.customer_id=j.customer_id
                  WHERE j.tenant_id=:t AND (cu.legal_name ILIKE '%ramakanta%' OR cu.display_name ILIKE '%ramakanta%')"""), {"t": T}).mappings().all()
              show("journey", j)
              jid = j[0]["journey_id"]
              show("queue rows", c.execute(text("""
                  SELECT q.queue_id, q.page_number, q.page_numbers, q.queue_status, q.template_key, q.last_error,
                         q.type_overridden_by_actor_id IS NOT NULL AS type_set, q.di_document_id, q.di_submitted_at_utc,
                         q.updated_at_utc, b.original_filename, d.capture_status,
                         (SELECT COUNT(*) FROM auditcore.journey_document_extracted_fields f
                           WHERE f.tenant_id=q.tenant_id AND f.journey_id=q.journey_id AND f.di_document_id=q.di_document_id) AS fields
                  FROM auditcore.p2_document_queue q
                  JOIN auditcore.p2_upload_batches b ON b.tenant_id=q.tenant_id AND b.batch_id=q.batch_id
                  LEFT JOIN auditcore.document_capture_v2_documents d ON d.tenant_id=q.tenant_id AND d.journey_id=q.journey_id AND d.di_document_id=q.di_document_id
                  WHERE q.tenant_id=:t AND q.journey_id=:j ORDER BY b.created_at_utc, q.page_number"""), {"t": T, "j": jid}).mappings().all())
              show("evidence", c.execute(text("""
                  SELECT evidence_id, document_type_key, association_status, di_document_id, linked_at_utc
                  FROM auditcore.evidence WHERE tenant_id=:t AND journey_id=:j ORDER BY linked_at_utc"""), {"t": T, "j": jid}).mappings().all())
              show("fields per document", c.execute(text("""
                  SELECT di_document_id, source_document_type_key, COUNT(*) AS n
                  FROM auditcore.journey_document_extracted_fields WHERE tenant_id=:t AND journey_id=:j
                  GROUP BY 1,2 ORDER BY 2"""), {"t": T, "j": jid}).mappings().all())
              h = journey_document_health(c, tenant_id=T, journey_id=jid)
              print("\nhealth summary", h["summary"]); print("defects", json.dumps(h["defects"], default=str))
              show("activity", c.execute(text("""
                  SELECT created_at_utc, event_type, subject_type, details FROM auditcore.p2_activity_events
                  WHERE tenant_id=:t AND journey_id=:j AND (details::text ILIKE '%read%' OR event_type ILIKE '%PAGE%' OR event_type ILIKE '%DOC%')
                  ORDER BY event_id DESC LIMIT 25"""), {"t": T, "j": jid}).mappings().all())
          PY
