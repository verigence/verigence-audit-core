name: One-shot Attendance routes and database inspect (DEV, read-only)

# Read-only. Lists Railway services, where each deploys from, variable NAMES
# (never values) and, for the attendance database, schema/table names with row
# counts only. Never writes. Logs of this repo are public: nothing secret or
# row-level is printed.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli

      - name: Which routes does the attendance service answer? (unauthenticated GETs, status codes only)
        shell: bash
        run: |
          set -uo pipefail
          for p in /health /ready /employee-attendance/v1/me /employee-attendance/v1/admin/payroll-profiles /attendance/v1/tenants/x/policy /openapi.json; do
            code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://attendance-dev.up.railway.app$p" || echo ERR)"
            echo "$p -> $code"
          done

      - name: Attendance database vs Audit Core database (booleans, schemas, tables, row counts only)
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          python - <<'PY'
          import json, subprocess
          from urllib.parse import urlparse, urlunparse
          import psycopg

          def vars_of(name):
              r = subprocess.run(['railway', 'variable', 'list', '--service', name, '--json'], capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode == 0 else {}

          def norm(url):
              for pre in ('postgresql+psycopg://', 'postgresql+asyncpg://', 'postgres://'):
                  if url.startswith(pre):
                      return 'postgresql://' + url[len(pre):]
              return url

          def ident(url):
              u = urlparse(norm(url))
              return (u.hostname, u.port, (u.path or '').lstrip('/'))

          audit = vars_of('verigence-audit-core')
          audit_internal = ident(audit['DATABASE_URL'])
          att = vars_of('attendance')
          att_url = att.get('ATTENDANCE_DATABASE_URL', '')
          if not att_url:
              print('attendance service has no ATTENDANCE_DATABASE_URL')
              raise SystemExit(0)
          ai = ident(att_url)
          print('attendance DB host+port same as Audit Core DB host+port:', ai[:2] == audit_internal[:2])
          print('attendance DB name same as Audit Core DB name:', ai[2] == audit_internal[2])
          for other in ('verigence-p2-worker', 'security', 'di-api', 'analytics', 'audit-api'):
              v = vars_of(other)
              for key in ('DATABASE_URL', 'DI_DATABASE_URL', 'ANALYTICS_DB_URL', 'AUDIT_DB_URL'):
                  if v.get(key):
                      oi = ident(v[key])
                      print(f'{other}.{key}: same host+port as attendance DB: {oi[:2] == ai[:2]}; same database name: {oi[2] == ai[2]}')

          # connect: same host as Audit Core -> use Audit Core's public URL host with the attendance db name and login
          pub = urlparse(norm(audit['DATABASE_PUBLIC_URL']))
          att_u = urlparse(norm(att_url))
          if ai[:2] == audit_internal[:2]:
              netloc = f"{att_u.username}:{att_u.password}@{pub.hostname}:{pub.port}"
              target = urlunparse(('postgresql', netloc, att_u.path, '', '', ''))
          else:
              target = norm(att_url)
          try:
              with psycopg.connect(target, connect_timeout=15, options='-c statement_timeout=20000 -c default_transaction_read_only=on') as c:
                  cur = c.cursor()
                  cur.execute("select current_setting('server_version'), current_database()")
                  ver, db = cur.fetchone()
                  print('connected; postgres', ver, '| database:', db)
                  cur.execute("""select table_schema, count(*) from information_schema.tables
                                 where table_schema not in ('pg_catalog','information_schema') group by 1 order by 1""")
                  for schema, n in cur.fetchall():
                      print(f'  schema {schema}: {n} tables')
                  cur.execute("""select table_schema, table_name from information_schema.tables
                                 where table_schema not in ('pg_catalog','information_schema','auditcore') and table_type='BASE TABLE' order by 1,2""")
                  for schema, t in cur.fetchall():
                      cur.execute(f'select count(*) from "{schema}"."{t}"')
                      print(f'    {schema}.{t}: {cur.fetchone()[0]} rows')
          except Exception as exc:
              print('db inspect failed:', type(exc).__name__)
          PY
