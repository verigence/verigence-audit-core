name: One-shot Prateek deal amount diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Print Prateek's journeys, invoice documents, tax fields and deal sources
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from datetime import datetime, date
          from sqlalchemy import create_engine, text

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime, date)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False))

          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              js = c.execute(text("""
                  SELECT j.journey_id, j.journey_reference, cu.display_name, j.created_at_utc
                  FROM auditcore.journeys j JOIN auditcore.customers cu ON cu.tenant_id=j.tenant_id AND cu.customer_id=j.customer_id
                  WHERE cu.display_name ILIKE 'PRATEEK%' ORDER BY j.created_at_utc""")).mappings().all()
              show("journeys", js)
              for j in js:
                  p = {"j": j["journey_id"]}
                  print("\n######## journey", j["journey_reference"], j["journey_id"])
                  show("deal source values", c.execute(text("""
                      SELECT line_kind, component_key, source_document_type, amount, source_document_id
                      FROM auditcore.commercial_line_source_values WHERE journey_id=:j
                      ORDER BY line_kind, component_key, source_document_type"""), p).mappings().all())
                  show("invoice-type evidence", c.execute(text("""
                      SELECT di_document_id, document_type_key, association_status, process_area
                      FROM auditcore.evidence WHERE journey_id=:j
                        AND document_type_key IN ('customer_invoice_dms','tax_invoice_tally','accessory_invoice_dms','accessory_invoice_tally','credit_note','debit_note')"""), p).mappings().all())
                  show("invoice amount fields", c.execute(text("""
                      SELECT source_document_type_key, di_document_id, field_key, effective_value
                      FROM auditcore.journey_document_extracted_fields WHERE journey_id=:j
                        AND source_document_type_key IN ('customer_invoice_dms','tax_invoice_tally')
                        AND field_key IN ('gross_amount_before_discount','invoice_discount_amount','taxable_amount','cgst_amount','sgst_amount','igst_amount','cess_amount','tcs_amount','grand_total_amount','invoice_number')
                      ORDER BY source_document_type_key, di_document_id, field_key"""), p).mappings().all())
          PY
