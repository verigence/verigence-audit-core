name: One-shot Attendance service inspect (DEV, read-only)

# Read-only. Lists Railway services, where each deploys from, variable NAMES
# (never values) and, for the attendance database, schema/table names with row
# counts only. Never writes. Logs of this repo are public: nothing secret or
# row-level is printed.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli

      - name: Railway services and deployment sources
        shell: bash
        run: |
          set -uo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway status --json >/tmp/status.json 2>/tmp/status.err || { echo 'status failed:'; head -c 400 /tmp/status.err; }
          python - <<'PY'
          import json
          from pathlib import Path
          try:
              s = json.loads(Path('/tmp/status.json').read_text())
          except Exception as exc:
              print('could not read status json:', type(exc).__name__)
              raise SystemExit(0)
          print('project:', s.get('name'))
          envs = s.get('environments', {}).get('edges', [])
          for e in envs:
              node = e['node']
              print('environment:', node.get('name'))
              for si in node.get('serviceInstances', {}).get('edges', []):
                  n = si['node']
                  dep = n.get('latestDeployment') or {}
                  meta = dep.get('meta') or {}
                  src = n.get('source') or {}
                  domains = (n.get('domains') or {})
                  doms = [d.get('domain') for d in domains.get('serviceDomains', [])] + [d.get('domain') for d in domains.get('customDomains', [])]
                  print('---')
                  print('service:', n.get('serviceName'))
                  print('  source repo:', src.get('repo'), '| image:', src.get('image'), '| root:', meta.get('rootDirectory'))
                  print('  deploy repo/branch:', meta.get('repo'), '/', meta.get('branch'))
                  print('  commit:', (meta.get('commitHash') or '')[:10], '|', (meta.get('commitMessage') or '').splitlines()[0:1])
                  print('  status:', dep.get('status'), '| created:', dep.get('createdAt'))
                  print('  builder:', n.get('builder'), '| start:', n.get('startCommand'), '| pre-deploy:', n.get('preDeployCommand'))
                  print('  domains:', doms)
          PY

      - name: Variable names per service (values never printed)
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          s = json.loads(Path('/tmp/status.json').read_text())
          names = []
          for e in s.get('environments', {}).get('edges', []):
              for si in e['node'].get('serviceInstances', {}).get('edges', []):
                  names.append(si['node'].get('serviceName'))
          for name in names:
              r = subprocess.run(['railway', 'variable', 'list', '--service', name, '--json'], capture_output=True, text=True)
              if r.returncode != 0:
                  print(name, ': variable list failed')
                  continue
              try:
                  keys = sorted(json.loads(r.stdout).keys())
              except Exception:
                  print(name, ': unreadable')
                  continue
              keep = [k for k in keys if not k.startswith('RAILWAY_')]
              print('---', name, f'({len(keep)} variables)')
              print('  ', ', '.join(keep))
          PY

      - name: Attendance database, same instance as Audit Core? schemas, tables, row counts only
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import json, subprocess
          from urllib.parse import urlparse
          import psycopg
          from pathlib import Path

          s = json.loads(Path('/tmp/status.json').read_text())
          names = []
          for e in s.get('environments', {}).get('edges', []):
              for si in e['node'].get('serviceInstances', {}).get('edges', []):
                  names.append(si['node'].get('serviceName'))

          def vars_of(name):
              r = subprocess.run(['railway', 'variable', 'list', '--service', name, '--json'], capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode == 0 else {}

          def ident(url):
              if not url:
                  return None
              u = urlparse(url.replace('postgresql+psycopg://', 'postgresql://').replace('postgresql+asyncpg://', 'postgresql://'))
              return (u.hostname, u.port, (u.path or '').lstrip('/'))

          audit = vars_of('verigence-audit-core')
          audit_ids = {ident(audit.get('DATABASE_URL')), ident(audit.get('DATABASE_PUBLIC_URL'))} - {None}
          for name in names:
              v = vars_of(name)
              url = v.get('VERIGENCE_ATTENDANCE_DATABASE_URL')
              if not url:
                  continue
              print('service with VERIGENCE_ATTENDANCE_DATABASE_URL:', name)
              same = ident(url) in audit_ids
              print('  same host/port/database as Audit Core DATABASE_URL:', same)
              public = v.get('VERIGENCE_ATTENDANCE_DATABASE_PUBLIC_URL') or url
              raw = public.replace('postgresql+psycopg://', 'postgresql://').replace('postgresql+asyncpg://', 'postgresql://').replace('postgres://', 'postgresql://')
              try:
                  with psycopg.connect(raw, connect_timeout=15, options='-c statement_timeout=20000 -c default_transaction_read_only=on') as c:
                      cur = c.cursor()
                      cur.execute("select current_setting('server_version')")
                      print('  postgres version:', cur.fetchone()[0])
                      cur.execute("""select table_schema, count(*) from information_schema.tables
                                     where table_schema not in ('pg_catalog','information_schema')
                                     group by 1 order by 1""")
                      for schema, n in cur.fetchall():
                          print(f'  schema {schema}: {n} tables')
                      cur.execute("""select table_schema, table_name from information_schema.tables
                                     where table_schema not in ('pg_catalog','information_schema','auditcore') and table_type='BASE TABLE'
                                     order by 1,2""")
                      tables = cur.fetchall()
                      for schema, t in tables:
                          cur.execute(f'select count(*) from "{schema}"."{t}"')
                          print(f'    {schema}.{t}: {cur.fetchone()[0]} rows')
              except Exception as exc:
                  print('  db inspect failed:', type(exc).__name__)
          PY
