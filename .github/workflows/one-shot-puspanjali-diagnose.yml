name: One-shot Puspanjali stage diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Print documents, queue pages and stage records with times
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from datetime import datetime, date
          from sqlalchemy import create_engine, text

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime, date)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False))

          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              p = {"j": "dc9b79f4-1885-4ef1-9f80-92fb39919389"}
              print("now:", c.execute(text("SELECT now()")).scalar())
              show("runtime now", c.execute(text("SELECT current_stage, booking_completion_state, delivery_completion_state, created_at_utc, updated_at_utc FROM auditcore.p2_journey_runtime WHERE journey_id=:j"), p).mappings().all())
              show("queue pages by status now", c.execute(text("SELECT queue_status, count(*) AS pages, min(created_at_utc) AS first, max(updated_at_utc) AS last_update FROM auditcore.p2_document_queue WHERE journey_id=:j GROUP BY 1"), p).mappings().all())
              show("evidence rows (what the journey holds)", c.execute(text("""
                  SELECT e.process_area, e.document_type_key, e.association_status, e.created_at_utc,
                         e.di_document_id, (q.queue_id IS NOT NULL) AS in_queue, q.queue_status, q.page_number
                  FROM auditcore.evidence e
                  LEFT JOIN auditcore.p2_document_queue q ON q.tenant_id=e.tenant_id AND q.journey_id=e.journey_id AND q.di_document_id=e.di_document_id
                  WHERE e.journey_id=:j ORDER BY e.created_at_utc"""), p).mappings().all())
              show("capture documents", c.execute(text("""
                  SELECT capture_status, classified_document_type_key, count(*) AS n, min(created_at_utc) AS first, max(created_at_utc) AS last
                  FROM auditcore.document_capture_v2_documents WHERE journey_id=:j GROUP BY 1,2 ORDER BY 1,2"""), p).mappings().all())
              show("queue pages (first 40)", c.execute(text("""
                  SELECT page_number, queue_status, template_key, classified_document_type, di_document_id IS NOT NULL AS has_di_doc,
                         di_submitted_at_utc, updated_at_utc, last_error
                  FROM auditcore.p2_document_queue WHERE journey_id=:j ORDER BY page_number LIMIT 40"""), p).mappings().all())
              show("activity events", c.execute(text("SELECT to_jsonb(e) AS ev FROM auditcore.p2_activity_events e WHERE journey_id=:j LIMIT 60"), p).mappings().all())
              show("work queue for the journey", c.execute(text("""
                  SELECT work_type, work_status, attempt_count, created_at_utc, updated_at_utc, last_error
                  FROM auditcore.p2_work_queue WHERE journey_id=:j ORDER BY created_at_utc LIMIT 30"""), p).mappings().all())
          PY
