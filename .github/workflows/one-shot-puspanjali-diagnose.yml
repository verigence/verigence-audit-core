name: One-shot Ramakanta evidence diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Ramakanta evidence void reasons and the failed re-read, read-only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, date
          from decimal import Decimal
          from sqlalchemy import create_engine, text
          from audit_core.db import set_tenant_context

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime, date)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False)[:900])

          T = "5fbe26ab-6ed7-444a-8488-5bfb81208588"
          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              set_tenant_context(c, T)
              jid = c.execute(text("""SELECT j.journey_id FROM auditcore.journeys j JOIN auditcore.customers cu
                  ON cu.tenant_id=j.tenant_id AND cu.customer_id=j.customer_id
                  WHERE j.tenant_id=:t AND (cu.legal_name ILIKE '%ramakanta%' OR cu.display_name ILIKE '%ramakanta%')"""), {"t": T}).scalar_one()
              show("evidence of the journey", c.execute(text("""
                  SELECT evidence_id, document_type_key, association_status, void_reason, voided_by_actor_id, voided_at_utc,
                         supersedes_evidence_id, di_document_id, linked_at_utc, journey_document_requirement_id
                  FROM auditcore.evidence WHERE tenant_id=:t AND journey_id=:j ORDER BY linked_at_utc"""), {"t": T, "j": jid}).mappings().all())
              show("work items for the journey", c.execute(text("""
                  SELECT work_type, work_key, work_status, attempt_count, last_error, created_at_utc, updated_at_utc
                  FROM auditcore.p2_work_queue WHERE tenant_id=:t AND journey_id=:j
                    AND work_type IN ('PAGE_REREAD','DOCUMENT_RECONCILE','DOCUMENT_INGEST') ORDER BY updated_at_utc DESC LIMIT 12"""), {"t": T, "j": jid}).mappings().all())
              show("tenant: void reasons on evidence", c.execute(text("""
                  SELECT association_status, COALESCE(void_reason,'-') AS void_reason, COUNT(*) AS n,
                         MIN(voided_at_utc) AS first, MAX(voided_at_utc) AS last
                  FROM auditcore.evidence WHERE tenant_id=:t AND association_status<>'ACTIVE'
                  GROUP BY 1,2 ORDER BY 3 DESC"""), {"t": T}).mappings().all())
              show("tenant: pages settled SUPPORTING with a real type", c.execute(text("""
                  SELECT j.journey_reference, q.template_key, q.page_number, q.updated_at_utc,
                         (SELECT association_status||'/'||COALESCE(void_reason,'-') FROM auditcore.evidence e
                           WHERE e.tenant_id=q.tenant_id AND e.di_document_id=q.di_document_id LIMIT 1) AS evidence,
                         (SELECT COUNT(*) FROM auditcore.evidence e2 WHERE e2.tenant_id=q.tenant_id AND e2.journey_id=q.journey_id
                            AND e2.document_type_key=q.template_key AND e2.association_status='ACTIVE') AS active_same_type
                  FROM auditcore.p2_document_queue q JOIN auditcore.journeys j ON j.tenant_id=q.tenant_id AND j.journey_id=q.journey_id
                  WHERE q.tenant_id=:t AND q.queue_status='SUPPORTING' AND q.template_key NOT IN ('supporting_document','')
                    AND q.template_key IS NOT NULL ORDER BY j.journey_reference, q.page_number"""), {"t": T}).mappings().all())
          PY
