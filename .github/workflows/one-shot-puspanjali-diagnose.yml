name: One-shot List variance, task counts and live build diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Which build is the DEV API running
        shell: bash
        run: |
          railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 400 2>/dev/null \
            | grep -oE 'version[": =]+[0-9a-f]{7,40}' | sort | uniq -c | sort -rn | head -5 || true
          railway deployment list --service "$AUDIT_SERVICE" --limit 4 --json 2>/dev/null | python -c "import json,sys; [print(r.get('id'), r.get('status'), r.get('createdAt'), str(r.get('meta',{}))[:160]) for r in json.load(sys.stdin)]" || true

      - name: Print task counts per journey, Hero totals and list price variance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from datetime import datetime, date
          from sqlalchemy import create_engine, text

          def show(title, rows):
              print(f"\n===== {title} ({len(rows)})")
              for r in rows:
                  print(json.dumps({k: (str(v) if isinstance(v, (Decimal, datetime, date)) else v) for k, v in dict(r).items()},
                                   default=str, ensure_ascii=False))

          T = "5fbe26ab-6ed7-444a-8488-5bfb81208588"
          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              p = {"t": T}
              show("per journey: stage, closed, open p2 tasks, open legacy tasks", c.execute(text("""
                  SELECT j.journey_reference, cu.display_name, pr.current_stage, (pr.journey_id IS NOT NULL) AS has_runtime,
                         (ds.business_completed_at_utc IS NOT NULL) AS delivery_done,
                         (bs.business_status IN ('BOOKING_CANCELLED','DUPLICATE_BOOKING') OR bs.closure_disposition='NO_DELIVERY') AS cancelled,
                         (SELECT COUNT(*) FROM auditcore.p2_tasks t WHERE t.tenant_id=j.tenant_id AND t.journey_id=j.journey_id
                            AND t.task_status NOT IN ('VERIFIED_COMPLETE','CANCELLED','FAILED','DEAD_LETTER')) AS open_p2,
                         (SELECT COUNT(*) FROM auditcore.workflow_tasks w WHERE w.tenant_id=j.tenant_id AND w.journey_id=j.journey_id
                            AND w.assigned_role_code IN ('PC','TL','PM','EXECUTIVE')
                            AND w.task_status IN ('PENDING','READY','CLAIMED','IN_PROGRESS','RETRY_WAIT')) AS open_legacy
                  FROM auditcore.journeys j
                  JOIN auditcore.customers cu ON cu.tenant_id=j.tenant_id AND cu.customer_id=j.customer_id
                  LEFT JOIN auditcore.p2_journey_runtime pr ON pr.tenant_id=j.tenant_id AND pr.journey_id=j.journey_id
                  LEFT JOIN auditcore.journey_stage_states bs ON bs.tenant_id=j.tenant_id AND bs.journey_id=j.journey_id AND bs.stage_code='BOOKING'
                  LEFT JOIN auditcore.journey_stage_states ds ON ds.tenant_id=j.tenant_id AND ds.journey_id=j.journey_id AND ds.stage_code='DELIVERY'
                  WHERE j.tenant_id=:t ORDER BY j.journey_reference"""), p).mappings().all())
              show("Hero style total: every open p2 task on every journey", c.execute(text("""
                  SELECT COUNT(*) AS open_p2_all_journeys FROM auditcore.p2_tasks
                  WHERE tenant_id=:t AND task_status NOT IN ('VERIFIED_COMPLETE','CANCELLED','FAILED','DEAD_LETTER')"""), p).mappings().all())
              show("open p2 tasks by type", c.execute(text("""
                  SELECT task_type, assigned_role_code, count(*) AS n FROM auditcore.p2_tasks
                  WHERE tenant_id=:t AND task_status NOT IN ('VERIFIED_COMPLETE','CANCELLED','FAILED','DEAD_LETTER')
                  GROUP BY 1,2 ORDER BY n DESC"""), p).mappings().all())
              show("list variance inputs for the two Prateek journeys", c.execute(text("""
                  SELECT j.journey_reference, cl.component_key, cl.standard_amount, cl.actual_amount,
                         (SELECT s.amount FROM auditcore.commercial_line_source_values s WHERE s.tenant_id=cl.tenant_id AND s.journey_id=cl.journey_id
                            AND s.line_kind='COMMERCIAL' AND s.component_key=cl.component_key
                            AND s.source_document_type NOT IN ('booking_form','booking_docket','order_taking_form','customer_ledger','cost_sheet')
                          ORDER BY s.updated_at_utc DESC LIMIT 1) AS non_booking_source
                  FROM auditcore.commercial_lines cl JOIN auditcore.journeys j ON j.tenant_id=cl.tenant_id AND j.journey_id=cl.journey_id
                  WHERE j.journey_id IN ('20f1de3c-46a7-4ac9-a7c1-dd9c39035255','749e6c59-facc-489f-bf5b-6e087f2e319a')
                  ORDER BY j.journey_reference, cl.component_key"""), p).mappings().all())
              show("list variance: discount applications", c.execute(text("""
                  SELECT j.journey_reference, da.discount_key, da.standard_eligible_amount, da.actual_discount_amount
                  FROM auditcore.discount_applications da JOIN auditcore.journeys j ON j.tenant_id=da.tenant_id AND j.journey_id=da.journey_id
                  WHERE j.journey_id IN ('20f1de3c-46a7-4ac9-a7c1-dd9c39035255','749e6c59-facc-489f-bf5b-6e087f2e319a')
                  ORDER BY 1,2"""), p).mappings().all())
          PY
