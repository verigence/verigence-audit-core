name: One-shot Hero counts diagnose (DEV, read-only)

# Read-only: one customer's journeys. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-puspanjali-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-puspanjali-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Resolve Railway DEV database connection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          raw="$(python - <<'PY'
          import json
          from pathlib import Path
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(variables.get('DATABASE_PUBLIC_URL') or variables.get('DATABASE_URL') or '')
          PY
          )"
          [[ -n "$raw" ]] || { echo '::error::no DATABASE_URL on the DEV service.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) url="$raw" ;;
            postgresql+asyncpg://*) url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::DATABASE_URL is not a PostgreSQL URL.'; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Hero counts vs rows, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from sqlalchemy import create_engine, text
          from audit_core.db import set_tenant_context
          import audit_core.uc03_p2_api as api

          T = "5fbe26ab-6ed7-444a-8488-5bfb81208588"
          src = open(api.__file__).read()
          a = src.index('def journeys_summary')
          start = src.index('WITH scoped AS (', a)
          end = src.index('"""', start)
          HERO = src[start:end]
          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"options": "-c statement_timeout=60000"})
          with engine.connect() as c:
              c.execute(text("SET TRANSACTION READ ONLY"))
              set_tenant_context(c, T)
              actors = c.execute(text("""SELECT DISTINCT security_actor_id, business_role_code, dealer_id IS NULL AS tenant_wide
                  FROM auditcore.business_assignments WHERE tenant_id=:t AND assignment_status='ACTIVE'
                  AND effective_from <= now() AND (effective_to IS NULL OR effective_to >= now())"""), {"t": T}).all()
              print("actors:", [(a[0][:8], a[1], a[2]) for a in actors])
              for actor, role, wide in actors:
                  row = c.execute(text(HERO), {"tenant_id": T, "actor_id": actor}).mappings().one()
                  print("HERO as", actor[:8], role, "wide" if wide else "scoped", {k: (str(v) if v is not None else None) for k, v in row.items() if k in ("open_bookings","open_deliveries","closed_bookings","closed_deliveries","open_tasks")})
              print()
              for r in c.execute(text("""
                  SELECT j.journey_reference, pr.current_stage, bs.business_status AS bstatus,
                         bs.business_completed_at_utc IS NOT NULL AS b_done, ds.journey_id IS NOT NULL AS has_ds_row,
                         ds.business_completed_at_utc IS NOT NULL AS d_done, dl.journey_id IS NOT NULL AS has_dl_row,
                         (SELECT COUNT(*) FROM auditcore.p2_tasks t WHERE t.tenant_id=j.tenant_id AND t.journey_id=j.journey_id
                            AND t.task_status NOT IN ('VERIFIED_COMPLETE','CANCELLED','FAILED','DEAD_LETTER')) AS p2_open,
                         (SELECT COUNT(*) FROM auditcore.p2_tasks t WHERE t.tenant_id=j.tenant_id AND t.journey_id=j.journey_id
                            AND t.task_status NOT IN ('VERIFIED_COMPLETE','CANCELLED','FAILED','DEAD_LETTER') AND t.assigned_role_code='PC') AS pc_open,
                         (SELECT COUNT(*) FROM auditcore.p2_tasks t WHERE t.tenant_id=j.tenant_id AND t.journey_id=j.journey_id
                            AND t.task_status NOT IN ('VERIFIED_COMPLETE','CANCELLED','FAILED','DEAD_LETTER') AND t.assigned_role_code IN ('TL','PM')) AS tl_open
                  FROM auditcore.journeys j
                  LEFT JOIN auditcore.p2_journey_runtime pr ON pr.tenant_id=j.tenant_id AND pr.journey_id=j.journey_id
                  LEFT JOIN auditcore.journey_stage_states bs ON bs.tenant_id=j.tenant_id AND bs.journey_id=j.journey_id AND bs.stage_code='BOOKING'
                  LEFT JOIN auditcore.journey_stage_states ds ON ds.tenant_id=j.tenant_id AND ds.journey_id=j.journey_id AND ds.stage_code='DELIVERY'
                  LEFT JOIN auditcore.deliveries dl ON dl.tenant_id=j.tenant_id AND dl.journey_id=j.journey_id
                  WHERE j.tenant_id=:t ORDER BY j.created_at_utc"""), {"t": T}).mappings():
                  print(dict(r))
          PY
