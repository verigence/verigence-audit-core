name: One-shot Missing documents report verify (read-only)

# Read-only: the figures behind the Tracker's "Who is doing what" PCs table and the
# daily duties (duty days missed, cash register, bank statement, photos). Counts only,
# people as short hashes: this repository is public. Never writes.
on:
  workflow_dispatch:
  push:
    branches: [claude/missing-docs-verify]
    paths:
      - '.github/workflows/one-shot-missing-docs-verify.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e . 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli@5.70.0
      - name: Reach the live database
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json > /tmp/vars.json
          url="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          v = json.load(open('/tmp/vars.json'))
          for key in ('DATABASE_PUBLIC_URL', 'DATABASE_URL'):
              value = (v.get(key) or '').replace('postgresql+psycopg://', 'postgresql://', 1)
              host = (urlparse(value).hostname or '').lower()
              if value and host and not host.endswith('.railway.internal'):
                  print(value)
                  break
          PY
          )"
          test -n "$url"
          echo "::add-mask::$url"
      - name: The report as built, read-only
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta
          from sqlalchemy import create_engine
          from audit_core.db import set_tenant_context
          from audit_core.uc03_p2_missing_documents import build_missing_documents
          T = "afa9e32b-e62f-4cbc-be2b-7ab7ad5ef572"
          e = create_engine(os.environ["DB"].replace("postgresql://", "postgresql+psycopg://", 1))
          with e.connect() as c:
              c.exec_driver_sql("SET TRANSACTION READ ONLY")
              set_tenant_context(c, T)
              from audit_core.uc03_p2_missing_documents import _all_outlets
              outlets = _all_outlets(c, T)
              last = date(2026, 11, 24)
              r = build_missing_documents(c, tenant_id=T, outlets=outlets, first=last - timedelta(days=30), last=last)
              c.rollback()
          print("TOTALS", r["totals"])
          for d in r["byDocument"]:
              print("DOC", d["count"], "|", d["name"], "| outlets:", len(d["byOutlet"]), "| sum:", sum(o["count"] for o in d["byOutlet"]))
          combined = [d["name"] for d in r["byDocument"] if "missing documents" in d["name"].lower()]
          print("COMBINED_NAMES_LEFT", len(combined))
          per = [len(j["documents"]) for day in r["days"] for j in day["journeys"]]
          print("FILES", len(per), "DOCS", sum(per), "MAX_PER_FILE", max(per) if per else 0)
          PY
