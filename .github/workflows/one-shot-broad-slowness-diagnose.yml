name: One-shot diagnose broad slowness / pool exhaustion

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-broad-slowness-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Read filtered Audit Core runtime errors
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway logs --service "$AUDIT_SERVICE" --lines 2000 > /tmp/audit-runtime.log 2>&1 || true
          wc -l /tmp/audit-runtime.log
          echo "=== counts of key signals ==="
          grep -ci "http_request_slow" /tmp/audit-runtime.log || true
          grep -ci "QueuePool limit\|pool_timeout\|TimeoutError\|could not obtain a connection\|remaining connection slots\|too many connections" /tmp/audit-runtime.log || true
          grep -ci "statement timeout\|QueryCanceled\|deadlock" /tmp/audit-runtime.log || true
          grep -ci "500 Internal\|VAC-SYS-001\|unhandled_exception" /tmp/audit-runtime.log || true
          echo "=== last 40 http_request_slow lines (with duration) ==="
          grep -i "http_request_slow" /tmp/audit-runtime.log | tail -40 || true
          echo "=== any pool/connection errors, full context ==="
          python - <<'PY'
          import re
          from pathlib import Path
          lines = Path('/tmp/audit-runtime.log').read_text(errors='replace').splitlines()
          markers = (
              'QueuePool', 'pool_timeout', 'could not obtain a connection',
              'remaining connection slots', 'too many connections', 'TimeoutError',
              'QueryCanceled', 'deadlock', 'OperationalError', 'InterfaceError',
          )
          selected = set()
          for i, line in enumerate(lines):
              if any(m.lower() in line.lower() for m in markers):
                  for j in range(max(0, i-5), min(len(lines), i+15)):
                      selected.add(j)
          out = [lines[i] for i in sorted(selected)]
          text = '\n'.join(out[-300:])
          text = re.sub(r'\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b', '<uuid>', text)
          print(text or 'NO_POOL_OR_TIMEOUT_ERRORS_FOUND')
          PY
