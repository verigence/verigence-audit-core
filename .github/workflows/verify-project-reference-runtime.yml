name: Verify Project page authenticated startup

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      SECURITY_SERVICE: security
      WEB_ORIGIN: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - name: Install tooling
        run: |
          npm install --global @railway/cli
          python -m pip install 'psycopg[binary]>=3.2,<4' 'PyJWT>=2.9,<3' 'cryptography>=44,<46'

      - name: Reproduce authenticated Project page startup calls
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json

          python - <<'PY'
          import json, os, uuid
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import jwt, psycopg, urllib.request, urllib.error

          audit = json.loads(Path('/tmp/audit-vars.json').read_text())
          security = json.loads(Path('/tmp/security-vars.json').read_text())
          security_db = str(security.get('DATABASE_URL','')).replace('postgresql+psycopg://','postgresql://',1)
          with psycopg.connect(security_db) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT ei.user_id
                    FROM security.external_identities ei
                    JOIN security.user_admin_role_assignments a ON a.user_id=ei.user_id
                    WHERE ei.provider='CLERK'
                      AND ei.provider_subject=%s
                      AND ei.status='ACTIVE'
                      AND a.role_key='SuperAdmin'
                      AND a.scope_type='PLATFORM'
                      AND a.scope_id IS NULL
                      AND a.status='ACTIVE'
                    LIMIT 1
                  """, ('user_3I7FdD5Pkmydsp23OfjH9hBMxpN',))
                  row = cur.fetchone()
                  if not row: raise SystemExit('CANONICAL_SUPERADMIN_NOT_FOUND')
                  user_id = str(row[0])

          private_key = str(security.get('SECURITY_PRIVATE_KEY_PEM','')).replace('\\n','\n')
          key_id = str(security.get('SECURITY_KEY_ID','')).strip()
          issuer = str(security.get('SECURITY_TOKEN_ISSUER','verigence-security')).strip()
          audience = str(security.get('SECURITY_TOKEN_AUDIENCE','verigence-platform')).strip()
          now = datetime.now(timezone.utc)
          token = jwt.encode({
              'iss': issuer, 'sub': user_id, 'aud': audience,
              'iat': now, 'exp': now + timedelta(minutes=5),
              'jti': str(uuid.uuid4()), 'actor_type': 'USER',
          }, private_key, algorithm='RS256', headers={'kid': key_id})
          print('DEV_SUPERADMIN_TOKEN_MINT=PASS')

          audit_base = 'https://' + str(audit.get('RAILWAY_PUBLIC_DOMAIN','')).strip()
          security_base = 'https://' + str(security.get('RAILWAY_PUBLIC_DOMAIN','')).strip()

          def call(label, url):
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + token,
                  'Origin': os.environ['WEB_ORIGIN'],
                  'Accept': 'application/json',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      status, body, headers = resp.status, resp.read().decode(), resp.headers
              except urllib.error.HTTPError as exc:
                  status, body, headers = exc.code, exc.read().decode(), exc.headers
              print(f'{label}_HTTP={status}')
              print(f'{label}_CORS=' + ('PASS' if headers.get('Access-Control-Allow-Origin','') == os.environ['WEB_ORIGIN'] else 'FAIL'))
              correlation = headers.get('X-Correlation-ID','').strip()
              if correlation:
                  Path('/tmp/projects-correlation.txt').write_text(correlation)
                  print(f'{label}_CORRELATION_PRESENT=YES')
              try:
                  parsed = json.loads(body)
                  print(f'{label}_JSON=PASS')
              except Exception:
                  print(f'{label}_JSON=FAIL')
                  return status, None
              if status >= 400 and isinstance(parsed, dict):
                  for key in ('code','status','title'):
                      value = parsed.get(key)
                      if value is not None:
                          print(f'{label}_PROBLEM_{key.upper()}={value}')
              return status, parsed

          status, admin = call('SECURITY_ADMIN_CONTEXT', security_base + '/security/v1/platform/admin-context')
          if status != 200: raise SystemExit('SECURITY_ADMIN_CONTEXT_FAILED')

          project_status, projects = call('AUDIT_PROJECTS', audit_base + '/v1/projects')
          if project_status == 200:
              print('AUDIT_PROJECTS_SHAPE=' + ('LIST' if isinstance(projects, list) else 'INVALID'))
              if isinstance(projects, list): print('AUDIT_PROJECTS_COUNT=' + str(len(projects)))

          ref_status, refs = call('AUDIT_REFERENCE_DATA', audit_base + '/v1/project-reference-data')
          if ref_status == 200 and isinstance(refs, dict):
              print('AUDIT_REFERENCE_SHAPE=' + ('PASS' if isinstance(refs.get('oems'), list) and isinstance(refs.get('productCategories'), list) else 'FAIL'))
              print('AUDIT_REFERENCE_OEM_COUNT=' + str(len(refs.get('oems',[]))))
              print('AUDIT_REFERENCE_CATEGORY_COUNT=' + str(len(refs.get('productCategories',[]))))

          Path('/tmp/startup-result.txt').write_text(f'{project_status},{ref_status}')
          PY

          sleep 2
          echo '--- CORRELATED AUDIT CORE ERROR ---'
          if [ -s /tmp/projects-correlation.txt ]; then
            correlation="$(cat /tmp/projects-correlation.txt)"
            railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 5000 2>/dev/null \
              | grep -F "$correlation" \
              | tail -n 40 || true
          fi
          echo '--- RECENT SYSTEM ERRORS ---'
          railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 5000 2>/dev/null \
            | grep -E 'system_error|api_error|project_directory_dependency_failed' \
            | tail -n 80 || true

          result="$(cat /tmp/startup-result.txt)"
          [ "$result" = '200,200' ] || exit 1
