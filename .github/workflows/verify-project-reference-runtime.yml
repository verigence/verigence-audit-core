name: Verify Project page authenticated startup

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      SECURITY_SERVICE: security
      WEB_ORIGIN: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - name: Install tooling
        run: |
          npm install --global @railway/cli
          python -m pip install 'psycopg[binary]>=3.2,<4' 'PyJWT>=2.9,<3' 'cryptography>=44,<46'

      - name: Reproduce authenticated Project page startup calls
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/dev/null
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json

          python - <<'PY'
          import json, os, uuid
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import jwt, psycopg, urllib.request, urllib.error

          audit = json.loads(Path('/tmp/audit-vars.json').read_text())
          security = json.loads(Path('/tmp/security-vars.json').read_text())

          security_db = str(security.get('DATABASE_URL','')).replace('postgresql+psycopg://','postgresql://',1)
          if not security_db:
              raise SystemExit('SECURITY_DATABASE_URL_MISSING')
          with psycopg.connect(security_db) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT ei.user_id
                    FROM security.external_identities ei
                    JOIN security.user_admin_role_assignments a ON a.user_id=ei.user_id
                    WHERE ei.provider='CLERK'
                      AND ei.provider_subject=%s
                      AND ei.status='ACTIVE'
                      AND a.role_key='SuperAdmin'
                      AND a.scope_type='PLATFORM'
                      AND a.scope_id IS NULL
                      AND a.status='ACTIVE'
                    LIMIT 1
                  """, ('user_3I7FdD5Pkmydsp23OfjH9hBMxpN',))
                  row = cur.fetchone()
                  if not row:
                      raise SystemExit('CANONICAL_SUPERADMIN_NOT_FOUND')
                  user_id = str(row[0])

          private_key = str(security.get('SECURITY_PRIVATE_KEY_PEM','')).replace('\\n','\n')
          key_id = str(security.get('SECURITY_KEY_ID','')).strip()
          issuer = str(security.get('SECURITY_TOKEN_ISSUER','verigence-security')).strip()
          audience = str(security.get('SECURITY_TOKEN_AUDIENCE','verigence-platform')).strip()
          if not private_key or not key_id:
              raise SystemExit('SECURITY_SIGNING_CONFIG_MISSING')
          now = datetime.now(timezone.utc)
          token = jwt.encode({
              'iss': issuer,
              'sub': user_id,
              'aud': audience,
              'iat': now,
              'exp': now + timedelta(minutes=5),
              'jti': str(uuid.uuid4()),
              'actor_type': 'USER',
          }, private_key, algorithm='RS256', headers={'kid': key_id})
          print('DEV_SUPERADMIN_TOKEN_MINT=PASS')

          audit_domain = str(audit.get('RAILWAY_PUBLIC_DOMAIN','')).strip()
          security_domain = str(security.get('RAILWAY_PUBLIC_DOMAIN','')).strip()
          if not audit_domain or not security_domain:
              raise SystemExit('PUBLIC_DOMAIN_MISSING')
          audit_base = 'https://' + audit_domain
          security_base = 'https://' + security_domain

          def call(label, url):
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + token,
                  'Origin': os.environ['WEB_ORIGIN'],
                  'Accept': 'application/json',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      status = resp.status
                      body = resp.read().decode('utf-8')
                      headers = resp.headers
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read().decode('utf-8')
                  headers = exc.headers
              print(f'{label}_HTTP={status}')
              cors = headers.get('Access-Control-Allow-Origin','')
              print(f'{label}_CORS=' + ('PASS' if cors == os.environ['WEB_ORIGIN'] else 'FAIL'))
              try:
                  parsed = json.loads(body)
              except Exception:
                  print(f'{label}_JSON=FAIL')
                  raise SystemExit(1)
              print(f'{label}_JSON=PASS')
              return status, parsed

          status, admin = call('SECURITY_ADMIN_CONTEXT', security_base + '/security/v1/platform/admin-context')
          if status != 200 or not isinstance(admin, dict):
              raise SystemExit('SECURITY_ADMIN_CONTEXT_FAILED')

          status, projects = call('AUDIT_PROJECTS', audit_base + '/v1/projects')
          if status != 200 or not isinstance(projects, list):
              raise SystemExit('AUDIT_PROJECTS_FAILED')
          print('AUDIT_PROJECTS_SHAPE=LIST')
          print('AUDIT_PROJECTS_COUNT=' + str(len(projects)))

          status, refs = call('AUDIT_REFERENCE_DATA', audit_base + '/v1/project-reference-data')
          if status != 200 or not isinstance(refs, dict):
              raise SystemExit('AUDIT_REFERENCE_DATA_FAILED')
          if not isinstance(refs.get('oems'), list) or not isinstance(refs.get('productCategories'), list):
              raise SystemExit('AUDIT_REFERENCE_SHAPE_FAILED')
          print('AUDIT_REFERENCE_SHAPE=PASS')
          print('AUDIT_REFERENCE_OEM_COUNT=' + str(len(refs['oems'])))
          print('AUDIT_REFERENCE_CATEGORY_COUNT=' + str(len(refs['productCategories'])))
          PY
