name: Verify UC02 DEV end-to-end

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-dev-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SECURITY_SERVICE: security
      AUDIT_SERVICE: verigence-audit-core
      DI_API_SERVICE: di-api
      DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
      SECURITY_DEPLOYMENT_ID: 2d7b9b7d-f07e-43d6-a879-f3fa6fa52229
      AUDIT_DEPLOYMENT_ID: c49c1c56-c5c7-429c-8ac0-236332749a90
      DI_API_DEPLOYMENT_ID: c4f56d40-9051-47ca-a005-adb752214165

    steps:
      - name: Install isolated acceptance tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          python -m pip install --disable-pip-version-check \
            'sqlalchemy>=2,<3' 'psycopg[binary]>=3,<4' 'PyJWT>=2,<3' \
            'cryptography>=45,<47' 'requests>=2,<3' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Freeze exact DEV deployments and load runtime variables
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo 'RAILWAY_API_TOKEN is not configured'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          for service in "$SECURITY_SERVICE" "$AUDIT_SERVICE" "$DI_API_SERVICE"; do
            railway deployment list --service "$service" --limit 1 --json >"/tmp/${service}-deployment.json"
          done
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          railway variable list --service "$DI_API_SERVICE" --json >/tmp/di-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = {
              os.environ['SECURITY_SERVICE']: os.environ['SECURITY_DEPLOYMENT_ID'],
              os.environ['AUDIT_SERVICE']: os.environ['AUDIT_DEPLOYMENT_ID'],
              os.environ['DI_API_SERVICE']: os.environ['DI_API_DEPLOYMENT_ID'],
          }
          for service, deployment_id in expected.items():
              rows = json.loads(Path(f'/tmp/{service}-deployment.json').read_text())
              if not rows or rows[0].get('id') != deployment_id or rows[0].get('status') != 'SUCCESS':
                  raise SystemExit(f'{service} DEV deployment moved or is not SUCCESS')
              print(f'UC02_E2E_DEPLOYMENT=PASS|{service}|{deployment_id}')
          PY

      - name: Run deployed UC02 browser, API and database acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, uuid
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          import jwt
          import requests
          from playwright.sync_api import sync_playwright
          from sqlalchemy import create_engine, text

          run_id = os.environ['GITHUB_RUN_ID']
          project_name = 'UC02-E2E-' + run_id
          idempotency_key = 'uc02-e2e-' + run_id + '-project'
          correlation_id = 'uc02-e2e-' + run_id
          dealer_id = None
          outlet_id = None
          tenant_id = None
          operation_id = None

          def read_json(path):
              return json.loads(Path(path).read_text())

          def sa_url(value):
              value = str(value or '').strip()
              if value.startswith('postgres://'):
                  return 'postgresql+psycopg://' + value[len('postgres://'):]
              if value.startswith('postgresql://'):
                  return 'postgresql+psycopg://' + value[len('postgresql://'):]
              return value

          def public_base(values):
              domain = values.get('RAILWAY_PUBLIC_DOMAIN') or values.get('RAILWAY_STATIC_URL') or ''
              if not domain:
                  raise SystemExit('Required DEV public domain is missing')
              return domain.rstrip('/') if domain.startswith(('http://', 'https://')) else 'https://' + domain.rstrip('/')

          security = read_json('/tmp/security-vars.json')
          audit = read_json('/tmp/audit-vars.json')
          di = read_json('/tmp/di-vars.json')
          security_db = sa_url(security.get('DATABASE_URL'))
          audit_db = sa_url(audit.get('DATABASE_URL'))
          di_db = sa_url(di.get('DI_DATABASE_URL') or di.get('DATABASE_URL'))
          if not security_db or not audit_db or not di_db:
              raise SystemExit('One or more DEV database URLs are unavailable')

          security_base = public_base(security)
          audit_base = public_base(audit)
          di_base = public_base(di)

          with create_engine(security_db).connect() as conn:
              admin_ids = conn.execute(text('''
                  SELECT DISTINCT u.user_id
                  FROM security.users u
                  JOIN security.security_principals sp ON sp.principal_id=u.user_id
                  JOIN security.external_identities ei
                    ON ei.user_id=u.user_id AND ei.provider='CLERK' AND ei.status='ACTIVE'
                  JOIN security.user_admin_role_assignments a ON a.user_id=u.user_id
                  WHERE u.status='ACTIVE'
                    AND sp.actor_type='USER' AND sp.status='ACTIVE'
                    AND a.role_key='SuperAdmin' AND a.scope_type='PLATFORM'
                    AND a.scope_id IS NULL AND a.status='ACTIVE'
                  ORDER BY u.user_id
              ''')).scalars().all()
          if not admin_ids:
              raise SystemExit('No approved active DEV platform administrator exists')
          user_id = str(admin_ids[0])

          private_key = str(security.get('SECURITY_PRIVATE_KEY_PEM', '')).replace('\\n', '\n')
          key_id = str(security.get('SECURITY_KEY_ID', ''))
          if not private_key or not key_id:
              raise SystemExit('Security DEV signing configuration is unavailable')
          now = datetime.now(UTC)
          token = jwt.encode(
              {
                  'iss': str(security.get('SECURITY_TOKEN_ISSUER') or 'verigence-security'),
                  'sub': user_id,
                  'aud': str(security.get('SECURITY_TOKEN_AUDIENCE') or 'verigence-platform'),
                  'iat': now,
                  'exp': now + timedelta(minutes=15),
                  'jti': str(uuid.uuid4()),
                  'actor_type': 'USER',
              },
              private_key,
              algorithm='RS256',
              headers={'kid': key_id},
          )
          print('::add-mask::' + token)
          auth_headers = {
              'Authorization': 'Bearer ' + token,
              'Origin': os.environ['DEV_WEB_URL'],
              'X-Correlation-ID': correlation_id + '-verify',
          }

          admin = requests.get(
              security_base + '/security/v1/platform/admin-context',
              headers=auth_headers,
              timeout=20,
          )
          if admin.status_code != 200 or admin.json().get('userId') != user_id or admin.json().get('isSuperAdmin') is not True:
              raise SystemExit('Live Security administrative context failed')
          print('UC02_E2E_ADMIN_CONTEXT=PASS')

          with create_engine(audit_db).connect() as conn:
              oem_id = conn.execute(text('SELECT oem_id FROM auditcore.oems WHERE is_active=true ORDER BY oem_id LIMIT 1')).scalar_one_or_none()
              category_id = conn.execute(text('SELECT product_category_id FROM auditcore.product_categories WHERE is_active=true ORDER BY product_category_id LIMIT 1')).scalar_one_or_none()
          if oem_id is None or category_id is None:
              raise SystemExit('Audit Core DEV has no active OEM/Product Category reference data')
          payload = {
              'projectName': project_name,
              'oemId': str(oem_id),
              'productCategoryId': str(category_id),
              'effectiveStartDate': now.date().isoformat(),
              'effectiveEndDate': None,
              'timezoneName': 'Asia/Kolkata',
              'regionCode': 'E2E',
          }
          print('UC02_E2E_REFERENCE_DATA=PASS')
          print('UC02_E2E_PROJECT_TAG=' + project_name)

          # The create request originates inside the deployed Cloudflare Web page. If
          # browser CORS blocks either preflight or actual response, page.evaluate fails.
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  page = browser.new_page()
                  page.goto(os.environ['DEV_WEB_URL'] + '/login', wait_until='domcontentloaded', timeout=60000)
                  result = page.evaluate(
                      '''async (args) => {
                        const response = await fetch(args.base + '/v1/projects', {
                          method: 'POST',
                          mode: 'cors',
                          headers: {
                            'Authorization': 'Bearer ' + args.token,
                            'Content-Type': 'application/json',
                            'Idempotency-Key': args.idempotencyKey,
                            'X-Correlation-ID': args.correlationId,
                          },
                          body: JSON.stringify(args.payload),
                        });
                        return {
                          status: response.status,
                          correlationId: response.headers.get('x-correlation-id'),
                          body: await response.text(),
                        };
                      }''',
                      {
                          'base': audit_base,
                          'token': token,
                          'payload': payload,
                          'idempotencyKey': idempotency_key,
                          'correlationId': correlation_id,
                      },
                  )
              finally:
                  browser.close()
          if result['status'] not in (201, 202):
              raise SystemExit('Browser Project create failed HTTP ' + str(result['status']) + ': ' + result['body'][:500])
          if result.get('correlationId') != correlation_id:
              raise SystemExit('Browser could not read the preserved X-Correlation-ID')
          state = json.loads(result['body'])
          operation_id = state.get('operationId')
          if not operation_id:
              raise SystemExit('Browser Project create returned no operationId')
          print('UC02_BROWSER_CORS_AUTHENTICATED_CREATE=PASS')
          print('UC02_CREATE_HTTP=' + str(result['status']))
          print('UC02_CREATE_OPERATION=' + operation_id)
          print('UC02_CREATE_CORRELATION=' + correlation_id)

          for _ in range(4):
              if state.get('provisioningStatus') == 'READY' and state.get('currentStep') == 'COMPLETE':
                  break
              if state.get('provisioningStatus') == 'RECOVERY_REQUIRED':
                  response = requests.post(
                      audit_base + f'/v1/project-provisioning-operations/{operation_id}/retry',
                      headers=auth_headers,
                      timeout=30,
                  )
              else:
                  time.sleep(2)
                  response = requests.get(
                      audit_base + f'/v1/project-provisioning-operations/{operation_id}',
                      headers=auth_headers,
                      timeout=30,
                  )
              if response.status_code not in (200, 202):
                  raise SystemExit('Project provisioning continuation failed HTTP ' + str(response.status_code) + ': ' + response.text[:500])
              state = response.json()
          if state.get('provisioningStatus') != 'READY' or state.get('currentStep') != 'COMPLETE':
              raise SystemExit('Project provisioning did not reach READY/COMPLETE: ' + json.dumps(state))
          tenant_id = state.get('tenantId')
          if not tenant_id:
              raise SystemExit('Completed provisioning returned no tenantId')
          print('UC02_PROJECT_PROVISIONING=PASS|' + tenant_id)

          replay = requests.post(
              audit_base + '/v1/projects',
              headers={**auth_headers, 'Idempotency-Key': idempotency_key},
              json=payload,
              timeout=30,
          )
          if replay.status_code not in (200, 201, 202):
              raise SystemExit('Idempotent replay failed HTTP ' + str(replay.status_code))
          replay_body = replay.json()
          if replay_body.get('operationId') != operation_id or replay_body.get('tenantId') != tenant_id:
              raise SystemExit('Idempotent replay created a different operation/Tenant')
          print('UC02_PROJECT_IDEMPOTENT_REPLAY=PASS')

          changed = dict(payload)
          changed['projectName'] = project_name + '-DIFFERENT'
          conflict = requests.post(
              audit_base + '/v1/projects',
              headers={**auth_headers, 'Idempotency-Key': idempotency_key},
              json=changed,
              timeout=30,
          )
          if conflict.status_code != 409:
              raise SystemExit('Changed payload with same idempotency key did not fail 409; HTTP ' + str(conflict.status_code))
          print('UC02_PROJECT_IDEMPOTENCY_CONFLICT=PASS')

          project = requests.get(audit_base + f'/v1/tenants/{tenant_id}/project', headers=auth_headers, timeout=30)
          if project.status_code != 200:
              raise SystemExit('Project GET failed HTTP ' + str(project.status_code))
          project_body = project.json()
          if project_body.get('projectName') != project_name or project_body.get('projectStatus') != 'CONFIGURING':
              raise SystemExit('Project persisted state does not match create request')
          etag = project.headers.get('ETag')
          old_version = project_body.get('versionNo')
          if not etag or not isinstance(old_version, int):
              raise SystemExit('Project GET did not return valid ETag/versionNo')
          print('UC02_PROJECT_GET=PASS|ETAG=' + etag)

          patch = requests.patch(
              audit_base + f'/v1/tenants/{tenant_id}/project',
              headers={**auth_headers, 'If-Match': etag},
              json={'regionCode': 'E2E-' + run_id},
              timeout=30,
          )
          if patch.status_code != 200 or patch.json().get('versionNo') != old_version + 1:
              raise SystemExit('Project optimistic update failed: HTTP ' + str(patch.status_code) + ' ' + patch.text[:300])
          print('UC02_PROJECT_PATCH=PASS')

          stale = requests.patch(
              audit_base + f'/v1/tenants/{tenant_id}/project',
              headers={**auth_headers, 'If-Match': etag},
              json={'regionCode': 'STALE'},
              timeout=30,
          )
          if stale.status_code != 409:
              raise SystemExit('Stale If-Match did not fail 409; HTTP ' + str(stale.status_code))
          print('UC02_PROJECT_STALE_ETAG=PASS')

          # Exercise Project Administration steps 2, 3, 4 and 6 without retaining child test data.
          try:
              dealer = requests.post(
                  audit_base + f'/v1/tenants/{tenant_id}/dealers',
                  headers=auth_headers,
                  json={'dealerName': 'UC02 E2E Dealer ' + run_id},
                  timeout=30,
              )
              if dealer.status_code != 201:
                  raise SystemExit('Dealer create failed: HTTP ' + str(dealer.status_code) + ' ' + dealer.text[:300])
              dealer_id = dealer.json()['dealerId']

              outlet = requests.post(
                  audit_base + f'/v1/tenants/{tenant_id}/dealers/{dealer_id}/outlets',
                  headers=auth_headers,
                  json={
                      'outletName': 'UC02 E2E Outlet ' + run_id,
                      'outletClassification': 'ONSITE',
                      'city': 'E2E',
                      'monthlyVehicleVolume': 1,
                  },
                  timeout=30,
              )
              if outlet.status_code != 201:
                  raise SystemExit('Outlet create failed: HTTP ' + str(outlet.status_code) + ' ' + outlet.text[:300])
              outlet_id = outlet.json()['outletId']
              print('UC02_DEALER_OUTLET_CREATE=PASS')

              candidates = requests.get(
                  audit_base + f'/v1/tenants/{tenant_id}/role-mapping-candidates?limit=100',
                  headers=auth_headers,
                  timeout=30,
              )
              if candidates.status_code != 200 or not isinstance(candidates.json(), list):
                  raise SystemExit('Employee browse failed')
              print('UC02_EMPLOYEE_BROWSE=PASS|COUNT=' + str(len(candidates.json())))

              masters = requests.get(
                  audit_base + f'/v1/tenants/{tenant_id}/project-masters',
                  headers=auth_headers,
                  timeout=30,
              )
              if masters.status_code != 200 or not isinstance(masters.json(), list) or not masters.json():
                  raise SystemExit('Project Masters catalogue failed')
              owners = sorted({str(row.get('ownerModule')) for row in masters.json()})
              print('UC02_PROJECT_MASTERS_CATALOG=PASS|OWNERS=' + ','.join(owners))

              readiness = requests.get(
                  audit_base + f'/v1/tenants/{tenant_id}/project/readiness',
                  headers=auth_headers,
                  timeout=30,
              )
              if readiness.status_code != 200:
                  raise SystemExit('Project readiness failed HTTP ' + str(readiness.status_code))
              ready = readiness.json()
              checks = {row['checkKey']: row for row in ready.get('checks', [])}
              for key in ('PROJECT_SETUP_COMPLETE', 'SECURITY_TENANT_LIFECYCLE', 'DEALER_OUTLET_STRUCTURE'):
                  if checks.get(key, {}).get('status') != 'PASS':
                      raise SystemExit('Expected readiness PASS missing for ' + key)
              if ready.get('readyToActivate') is not False:
                  raise SystemExit('Incomplete test Project was incorrectly ready to activate')
              print('UC02_READINESS_BLOCKERS=PASS')

              blocked = requests.post(
                  audit_base + f'/v1/tenants/{tenant_id}/project/activate',
                  headers={**auth_headers, 'Idempotency-Key': 'uc02-e2e-' + run_id + '-activate'},
                  timeout=30,
              )
              if blocked.status_code != 409:
                  raise SystemExit('Incomplete Project activation did not fail closed with 409; HTTP ' + str(blocked.status_code))
              print('UC02_ACTIVATION_FAIL_CLOSED=PASS')

              security_tenant = requests.get(
                  security_base + f'/security/v1/platform/tenants/{tenant_id}',
                  headers=auth_headers,
                  timeout=30,
              )
              if security_tenant.status_code != 200:
                  raise SystemExit('Security Tenant GET failed HTTP ' + str(security_tenant.status_code))
              sec_body = security_tenant.json()
              if sec_body.get('tenantName') != project_name or sec_body.get('status') != 'CONFIGURING':
                  raise SystemExit('Security Tenant state mismatch or blocked activation changed lifecycle')
              print('UC02_SECURITY_TENANT_API=PASS')

              di_provision = requests.get(
                  di_base + f'/v1/tenants/{tenant_id}/admin/provisioning',
                  headers=auth_headers,
                  timeout=30,
              )
              if di_provision.status_code != 200 or (di_provision.json().get('data') or {}).get('provisioningStatus') != 'READY':
                  raise SystemExit('DI Tenant provisioning is not READY')
              print('UC02_DI_PROVISIONING_API=PASS')

              with create_engine(security_db).connect() as conn:
                  row = conn.execute(
                      text('SELECT tenant_name,status FROM security.tenants WHERE tenant_id=:tid'),
                      {'tid': tenant_id},
                  ).mappings().one_or_none()
                  if row is None or row['tenant_name'] != project_name or row['status'] != 'CONFIGURING':
                      raise SystemExit('Security DB Tenant evidence mismatch')
              print('UC02_SECURITY_DB=PASS')

              with create_engine(audit_db).connect() as conn:
                  row = conn.execute(
                      text('SELECT project_name,project_status,version_no FROM auditcore.projects WHERE tenant_id=:tid'),
                      {'tid': tenant_id},
                  ).mappings().one_or_none()
                  if row is None or row['project_name'] != project_name or row['project_status'] != 'CONFIGURING' or row['version_no'] < old_version + 1:
                      raise SystemExit('Audit Core DB Project evidence mismatch')
              print('UC02_AUDIT_CORE_DB=PASS')

              with create_engine(di_db).connect() as conn:
                  settings_count = conn.execute(
                      text('SELECT count(*) FROM docintel.tenant_settings WHERE tenant_id=:tid'),
                      {'tid': tenant_id},
                  ).scalar_one()
                  retention_count = conn.execute(text('''
                      SELECT count(*)
                      FROM docintel.tenant_settings ts
                      JOIN docintel.retention_policies rp
                        ON rp.tenant_id=ts.tenant_id AND rp.retention_policy_id=ts.active_retention_policy_id
                      WHERE ts.tenant_id=:tid AND rp.status='ACTIVE'
                  '''), {'tid': tenant_id}).scalar_one()
                  doc_type_count = conn.execute(
                      text('SELECT count(*) FROM docintel.tenant_document_types WHERE tenant_id=:tid'),
                      {'tid': tenant_id},
                  ).scalar_one()
                  if settings_count != 1 or retention_count < 1 or doc_type_count < 1:
                      raise SystemExit('DI DB provisioning evidence mismatch')
              print('UC02_DI_DB=PASS')
          finally:
              # Dealer/Outlet delete APIs are supported; clean them even if a later assertion fails.
              if tenant_id and dealer_id and outlet_id:
                  impact = requests.get(
                      audit_base + f'/v1/tenants/{tenant_id}/dealers/{dealer_id}/outlets/{outlet_id}/deletion-impact',
                      headers=auth_headers,
                      timeout=30,
                  )
                  if impact.status_code == 200 and impact.json().get('canDelete') is True:
                      deleted = requests.delete(
                          audit_base + f'/v1/tenants/{tenant_id}/dealers/{dealer_id}/outlets/{outlet_id}',
                          headers={**auth_headers, 'Idempotency-Key': 'uc02-e2e-' + run_id + '-delete-outlet'},
                          timeout=30,
                      )
                      if deleted.status_code == 204:
                          outlet_id = None
              if tenant_id and dealer_id and outlet_id is None:
                  impact = requests.get(
                      audit_base + f'/v1/tenants/{tenant_id}/dealers/{dealer_id}/deletion-impact',
                      headers=auth_headers,
                      timeout=30,
                  )
                  if impact.status_code == 200 and impact.json().get('canDelete') is True:
                      deleted = requests.delete(
                          audit_base + f'/v1/tenants/{tenant_id}/dealers/{dealer_id}',
                          headers={**auth_headers, 'Idempotency-Key': 'uc02-e2e-' + run_id + '-delete-dealer'},
                          timeout=30,
                      )
                      if deleted.status_code == 204:
                          dealer_id = None

          if dealer_id is not None or outlet_id is not None:
              raise SystemExit('Supported child test-data cleanup did not complete')
          print('UC02_CHILD_TEST_DATA_CLEANUP=PASS')
          print('UC02_DEV_E2E=PASS')
          print('UC02_E2E_TENANT=' + tenant_id)
          print('UC02_E2E_OPERATION=' + operation_id)
          print('UC02_E2E_PROJECT=' + project_name)
          print('UC02_END_TO_END_VERDICT=PASS')
          PY
