name: One-shot publish MahindraOrissa August policy

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-publish-mahindraorissa-policy-202608.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Publish in ephemeral Railway private-network sandbox
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json

          # Railway resolves Postgres.DATABASE_URL server-side. The sandbox joins
          # the DEV private network, so postgres.railway.internal remains private.
          railway sandbox create \
            --private-network \
            --variable DATABASE_URL=Postgres.DATABASE_URL \
            --idle-timeout-minutes 5 \
            --json >/tmp/sandbox.json

          cleanup() {
            railway sandbox destroy >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # The sandbox is disposable. Install only the tiny runtime needed for
          # this one transaction; nothing is added to the deployed service.
          railway sandbox exec --timeout 180 -- sh -lc '
            set -eu
            if ! command -v python3 >/dev/null 2>&1; then
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip >/dev/null
            fi
            if ! python3 -m pip --version >/dev/null 2>&1; then
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip >/dev/null
            fi
            python3 -m pip install --quiet --break-system-packages "psycopg[binary]>=3.3,<4"
          '

          cat >/tmp/publish_policy.py <<'PY'
          from __future__ import annotations

          import os
          from datetime import date

          import psycopg
          from psycopg.rows import dict_row

          TARGET_KEY = "mahindraorissa"
          EFFECTIVE_FROM = date(2026, 8, 1)
          EFFECTIVE_ON = date(2026, 8, 30)
          ACTOR = "dev-master-publication-20260830"
          MINIMUM_BOOKING_AMOUNT = 21000
          MR_PERCENT = 4


          def fail(message: str) -> None:
              raise RuntimeError("Safety stop: " + message)


          with psycopg.connect(os.environ["DATABASE_URL"], row_factory=dict_row) as connection:
              with connection.transaction():
                  projects = connection.execute(
                      """
                      SELECT tenant_id, project_code, project_name
                      FROM auditcore.projects
                      WHERE regexp_replace(lower(coalesce(project_code, '')), '[^a-z0-9]+', '', 'g') = %s
                         OR regexp_replace(lower(coalesce(project_name, '')), '[^a-z0-9]+', '', 'g') = %s
                      ORDER BY created_at_utc DESC
                      """,
                      (TARGET_KEY, TARGET_KEY),
                  ).fetchall()
                  if len(projects) != 1:
                      fail(f"expected exactly one MahindraOrissa DEV project, found {len(projects)}")

                  tenant_id = projects[0]["tenant_id"]
                  dealers = connection.execute(
                      """
                      SELECT dealer_id, dealer_code
                      FROM auditcore.dealers
                      WHERE tenant_id = %s
                      ORDER BY dealer_code, dealer_id
                      """,
                      (tenant_id,),
                  ).fetchall()
                  if len(dealers) != 2:
                      fail(f"MahindraOrissa must have exactly two Dealers; found {len(dealers)}")
                  dealer_ids = [row["dealer_id"] for row in dealers]

                  current = connection.execute(
                      """
                      SELECT discount_policy_version_id, version_no, effective_from, effective_to
                      FROM auditcore.discount_policy_versions
                      WHERE tenant_id = %s
                        AND lifecycle_status IN ('PUBLISHED', 'RETIRED')
                        AND effective_from <= %s
                        AND (effective_to IS NULL OR effective_to >= %s)
                      ORDER BY effective_from DESC, version_no DESC, discount_policy_version_id DESC
                      LIMIT 1
                      """,
                      (tenant_id, EFFECTIVE_ON, EFFECTIVE_ON),
                  ).fetchone()

                  if current is not None:
                      minimum_ok = connection.execute(
                          """
                          SELECT count(*) = 1 AS ok
                          FROM auditcore.discount_policy_parameters
                          WHERE tenant_id = %s
                            AND discount_policy_version_id = %s
                            AND scope_type = 'PROJECT'
                            AND parameter_key = 'MINIMUM_BOOKING_AMOUNT'
                            AND value_type = 'NUMBER'
                            AND value_number = %s
                            AND unit = 'INR'
                          """,
                          (
                              tenant_id,
                              current["discount_policy_version_id"],
                              MINIMUM_BOOKING_AMOUNT,
                          ),
                      ).fetchone()["ok"]

                      current_mr_ids = {
                          row["dealer_id"]
                          for row in connection.execute(
                              """
                              SELECT dealer_id
                              FROM auditcore.discount_policy_parameters
                              WHERE tenant_id = %s
                                AND discount_policy_version_id = %s
                                AND scope_type = 'DEALER'
                                AND parameter_key = 'MR_MAX_PERCENT_PREVIOUS_MONTH_RETAIL'
                                AND value_type = 'NUMBER'
                                AND value_number = %s
                                AND unit = 'PERCENT'
                              """,
                              (
                                  tenant_id,
                                  current["discount_policy_version_id"],
                                  MR_PERCENT,
                              ),
                          ).fetchall()
                      }
                      if minimum_ok and current_mr_ids == set(dealer_ids):
                          print("PROJECT=MahindraOrissa")
                          print("DEALER_COUNT=2")
                          print("MINIMUM_BOOKING_AMOUNT=21000 INR")
                          print("MR_PERCENT_EACH=4")
                          print(f"VERSION_NO={current['version_no']}")
                          print("RESULT=ALREADY_PUBLISHED")
                          raise SystemExit(0)

                      if current["effective_from"] > EFFECTIVE_FROM:
                          fail("a newer-dated effective policy already exists; refusing to backdate over it")

                  next_version = connection.execute(
                      """
                      SELECT coalesce(max(version_no), 0) + 1 AS version_no
                      FROM auditcore.discount_policy_versions
                      WHERE tenant_id = %s
                      """,
                      (tenant_id,),
                  ).fetchone()["version_no"]

                  new_version_id = connection.execute(
                      """
                      INSERT INTO auditcore.discount_policy_versions (
                          tenant_id, version_no, effective_from, effective_to,
                          lifecycle_status, created_by_actor_id
                      ) VALUES (%s, %s, %s, %s, 'DRAFT', %s)
                      RETURNING discount_policy_version_id
                      """,
                      (
                          tenant_id,
                          next_version,
                          EFFECTIVE_FROM,
                          current["effective_to"] if current is not None else None,
                          ACTOR,
                      ),
                  ).fetchone()["discount_policy_version_id"]

                  if current is not None:
                      connection.execute(
                          """
                          INSERT INTO auditcore.discount_policy_parameters (
                              tenant_id, discount_policy_version_id, scope_type,
                              segment_id, scope_key, dealer_id, parameter_key,
                              value_type, value_number, value_text, unit, notes,
                              source_import_row_no
                          )
                          SELECT tenant_id, %s, scope_type,
                                 segment_id, scope_key, dealer_id, parameter_key,
                                 value_type, value_number, value_text, unit, notes,
                                 source_import_row_no
                          FROM auditcore.discount_policy_parameters
                          WHERE tenant_id = %s
                            AND discount_policy_version_id = %s
                          """,
                          (
                              new_version_id,
                              tenant_id,
                              current["discount_policy_version_id"],
                          ),
                      )

                  connection.execute(
                      """
                      DELETE FROM auditcore.discount_policy_parameters
                      WHERE tenant_id = %s
                        AND discount_policy_version_id = %s
                        AND scope_type = 'PROJECT'
                        AND parameter_key = 'MINIMUM_BOOKING_AMOUNT'
                      """,
                      (tenant_id, new_version_id),
                  )
                  connection.execute(
                      """
                      INSERT INTO auditcore.discount_policy_parameters (
                          tenant_id, discount_policy_version_id, scope_type,
                          parameter_key, value_type, value_number, unit, notes
                      ) VALUES (
                          %s, %s, 'PROJECT', 'MINIMUM_BOOKING_AMOUNT',
                          'NUMBER', %s, 'INR',
                          'Minimum Booking Amount effective 01-Aug-2026'
                      )
                      """,
                      (tenant_id, new_version_id, MINIMUM_BOOKING_AMOUNT),
                  )

                  connection.execute(
                      """
                      DELETE FROM auditcore.discount_policy_parameters
                      WHERE tenant_id = %s
                        AND discount_policy_version_id = %s
                        AND scope_type = 'DEALER'
                        AND parameter_key = 'MR_MAX_PERCENT_PREVIOUS_MONTH_RETAIL'
                        AND dealer_id = ANY(%s)
                      """,
                      (tenant_id, new_version_id, dealer_ids),
                  )
                  for dealer_id in dealer_ids:
                      connection.execute(
                          """
                          INSERT INTO auditcore.discount_policy_parameters (
                              tenant_id, discount_policy_version_id, scope_type,
                              dealer_id, parameter_key, value_type,
                              value_number, unit, notes
                          ) VALUES (
                              %s, %s, 'DEALER', %s,
                              'MR_MAX_PERCENT_PREVIOUS_MONTH_RETAIL',
                              'NUMBER', %s, 'PERCENT',
                              'Management Referral entitlement for Dealer'
                          )
                          """,
                          (tenant_id, new_version_id, dealer_id, MR_PERCENT),
                      )

                  updated = connection.execute(
                      """
                      UPDATE auditcore.discount_policy_versions
                      SET lifecycle_status = 'PUBLISHED',
                          published_by_actor_id = %s,
                          published_at_utc = now(),
                          updated_at_utc = now()
                      WHERE tenant_id = %s
                        AND discount_policy_version_id = %s
                        AND lifecycle_status = 'DRAFT'
                      """,
                      (ACTOR, tenant_id, new_version_id),
                  )
                  if updated.rowcount != 1:
                      fail("policy version did not transition from DRAFT to PUBLISHED")

                  minimum_rows = connection.execute(
                      """
                      SELECT count(*) AS count
                      FROM auditcore.discount_policy_parameters
                      WHERE tenant_id = %s
                        AND discount_policy_version_id = %s
                        AND scope_type = 'PROJECT'
                        AND parameter_key = 'MINIMUM_BOOKING_AMOUNT'
                        AND value_number = %s
                        AND unit = 'INR'
                      """,
                      (tenant_id, new_version_id, MINIMUM_BOOKING_AMOUNT),
                  ).fetchone()["count"]
                  mr_ids = {
                      row["dealer_id"]
                      for row in connection.execute(
                          """
                          SELECT dealer_id
                          FROM auditcore.discount_policy_parameters
                          WHERE tenant_id = %s
                            AND discount_policy_version_id = %s
                            AND scope_type = 'DEALER'
                            AND parameter_key = 'MR_MAX_PERCENT_PREVIOUS_MONTH_RETAIL'
                            AND value_number = %s
                            AND unit = 'PERCENT'
                          """,
                          (tenant_id, new_version_id, MR_PERCENT),
                      ).fetchall()
                  }
                  if minimum_rows != 1 or mr_ids != set(dealer_ids):
                      fail("post-publication verification failed")

              print("PROJECT=MahindraOrissa")
              print("DEALER_COUNT=2")
              print("MINIMUM_BOOKING_AMOUNT=21000 INR")
              print("MR_PERCENT_EACH=4")
              print(f"VERSION_NO={next_version}")
              print("EFFECTIVE_FROM=2026-08-01")
              print("RESULT=PASS")
          PY

          cat /tmp/publish_policy.py | railway sandbox exec --timeout 120 -- python3 - | tee /tmp/policy-result.txt

          # Destroy before persisting evidence so this job leaves no runtime behind.
          cleanup
          trap - EXIT

      - name: Validate publication evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^RESULT=(PASS|ALREADY_PUBLISHED)$' /tmp/policy-result.txt
          grep -Fx 'DEALER_COUNT=2' /tmp/policy-result.txt
          grep -Fx 'MINIMUM_BOOKING_AMOUNT=21000 INR' /tmp/policy-result.txt
          grep -Fx 'MR_PERCENT_EACH=4' /tmp/policy-result.txt

      - name: Record result and self-clean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/runtime
          cp /tmp/policy-result.txt docs/runtime/mahindraorissa-policy-202608.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-publish-mahindraorissa-policy-202608.yml
          git add docs/runtime/mahindraorissa-policy-202608.txt
          git commit -m 'docs(dev): record MahindraOrissa August policy publication [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
