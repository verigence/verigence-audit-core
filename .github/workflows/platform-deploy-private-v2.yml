name: Deploy unified Railway platform DEV v2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/unified-railway-platform
    paths:
      - .github/workflows/platform-deploy-private-v2.yml

permissions:
  contents: read

concurrency:
  group: unified-railway-platform-dev-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      TARGET_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      TARGET_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
      LEGACY_DI_PROJECT_ID: 62c22163-78d0-4a86-a2f7-dbf39e64aa4d
      AUDIT_SERVICE: verigence-audit-core
      SECURITY_SERVICE: security
      DI_API_SERVICE: di-api
      DI_WORKER_SERVICE: di-worker
      DB_SERVICE: Postgres
      SMOKE_SERVICE: platform-smoke
      SECURITY_PORT: "8001"
      DI_PORT: "8000"
      DEV_TENANT_ID: dev-auth-test

    steps:
      - name: Checkout Audit Core
        uses: actions/checkout@v6
        with:
          path: _src/audit-core

      - name: Checkout Security
        uses: actions/checkout@v6
        with:
          repository: verigence/verigence-security
          ref: main
          path: _src/security

      - name: Checkout DI two-service runtime
        uses: actions/checkout@v6
        with:
          repository: verigence/verigence-di
          ref: agent/railway-two-service-runtime
          path: _src/di

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link and verify target Railway DEV
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$TARGET_PROJECT_ID" --environment "$TARGET_ENVIRONMENT_ID" --json >/tmp/link.json
          railway status --json >/tmp/status.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/status.json').read_text())
          if data.get('id') != os.environ['TARGET_PROJECT_ID']:
              raise SystemExit('wrong Railway target project')
          print('PLATFORM_PROJECT_VERIFIED=PASS')
          PY
          railway service list --json >/tmp/services.json
          python - <<'PY'
          import json
          from pathlib import Path
          names={row.get('name') for row in json.loads(Path('/tmp/services.json').read_text())}
          required={'verigence-audit-core','security','di-api','di-worker','Postgres','platform-smoke'}
          missing=required-names
          if missing:
              raise SystemExit('missing services: '+','.join(sorted(missing)))
          print('PLATFORM_SERVICE_INVENTORY=PASS')
          PY

      - name: Capture Audit Core OAuth client verifier material
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          secret="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/audit-vars.json').read_text())
          print(data.get('SECURITY_CLIENT_SECRET',''))
          PY
          )"
          test -n "$secret" || { echo 'Audit Core SECURITY_CLIENT_SECRET missing' >&2; exit 1; }
          echo "::add-mask::$secret"
          echo "AUDIT_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"
          digest="$(CLIENT_SECRET="$secret" python -c 'import hashlib,os; print(hashlib.sha256(os.environ["CLIENT_SECRET"].encode()).hexdigest())')"
          echo "AUDIT_CLIENT_SECRET_SHA256=$digest" >> "$GITHUB_ENV"
          echo 'AUDIT_OAUTH_CLIENT_MATERIAL=PASS'

      - name: Read legacy DI runtime configuration without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .railway
          railway link --project "$LEGACY_DI_PROJECT_ID" --environment production --json >/dev/null
          railway variable list --service di-api --json >/tmp/legacy-di.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/legacy-di.json').read_text())
          required=[
              'DI_SECRET_KEY','DI_DOCAI_MOCK',
              'DI_STORAGE_ACCESS_KEY_ID','DI_STORAGE_BUCKET','DI_STORAGE_ENDPOINT',
              'DI_STORAGE_PROVIDER','DI_STORAGE_REGION','DI_STORAGE_SECRET_ACCESS_KEY'
          ]
          missing=[key for key in required if not data.get(key)]
          if missing:
              raise SystemExit('legacy DI configuration missing: '+','.join(missing))
          print('LEGACY_DI_RUNTIME_CONFIG=PASS')
          PY

      - name: Configure consolidated Security and DI services
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .railway
          railway link --project "$TARGET_PROJECT_ID" --environment "$TARGET_ENVIRONMENT_ID" --json >/dev/null

          set_var() {
            local service="$1" name="$2" value="$3"
            printf '%s' "$value" | railway variable set "$name" --service "$service" --stdin --skip-deploys >/dev/null
          }

          db_ref="$(python -c 'print(chr(36)+chr(123)+chr(123)+"Postgres.DATABASE_URL"+chr(125)+chr(125))')"

          clients_json="$(AUDIT_HASH="$AUDIT_CLIENT_SECRET_SHA256" python - <<'PY'
          import json, os
          print(json.dumps({
              'audit-core': {
                  'secret_sha256': os.environ['AUDIT_HASH'],
                  'permissions': ['di.document.read','di.document.upload'],
                  'redirect_uris': [],
                  'public': False,
              }
          }, separators=(',', ':')))
          PY
          )"

          set_var "$SECURITY_SERVICE" PORT "$SECURITY_PORT"
          set_var "$SECURITY_SERVICE" SECURITY_KEY_ID security-unified-dev-1
          set_var "$SECURITY_SERVICE" SECURITY_TOKEN_ISSUER verigence-security
          set_var "$SECURITY_SERVICE" SECURITY_TOKEN_AUDIENCE verigence-platform
          set_var "$SECURITY_SERVICE" SECURITY_ROLE_DATABASE_URL "$db_ref"
          set_var "$SECURITY_SERVICE" SECURITY_INTEGRATION_CLIENTS_JSON "$clients_json"
          set_var "$SECURITY_SERVICE" SECURITY_SESSION_COOKIE_SECURE true
          set_var "$SECURITY_SERVICE" DEV_TENANT_ID "$DEV_TENANT_ID"

          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json
          if ! python - <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path('/tmp/security-vars.json').read_text())
          sys.exit(0 if data.get('SECURITY_PRIVATE_KEY_PEM') or data.get('SECURITY_JWT_PRIVATE_KEY_PEM') else 1)
          PY
          then
            private_key="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)"
            echo "::add-mask::$private_key"
            set_var "$SECURITY_SERVICE" SECURITY_PRIVATE_KEY_PEM "$private_key"
            unset private_key
          fi

          approved=(
            DI_SECRET_KEY DI_DOCAI_GEMINI_API_KEY DI_DOCAI_MOCK
            DI_STORAGE_ACCESS_KEY_ID DI_STORAGE_BUCKET DI_STORAGE_ENDPOINT
            DI_STORAGE_PROVIDER DI_STORAGE_REGION DI_STORAGE_SECRET_ACCESS_KEY
          )
          for key in "${approved[@]}"; do
            value="$(KEY="$key" python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/legacy-di.json').read_text())
          print(data.get(os.environ['KEY'],'') or '')
          PY
            )"
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
              set_var "$DI_API_SERVICE" "$key" "$value"
              set_var "$DI_WORKER_SERVICE" "$key" "$value"
            fi
          done

          for service in "$DI_API_SERVICE" "$DI_WORKER_SERVICE"; do
            set_var "$service" DI_ENV dev
            set_var "$service" DI_DATABASE_URL "$db_ref"
            set_var "$service" DI_SECURITY_JWKS_URL "http://security.railway.internal:${SECURITY_PORT}/.well-known/jwks.json"
            set_var "$service" DI_LOG_LEVEL INFO
          done
          set_var "$DI_API_SERVICE" PORT "$DI_PORT"
          set_var "$DI_API_SERVICE" DI_WORKER_ENABLED false
          set_var "$DI_WORKER_SERVICE" DI_WORKER_ENABLED true
          set_var "$DI_WORKER_SERVICE" DI_WORKER_ID unified-dev-worker

          echo 'PLATFORM_RUNTIME_CONFIGURATION=PASS'

      - name: Prepare Security private pre-deploy migration
        shell: bash
        run: |
          set -euo pipefail
          cat > _src/security/scripts/platform_predeploy.py <<'PY'
          import os
          from pathlib import Path

          import psycopg

          from verigence_security.auth_store import PostgresAuthStore
          from verigence_security.role_templates import PostgresRoleTemplateStore, RoleTemplateService
          from verigence_security.settings import normalize_database_url

          db = normalize_database_url(os.environ['SECURITY_ROLE_DATABASE_URL'])
          with psycopg.connect(db) as conn, conn.cursor() as cur:
              for path in sorted(Path('database').glob('*.sql')):
                  cur.execute(path.read_text(encoding='utf-8'))
              conn.commit()

          roles = RoleTemplateService(PostgresRoleTemplateStore(db))
          roles.seed_platform_defaults()
          roles.seed_tenant(
              tenant_id=os.environ['DEV_TENANT_ID'],
              actor_sub='PLATFORM_DEPLOY',
              correlation_id=None,
              replace=False,
          )
          PostgresAuthStore(db).ensure_tenant(os.environ['DEV_TENANT_ID'])
          print('SECURITY_PRIVATE_MIGRATION=PASS', flush=True)
          PY

          cat > _src/security/railway.toml <<'TOML'
          [build]
          builder = "RAILPACK"

          [deploy]
          preDeployCommand = ["PYTHONPATH=src python scripts/platform_predeploy.py"]
          startCommand = "PYTHONPATH=src uvicorn verigence_security.app:create_app --factory --host 0.0.0.0 --port $PORT"
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 3
          TOML

      - name: Deploy Security with private migration
        shell: bash
        run: |
          set -euo pipefail
          railway up _src/security --path-as-root --service "$SECURITY_SERVICE" --ci --message "Unified DEV Security private-v2 ${GITHUB_SHA}"
          echo 'PLATFORM_SECURITY_DEPLOY_SUBMITTED=PASS'

      - name: Prepare and deploy DI API with private Alembic migration
        shell: bash
        run: |
          set -euo pipefail
          cat > _src/di/backend/railway.toml <<'TOML'
          [build]
          builder = "DOCKERFILE"
          dockerfilePath = "Dockerfile"

          [deploy]
          preDeployCommand = ["alembic upgrade head"]
          startCommand = "sh -c 'uvicorn verigence.di.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000}'"
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 3
          TOML
          railway up _src/di/backend --path-as-root --service "$DI_API_SERVICE" --ci --message "Unified DEV DI API private-v2 ${GITHUB_SHA}"
          echo 'PLATFORM_DI_API_DEPLOY_SUBMITTED=PASS'

      - name: Prepare and deploy DI worker with scheduler
        shell: bash
        run: |
          set -euo pipefail
          cat > _src/di/backend/railway.toml <<'TOML'
          [build]
          builder = "DOCKERFILE"
          dockerfilePath = "Dockerfile.worker"

          [deploy]
          startCommand = "python -m verigence.di.workers"
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 10
          TOML
          railway up _src/di/backend --path-as-root --service "$DI_WORKER_SERVICE" --ci --message "Unified DEV DI worker private-v2 ${GITHUB_SHA}"
          echo 'PLATFORM_DI_WORKER_DEPLOY_SUBMITTED=PASS'

      - name: Verify DI worker and scheduler startup
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            railway logs --service "$DI_WORKER_SERVICE" --latest --lines 300 >/tmp/worker.log || true
            if grep -q 'DI_WORKER_STARTED=PASS' /tmp/worker.log && grep -q 'DI_EOD_SCHEDULER_STARTED=PASS' /tmp/worker.log; then
              echo 'PLATFORM_DI_WORKER=PASS'
              echo 'PLATFORM_DI_EOD_SCHEDULER=PASS'
              exit 0
            fi
            if grep -Eiq 'Traceback|failed|error' /tmp/worker.log; then
              tail -n 120 /tmp/worker.log
            fi
            sleep 3
          done
          echo 'DI worker/scheduler startup markers missing' >&2
          tail -n 200 /tmp/worker.log >&2 || true
          exit 1

      - name: Rebind and redeploy Audit Core on private endpoints
        shell: bash
        run: |
          set -euo pipefail
          set_var() {
            local name="$1" value="$2"
            printf '%s' "$value" | railway variable set "$name" --service "$AUDIT_SERVICE" --stdin --skip-deploys >/dev/null
          }
          set_var SECURITY_BASE_URL "http://security.railway.internal:${SECURITY_PORT}"
          set_var SECURITY_TOKEN_URL "http://security.railway.internal:${SECURITY_PORT}/oauth/token"
          set_var SECURITY_JWKS_URL "http://security.railway.internal:${SECURITY_PORT}/.well-known/jwks.json"
          set_var SECURITY_CLIENT_ID audit-core
          set_var DI_BASE_URL "http://di-api.railway.internal:${DI_PORT}"
          railway redeploy --service "$AUDIT_SERVICE" --yes >/dev/null
          echo 'PLATFORM_AUDIT_CORE_REBOUND=PASS'

      - name: Build private-network E2E smoke probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _smoke
          mkdir -p _smoke
          cat > _smoke/Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          WORKDIR /app
          RUN pip install --no-cache-dir httpx==0.28.1
          COPY smoke.py .
          CMD ["python", "smoke.py"]
          DOCKER
          cat > _smoke/smoke.py <<'PY'
          import os
          import time
          from http.server import BaseHTTPRequestHandler, HTTPServer

          import httpx

          security=os.environ['SECURITY_BASE_URL'].rstrip('/')
          di=os.environ['DI_BASE_URL'].rstrip('/')
          client_id=os.environ['SECURITY_CLIENT_ID']
          client_secret=os.environ['SECURITY_CLIENT_SECRET']
          tenant_id=os.environ['DEV_TENANT_ID']

          def wait_json(url, expected):
              last=''
              with httpx.Client(timeout=5.0) as client:
                  for _ in range(90):
                      try:
                          r=client.get(url)
                          last=f'{r.status_code} {r.text[:160]}'
                          if r.status_code == 200 and r.json().get('status') == expected:
                              return
                      except Exception as exc:
                          last=str(exc)
                      time.sleep(2)
              raise RuntimeError(f'{url} unavailable: {last}')

          wait_json(security + '/health', 'ok')
          print('PLATFORM_SECURITY_HEALTH=PASS', flush=True)
          wait_json(di + '/health', 'ok')
          print('PLATFORM_DI_HEALTH=PASS', flush=True)
          wait_json(di + '/ready', 'ready')
          print('PLATFORM_DI_READY=PASS', flush=True)

          with httpx.Client(timeout=10.0) as client:
              r=client.post(
                  security + '/oauth/token',
                  auth=(client_id, client_secret),
                  data={'grant_type':'client_credentials','tenant_id':tenant_id,'scope':'di.document.read'},
              )
              r.raise_for_status()
              token=r.json()['access_token']
              print('PLATFORM_SECURITY_SERVICE_TOKEN=PASS', flush=True)
              r=client.get(
                  f'{di}/v1/tenants/{tenant_id}/subjects',
                  params={'limit':1},
                  headers={'Authorization':f'Bearer {token}','X-Correlation-ID':'platform-private-v2'},
              )
              if r.status_code != 200:
                  raise RuntimeError(f'DI auth failed: {r.status_code} {r.text[:300]}')
              print('PLATFORM_SECURITY_TO_DI_JWKS_AUTH=PASS', flush=True)
              print('PLATFORM_PRIVATE_E2E=PASS', flush=True)

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200); self.end_headers(); self.wfile.write(b'ok')
              def log_message(self, format, *args):
                  return
          HTTPServer(('0.0.0.0', int(os.environ.get('PORT','8080'))), Handler).serve_forever()
          PY

      - name: Deploy and verify private-network E2E smoke
        shell: bash
        run: |
          set -euo pipefail
          set_var() {
            local name="$1" value="$2"
            printf '%s' "$value" | railway variable set "$name" --service "$SMOKE_SERVICE" --stdin --skip-deploys >/dev/null
          }
          set_var SECURITY_BASE_URL "http://security.railway.internal:${SECURITY_PORT}"
          set_var DI_BASE_URL "http://di-api.railway.internal:${DI_PORT}"
          set_var SECURITY_CLIENT_ID audit-core
          set_var SECURITY_CLIENT_SECRET "$AUDIT_CLIENT_SECRET"
          set_var DEV_TENANT_ID "$DEV_TENANT_ID"
          railway up _smoke --path-as-root --service "$SMOKE_SERVICE" --ci --message "Unified DEV private E2E v2 ${GITHUB_SHA}"

          for attempt in $(seq 1 90); do
            railway logs --service "$SMOKE_SERVICE" --latest --lines 300 >/tmp/smoke.log || true
            if grep -q 'PLATFORM_PRIVATE_E2E=PASS' /tmp/smoke.log; then
              break
            fi
            sleep 2
          done

          for marker in \
            PLATFORM_SECURITY_HEALTH=PASS \
            PLATFORM_DI_HEALTH=PASS \
            PLATFORM_DI_READY=PASS \
            PLATFORM_SECURITY_SERVICE_TOKEN=PASS \
            PLATFORM_SECURITY_TO_DI_JWKS_AUTH=PASS \
            PLATFORM_PRIVATE_E2E=PASS; do
            grep -q "$marker" /tmp/smoke.log || { echo "Missing marker $marker" >&2; tail -n 200 /tmp/smoke.log >&2; exit 1; }
            echo "$marker"
          done

      - name: Verify final service topology
        shell: bash
        run: |
          set -euo pipefail
          railway service list --json >/tmp/final-services.json
          python - <<'PY'
          import json
          from pathlib import Path
          names={row.get('name') for row in json.loads(Path('/tmp/final-services.json').read_text())}
          required={'verigence-audit-core','security','di-api','di-worker','Postgres','platform-smoke'}
          missing=required-names
          if missing:
              raise SystemExit('missing final services: '+','.join(sorted(missing)))
          if 'di-scheduler' in names:
              raise SystemExit('unexpected di-scheduler service exists')
          print('FINAL_TOPOLOGY=PASS')
          print('DI_PROCESS_TOPOLOGY=API_PLUS_WORKER')
          print('DI_SCHEDULER_SERVICE=NONE')
          PY

      - name: Stop smoke compute after verification
        if: always()
        shell: bash
        run: |
          set +e
          railway down --service "$SMOKE_SERVICE" --yes >/dev/null 2>&1
          exit 0
