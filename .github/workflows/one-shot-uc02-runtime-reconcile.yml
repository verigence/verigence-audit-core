name: One-shot reconcile UC02 DEV project provisioning state

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-uc02-runtime-reconcile.yml

permissions:
  contents: write

concurrency:
  group: one-shot-uc02-runtime-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SECURITY_SERVICE: security
      AUDIT_SERVICE: verigence-audit-core
      DI_SERVICE: di-api

    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install Railway CLI and PostgreSQL driver
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Link shared DEV project and collect runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo 'RAILWAY_API_TOKEN is not configured' >&2; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          railway variable list --service "$DI_SERVICE" --json >/tmp/di-vars.json
          railway deployment list --service "$SECURITY_SERVICE" --limit 1 --json >/tmp/security-deploy.json
          railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-deploy.json
          railway deployment list --service "$DI_SERVICE" --limit 1 --json >/tmp/di-deploy.json

      - name: Reconcile Security, Audit Core and DI state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import psycopg

          def load(path: str):
              return json.loads(Path(path).read_text())

          def db_url(values: dict, *keys: str) -> str:
              for key in keys:
                  value = str(values.get(key, '') or '').strip()
                  if value:
                      return value.replace('postgresql+psycopg://','postgresql://',1).replace('postgresql+asyncpg://','postgresql://',1)
              raise SystemExit('Required database URL is missing: ' + ','.join(keys))

          def deployment(path: str):
              rows=load(path); row=rows[0] if rows else {}
              meta=row.get('meta') if isinstance(row.get('meta'),dict) else {}
              return str(row.get('status','') or ''), str(row.get('createdAt') or ''), str(meta.get('commitHash') or meta.get('commit') or ''), str(meta.get('branch') or '')

          sv,av,dv=load('/tmp/security-vars.json'),load('/tmp/audit-vars.json'),load('/tmp/di-vars.json')
          su,au,du=db_url(sv,'DATABASE_URL'),db_url(av,'DATABASE_URL'),db_url(dv,'DI_DATABASE_URL','DATABASE_URL')

          with psycopg.connect(su) as s, psycopg.connect(au) as a, psycopg.connect(du) as d:
              with a.cursor() as cur:
                  cur.execute("SELECT tenant_id::text, project_name, status, provisioning_status, created_at_utc FROM auditcore.projects ORDER BY created_at_utc")
                  projects=cur.fetchall()
              with s.cursor() as cur:
                  cur.execute("SELECT tenant_id::text, tenant_name, status, created_at_utc FROM security.tenants ORDER BY created_at_utc")
                  tenants=cur.fetchall()
              configuring=[r for r in tenants if str(r[2])=='CONFIGURING']
              candidates=[]; with_project=[]; with_docs=[]
              for tenant_id, tenant_name, status, created_at in configuring:
                  with a.cursor() as cur:
                      cur.execute("SELECT EXISTS (SELECT 1 FROM auditcore.projects WHERE tenant_id=%s)",(tenant_id,)); project_exists=bool(cur.fetchone()[0])
                  with d.cursor() as cur:
                      cur.execute("SELECT EXISTS (SELECT 1 FROM docintel.documents WHERE tenant_id=%s)",(tenant_id,)); docs=bool(cur.fetchone()[0])
                      cur.execute("SELECT (SELECT count(*) FROM docintel.tenant_settings WHERE tenant_id=%s)+(SELECT count(*) FROM docintel.retention_policies WHERE tenant_id=%s)+(SELECT count(*) FROM docintel.tenant_document_types WHERE tenant_id=%s)",(tenant_id,tenant_id,tenant_id)); prov=int(cur.fetchone()[0])
                  if project_exists: with_project.append((tenant_id,tenant_name))
                  elif docs: with_docs.append((tenant_id,tenant_name))
                  else: candidates.append((tenant_id,tenant_name,prov))

          ss,sc,sh,sb=deployment('/tmp/security-deploy.json'); aas,aac,aah,aab=deployment('/tmp/audit-deploy.json'); ds,dc,dh,db=deployment('/tmp/di-deploy.json')
          lines=['# UC02 DEV Runtime Reconciliation','', 'READ_ONLY=true',
                 f'SECURITY_LATEST_STATUS={ss or "UNKNOWN"}',f'SECURITY_LATEST_CREATED_AT={sc or "UNKNOWN"}',f'SECURITY_LATEST_COMMIT={sh or "UNKNOWN"}',f'SECURITY_LATEST_BRANCH={sb or "UNKNOWN"}',
                 f'AUDIT_CORE_LATEST_STATUS={aas or "UNKNOWN"}',f'AUDIT_CORE_LATEST_CREATED_AT={aac or "UNKNOWN"}',f'AUDIT_CORE_LATEST_COMMIT={aah or "UNKNOWN"}',f'AUDIT_CORE_LATEST_BRANCH={aab or "UNKNOWN"}',
                 f'DI_API_LATEST_STATUS={ds or "UNKNOWN"}',f'DI_API_LATEST_CREATED_AT={dc or "UNKNOWN"}',f'DI_API_LATEST_COMMIT={dh or "UNKNOWN"}',f'DI_API_LATEST_BRANCH={db or "UNKNOWN"}',
                 f'AUDIT_PROJECT_ROWS={len(projects)}',f'SECURITY_TENANT_ROWS={len(tenants)}',f'SECURITY_CONFIGURING_TENANTS={len(configuring)}',
                 f'CONFIGURING_WITH_AUDIT_PROJECT={len(with_project)}',f'CONFIGURING_WITH_DI_DOCUMENTS_BUT_NO_PROJECT={len(with_docs)}',f'ORPHAN_CANDIDATES_NO_PROJECT_NO_DI_DOCUMENTS={len(candidates)}',f'ORPHAN_CANDIDATES_WITH_DI_PROVISIONING_ROWS={sum(1 for _,_,rows in candidates if rows>0)}']
          for i,(tid,name,status,prov,created) in enumerate(projects,1): lines.append(f'PROJECT_{i}={name}|{status}|{prov}|{tid}')
          for i,(tid,name,prov) in enumerate(candidates,1): lines.append(f'ORPHAN_{i}={name}|DI_PROVISIONING_ROWS={prov}|{tid}')
          lines.append('RESULT=PASS')
          Path('docs/runtime').mkdir(parents=True,exist_ok=True)
          Path('docs/runtime/uc02-runtime-reconcile.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Record sanitized result and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-uc02-runtime-reconcile.yml
          git add docs/runtime/uc02-runtime-reconcile.txt
          git commit -m 'docs(dev): record UC02 runtime reconciliation [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
