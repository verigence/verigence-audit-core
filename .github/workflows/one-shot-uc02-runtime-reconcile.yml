name: One-shot reconcile UC02 DEV project provisioning state

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-uc02-runtime-reconcile.yml

permissions:
  contents: write

concurrency:
  group: one-shot-uc02-runtime-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SECURITY_SERVICE: security
      AUDIT_SERVICE: verigence-audit-core
      DI_SERVICE: di-api

    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install Railway CLI and PostgreSQL driver
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Link shared DEV project and collect runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo 'RAILWAY_API_TOKEN is not configured' >&2; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          railway variable list --service "$DI_SERVICE" --json >/tmp/di-vars.json
          railway deployment list --service "$SECURITY_SERVICE" --limit 1 --json >/tmp/security-deploy.json
          railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-deploy.json
          railway deployment list --service "$DI_SERVICE" --limit 1 --json >/tmp/di-deploy.json

      - name: Reconcile Security, Audit Core and DI state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          import psycopg

          def load(path: str):
              return json.loads(Path(path).read_text())

          def db_url(values: dict, *keys: str) -> str:
              for key in keys:
                  value = str(values.get(key, '') or '').strip()
                  if value:
                      value = value.replace('postgresql+psycopg://', 'postgresql://', 1)
                      value = value.replace('postgresql+asyncpg://', 'postgresql://', 1)
                      return value
              raise SystemExit('Required database URL is missing: ' + ','.join(keys))

          def deployment(path: str) -> tuple[str, str, str]:
              rows = load(path)
              row = rows[0] if rows else {}
              return (
                  str(row.get('id', '') or ''),
                  str(row.get('status', '') or ''),
                  str(row.get('createdAt') or row.get('created_at') or ''),
              )

          security_values = load('/tmp/security-vars.json')
          audit_values = load('/tmp/audit-vars.json')
          di_values = load('/tmp/di-vars.json')
          security_url = db_url(security_values, 'DATABASE_URL')
          audit_url = db_url(audit_values, 'DATABASE_URL')
          di_url = db_url(di_values, 'DI_DATABASE_URL', 'DATABASE_URL')

          with psycopg.connect(security_url) as security, psycopg.connect(audit_url) as audit, psycopg.connect(di_url) as di:
              with security.cursor() as cur:
                  cur.execute("""
                      SELECT tenant_id::text, tenant_name, status, created_at_utc
                      FROM security.tenants
                      WHERE status='CONFIGURING'
                      ORDER BY created_at_utc
                  """)
                  configuring = cur.fetchall()

              candidates = []
              with_docs = []
              with_project = []
              testhyundai_configuring = 0
              testhyundai_candidates = 0

              for tenant_id, tenant_name, status, created_at in configuring:
                  if str(tenant_name).casefold() == 'testhyundai':
                      testhyundai_configuring += 1

                  with audit.cursor() as cur:
                      cur.execute(
                          "SELECT EXISTS (SELECT 1 FROM auditcore.projects WHERE tenant_id=%s)",
                          (tenant_id,),
                      )
                      project_exists = bool(cur.fetchone()[0])

                  with di.cursor() as cur:
                      cur.execute(
                          "SELECT EXISTS (SELECT 1 FROM docintel.documents WHERE tenant_id=%s)",
                          (tenant_id,),
                      )
                      documents_exist = bool(cur.fetchone()[0])
                      cur.execute(
                          """
                          SELECT
                            (SELECT count(*) FROM docintel.tenant_settings WHERE tenant_id=%s) +
                            (SELECT count(*) FROM docintel.retention_policies WHERE tenant_id=%s) +
                            (SELECT count(*) FROM docintel.tenant_document_types WHERE tenant_id=%s)
                          """,
                          (tenant_id, tenant_id, tenant_id),
                      )
                      provisioning_rows = int(cur.fetchone()[0])

                  if project_exists:
                      with_project.append(tenant_id)
                  elif documents_exist:
                      with_docs.append(tenant_id)
                  else:
                      candidates.append((tenant_id, provisioning_rows, str(tenant_name)))
                      if str(tenant_name).casefold() == 'testhyundai':
                          testhyundai_candidates += 1

          s_id, s_status, s_created = deployment('/tmp/security-deploy.json')
          a_id, a_status, a_created = deployment('/tmp/audit-deploy.json')
          d_id, d_status, d_created = deployment('/tmp/di-deploy.json')

          lines = [
              '# UC02 DEV Runtime Reconciliation',
              '',
              'READ_ONLY=true',
              f'SECURITY_LATEST_STATUS={s_status or "UNKNOWN"}',
              f'SECURITY_LATEST_CREATED_AT={s_created or "UNKNOWN"}',
              f'AUDIT_CORE_LATEST_STATUS={a_status or "UNKNOWN"}',
              f'AUDIT_CORE_LATEST_CREATED_AT={a_created or "UNKNOWN"}',
              f'DI_API_LATEST_STATUS={d_status or "UNKNOWN"}',
              f'DI_API_LATEST_CREATED_AT={d_created or "UNKNOWN"}',
              f'SECURITY_CONFIGURING_TENANTS={len(configuring)}',
              f'CONFIGURING_WITH_AUDIT_PROJECT={len(with_project)}',
              f'CONFIGURING_WITH_DI_DOCUMENTS_BUT_NO_PROJECT={len(with_docs)}',
              f'ORPHAN_CANDIDATES_NO_PROJECT_NO_DI_DOCUMENTS={len(candidates)}',
              f'ORPHAN_CANDIDATES_WITH_DI_PROVISIONING_ROWS={sum(1 for _, rows, _ in candidates if rows > 0)}',
              f'TESTHYUNDAI_CONFIGURING={testhyundai_configuring}',
              f'TESTHYUNDAI_ORPHAN_CANDIDATES={testhyundai_candidates}',
              'RESULT=PASS',
          ]
          Path('docs/runtime').mkdir(parents=True, exist_ok=True)
          Path('docs/runtime/uc02-runtime-reconcile.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Record sanitized result and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-uc02-runtime-reconcile.yml
          git add docs/runtime/uc02-runtime-reconcile.txt
          git commit -m 'docs(dev): record UC02 runtime reconciliation [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
