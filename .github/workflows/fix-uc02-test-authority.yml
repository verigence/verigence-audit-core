name: Fix UC02 Project Admin Authority Coverage

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: uc02-project-admin-authority-coverage
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.head_ref == 'refactor/uc02-project-admin-workspace' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/auditcore_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/uc02-project-admin-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align UC02 authority across DI facade and integration fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('src/audit_core/di_project_master_proxy.py'),
              Path('tests/test_dealers.py'),
              Path('tests/test_projects.py'),
              Path('tests/test_uc02_project_master_imports.py'),
              Path('tests/test_uc02_readiness.py'),
              Path('tests/test_uc02_role_mappings.py'),
          ]
          for path in files:
              text = path.read_text()
              path.write_text(text.replace('require_super_admin_request', 'require_project_admin_request'))
          PY
      - name: Validate full Audit Core suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[test,lint]' >/dev/null
          ruff check src tests migrations
          alembic upgrade head
          pytest -q
      - name: Commit validated authority coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Verigence-admin'
          git config user.email 'admin@verigence.local'
          git add src/audit_core/di_project_master_proxy.py tests/test_dealers.py tests/test_projects.py tests/test_uc02_project_master_imports.py tests/test_uc02_readiness.py tests/test_uc02_role_mappings.py
          if git diff --cached --quiet; then
            echo 'No authority coverage changes required'
            exit 0
          fi
          git commit -m 'fix(uc02): complete tenant-scoped project admin authority [uc02-authority-covered]'
          git pull --rebase origin refactor/uc02-project-admin-workspace
          git push origin HEAD:refactor/uc02-project-admin-workspace
