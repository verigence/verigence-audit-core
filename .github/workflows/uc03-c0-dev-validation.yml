name: UC03 C0 DEV Validation

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: uc03-c0-audit-core-dev
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.head_ref == 'planning/uc-003-booking-delivery-audit' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/auditcore_test
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact UC03 branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact branch revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          echo "UC03_C0_AUDIT_CORE_HEAD=$actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'

      - name: Build and lint
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          ruff check src tests migrations

      - name: Verify C0 route contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from audit_core.main import app

          paths = app.openapi().get("paths", {})
          required = [
              "/v1/me/projects",
              "/v1/tenants/{tenant_id}/uc03/landing-metrics",
              "/v1/tenants/{tenant_id}/uc03/work-items",
          ]
          missing = [path for path in required if path not in paths]
          if missing:
              raise SystemExit("Missing UC03 C0 API path(s): " + ", ".join(missing))
          print("UC03_C0_ROUTE_CONTRACT=PASS")
          PY

      - name: Apply fresh C0 database migration
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              assert connection.execute(text("select version_num from alembic_version")).scalar_one() == "0010_uc03_c0_foundation"
              assert connection.execute(text("select to_regclass('auditcore.journey_stage_states')::text")).scalar_one() == "auditcore.journey_stage_states"
              assert connection.execute(text("select to_regclass('auditcore.journey_workflow_events')::text")).scalar_one() == "auditcore.journey_workflow_events"
          print("UC03_C0_FRESH_MIGRATION=PASS")
          PY

      - name: Run full test suite
        run: pytest -q

  deploy-dev:
    name: Deploy exact UC03 C0 head to Railway DEV
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
      DEV_WEB_ORIGIN: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - name: Checkout exact validated UC03 branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$DEPLOY_SHA"
          echo "UC03_C0_DEPLOY_SHA=$actual"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link and verify approved Railway DEV target
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN secret is not configured.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway status --json >/tmp/status.json
          railway service list --json >/tmp/services.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          project = json.loads(Path('/tmp/status.json').read_text())
          services = json.loads(Path('/tmp/services.json').read_text())
          variables = json.loads(Path('/tmp/audit-vars.json').read_text())
          if project.get('id') != os.environ['PLATFORM_PROJECT_ID']:
              raise SystemExit('Railway token does not target the approved shared DEV project')
          if not any(row.get('name') == os.environ['AUDIT_SERVICE'] for row in services):
              raise SystemExit('Audit Core service is missing from the approved shared DEV project')
          required = [
              'DATABASE_URL',
              'APP_ENV',
              'SECURITY_BASE_URL',
              'SECURITY_CLIENT_ID',
              'SECURITY_CLIENT_SECRET',
          ]
          missing = [name for name in required if not str(variables.get(name, '')).strip()]
          if missing:
              raise SystemExit('Audit Core Railway DEV is missing required C0 variable(s): ' + ', '.join(missing))
          app_env = str(variables.get('APP_ENV', '')).strip().lower()
          if app_env not in {'dev', 'development'}:
              raise SystemExit('Audit Core Railway DEV APP_ENV must be dev or development')
          print('UC03_C0_RAILWAY_TARGET=PASS')
          print('UC03_C0_RUNTIME_CONFIG=PASS')
          PY

      - name: Deploy exact C0 revision
        shell: bash
        run: |
          set -euo pipefail
          railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-before.json
          previous_id="$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/audit-before.json').read_text())
          print(rows[0].get('id', '') if rows else '')
          PY
          )"
          echo "AUDIT_PREVIOUS_DEPLOYMENT_ID=$previous_id" >> "$GITHUB_ENV"
          railway up . --path-as-root --service "$AUDIT_SERVICE" --detach --yes \
            --message "UC03 C0 Audit Core DEV ${DEPLOY_SHA}" >/dev/null

      - name: Verify fresh deployment reaches SUCCESS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/audit-deployment.json
            read -r deployment_id status <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/audit-deployment.json').read_text())
          if not rows:
              print(' ')
          else:
              print(rows[0].get('id', ''), rows[0].get('status', ''))
          PY
          )"
            if [[ -z "$deployment_id" || "$deployment_id" == "${AUDIT_PREVIOUS_DEPLOYMENT_ID:-}" ]]; then
              echo "Waiting for new Audit Core deployment ($attempt/30)"
              sleep 10
              continue
            fi
            case "$status" in
              SUCCESS)
                echo "UC03_C0_AUDIT_CORE_DEPLOYMENT=PASS"
                echo "UC03_C0_AUDIT_CORE_DEPLOYMENT_ID=$deployment_id"
                echo "AUDIT_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
                break
                ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 220 || true
                echo "::error::Audit Core deployment $deployment_id failed with $status"
                exit 1
                ;;
            esac
            if [[ "$attempt" == "30" ]]; then
              railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 220 || true
              echo '::error::Audit Core deployment did not reach SUCCESS.'
              exit 1
            fi
            sleep 10
          done

      - name: Smoke C0 routes on deployed DEV service
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/audit-vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          [ -n "$domain" ] || { echo '::error::Audit Core Railway DEV has no public domain.'; exit 1; }
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac

          curl --fail --silent --show-error "$base/health" >/tmp/health.json
          echo "UC03_C0_AUDIT_CORE_HEALTH=PASS"

          probe_protected_get() {
            local path="$1"
            local code
            code="$(curl --silent --show-error --output /tmp/probe.body --write-out '%{http_code}' "$base$path" || true)"
            case "$code" in
              401|403) echo "UC03_C0_ROUTE_PRESENT|$path|HTTP_$code" ;;
              *)
                cat /tmp/probe.body >&2 || true
                echo "::error::Protected C0 route $path returned HTTP $code; expected 401 or 403 without credentials."
                exit 1
                ;;
            esac
          }

          probe_protected_get '/v1/me/projects'
          probe_protected_get '/v1/tenants/uc03-c0-smoke/uc03/landing-metrics'
          probe_protected_get '/v1/tenants/uc03-c0-smoke/uc03/work-items'

          cors_status="$(curl --silent --show-error \
            --dump-header /tmp/cors.headers \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: $DEV_WEB_ORIGIN" \
            --header 'Access-Control-Request-Method: GET' \
            --header 'Access-Control-Request-Headers: authorization,content-type,x-correlation-id,x-trace-id' \
            "$base/v1/me/projects" || true)"
          test "$cors_status" = "200" || { cat /tmp/cors.headers >&2 || true; echo "::error::C0 browser CORS returned HTTP $cors_status"; exit 1; }
          grep -Fqi "access-control-allow-origin: $DEV_WEB_ORIGIN" /tmp/cors.headers || {
            cat /tmp/cors.headers >&2
            echo '::error::C0 browser CORS did not allow the approved DEV Web origin.'
            exit 1
          }
          echo "UC03_C0_AUDIT_CORE_CORS=PASS"
          echo "UC03_C0_AUDIT_CORE_DEV=PASS"
