name: Patch UC02 Mahindra Master Read Auth

on:
  push:
    branches:
      - fix/uc02-master-lightweight-read

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-master-read]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uc02-master-lightweight-read
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused auth fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/audit_core/dependencies.py')
          text = path.read_text()
          marker = '    re.compile(r"^/v1/tenants/[^/]+/project-masters/?$"),\n'
          insert = marker + (
              '    re.compile(r"^/v1/tenants/[^/]+/mahindra-masters/imports/?$"),\n'
              '    re.compile(r"^/v1/tenants/[^/]+/mahindra-masters/imports/[^/]+/validation-report/?$"),\n'
          )
          if marker not in text:
              raise SystemExit('lightweight read marker not found')
          if 'mahindra-masters/imports/?$' not in text:
              text = text.replace(marker, insert)
          path.write_text(text)
          PY
      - name: Validate source
        run: |
          python -m pip install -e '.[dev]' >/dev/null
          ruff check src/audit_core/dependencies.py
      - name: Commit application change
        shell: bash
        run: |
          git config user.name 'Verigence-admin'
          git config user.email 'verigence-admin@users.noreply.github.com'
          git add src/audit_core/dependencies.py
          git commit -m 'fix: make Mahindra master status reads lightweight [patched-master-read]'
          git push origin HEAD:fix/uc02-master-lightweight-read
