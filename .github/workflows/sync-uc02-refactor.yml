name: Sync UC02 Refactor With Dev

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.head_ref == 'refactor/uc02-project-admin-workspace' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/uc02-project-admin-workspace
          fetch-depth: 0
      - name: Merge current dev into refactor branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Verigence-admin'
          git config user.email 'admin@verigence.local'
          git fetch origin dev
          git merge --no-edit origin/dev
          git push origin HEAD:refactor/uc02-project-admin-workspace
