name: Inspect DI authenticated request failure v8

on:
  workflow_dispatch:
  push:
    branches:
      - agent/unified-railway-platform
    paths:
      - .github/workflows/platform-di-auth-error-inspect-v8.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Inspect DI and Security runtime errors
        shell: bash
        run: |
          set -euo pipefail
          railway status --json >/tmp/status.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/status.json').read_text())
          if data.get('id') != os.environ['TARGET_PROJECT_ID']:
              raise SystemExit('wrong Railway project')
          PY
          echo '--- DI API LOGS ---'
          railway logs --service di-api --latest --deployment --lines 500 || true
          echo '--- SECURITY LOGS ---'
          railway logs --service security --latest --deployment --lines 300 || true
