name: Finalize UC02 DEV acceptance evidence

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  finalize:
    if: github.head_ref == 'verify/uc02-dev-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SECURITY_SERVICE: security
      AUDIT_SERVICE: verigence-audit-core
      DB_SERVICE: Postgres
      MAIN_OPERATION_ID: c3cba519-88b5-48c9-874d-14383a4137d2
      MAIN_PROJECT_TAG: UC02-E2E-32565795640
      MAIN_TENANT_ID: d51bc9f3-98fd-4498-8d34-469b1b545b16
      CHILD_RUN_ID: '32566277251'
      EXTRA_OPERATION_ID: eb414e82-aa55-4674-99b1-97bc6be4e3b7
      EXTRA_PROJECT_TAG: UC02-E2E-32565975167
      DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - name: Install evidence tooling
        run: |
          npm install --global @railway/cli
          python -m pip install --disable-pip-version-check \
            'sqlalchemy>=2,<3' 'psycopg[binary]>=3,<4' 'PyJWT>=2,<3' \
            'cryptography>=45,<47' 'requests>=2,<3'

      - name: Load DEV configuration including public Railway Postgres URL
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json
          railway variable list --service "$AUDIT_SERVICE" --json >/tmp/audit-vars.json
          railway variable list --service "$DB_SERVICE" --json >/tmp/postgres-vars.json

      - name: Verify final persistence and safely clean duplicate Security-only fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, uuid
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          import jwt
          import requests
          from sqlalchemy import create_engine, text

          def read(path): return json.loads(Path(path).read_text())
          def db_url(value):
              value=str(value or '').strip()
              if value.startswith('postgres://'):
                  return 'postgresql+psycopg://' + value[len('postgres://'):]
              if value.startswith('postgresql://'):
                  return 'postgresql+psycopg://' + value[len('postgresql://'):]
              return value
          def public_base(values):
              domain=values.get('RAILWAY_PUBLIC_DOMAIN') or values.get('RAILWAY_STATIC_URL') or ''
              if not domain: raise SystemExit('Security public domain missing')
              return domain.rstrip('/') if domain.startswith(('http://','https://')) else 'https://' + domain.rstrip('/')

          security=read('/tmp/security-vars.json')
          audit=read('/tmp/audit-vars.json')
          postgres=read('/tmp/postgres-vars.json')
          sec_db=db_url(security.get('DATABASE_URL'))
          audit_db=db_url(audit.get('DATABASE_URL'))
          di_public_db=db_url(postgres.get('DATABASE_PUBLIC_URL') or postgres.get('POSTGRES_PUBLIC_URL'))
          if not sec_db or not audit_db or not di_public_db:
              raise SystemExit('Required public database evidence endpoint is unavailable')

          # Main accepted Project/Tenant and completed distributed operation.
          with create_engine(sec_db).connect() as conn:
              sec=conn.execute(text('SELECT tenant_name,status FROM security.tenants WHERE tenant_id=:tid'),{'tid':os.environ['MAIN_TENANT_ID']}).mappings().one()
              if sec['tenant_name'] != os.environ['MAIN_PROJECT_TAG'] or sec['status'] != 'CONFIGURING':
                  raise SystemExit('Main Security Tenant final state mismatch')
          print('UC02_FINAL_SECURITY_DB=PASS')

          with create_engine(audit_db).connect() as conn:
              project=conn.execute(text('SELECT project_name,project_status,version_no,region_code FROM auditcore.projects WHERE tenant_id=:tid'),{'tid':os.environ['MAIN_TENANT_ID']}).mappings().one()
              operation=conn.execute(text('SELECT status,current_step,last_error_code,tenant_id FROM auditcore.administrative_operations WHERE operation_id=:oid'),{'oid':os.environ['MAIN_OPERATION_ID']}).mappings().one()
              child_dealers=conn.execute(text('SELECT count(*) FROM auditcore.dealers WHERE tenant_id=:tid AND dealer_name=:name'),{'tid':os.environ['MAIN_TENANT_ID'],'name':'UC02 E2E Dealer '+os.environ['CHILD_RUN_ID']}).scalar_one()
              child_outlets=conn.execute(text('SELECT count(*) FROM auditcore.dealer_outlets WHERE tenant_id=:tid AND outlet_name=:name'),{'tid':os.environ['MAIN_TENANT_ID'],'name':'UC02 E2E Outlet '+os.environ['CHILD_RUN_ID']}).scalar_one()
              if project['project_name'] != os.environ['MAIN_PROJECT_TAG'] or project['project_status'] != 'CONFIGURING' or project['version_no'] != 2 or project['region_code'] != 'E2E-CONTINUED':
                  raise SystemExit('Main Audit Core Project final state mismatch')
              if operation['status'] != 'COMPLETED' or operation['current_step'] != 'COMPLETE' or operation['last_error_code'] is not None or str(operation['tenant_id']) != os.environ['MAIN_TENANT_ID']:
                  raise SystemExit('Main Audit Core operation final state mismatch')
              if child_dealers != 0 or child_outlets != 0:
                  raise SystemExit('Dealer/Outlet acceptance child data was not cleaned up')
          print('UC02_FINAL_AUDIT_CORE_DB=PASS')
          print('UC02_CHILD_TEST_DATA_CLEANUP=PASS')

          with create_engine(di_public_db).connect() as conn:
              settings=conn.execute(text('SELECT count(*) FROM docintel.tenant_settings WHERE tenant_id=:tid'),{'tid':os.environ['MAIN_TENANT_ID']}).scalar_one()
              retention=conn.execute(text('''
                  SELECT count(*) FROM docintel.tenant_settings ts
                  JOIN docintel.retention_policies rp
                    ON rp.tenant_id=ts.tenant_id AND rp.retention_policy_id=ts.active_retention_policy_id
                  WHERE ts.tenant_id=:tid AND rp.status='ACTIVE'
              '''),{'tid':os.environ['MAIN_TENANT_ID']}).scalar_one()
              doc_types=conn.execute(text('SELECT count(*) FROM docintel.tenant_document_types WHERE tenant_id=:tid'),{'tid':os.environ['MAIN_TENANT_ID']}).scalar_one()
              if settings != 1 or retention < 1 or doc_types < 1:
                  raise SystemExit(f'DI DB provisioning evidence mismatch settings={settings} retention={retention} docTypes={doc_types}')
          print('UC02_FINAL_DI_DB=PASS|SETTINGS=1|RETENTION='+str(retention)+'|DOC_TYPES='+str(doc_types))

          # Duplicate run #3 was created only because branch synchronization fired the old
          # verifier before it was disabled. Delete its Security Tenant only when all checks
          # prove that Audit Core and DI never projected it.
          with create_engine(audit_db).connect() as conn:
              extra_op=conn.execute(text('''
                  SELECT initiated_by_user_id,status,current_step,tenant_id,last_error_code
                  FROM auditcore.administrative_operations WHERE operation_id=:oid
              '''),{'oid':os.environ['EXTRA_OPERATION_ID']}).mappings().one()
          with create_engine(sec_db).connect() as conn:
              extra_tenants=conn.execute(text('SELECT tenant_id,status FROM security.tenants WHERE tenant_name=:name'),{'name':os.environ['EXTRA_PROJECT_TAG']}).mappings().all()
          if len(extra_tenants) > 1:
              raise SystemExit('More than one duplicate Security Tenant matched the extra test tag; refusing cleanup')
          if extra_tenants:
              extra_tid=str(extra_tenants[0]['tenant_id'])
              if extra_tenants[0]['status'] != 'CONFIGURING':
                  raise SystemExit('Duplicate test Tenant is not CONFIGURING; refusing cleanup')
              if extra_op['status'] != 'RECOVERY_REQUIRED' or extra_op['current_step'] != 'SECURITY' or extra_op['tenant_id'] is not None or extra_op['last_error_code'] != 'SECURITY_ADMIN_FAILED':
                  raise SystemExit('Duplicate Audit operation is not the expected Security-only recovery record; refusing cleanup')
              with create_engine(audit_db).connect() as conn:
                  audit_projection=conn.execute(text('SELECT count(*) FROM auditcore.projects WHERE tenant_id=:tid'),{'tid':extra_tid}).scalar_one()
              with create_engine(di_public_db).connect() as conn:
                  di_projection=conn.execute(text('SELECT count(*) FROM docintel.tenant_settings WHERE tenant_id=:tid'),{'tid':extra_tid}).scalar_one()
              if audit_projection != 0 or di_projection != 0:
                  raise SystemExit('Duplicate test Tenant has downstream projection; refusing Security-only cleanup')

              actor_id=str(extra_op['initiated_by_user_id'])
              now=datetime.now(UTC)
              private_key=str(security.get('SECURITY_PRIVATE_KEY_PEM','')).replace('\\n','\n')
              token=jwt.encode({
                  'iss':str(security.get('SECURITY_TOKEN_ISSUER') or 'verigence-security'),
                  'sub':actor_id,
                  'aud':str(security.get('SECURITY_TOKEN_AUDIENCE') or 'verigence-platform'),
                  'iat':now,'exp':now+timedelta(minutes=10),'jti':str(uuid.uuid4()),'actor_type':'USER',
              },private_key,algorithm='RS256',headers={'kid':str(security.get('SECURITY_KEY_ID'))})
              print('::add-mask::'+token)
              response=requests.delete(
                  public_base(security)+f'/security/v1/platform/tenants/{extra_tid}',
                  headers={'Authorization':'Bearer '+token,'X-Correlation-ID':'uc02-extra-cleanup-'+os.environ['GITHUB_RUN_ID']},
                  timeout=30,
              )
              if response.status_code != 200 or response.json().get('status') != 'DELETED':
                  raise SystemExit('Supported Security hard-delete of duplicate test Tenant failed HTTP '+str(response.status_code)+': '+response.text[:300])
              with create_engine(sec_db).connect() as conn:
                  remains=conn.execute(text('SELECT count(*) FROM security.tenants WHERE tenant_id=:tid'),{'tid':extra_tid}).scalar_one()
              if remains != 0:
                  raise SystemExit('Duplicate Security test Tenant still exists after supported hard delete')
              print('UC02_DUPLICATE_SECURITY_ONLY_TEST_FIXTURE_CLEANUP=PASS|'+extra_tid)
          else:
              print('UC02_DUPLICATE_SECURITY_ONLY_TEST_FIXTURE_CLEANUP=ALREADY_CLEAN')

          print('UC02_FINAL_ACCEPTANCE_EVIDENCE=PASS')
          print('UC02_MAIN_PROJECT='+os.environ['MAIN_PROJECT_TAG'])
          print('UC02_MAIN_TENANT='+os.environ['MAIN_TENANT_ID'])
          print('UC02_MAIN_OPERATION='+os.environ['MAIN_OPERATION_ID'])
          PY
