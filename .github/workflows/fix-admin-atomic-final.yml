name: Apply proven UC02 atomic fixes

on:
  push:
    branches: [fix/admin-atomic-compensation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-atomic-compensation
      - name: Apply exact CI-proven fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          role = Path('src/audit_core/role_mappings.py')
          text = role.read_text()
          marker = '''def _active_assignment_rows(\n'''
          helper = '''def _runtime_transaction(engine: Engine):\n    return engine.begin()\n\n\n'''
          if 'def _runtime_transaction(engine: Engine):' not in text:
              if marker not in text:
                  raise SystemExit('role mapping helper insertion point not found')
              text = text.replace(marker, helper + marker, 1)
          role.write_text(text)

          project_test = Path('tests/test_uc02_project_provisioning.py')
          text = project_test.read_text()
          signature = 'def test_compensation_removes_di_before_security(monkeypatch) -> None:\n    calls: list[str] = []\n'
          replacement = 'def test_compensation_removes_di_before_security(monkeypatch) -> None:\n    monkeypatch.setenv("DI_BASE_URL", "https://di.test")\n    monkeypatch.setenv("SECURITY_BASE_URL", "https://security.test")\n    calls: list[str] = []\n'
          if signature in text:
              text = text.replace(signature, replacement, 1)
          elif 'monkeypatch.setenv("DI_BASE_URL", "https://di.test")' not in text:
              raise SystemExit('project compensation test insertion point not found')
          project_test.write_text(text)

          role_test = Path('tests/test_uc02_role_mappings.py')
          text = role_test.read_text()
          text = text.replace(
              'client = TestClient(app, raise_server_exceptions=True)',
              'client = TestClient(app, raise_server_exceptions=False)',
              1,
          )
          old = '''def test_role_mapping_security_failure_is_recoverable_with_same_key(role_mapping_setup) -> None:\n    setup = role_mapping_setup\n    client = TestClient(app, raise_server_exceptions=False)\n    setup["security"].fail_set = True\n    user_id = "user-recovery"\n    path = f"/v1/tenants/{setup['tenant_a']}/role-mappings/{user_id}"\n    body = {"operatingRole": "TL", "dealerIds": [], "outletIds": []}\n\n    failed = client.put(path, headers={"Idempotency-Key": "recover-map"}, json=body)\n    assert failed.status_code == 202\n    assert failed.json()["operationStatus"] == "RECOVERY_REQUIRED"\n    assert failed.json()["mapping"] is None\n\n    setup["security"].fail_set = False\n    recovered = client.put(path, headers={"Idempotency-Key": "recover-map"}, json=body)\n    assert recovered.status_code == 200\n    assert recovered.json()["operationStatus"] == "COMPLETED"\n    assert recovered.json()["mapping"]["operatingRole"] == "TL"\n    assert len(setup["security"].calls) == 2\n'''
          new = '''def test_role_mapping_security_failure_returns_error_without_local_state(role_mapping_setup) -> None:\n    setup = role_mapping_setup\n    client = TestClient(app, raise_server_exceptions=False)\n    setup["security"].fail_set = True\n    user_id = "user-failed-mapping"\n    path = f"/v1/tenants/{setup['tenant_a']}/role-mappings/{user_id}"\n    body = {"operatingRole": "TL", "dealerIds": [], "outletIds": []}\n\n    failed = client.put(path, headers={"Idempotency-Key": "failed-map"}, json=body)\n    assert failed.status_code == 503\n    assert failed.json()["errorCode"] == "VAC-SYS-002"\n    assert client.get(path).json() is None\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'def test_role_mapping_security_failure_returns_error_without_local_state' not in text:
              raise SystemExit('role mapping recovery test block not found')
          role_test.write_text(text)
          PY
          git rm .github/workflows/fix-admin-atomic-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audit_core/role_mappings.py tests/test_uc02_project_provisioning.py tests/test_uc02_role_mappings.py
          git commit -m 'fix: correct UC02 atomic admin test regressions'
          git push origin HEAD:fix/admin-atomic-compensation
