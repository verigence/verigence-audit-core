name: Inspect crashed DI API runtime v6

on:
  workflow_dispatch:
  push:
    branches:
      - agent/unified-railway-platform
    paths:
      - .github/workflows/platform-di-api-inspect-v6.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Verify target and inspect DI API
        shell: bash
        run: |
          set -euo pipefail
          railway status --json >/tmp/status.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/status.json').read_text())
          if data.get('id') != os.environ['TARGET_PROJECT_ID']:
              raise SystemExit('wrong Railway project')
          PY
          railway deployment list --service di-api --limit 4 --json >/tmp/deployments.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/deployments.json').read_text())
          for i,row in enumerate(rows[:4]):
              print(f"DI_API_DEPLOYMENT_{i}={row.get('id','')}|{row.get('status','')}")
          PY
          echo '--- DI API RUNTIME LOGS ---'
          railway logs --service di-api --latest --deployment --lines 350 || true
          echo '--- DI API BUILD LOG TAIL ---'
          railway logs --service di-api --latest --build --lines 120 || true
