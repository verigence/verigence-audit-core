name: Apply UC03 Security token reliability patch

on:
  push:
    branches:
      - fix/uc03-security-token-finalize-reliability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[token-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uc03-security-token-finalize-reliability
      - name: Apply deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one target block in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          security_path = "src/audit_core/security_integration.py"
          replace_once(
              security_path,
              "from dataclasses import dataclass\nfrom typing import Any, Self\n",
              "import time\nfrom dataclasses import dataclass\nfrom threading import Lock\nfrom typing import Any, Self\n",
          )
          replace_once(
              security_path,
              'logger = structlog.get_logger(__name__)\n\n\nclass SecurityTokenError(RuntimeError):\n    """Security did not issue the requested ServiceIntegration access token."""\n',
              'logger = structlog.get_logger(__name__)\n\n_SERVICE_TOKEN_MAX_ATTEMPTS = 2\n_SERVICE_TOKEN_RETRY_BACKOFF_SECONDS = 0.15\n_SERVICE_TOKEN_RETRYABLE_STATUS_CODES = frozenset({429, 500, 502, 503, 504})\n\n\nclass SecurityTokenError(RuntimeError):\n    """Security did not issue the requested ServiceIntegration access token."""\n\n\nclass SecurityTokenUnavailableError(SecurityTokenError):\n    """Security service-token endpoint is temporarily unavailable."""\n',
          )
          replace_once(
              security_path,
              "        self._client = httpx.Client(\n            base_url=base_url.rstrip(\"/\"),\n            auth=(client_id, client_secret),\n            timeout=timeout_seconds,\n            transport=transport,\n        )\n",
              "        self._client = httpx.Client(\n            base_url=base_url.rstrip(\"/\"),\n            auth=(client_id, client_secret),\n            timeout=timeout_seconds,\n            transport=transport,\n        )\n        self._token_cache: dict[str, tuple[float, str]] = {}\n        self._token_cache_lock = Lock()\n",
          )

          old_method = '''    def get_service_token(self, *, audience: str) -> str:\n        requested_audience = audience.strip()\n        if not requested_audience:\n            raise ValueError("audience is required")\n        logger.debug(\n            "security_service_token_start",\n            audience=requested_audience,\n        )\n        try:\n            response = self._client.post(\n                "/security/v1/service/token",\n                data={"audience": requested_audience},\n            )\n        except httpx.HTTPError as exc:\n            logger.warning("security_service_token_failed", reason="endpoint_unavailable")\n            raise SecurityTokenError("Security service-token endpoint is unavailable") from exc\n\n        if response.status_code != 200:\n            error = _safe_service_error(response)\n            logger.warning(\n                "security_service_token_failed",\n                http_status=response.status_code,\n                error=error,\n                audience=requested_audience,\n            )\n            raise SecurityTokenError(\n                f"Security service-token request denied with HTTP {response.status_code}: {error}"\n            )\n\n        try:\n            payload: Any = response.json()\n        except ValueError as exc:\n            raise SecurityTokenError("Security service-token response is not valid JSON") from exc\n        if not isinstance(payload, dict):\n            raise SecurityTokenError("Security service-token response has invalid shape")\n\n        access_token = payload.get("accessToken")\n        token_type = payload.get("tokenType")\n        returned_audience = payload.get("audience")\n        if not isinstance(access_token, str) or not access_token:\n            raise SecurityTokenError("Security service-token response has no accessToken")\n        if token_type != "Bearer":\n            raise SecurityTokenError("Security service-token response has invalid tokenType")\n        if returned_audience != requested_audience:\n            raise SecurityTokenError("Security service-token response audience mismatch")\n        return access_token\n'''
          new_method = '''    def get_service_token(self, *, audience: str) -> str:\n        requested_audience = audience.strip()\n        if not requested_audience:\n            raise ValueError("audience is required")\n\n        # The client is process-cached by callers. Reuse Security's own audience-bound\n        # token until shortly before its reported expiry instead of requesting a new\n        # token for every document finalize call. The token is memory-only.\n        with self._token_cache_lock:\n            cached = self._cached_service_token(requested_audience)\n            if cached is not None:\n                logger.debug(\n                    "security_service_token_cache_hit",\n                    audience=requested_audience,\n                )\n                return cached\n\n            access_token, expires_in = self._request_service_token(requested_audience)\n            self._remember_service_token(\n                audience=requested_audience,\n                access_token=access_token,\n                expires_in=expires_in,\n            )\n            return access_token\n\n    def _cached_service_token(self, audience: str) -> str | None:\n        cached = self._token_cache.get(audience)\n        if cached is None:\n            return None\n        expires_at, access_token = cached\n        if expires_at <= time.monotonic():\n            self._token_cache.pop(audience, None)\n            return None\n        return access_token\n\n    def _remember_service_token(\n        self,\n        *,\n        audience: str,\n        access_token: str,\n        expires_in: int | None,\n    ) -> None:\n        if expires_in is None:\n            return\n        lifetime = float(expires_in)\n        # Keep a conservative skew so a token is never deliberately reused at expiry.\n        skew = min(60.0, max(1.0, lifetime * 0.10))\n        cache_ttl = lifetime - skew\n        if cache_ttl <= 0:\n            return\n        self._token_cache[audience] = (time.monotonic() + cache_ttl, access_token)\n\n    def _request_service_token(self, requested_audience: str) -> tuple[str, int | None]:\n        for attempt in range(1, _SERVICE_TOKEN_MAX_ATTEMPTS + 1):\n            logger.debug(\n                "security_service_token_start",\n                audience=requested_audience,\n                attempt=attempt,\n            )\n            try:\n                response = self._client.post(\n                    "/security/v1/service/token",\n                    data={"audience": requested_audience},\n                )\n            except httpx.HTTPError as exc:\n                logger.warning(\n                    "security_service_token_failed",\n                    reason="endpoint_unavailable",\n                    audience=requested_audience,\n                    attempt=attempt,\n                )\n                if attempt < _SERVICE_TOKEN_MAX_ATTEMPTS:\n                    time.sleep(_SERVICE_TOKEN_RETRY_BACKOFF_SECONDS)\n                    continue\n                raise SecurityTokenUnavailableError(\n                    "Security service-token endpoint is unavailable"\n                ) from exc\n\n            if (\n                response.status_code in _SERVICE_TOKEN_RETRYABLE_STATUS_CODES\n                and attempt < _SERVICE_TOKEN_MAX_ATTEMPTS\n            ):\n                logger.warning(\n                    "security_service_token_failed",\n                    reason="retryable_http_status",\n                    http_status=response.status_code,\n                    audience=requested_audience,\n                    attempt=attempt,\n                )\n                time.sleep(_SERVICE_TOKEN_RETRY_BACKOFF_SECONDS)\n                continue\n\n            if response.status_code != 200:\n                error = _safe_service_error(response)\n                logger.warning(\n                    "security_service_token_failed",\n                    http_status=response.status_code,\n                    error=error,\n                    audience=requested_audience,\n                    attempt=attempt,\n                )\n                if response.status_code in _SERVICE_TOKEN_RETRYABLE_STATUS_CODES:\n                    raise SecurityTokenUnavailableError(\n                        f"Security service-token endpoint returned HTTP {response.status_code}"\n                    )\n                raise SecurityTokenError(\n                    f"Security service-token request denied with HTTP {response.status_code}: {error}"\n                )\n\n            try:\n                payload: Any = response.json()\n            except ValueError as exc:\n                raise SecurityTokenError(\n                    "Security service-token response is not valid JSON"\n                ) from exc\n            if not isinstance(payload, dict):\n                raise SecurityTokenError("Security service-token response has invalid shape")\n\n            access_token = payload.get("accessToken")\n            token_type = payload.get("tokenType")\n            returned_audience = payload.get("audience")\n            expires_in = payload.get("expiresIn")\n            if not isinstance(access_token, str) or not access_token:\n                raise SecurityTokenError("Security service-token response has no accessToken")\n            if token_type != "Bearer":\n                raise SecurityTokenError("Security service-token response has invalid tokenType")\n            if returned_audience != requested_audience:\n                raise SecurityTokenError("Security service-token response audience mismatch")\n            if expires_in is not None and (\n                not isinstance(expires_in, int)\n                or isinstance(expires_in, bool)\n                or expires_in <= 0\n            ):\n                raise SecurityTokenError("Security service-token response has invalid expiresIn")\n            return access_token, expires_in\n\n        raise AssertionError("service-token retry loop exhausted without a result")\n'''
          replace_once(security_path, old_method, new_method)

          errors_path = "src/audit_core/errors.py"
          replace_once(
              errors_path,
              "from audit_core.security import SecurityTokenError\n",
              "from audit_core.security import SecurityTokenError\nfrom audit_core.security_integration import SecurityTokenUnavailableError\n",
          )
          replace_once(
              errors_path,
              '''    @app.exception_handler(AuthorizationError)\n    async def authorization_error(request: Request, exc: AuthorizationError) -> JSONResponse:\n''',
              '''    @app.exception_handler(SecurityTokenUnavailableError)\n    async def service_token_unavailable(\n        request: Request, exc: SecurityTokenUnavailableError\n    ) -> JSONResponse:\n        return _problem(\n            request,\n            error_code="VAC-SYS-002",\n            status_code=503,\n            title="Service temporarily unavailable",\n            detail="Document processing authorization is temporarily unavailable. Please try again.",\n        )\n\n    @app.exception_handler(AuthorizationError)\n    async def authorization_error(request: Request, exc: AuthorizationError) -> JSONResponse:\n''',
          )

          test_security = "tests/test_security_integration.py"
          replace_once(
              test_security,
              "    SecurityOAuthClient,\n    SecurityTokenError,\n",
              "    SecurityOAuthClient,\n    SecurityTokenError,\n    SecurityTokenUnavailableError,\n",
          )
          marker = '''def test_service_token_is_audience_bound(\n    controlled_security: ControlledSecurity,\n) -> None:\n'''
          addition = '''def test_service_token_is_cached_per_audience(\n    controlled_security: ControlledSecurity,\n) -> None:\n    with _client(controlled_security) as security_client:\n        first = security_client.get_service_token(audience="di")\n        second = security_client.get_service_token(audience="di")\n\n    assert first == second\n    assert controlled_security.audiences == ["di"]\n\n\ndef test_service_token_retries_transient_transport_failure() -> None:\n    attempts = 0\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        nonlocal attempts\n        attempts += 1\n        if attempts == 1:\n            raise httpx.ReadTimeout("temporary Security timeout", request=request)\n        return httpx.Response(\n            200,\n            json={\n                "accessToken": "signed-token",\n                "tokenType": "Bearer",\n                "expiresIn": 60,\n                "audience": "di",\n            },\n        )\n\n    with SecurityOAuthClient(\n        base_url="https://security.test",\n        client_id=CLIENT_ID,\n        client_secret=CLIENT_SECRET,\n        transport=httpx.MockTransport(handler),\n    ) as security_client:\n        assert security_client.get_service_token(audience="di") == "signed-token"\n\n    assert attempts == 2\n\n\ndef test_service_token_reports_dependency_unavailable_after_retry() -> None:\n    attempts = 0\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        nonlocal attempts\n        attempts += 1\n        raise httpx.ReadTimeout("Security remains unavailable", request=request)\n\n    with (\n        SecurityOAuthClient(\n            base_url="https://security.test",\n            client_id=CLIENT_ID,\n            client_secret=CLIENT_SECRET,\n            transport=httpx.MockTransport(handler),\n        ) as security_client,\n        pytest.raises(SecurityTokenUnavailableError, match="endpoint is unavailable"),\n    ):\n        security_client.get_service_token(audience="di")\n\n    assert attempts == 2\n\n\n'''
          replace_once(test_security, marker, addition + marker)

          test_errors = "tests/test_errors.py"
          replace_once(
              test_errors,
              "from audit_core.security import SecurityTokenError\n",
              "from audit_core.security import SecurityTokenError\nfrom audit_core.security_integration import SecurityTokenUnavailableError\n",
          )
          replace_once(
              test_errors,
              '''    @app.get("/not-found")\n    def not_found() -> None:\n''',
              '''    @app.get("/service-token-unavailable")\n    def service_token_unavailable() -> None:\n        raise SecurityTokenUnavailableError("raw downstream token endpoint failure")\n\n    @app.get("/not-found")\n    def not_found() -> None:\n''',
          )
          replace_once(
              test_errors,
              '''        ("/auth", 401, "VAC-AUTH-001"),\n        ("/not-found", 404, "VAC-NF-001"),\n''',
              '''        ("/auth", 401, "VAC-AUTH-001"),\n        ("/service-token-unavailable", 503, "VAC-SYS-002"),\n        ("/not-found", 404, "VAC-NF-001"),\n''',
          )
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audit_core/security_integration.py src/audit_core/errors.py tests/test_security_integration.py tests/test_errors.py
          git diff --cached --check
          git commit -m "fix(uc03): tolerate transient Security token failures [token-fix-applied]"
          git push origin HEAD:fix/uc03-security-token-finalize-reliability
