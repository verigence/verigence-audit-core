name: One-shot Audit Core route usage (read-only)

# Counts requests per route from the Audit Core log kept by Railway. Prints route names and
# counts only: no headers, bodies, tokens or query strings.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-ac-route-usage.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-route-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Count
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service verigence-audit-core --json >/dev/null
          railway --version
          for since in 30d 14d 7d 3d 1d; do
            timeout 240 railway logs --service verigence-audit-core --since "$since" --lines 400000 > /tmp/ac.log 2>/tmp/ac.err && break || true
          done
          echo "log lines: $(wc -l < /tmp/ac.log)  (since=$since)"
          head -c 300 /tmp/ac.err || true
          echo "first line: $(head -1 /tmp/ac.log | cut -c1-40)"
          echo "last line:  $(tail -1 /tmp/ac.log | cut -c1-40)"
          python3 - <<'PY'
          import re, collections
          c = collections.Counter(); st = collections.defaultdict(collections.Counter)
          rx = re.compile(r'http_request\w*.*?method=(\w+).*?route=(\S+)|http_request\w*.*?route=(\S+).*?method=(\w+)')
          lines = open('/tmp/ac.log', errors='ignore').read().splitlines()
          sample = [l for l in lines if 'http_request' in l][:2]
          print('sample lines:'); [print('  ', s[:260]) for s in sample]
          for l in lines:
              if 'http_request' not in l: continue
              m = re.search(r'method=(\w+)', l); r = re.search(r'route=([^\s]+)', l); s = re.search(r'status(?:_code)?=(\d+)', l)
              if not (m and r): continue
              route = r.group(1).split('?')[0]
              route = re.sub(r'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}', '{id}', route)
              route = re.sub(r'(?<=/)\d+(?=/|$)', '{n}', route)
              key = f'{m.group(1)} {route}'
              c[key] += 1
              if s: st[key][s.group(1)] += 1
          print('distinct routes called:', len(c))
          for k, n in sorted(c.items(), key=lambda kv: kv[0].split(' ', 1)[1]):
              print(f'{n:6d}  {k}   {dict(st[k])}')
          PY
