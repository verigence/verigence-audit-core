name: One-shot Audit Core route usage (read-only)

# Counts requests per route from the Audit Core log kept by Railway. Prints route names and
# counts only: no headers, bodies, tokens or query strings.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-ac-route-usage.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-route-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Probe the log command
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service verigence-audit-core --json >/dev/null
          railway logs --help 2>&1 | head -40
          for n in 5000 10000 20000 50000; do
            timeout 120 railway logs --service verigence-audit-core --since 30d --lines $n > /tmp/p.log 2>/tmp/p.err
            echo "lines=$n -> got $(wc -l < /tmp/p.log) lines; err: $(head -c 120 /tmp/p.err)"
          done
          echo "oldest line available (30d window): $(head -1 /tmp/p.log | cut -c1-60)"
          echo "newest: $(tail -1 /tmp/p.log | cut -c1-60)"
          timeout 120 railway logs --service verigence-audit-core --since 30d --lines 50 --filter "http_request" > /tmp/f.log 2>/tmp/f.err
          echo "filter test: $(wc -l < /tmp/f.log) lines; err: $(head -c 150 /tmp/f.err)"
          head -2 /tmp/f.log | cut -c1-300
