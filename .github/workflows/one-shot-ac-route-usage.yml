name: One-shot Audit Core route usage (read-only)

# Counts requests per route from the Audit Core log kept by Railway. Prints route names and
# counts only: no headers, bodies, tokens or query strings.
on:
  push:
    branches: [claude/verigence-phase-2-issues-w515pq]
    paths:
      - '.github/workflows/one-shot-ac-route-usage.yml'

permissions:
  contents: read

concurrency:
  group: audit-core-route-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @railway/cli
      - name: Probe HTTP request logs
        shell: bash
        run: |
          set -uo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service verigence-audit-core --json >/dev/null
          for n in 1000 5000 20000 100000; do
            timeout 180 railway logs --http --json --since 30d --lines $n > /tmp/h_$n.json 2>/tmp/h_$n.err
            echo "lines=$n -> got $(wc -l < /tmp/h_$n.json) lines; err: $(head -c 150 /tmp/h_$n.err | tr '\n' ' ')"
          done
          f=$(ls -S /tmp/h_*.json | head -1)
          echo "using $f"
          sed -n 1p "$f" | cut -c1-500
          python3 - "$f" <<'PY'
          import json, sys, re, collections
          rows = []
          for line in open(sys.argv[1], errors='ignore'):
              line = line.strip()
              if not line.startswith('{'): continue
              try: rows.append(json.loads(line))
              except Exception: pass
          print('parsed rows:', len(rows))
          if rows:
              print('keys:', sorted(rows[0].keys()))
              ts = sorted(r.get('timestamp', '') for r in rows if r.get('timestamp'))
              print('oldest:', ts[0] if ts else None, ' newest:', ts[-1] if ts else None)
          PY
