name: One-shot UC03 Booking document profile DEV

on:
  push:
    branches:
      - planning/uc-003-booking-delivery-audit
    paths:
      - '.github/workflows/one-shot-uc03-booking-document-profile.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/auditcore_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Audit Core
        run: python -m pip install -e '.[test,lint]'
      - name: Validate migration and fresh database behavior
        shell: bash
        run: |
          set -euo pipefail
          ruff check migrations/versions/0016_uc03_standard_document_profile.py
          alembic upgrade head
          python - <<'PY'
          import os
          from uuid import uuid4
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ['DATABASE_URL'])
          suffix = uuid4().hex[:12]
          tenant_id = f'uc03-profile-{suffix}'
          with engine.begin() as c:
              head = c.execute(text('select version_num from alembic_version')).scalar_one()
              assert head == '0016_uc03_doc_profile', head

              category_id = c.execute(text('''
                  INSERT INTO auditcore.product_categories(category_code, category_name)
                  VALUES (:code, :name) RETURNING product_category_id
              '''), {'code': f'CAT-{suffix}', 'name': 'UC03 Profile Test'}).scalar_one()
              oem_id = c.execute(text('''
                  INSERT INTO auditcore.oems(oem_code, oem_name)
                  VALUES (:code, :name) RETURNING oem_id
              '''), {'code': f'OEM-{suffix}', 'name': 'UC03 Profile Test OEM'}).scalar_one()
              c.execute(text('''
                  INSERT INTO auditcore.projects(
                      tenant_id, project_code, project_name, oem_id,
                      product_category_id, effective_start_date,
                      timezone_name, project_status, created_by_actor_id
                  ) VALUES (
                      :tenant_id, :project_code, 'UC03 Profile Test Project', :oem_id,
                      :category_id, CURRENT_DATE, 'Asia/Kolkata', 'ACTIVE', 'ci'
                  )
              '''), {
                  'tenant_id': tenant_id,
                  'project_code': f'P-{suffix}',
                  'oem_id': oem_id,
                  'category_id': category_id,
              })

              profile = c.execute(text('''
                  SELECT v.document_requirement_profile_version_id, v.lifecycle_status
                  FROM auditcore.document_requirement_profiles p
                  JOIN auditcore.document_requirement_profile_versions v
                    ON v.tenant_id=p.tenant_id
                   AND v.document_requirement_profile_id=p.document_requirement_profile_id
                  WHERE p.tenant_id=:tenant_id
                    AND p.profile_code='VERIGENCE_AUTO_STANDARD'
                    AND v.version_no=1
              '''), {'tenant_id': tenant_id}).mappings().one()
              assert profile['lifecycle_status'] == 'PUBLISHED'

              rows = c.execute(text('''
                  SELECT requirement_key, document_type_key, process_area,
                         requirement_level, condition_config
                  FROM auditcore.document_requirement_items
                  WHERE tenant_id=:tenant_id
                    AND document_requirement_profile_version_id=:version_id
                    AND process_area='BOOKING'
                  ORDER BY sort_order
              '''), {
                  'tenant_id': tenant_id,
                  'version_id': profile['document_requirement_profile_version_id'],
              }).mappings().all()
              assert [r['requirement_key'] for r in rows] == [
                  'BOOKING_DOCKET',
                  'CUSTOMER_AADHAAR',
                  'CUSTOMER_PAN',
                  'MINIMUM_BOOKING_AMOUNT_RECEIPT',
              ]
              assert not any(r['requirement_key'] == 'CUSTOMER_ADDRESS_PROOF' for r in rows)
              assert rows[0]['document_type_key'] == 'booking_docket'
              assert rows[0]['requirement_level'] == 'REQUIRED'
              assert rows[1]['document_type_key'] == 'aadhaar'
              assert rows[2]['document_type_key'] == 'pan_card'
              assert rows[1]['condition_config']['groupRule'] == 'AT_LEAST_ONE'
              assert rows[2]['condition_config']['minimumRequired'] == 1
              assert rows[3]['document_type_key'] == 'supporting_document'
              assert rows[3]['requirement_level'] == 'REQUIRED'

              dealer_id = c.execute(text('''
                  INSERT INTO auditcore.dealers(tenant_id, dealer_code, dealer_name)
                  VALUES (:tenant_id, :code, 'UC03 Profile Dealer') RETURNING dealer_id
              '''), {'tenant_id': tenant_id, 'code': f'D-{suffix}'}).scalar_one()
              outlet_id = c.execute(text('''
                  INSERT INTO auditcore.dealer_outlets(
                      tenant_id, dealer_id, outlet_code, outlet_name
                  ) VALUES (:tenant_id, :dealer_id, :code, 'UC03 Profile Outlet')
                  RETURNING outlet_id
              '''), {
                  'tenant_id': tenant_id,
                  'dealer_id': dealer_id,
                  'code': f'O-{suffix}',
              }).scalar_one()
              customer_id = c.execute(text('''
                  INSERT INTO auditcore.customers(
                      tenant_id, dealer_id, outlet_id, customer_type_code, display_name
                  ) VALUES (:tenant_id, :dealer_id, :outlet_id, 'INDIVIDUAL', 'UC03 Customer')
                  RETURNING customer_id
              '''), {
                  'tenant_id': tenant_id,
                  'dealer_id': dealer_id,
                  'outlet_id': outlet_id,
              }).scalar_one()
              journey_id = c.execute(text('''
                  INSERT INTO auditcore.journeys(
                      tenant_id, dealer_id, outlet_id, customer_id, journey_reference
                  ) VALUES (:tenant_id, :dealer_id, :outlet_id, :customer_id, :reference)
                  RETURNING journey_id
              '''), {
                  'tenant_id': tenant_id,
                  'dealer_id': dealer_id,
                  'outlet_id': outlet_id,
                  'customer_id': customer_id,
                  'reference': f'J-{suffix}',
              }).scalar_one()
              bound = c.execute(text('''
                  SELECT document_requirement_profile_version_id
                  FROM auditcore.journeys
                  WHERE tenant_id=:tenant_id AND journey_id=:journey_id
              '''), {'tenant_id': tenant_id, 'journey_id': journey_id}).scalar_one()
              assert bound == profile['document_requirement_profile_version_id']

              c.execute(text('''
                  INSERT INTO auditcore.journey_stage_states(
                      tenant_id, journey_id, stage_code, business_status,
                      audit_state, audit_status, first_started_at_utc,
                      latest_activity_at_utc, version_no
                  ) VALUES (
                      :tenant_id, :journey_id, 'BOOKING', 'BOOKING_STARTED',
                      'NOT_STARTED', 'NOT_EVALUATED', now(), now(), 1
                  )
              '''), {'tenant_id': tenant_id, 'journey_id': journey_id})
              snap = c.execute(text('''
                  SELECT requirement_key
                  FROM auditcore.journey_document_requirements
                  WHERE tenant_id=:tenant_id AND journey_id=:journey_id
                    AND process_area='BOOKING'
                  ORDER BY requirement_key
              '''), {'tenant_id': tenant_id, 'journey_id': journey_id}).scalars().all()
              assert set(snap) == {
                  'BOOKING_DOCKET',
                  'CUSTOMER_AADHAAR',
                  'CUSTOMER_PAN',
                  'MINIMUM_BOOKING_AMOUNT_RECEIPT',
              }
          print('UC03_BOOKING_PROFILE_FRESH_DB=PASS')
          PY

  deploy-dev:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_SERVICE: verigence-audit-core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Audit Core
        run: python -m pip install -e .
      - name: Verify exact migration source
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/versions/0016_uc03_standard_document_profile.py
          head="$(alembic heads)"
          printf '%s\n' "$head"
          grep -q '0016_uc03_doc_profile' <<<"$head"
      - run: npm install --global @railway/cli
      - name: Deploy exact UC03 branch source to Railway DEV
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$AUDIT_SERVICE" --json >/tmp/link.json
          railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/before.json
          previous="$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/before.json').read_text())
          print(rows[0].get('id','') if rows else '')
          PY
          )"
          echo "PREVIOUS_ID=$previous" >> "$GITHUB_ENV"
          railway up . --path-as-root --service "$AUDIT_SERVICE" --detach --yes \
            --message "UC03 Booking document profile ${GITHUB_SHA}" >/dev/null
      - name: Wait for deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            railway deployment list --service "$AUDIT_SERVICE" --limit 1 --json >/tmp/after.json
            read -r id status <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/after.json').read_text())
          row=rows[0] if rows else {}
          print(row.get('id',''), row.get('status',''))
          PY
          )"
            if [[ -z "$id" || "$id" == "${PREVIOUS_ID:-}" ]]; then sleep 8; continue; fi
            if [[ "$status" == "SUCCESS" ]]; then
              echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
              echo 'UC03_BOOKING_PROFILE_DEPLOY=PASS'
              exit 0
            fi
            if [[ "$status" == "FAILED" || "$status" == "CRASHED" || "$status" == "REMOVED" ]]; then
              railway logs --service "$AUDIT_SERVICE" --latest --deployment --lines 240 || true
              exit 1
            fi
            sleep 8
          done
          echo 'Timed out waiting for Railway deployment' >&2
          exit 1
      - name: Verify DEV database profile and repaired Journey bindings
        shell: bash
        run: |
          set -euo pipefail
          railway run python - <<'PY' | tee /tmp/verification.txt
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as c:
              head = c.execute(text('select version_num from alembic_version')).scalar_one()
              assert head == '0016_uc03_doc_profile', head

              projects = c.execute(text('select count(*) from auditcore.projects')).scalar_one()
              seeded = c.execute(text('''
                  SELECT count(DISTINCT p.tenant_id)
                  FROM auditcore.document_requirement_profiles p
                  JOIN auditcore.document_requirement_profile_versions v
                    ON v.tenant_id=p.tenant_id
                   AND v.document_requirement_profile_id=p.document_requirement_profile_id
                  WHERE p.profile_code='VERIGENCE_AUTO_STANDARD'
                    AND v.lifecycle_status='PUBLISHED'
              ''')).scalar_one()
              assert seeded == projects, (seeded, projects)

              invalid_profiles = c.execute(text('''
                  SELECT count(*)
                  FROM auditcore.document_requirement_profiles p
                  JOIN auditcore.document_requirement_profile_versions v
                    ON v.tenant_id=p.tenant_id
                   AND v.document_requirement_profile_id=p.document_requirement_profile_id
                  JOIN auditcore.document_requirement_items i
                    ON i.tenant_id=v.tenant_id
                   AND i.document_requirement_profile_version_id=v.document_requirement_profile_version_id
                  WHERE p.profile_code='VERIGENCE_AUTO_STANDARD'
                    AND i.process_area='BOOKING'
                    AND i.requirement_key NOT IN (
                      'BOOKING_DOCKET','CUSTOMER_AADHAAR','CUSTOMER_PAN',
                      'MINIMUM_BOOKING_AMOUNT_RECEIPT'
                    )
              ''')).scalar_one()
              assert invalid_profiles == 0, invalid_profiles

              address_proof = c.execute(text('''
                  SELECT count(*)
                  FROM auditcore.document_requirement_profiles p
                  JOIN auditcore.document_requirement_profile_versions v
                    ON v.tenant_id=p.tenant_id
                   AND v.document_requirement_profile_id=p.document_requirement_profile_id
                  JOIN auditcore.document_requirement_items i
                    ON i.tenant_id=v.tenant_id
                   AND i.document_requirement_profile_version_id=v.document_requirement_profile_version_id
                  WHERE p.profile_code='VERIGENCE_AUTO_STANDARD'
                    AND i.process_area='BOOKING'
                    AND i.requirement_key='CUSTOMER_ADDRESS_PROOF'
              ''')).scalar_one()
              assert address_proof == 0

              null_journeys = c.execute(text('''
                  SELECT count(*) FROM auditcore.journeys
                  WHERE document_requirement_profile_version_id IS NULL
              ''')).scalar_one()
              assert null_journeys == 0, null_journeys

              print('ALEMBIC_HEAD=' + head)
              print('PROJECT_COUNT=' + str(projects))
              print('STANDARD_PROFILE_PROJECTS=' + str(seeded))
              print('NULL_PROFILE_JOURNEYS=' + str(null_journeys))
              print('ADDRESS_PROOF_BOOKING_REQUIREMENTS=' + str(address_proof))
              print('RESULT=PASS')
          PY
      - name: Record DEV evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/runtime
          {
            echo 'UC03_BOOKING_DOCUMENT_PROFILE_DEV'
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "DEPLOYMENT_ID=${DEPLOYMENT_ID:-UNKNOWN}"
            if [[ -f /tmp/verification.txt ]]; then cat /tmp/verification.txt; else echo 'RESULT=FAIL'; fi
          } > docs/runtime/uc03-booking-document-profile-dev.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/uc03-booking-document-profile-dev.txt
          git commit -m 'docs(uc03): record Booking document profile DEV update [skip ci]' || exit 0
          git pull --rebase origin planning/uc-003-booking-delivery-audit
          git push origin HEAD:planning/uc-003-booking-delivery-audit
