name: Rotate Security key and inspect DI deploy

on:
  workflow_dispatch:
  push:
    branches:
      - agent/unified-railway-platform
    paths:
      - .github/workflows/platform-security-rotate-di-inspect.yml

permissions:
  contents: read

jobs:
  repair-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      TARGET_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      TARGET_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link unified DEV
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$TARGET_PROJECT_ID" --environment "$TARGET_ENVIRONMENT_ID" --json >/dev/null

      - name: Rotate exposed Security signing key safely
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null > /tmp/security-private.pem
          railway variable set SECURITY_PRIVATE_KEY_PEM --service security --stdin --skip-deploys < /tmp/security-private.pem >/dev/null
          rm -f /tmp/security-private.pem
          railway redeploy --service security --yes >/dev/null
          echo 'SECURITY_SIGNING_KEY_ROTATED=PASS'

      - name: Inspect latest DI API deployment status
        shell: bash
        run: |
          set -euo pipefail
          railway deployment list --service di-api --limit 5 --json >/tmp/di-deployments.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/di-deployments.json').read_text())
          for i,row in enumerate(rows[:5]):
              meta=row.get('meta') or {}
              print('DI_DEPLOYMENT_%d=%s|%s|%s' % (
                  i,
                  row.get('id',''),
                  row.get('status',''),
                  meta.get('branch','') if isinstance(meta,dict) else '',
              ))
          PY

      - name: Capture latest DI API deployment logs
        shell: bash
        run: |
          set +e
          echo '--- DI DEPLOYMENT LOGS ---'
          railway logs --service di-api --latest --deployment --lines 300
          echo '--- DI BUILD LOG TAIL ---'
          railway logs --service di-api --latest --build --lines 120
          exit 0

      - name: Verify Security restarted after rotation
        shell: bash
        run: |
          set -euo pipefail
          railway deployment list --service security --limit 3 --json >/tmp/security-deployments.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/security-deployments.json').read_text())
          if not rows:
              raise SystemExit('No Security deployment found after key rotation')
          print('SECURITY_LATEST_DEPLOYMENT_STATUS=' + str(rows[0].get('status','')))
          PY
