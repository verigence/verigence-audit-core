name: One-shot restore DEV Security admin contract

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-security-admin-dev-verify.yml

permissions:
  contents: write

jobs:
  restore:
    name: Restore admin-context contract and self-clean
    runs-on: ubuntu-24.04
    steps:
      - name: Check out DEV with history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Restore canonical DEV contract and remove temporary evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # These two commits were an investigation detour based on Security main.
          # DEV Security's actual source-of-truth contract remains /platform/admin-context.
          git revert --no-commit da9368bb6f140364b06e87b804d5c12f039919c3
          git revert --no-commit d07b7642e29466dc40c61f586dc30e3f81cc9a91

          git rm -f docs/runtime/security-admin-dev-verified.txt || true
          git rm -f .github/workflows/one-shot-security-admin-dev-verify.yml

          grep -Fq '/security/v1/platform/admin-context' src/audit_core/security_integration.py
          grep -Fq 'isSuperAdmin' src/audit_core/security_integration.py
          grep -Fq '/security/v1/platform/admin-context' tests/test_uc02_admin_security.py

          git add src/audit_core/security_integration.py tests/test_uc02_admin_security.py
          git commit -m 'fix: restore DEV Security admin-context contract [skip ci]'
          git push origin HEAD:dev
