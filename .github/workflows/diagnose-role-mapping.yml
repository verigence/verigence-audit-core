name: Diagnose role mapping exception

on:
  push:
    branches: [fix/admin-atomic-compensation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-atomic-compensation
      - name: Expose first role mapping exception
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_uc02_role_mappings.py')
          text = path.read_text()
          old = 'client = TestClient(app, raise_server_exceptions=False)'
          if old not in text:
              raise SystemExit('diagnostic target not found')
          path.write_text(text.replace(old, 'client = TestClient(app, raise_server_exceptions=True)', 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_uc02_role_mappings.py
          git commit -m 'test: expose role mapping exception'
          git push origin HEAD:fix/admin-atomic-compensation
